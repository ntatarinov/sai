<body>
<title>Протокол выбора идеи</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap">
<style>
:root{
  --ground:#F3F5F8; --surface:#FFFFFF; --ink:#172033; --muted:#5A6478; --faint:#8A93A5;
  --rule:#D9DEE7; --accent:#2F55C9; --accent-soft:#E3E9FA;
  --agree:#2E7D5B; --agree-soft:#E2F1EA; --dispute:#A8620F; --dispute-soft:#F8ECDD;
  --reject:#B8322A; --reject-soft:#F7E3E1; --ghost:#C9D0DC;
  --serif:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0F131A; --surface:#161B24; --ink:#E4E8F0; --muted:#A0A9B9; --faint:#737D90;
    --rule:#2A3140; --accent:#8AA7FF; --accent-soft:#1E2945;
    --agree:#5CC195; --agree-soft:#15291F; --dispute:#E0A052; --dispute-soft:#2B2113;
    --reject:#F07B72; --reject-soft:#301816; --ghost:#3A4355;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0F131A; --surface:#161B24; --ink:#E4E8F0; --muted:#A0A9B9; --faint:#737D90;
  --rule:#2A3140; --accent:#8AA7FF; --accent-soft:#1E2945;
  --agree:#5CC195; --agree-soft:#15291F; --dispute:#E0A052; --dispute-soft:#2B2113;
  --reject:#F07B72; --reject-soft:#301816; --ghost:#3A4355;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding-inline:20px;padding-block:40px 64px;display:grid;gap:44px}
h1,h2,h3{font-family:var(--serif);font-weight:600;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(28px,4.6vw,40px);line-height:1.15}
h2{font-size:22px;line-height:1.25}
h3{font-size:16px;font-family:var(--sans);font-weight:600;letter-spacing:0}
p{margin:0;max-width:68ch}
.eyebrow{font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--mono);font-size:.92em}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
header{display:grid;gap:14px}
.lede{font-size:17px;color:var(--ink);max-width:62ch}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--muted);font-size:13px}
.meta b{color:var(--ink);font-weight:500}
section{display:grid;gap:18px}
.sec-head{display:grid;gap:6px}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:20px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font:500 12px/1.7 var(--sans);white-space:nowrap}
.pill.agree{background:var(--agree-soft);color:var(--agree)}
.pill.dispute{background:var(--dispute-soft);color:var(--dispute)}
.pill.reject{background:var(--reject-soft);color:var(--reject)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.pill.plain{background:transparent;border:1px solid var(--rule);color:var(--muted)}

/* ranking */
.rank{display:grid;gap:14px}
.rank-row{display:grid;grid-template-columns:minmax(0,230px) minmax(0,1fr) 88px;gap:14px;align-items:center}
.rank-name{display:grid;gap:2px}
.rank-name .id{font:12px var(--mono);color:var(--faint)}
.bar{position:relative;height:22px;border-radius:4px;background:transparent}
.bar .ghost{position:absolute;inset:0 auto 0 0;border:1.5px dashed var(--ghost);border-radius:4px}
.bar .fill{position:absolute;inset:3px auto 3px 0;border-radius:3px;background:var(--faint)}
.rank-row.first .bar .fill{background:var(--accent)}
.bar .tick{position:absolute;top:-4px;bottom:-4px;width:1px;background:var(--rule)}
.rank-score{text-align:right;font-variant-numeric:tabular-nums}
.rank-score b{font-size:20px;font-family:var(--serif)}
.rank-score .was{display:block;font-size:12px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:18px;height:10px;border-radius:2px;vertical-align:middle;margin-right:6px}
.callout{border-left:3px solid var(--dispute);padding:4px 0 4px 14px;color:var(--ink)}

/* timeline */
.steps{display:grid;gap:22px}
.step{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);gap:16px}
.step-label{display:grid;gap:4px;align-content:start}
.step-label .when{font:12px var(--mono);color:var(--muted)}
.lanes{display:grid;gap:8px}
.lane{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr);gap:10px;align-items:center}
.lane-name{font-size:13px;line-height:1.3}
.lane-name small{display:block;color:var(--faint);font:11px var(--mono)}
.track{position:relative;height:18px;background:var(--ground);border-radius:3px;border:1px solid var(--rule)}
.seg{position:absolute;top:2px;bottom:2px;border-radius:2px;background:var(--accent)}
.seg.pending{background:transparent;border:1.5px dashed var(--faint)}
.seg.failed{background:var(--reject)}
.lane-note{grid-column:2;font-size:12px;color:var(--dispute);margin-top:-2px}
.parallel{font-size:12px;color:var(--agree);font-weight:500}

/* matrix */
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;border-bottom:1px solid var(--rule);text-align:center;font-size:14px}
thead th{font:500 12px/1.3 var(--sans);color:var(--muted);vertical-align:bottom}
thead tr.lens th{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--faint);border-bottom:none;padding-bottom:0}
tbody th{text-align:left;font-weight:500}
td.changed{background:var(--dispute-soft)}
td.changed s{color:var(--muted);margin-right:4px}
td.total{font-weight:600;font-family:var(--serif);font-size:16px}
td.total.best{color:var(--accent)}

/* disputes */
.disputes{display:grid;gap:12px}
.dispute{display:grid;gap:10px;padding:16px 18px;background:var(--surface);border:1px solid var(--rule);border-radius:10px}
.dispute-top{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.who{font-size:14px}
.who b{font-weight:600}
.change{font:500 15px var(--mono)}
.change .arrow{color:var(--faint);margin-inline:6px}
.quote{font-size:14px;color:var(--muted);max-width:none}
.answer{font-size:14px;display:grid;gap:4px;border-top:1px dashed var(--rule);padding-top:10px}

/* verdicts */
.versions{display:grid;gap:14px}
.version{display:grid;grid-template-columns:minmax(0,120px) minmax(0,1fr);gap:16px;padding:18px;background:var(--surface);border:1px solid var(--rule);border-radius:10px}
.version.accepted{border-color:var(--agree)}
.v-num{display:grid;gap:6px;align-content:start}
.v-num b{font:600 22px var(--serif)}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.issues{margin:0;padding-left:18px;display:grid;gap:6px;font-size:14px}
ul.plain{margin:0;padding-left:18px;display:grid;gap:6px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}

/* next */
.actions{display:grid;gap:10px}
.action{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;padding:14px 16px;background:var(--surface);border:1px solid var(--rule);border-radius:10px}
.action .step-no{font:500 13px var(--mono);color:var(--muted);padding-top:2px}
.proof{display:grid;gap:10px;font-size:14px}
.proof-row{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:12px;padding-block:8px;border-bottom:1px solid var(--rule)}
.proof-row:last-child{border-bottom:none}
footer{font-size:13px;color:var(--muted);display:grid;gap:6px}
@media (max-width:640px){
  .rank-row{grid-template-columns:minmax(0,1fr) 70px}
  .rank-row .bar{grid-column:1/-1;order:3}
  .step,.version,.proof-row{grid-template-columns:minmax(0,1fr)}
  .lane{grid-template-columns:minmax(0,110px) minmax(0,1fr)}
}
@media (prefers-reduced-motion:no-preference){
  .seg,.bar .fill{transition:width .4s ease}
}
</style>

<script>
const DATA = {"run_id":"WF06-20260926-01","created_at":"2026-09-26T17:37:43Z","seal":"53d87ce5a0bc77039e056aac4872395a928da85749cf8c7f434aef5bdf36e504","candidates":["01-kviz-zayavki","02-sai","03-zhivoy-most","04-kamery-kpp"],"titles":{"01-kviz-zayavki":"Идея 1 — квизы, которые приводят заявки малому бизнесу","02-sai":"Идея 2 — Sai: подбор размера для Instagram-магазинов одежды","03-zhivoy-most":"Идея 3 — Живой мост: правда о том, что делает ИИ","04-kamery-kpp":"Идея 4 — Камеры на КПП: кто прошёл и что у него в руках"},"sources":["ideas/01-kviz-zayavki.md","ideas/02-sai.md","ideas/03-zhivoy-most.md","ideas/04-kamery-kpp.md","ideas/05-drugie-idei.md","docs/quality-bar.md","docs/owner-goals.md","docs/research/competitors-01-kviz-zayavki.md","docs/research/competitors-02-sai.md"],"criteria":{"market":["demand_evidence","competition_gap"],"execution":["cost_to_test","build_fit"],"owner_fit":["owner_goals","no_selling_self"]},"r1":{"market|01-kviz-zayavki|demand_evidence":{"score":4,"comment":"Спрос на категорию подтверждён фактами покупок, а не только словами идеи: разовый платный модуль concept.quiz — «более 1000» установок; в Казахстане квиз-модули Битрикса продаются партнёрами за тенге (Ready.kz, Adena); у лидера Marquiz и у MadTest, Enquiz, Matomba и других — платные тарифы. Не 5: ни одного отзыва, кейса или жалобы именно от казахстанского малого бизнеса не найдено, готовность платить новому игроку не проверена, а у формата есть известная слабость — в конкурентных нишах квизы собирают много некачественных заявок."},"market|01-kviz-zayavki|competition_gap":{"score":2,"comment":"Место занято плотно: в исследовании от 2026-09-26 названо 15+ конкурентов — Marquiz (есть бесплатный тариф), Tilda (квиз во всех платных тарифах), модули 1С-Битрикс atum.quiz и concept.quiz, которые уже продаются в Казахстане за тенге, MadTest, Enquiz, Flexbe, Matomba, MoClients, Envybox, Callibri, FormDesigner и др. Все три заявленных отличия уже есть у лидера Marquiz: заявки в Telegram (бот в чат или группу), казахский язык (в списке 38 языков), осмысленный результат с ценой. Свободна только узкая щель: встроенная доставка заявки владельцу в WhatsApp не найдена (у Marquiz — через платный Wazzup от 6000 ₸/мес или ChatPush), и у Marquiz нет цен в тенге. Такую щель конкурент закрывает одной интеграцией — поэтому 2; не 1, потому что щель подтверждена проверкой по конкретному списку страниц."},"market|02-sai|demand_evidence":{"score":3,"comment":"Проблема заявлена сильно: размер — главная причина возвратов (около половины), подсказка по размеру снижает возвраты. Но в очищенной копии у этих «Доказано» нет ни одной ссылки на источник — это утверждения идеи, а не факты, проверяемые в прогоне; и нет данных, что у небольших Instagram-магазинов Алматы эта проблема стоит денег. Готовность платить прямо помечена как не доказанная («Заплатят ли магазины»). Косвенный сигнал: CrmAI пишет для Instagram-магазинов одежды Алматы и называет стоимость настройки бота 300–800 тыс. тенге — это цена продавца услуги, а не доказательство, что магазины покупают. Итог 3: проблема правдоподобна, оплата не ясна."},"market|02-sai|competition_gap":{"score":3,"comment":"Утверждение идеи, что Instagram-магазины без сайта «остались без таких инструментов», исследованием от 2026-09-26 опровергнуто. AnyDress (Кипр) даёт витрину по ссылке без сайта с примеркой по фото, подбором размера по замерам вещи и кнопкой «DM to buy» в Instagram — это почти весь сценарий Sai, кроме заказа именно в WhatsApp и расчёта по росту и весу. TailorTalk — бот в Instagram и WhatsApp с заказом в чате, но размер только по таблице, примерка в бете. Dressie и Dresscode — примерка в Telegram без сайта, без подбора размера; BorisBot — шаблон бота с рекомендацией размера. Локально свободно: казахстанские CrmAI, AOE, Koktem-AI размер не рассчитывают и примерки не делают; у AnyDress страны не указаны. Ограничения поиска: не проверялась оплата из Казахстана, не искали внутри Instagram, Kaspi и каталогов Telegram-ботов. Место частично занято за рубежом, локально свободно — 3."},"market|03-zhivoy-most|demand_evidence":{"score":2,"comment":"Доказательств спроса и оплаты нет, зато есть прямые сигналы против: файл идеи сам пишет, что непонятно, кто платит, а единственный названный платящий сегмент — руководители, покупающие «контроль», — владелец исключает; аудитория узкая, хуки есть только в Claude Code, тогда как целевой пользователь «далёк от программирования». «Владельцу это интересно» — мотивация автора, не спрос рынка. Не 1: подсказки по запросам для разработчиков уже существуют (Braintrust Loop, Prompt Coach), значит сама потребность улучшать запросы у части пользователей есть; для непрограммистов и с оплатой она ничем не подтверждена."},"market|03-zhivoy-most|competition_gap":{"score":2,"comment":"Основная функция — панель «что ИИ сделал на самом деле» — занята бесплатно: Pixel Agents (расширение VS Code, тоже на хуках), claude-office, pixel-agents-standalone, приложение для iPhone. Следующий шаг владельца — подсказки по запросам — есть для разработчиков: Braintrust (Loop), Prompt Coach. Свободна узкая щель — разбор реальных сессий для непрограммистов, но она держится на фразе «готового не нашёл» без описанного поиска: отдельного датированного исследования конкурентов для этой идеи в прогоне нет. Кроме того, щель может закрыть сама платформа — Claude Code может встроить похожее. Бесплатные аналоги ядра и риск со стороны платформы — 2; не 1, потому что позиция для непрограммистов пока никем не названа."},"market|04-kamery-kpp|demand_evidence":{"score":3,"comment":"За категорию платят: у Trassir «Умный КПП» есть продаваемый комплект 310–670 тыс. ₽, на рынке также Macroscop, Ivideon, Avigilon, Hanwha, Axis — готовность предприятий платить за распознавание на КПП подтверждается существованием продаваемых комплектов (но цены 2022 года и российские). Для новой ценности — «что в руках / контроль выноса» — прямых доказательств спроса нет: есть лишь складские проекты под заказ и решения против краж с полок в магазинах, что говорит о проблеме, но не о её масштабе и цене. Данных по Казахстану нет. Итог 3: спрос на категорию есть, на предлагаемую функцию не ясен."},"market|04-kamery-kpp|competition_gap":{"score":3,"comment":"Половина продукта — кто прошёл через ворота — занята плотно: номера, лица и подсчёт людей давно готовы у Trassir, Macroscop, Ivideon, Avigilon, Hanwha, Axis. Вторая половина — «что в руках / не выносит ли» — готовым модулем почти не продают: это реальная щель, но её частично закрывают складские проекты под заказ и решения против краж в магазинах, а продукт должен встраиваться рядом с действующими системами (интеграция со СКУД). Бесплатных аналогов и риска со стороны платформы, как у идеи 03, нет. Проверка рынка — абзац в файле идеи без описанного поиска и с ценами 2022 года, отдельного датированного исследования в прогоне нет. Щель есть, но проверена слабо — 3."},"execution|01-kviz-zayavki|cost_to_test":{"score":4,"comment":"Проверка дешёвая и с порогом до постройки: без своего кода, 3 квиза руками, конструктор строится только если 2 из 3 платят. Свой движок для пилота не обязателен: у Marquiz есть бесплатный тариф и встроенная доставка заявок в Telegram, так что цена проверки — несколько дней ручной работы (бесплатный тариф ограничен 10 заявками в месяц — при живом потоке понадобится платный или своя минимальная страница). Не 5: (1) срок 2–4 недели плюс пробный период до первой оплаты — медленнее, чем у 02; (2) поток заявок зависит от рекламы самих бизнесов — нет рекламы, значит результат «не проверено», а не «нет спроса»; (3) выборка — 3 знакомых, их готовность платить завышена; (4) сигнал «заявки пришли» зашумлён — в конкурентных нишах квизы собирают много некачественных заявок, считать надо целевые."},"execution|01-kviz-zayavki|build_fit":{"score":4,"comment":"Механика знакома: ветвление, результат по правилам, сохранение ответов и доставка заявки уже делались в Advisor, движок небольшой. Переносится только опыт, не код: код принадлежит ABiTech, движок пишется заново; и именно Advisor — отрицательный пример в планке (Q7, токен Telegram в клиентском коде), так что прежние приёмы копировать нельзя. Нагрузка планки обычная: секреты ботов (Q7), разделение данных бизнесов (Q8), сбои Telegram/WhatsApp (Q10), адреса и вебхуки, которые задаёт бизнес (Q11); фото людей и биометрии нет. Слабое место — WhatsApp владельцу бизнеса: у проверенных конструкторов WhatsApp только через внешние платные сервисы, значит своя интеграция через платный шлюз (единственная цена в источниках — Wazzup от 6000 ₸/мес за канал): постоянный расход и внешняя точка отказа. Конструктор для самостоятельной работы бизнеса — заметно больше работы, но он за порогом проверки."},"execution|02-sai|cost_to_test":{"score":5,"comment":"Самая дешёвая и быстрая проверка из четырёх: без кода, 1–2 недели, 20 магазинов — выборка больше, чем 3 знакомых в 01, и не из своего круга; порог старт/стоп привязан к деньгам (платный пилот около 10 000 ₸), а не к похвале. Оговорки, которые балл не снижают, но обязательны при проведении: «готовы заплатить» засчитывать только как фактическую предоплату, а не устное согласие; порог 1–2 из 20 низкий — пройденный порог значит «строить пилот», а не «рынок доказан». Скрытая цена — сразу после проверки: оплаченный пилот придётся выполнить продуктом по полной планке, включая R3 с первого дня; это учтено в build_fit, а не здесь."},"execution|02-sai|build_fit":{"score":3,"comment":"Ядро собирается из понятных частей: размер — правила по росту, весу, обычному размеру и посадке (та же механика «ответы → результат по правилам», что в Advisor, но кода для переиспользования нет), заказ — ссылка в WhatsApp, примерка — внешний API без своей модели, Kaspi вне объёма. Но из трёх строимых идей здесь самая тяжёлая нагрузка планки: фото людей — R3 (согласие, срок хранения, не в логах и отчётах) с первого пилота; внешний сервис примерки — Q10; данные магазинов — Q8. И две вещи, которых нет в базе и которые кодом не решаются: замеры каждой вещи от магазина (без них подбор неточный; AnyDress требует того же — это свойство задачи, а не нашей реализации) и переменный расход 35–40 ₸ за картинку: пилот за 10 000 ₸ покрывает примерно 250–285 картинок в месяц, так что жёсткий лимит — обязательное требование, а не улучшение. Итого нейтрально: понятно, как строить, но дорого по дисциплине и с расходом на каждую примерку."},"execution|03-zhivoy-most|cost_to_test":{"score":2,"comment":"В идее нет плана проверки спроса и нет порога старт/стоп — в отличие от 01 и 02. Составить дешёвую проверку мешают факты из самого файла: неизвестен плательщик (руководители, которые платят за контроль, исключены самим владельцем), а целевые пользователи — непрограммисты, у которых при этом должен стоять Claude Code с хуками; набрать среди них даже 20 человек для проверки трудно. Работающая панель даёт быстрое демо, но показывает ту часть, которая на рынке уже бесплатна; новая ценность — подсказки к запросу до отправки и проверка профиля — не построена, значит для проверки её надо либо сделать, либо проводить разборы вручную. Не 1: демо есть сразу, и интерес (не оплату) можно проверить быстро."},"execution|03-zhivoy-most|build_fit":{"score":4,"comment":"Лучшее совпадение с имеющейся базой: сбор событий из хуков уже работает у владельца, есть агенты, конвейеры и Pixel Office, а в планке уже есть пункт R2 ровно про этот механизм (события только из хуков, с реальным временем) — требования к ядру известны и проверяемы. Не 5: (1) работает только та часть, что у других уже бесплатна; подсказки к запросу и проверка профиля требуют анализа чужих запросов — новый код и чувствительные данные пользователей (Q7, разделение данных разных людей по смыслу Q8); (2) ядро зависит от чужой платформы: формат хуков может поменяться, а платформа — встроить то же самое, это постоянная поддержка вне нашего контроля; (3) продукт для непрограммистов, которым надо настроить хуки Claude Code, — отдельная работа по установке и сопровождению."},"execution|04-kamery-kpp|cost_to_test":{"score":1,"comment":"Дешёвой проверки нет: плана и порога в идее нет, а покупатель — предприятия и склады с долгими продажами и требованием «имени», которого нет. Даже демо требует камер и монтажа на объекте, то есть доступа к чужой площадке; главная отличительная функция («что в руках») готовым модулем почти не продаётся, значит показывать её нечем, пока она не сделана. Проверка займёт месяцы и деньги на оборудование."},"execution|04-kamery-kpp|build_fit":{"score":1,"comment":"Имеющаяся база (агенты, веб-сервисы, квиз-механика, панель на хуках) к компьютерному зрению и оборудованию не относится; ближайшее — учёт ТМЦ в osnova, но это учёт, а не распознавание, и главную часть он не закрывает. Отличительная функция готовым модулем почти не продаётся — это своя модель распознавания или проект под заказ. Планку здесь соблюдать тяжелее всего: Q3 и Q4 требуют реального запуска и одной команды проверки на чистой копии, а поведение камеры на объекте так не проверяется; персональные данные и биометрия сотрудников — нагрузка выше, чем R3; СКУД — внешняя система на площадке клиента (Q10). Сильно против."},"owner_fit|01-kviz-zayavki|owner_goals":{"score":3,"comment":"Смешанно. За: путь ровно тот, который назвал владелец, — начать своё дело и продавать своё решение; идея прямо ставит целью полный цикл «сделал → нашёл клиента → получил оплату», а после проверки строится свой продукт (конструктор). Доход: платёж в категории доказан (за конструкторы квизов уже платят), но цены в категории низкие (Marquiz — от 790 ₽/мес за 30 заявок), и сама идея ждёт от первого продукта немного денег. Интерес не ясен: слов владельца о квизах нет, а идея — повтор Advisor («по сути умный квиз»); инвентаризацию владелец отверг именно как «пройденную тему», и здесь тот же риск — риск, а не доказанный факт. Требование владельца «подтвердил или доказал» выполнено для категории, но не для этого предложения: по исследованию конкурентов два из трёх заявленных отличий (казахский язык, осмысленный результат) у Marquiz уже есть, от третьего остаётся только доставка заявки владельцу в WhatsApp (Telegram у Marquiz есть)."},"owner_fit|01-kviz-zayavki|no_selling_self":{"score":4,"comment":"В основном обходится. Покупатель — малый бизнес, решает сам и быстро, не предприятия; бизнес ничем не рискует, личное доверие к владельцу не требуется; чужой код не нужен — движок пишется заново, код Advisor (принадлежит ABiTech) не копируется. Не 5: этап проверки — ручная работа под заказ (квизы «руками» для трёх бизнесов бесплатно или почти бесплатно), и первые клиенты — знакомые владельца. До появления конструктора это ближе к услуге, которая держится на личных связях, чем к продукту; продажей экспертизы, от которой владелец отходит, это не является, но и чистым продуктом тоже."},"owner_fit|02-sai|owner_goals":{"score":4,"comment":"В основном за. Свой продукт (сервис по ссылке для магазинов) и путь, который назвал владелец, — начать своё дело и продавать своё решение. Интерес: одежда — направление из идей самого владельца (раздел «Одежда (идеи владельца)»), то есть новое русло, а не пройденная тема. Требование «подтвердил или доказал» выполнено для проблемы: размер — около половины возвратов, подсказка по размеру доказанно снижает возвраты. Не 5: доход не доказан — идея сама пишет, что заплатят ли магазины, проверяется только на месте; у каждой примерки есть переменная стоимость API (35–40 ₸ за картинку), которая съедает часть выручки; посылку «магазины без сайта остались без таких инструментов» ослабляет AnyDress из исследования конкурентов — готовая витрина по ссылке без сайта с примеркой и замерами по размерам."},"owner_fit|02-sai|no_selling_self":{"score":5,"comment":"Сильно за. Продаётся продукт, а не владелец и не его экспертиза: покупатель магазина сам открывает ссылку, в систему магазина или площадки ничего не встраивается (Kaspi сознательно не трогается), доступ к чужому коду не нужен — от магазина нужны только замеры его вещей. Покупатели — небольшие Instagram-магазины, не предприятия; продажа — письма 20 магазинам и платный пилот на месяц, решает сам владелец магазина. Единственное требование доверия — фото покупателей только с согласием; это доверие к продукту, а не к владельцу лично, поэтому балл не снижаю."},"owner_fit|03-zhivoy-most|owner_goals":{"score":2,"comment":"В основном против, несмотря на сильный интерес. Интерес и свой продукт здесь сильнее, чем у любой другой идеи: владельцу интересно, он делает это по своей воле, прототип уже работает. Но первую из названных владельцем целей — доход — здесь не видно: кто платит, непонятно, а единственные названные плательщики (руководители, за «контроль») — это слежка, которую владелец сам не хочет; аудитория узкая (только Claude Code); картинка уже есть бесплатно; платформа может встроить похожее сама. Владелец прямо сказал, что ему не нужны варианты, которые ему только интересны, и попросил подтверждений; здесь есть только найденная щель (подсказки для непрограммистов), но нет ни одного подтверждения спроса или готовности платить. Это ровно тот случай, от которого владелец предостерёг."},"owner_fit|03-zhivoy-most|no_selling_self":{"score":4,"comment":"В основном обходится. Человек ставит панель себе и смотрит сам на себя, данные идут из хуков его собственного Claude Code — доступа к чужому коду или к системам компании не нужно; продажу предприятиям для «контроля» владелец сам исключает. Не 5 по двум причинам: единственный платящий сегмент, который называет идея, — руководители, то есть продажа организациям; а подсказки «учить человека работать с ИИ» по смыслу близки к обучению работе с ИИ-агентами, которое в списке идей стоит в разделе продажи экспертизы, — если продукт не будет учить сам, работа сползёт в услугу владельца."},"owner_fit|04-kamery-kpp|owner_goals":{"score":2,"comment":"В основном против. За: это идея самого владельца, и узкая щель есть — «что в руках» готовым модулем почти не продают. Против: это не столько свой продукт, сколько  место чуть свободнее, но, по-моему, не на целый балл.","action":"revise","to":2,"reason":"Довод принят: моё же правило для 01 («щель, которую конкурент закрывает одной интеграцией, — 2») даёт у 02 тоже 2. Ближайший аналог AnyDress уже даёт витрину по ссылке без сайта, примерку, размер по замерам вещи и заказ кнопкой «DM to buy» в Instagram. Не хватает только заказа именно в WhatsApp и расчёта по росту и весу — это небольшие доработки, а приём заказа в переписке WhatsApp у магазинов одежды без сайта уже есть у TailorTalk. Мой довод «локально свободно» опирался на то, что у AnyDress страны не указаны, а оплата из Казахстана не проверялась. Это отсутствие данных, а не доказанная щель; такое же отсутствие у 01 (у Marquiz нет цен в тенге и упоминаний Казахстана) я в раунде 1 балл поднимать не стал. Поправку к доводу оставляю: у 01 в Казахстане есть местные продавцы (квиз-модули Битрикса за тенге), а у 02 местного сервиса с расчётом размера и примеркой не найдено, и всей связки нет ни у кого. Поэтому внутри балла 2 место у 02 свободнее, чем у 01, но не на целый балл. У 04 остаётся 3: там отличительную функцию готовым модулем почти не продают, а у 02 её почти целиком продаёт AnyDress."}],"agreeCount":44,"verdicts":[{"version":1,"created_at":"2026-09-28T16:48:53Z","chosen":"01-kviz-zayavki","confidence":"low","ranking":[{"idea_id":"01-kviz-zayavki","rank":1,"total":21},{"idea_id":"02-sai","rank":2,"total":20},{"idea_id":"03-zhivoy-most","rank":3,"total":15},{"idea_id":"04-kamery-kpp","rank":4,"total":11}],"reasons":["Отрыв минимальный и неустойчивый: 01-kviz-zayavki — 21, 02-sai — 20, разница 1 балл из 30 возможных. Он появился только в раунде 3: в раунде 1 впереди была 02-sai, 23 против 21. Все три правки 02-sai — по −1 (competition_gap 3→2, owner_goals 4→3, no_selling_self 5→4). Если отменить любую одну — ничья 21:21; любые две — 02-sai впереди 22:21; все три — 23:21, как в раунде 1. У 01 правок нет. Поэтому уверенность низкая, а следующий кандидат при провале проверки 0       <div class="step-label"><h3>${esc(grp.label)}</h3><span class="muted" style="font-size:13px">${esc(grp.sub)}</span>
        <span class="when">${almaty(new Date(lo).toISOString())} → ${almaty(new Date(hi).toISOString(), true)}</span>
        ${overlap ? `<span class="parallel">работали одновременно</span>` : ""}</div>
      <div class="lanes">${lanes}</div>
    </div>`;
  }).join("");
  return `<section>
    <div class="sec-head"><span class="eyebrow">Кто что делал</span><h2>Ход работы агентов</h2>
      <p class="muted">Каждый отрезок — одна задача одного агента, от выдачи до сдачи, по времени из handoff-файлов. У каждого шага своя шкала, чтобы было видно, кто работал одновременно; время — Алматы.</p></div>
    <div class="panel steps">${rows}</div>
  </section>`;
}

function matrix() {
  const cols = [];
  for (const l of ["market", "execution", "owner_fit"]) for (const c of DATA.criteria[l]) cols.push({ l, c });
  const lensRow = ["market", "execution", "owner_fit"].map((l) => `<th colspan="2">${esc(LENS[l])}</th>`).join("");
  const critRow = cols.map((x) => `<th>${esc(CRIT[x.c])}</th>`).join("");
  const body = order.map((id, i) => {
    const cells = cols.map((x) => {
      const k = `${x.l}|${id}|${x.c}`;
      const a = DATA.r1[k].score, b = DATA.final[k];
      return a === b ? `<td>${b}</td>` : `<td class="changed" title="${esc(CRIT[x.c])}: ${a} → ${b} после спора"><s>${a}</s>${b}</td>`;
    }).join("");
    return `<tr><th scope="row">${esc(IDEA[id])}</th>${cells}<td class="total ${i === 0 ? "best" : ""}">${FIN[id]}</td></tr>`;
  }).join("");
  return `<section>
    <div class="sec-head"><span class="eyebrow">Оценки</span><h2>Баллы по критериям, 1–5</h2>
      <p class="muted">Каждый балл подкреплён дословной цитатой из очищенных источников — код отклоняет оценку без цитаты. Подсвечены баллы, изменённые после спора: зачёркнут первый, рядом итоговый.</p></div>
    <div class="panel scroll"><table>
      <thead><tr class="lens"><th></th>${lensRow}<th></th></tr><tr><th style="text-align:left">Идея</th>${critRow}<th>Сумма</th></tr></thead>
      <tbody>${body}</tbody></table></div>
  </section>`;
}

function disputes() {
  const items = DATA.disagreements.map((d) => {
    const pill = d.action === "revise" ? `<span class="pill agree">пересмотрено: ${d.their} → ${d.to}</span>` : d.action === "hold" ? `<span class="pill dispute">удержано</span>` : `<span class="pill plain">без ответа</span>`;
    return `<div class="dispute">
      <div class="dispute-top">
        <div class="who"><b>${esc(LENS[d.raised_by])}</b> <span class="muted">не согласен с оценкой</span> <b>${esc(LENS[d.lens])}</b></div>
        ${pill}
      </div>
      <div class="change">${esc(IDEA[d.idea_id])} · ${esc(CRIT[d.criterion])}: ${d.their}<span class="arrow">→</span>${d.proposed}</div>
      <p class="quote">${esc(d.note)}</p>
      ${d.reason ? `<div class="answer"><span class="eyebrow">Ответ автора оценки</span><p>${esc(d.reason)}</p></div>` : ""}
    </div>`;
  }).join("");
  const total = DATA.agreeCount + DATA.disagreements.length;
  return `<section>
    <div class="sec-head"><span class="eyebrow">Совместный анализ</span><h2>Споры между аналитиками</h2>
      <p class="muted">Во втором раунде каждый аналитик проверил все чужие оценки: ${total} проверок, ${DATA.agreeCount} согласий, ${DATA.disagreements.length} несогласий. В третьем раунде автор каждой спорной оценки обязан был ответить.</p></div>
    <div class="disputes">${items}</div>
  </section>`;
}

function verdicts() {
  const rows = DATA.verdicts.map((v) => {
    const r = v.review;
    const ok = r && r.decision === "ACCEPT";
    const checks = r ? r.checks.map((c) => `<span class="pill ${c.result === "PASS" ? "agree" : "reject"}">${esc(CHECK[c.name] || c.name)}</span>`).join("") : "";
    const issues = r && r.issues.length ? `<ul class="issues">${r.issues.map((x) => `<li>${esc(x.length > 420 ? x.slice(0, 420) + "…" : x)}</li>`).join("")}</ul>` : "";
    return `<div class="version ${ok ? "accepted" : ""}">
      <div class="v-num"><span class="eyebrow">Версия</span><b>${v.version}</b>
        ${r ? `<span class="pill ${ok ? "agree" : "reject"}">${ok ? "принята" : "возвращена судье"}</span>` : `<span class="pill plain">без проверки</span>`}</div>
      <div style="display:grid;gap:10px">
        <div class="muted" style="font-size:13px">Судья: ${almaty(v.created_at)} · выбрана «${esc(IDEA[v.chosen])}», уверенность ${esc(CONF[v.confidence])}</div>
        ${checks ? `<div class="checks">${checks}</div>` : ""}
        ${issues ? `<div style="display:grid;gap:6px"><span class="eyebrow">Почему вернул исполнитель</span>${issues}</div>` : ""}
        ${ok ? `<p style="font-size:14px">Все пять проверок пройдены, текст сверен с источниками. Исполнитель применил вердикт: записал рекомендацию в STATE.md и очередь следующих задач.</p>` : ""}
      </div>
    </div>`;
  }).join("");
  const v = accepted;
  return `<section>
    <div class="sec-head"><span class="eyebrow">Вердикт и его проверка</span><h2>Судья пишет — исполнитель проверяет</h2>
      <p class="muted">Исполнитель не принимает вердикт на веру: сам пересчитывает суммы, открывает источники и ищет неточности. Допускается до трёх версий.</p></div>
    <div class="versions">${rows}</div>
    <div class="two">
      <div class="panel" style="display:grid;gap:10px"><h3>Почему эта идея</h3><ul class="plain">${v.reasons.slice(0, 3).map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>
      <div class="panel" style="display:grid;gap:10px"><h3>Остановиться, если</h3><ul class="plain">${v.kill_criteria.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>
    </div>
  </section>`;
}

function next() {
  const acts = DATA.proposed.map((a) => {
    const dep = DATA.handoffs.find((h) => h.run === DATA.run_id && h.step === a.step);
    return `<div class="action"><span class="step-no">${esc(a.step)}</span>
      <div style="display:grid;gap:6px"><div><b>${esc(ROLE[a.to_agent] || a.to_agent)}</b> <span class="pill plain">${esc(dep ? (dep.status === "PENDING" ? "ждёт" : dep.status) : "в очереди")}</span></div>
      <p style="font-size:14px">${esc(a.task)}</p></div></div>`;
  }).join("");
  return `<section>
    <div class="sec-head"><span class="eyebrow">Что дальше</span><h2>Очередь задач, которую поставил вердикт</h2>
      <p class="muted">Задачи получают только аналитики и ORCH. Разработчикам продукта — ничего, пока владелец не запишет решение о старте.</p></div>
    <div class="actions">${acts}</div>
  </section>`;
}

function proof() {
  const rows = [
    ["Печать прогона", `<span class="mono">${esc(DATA.seal.slice(0, 16))}…</span> — хеш run.json; проверка с печатью: OK`],
    ["Снимок «до»", "снят первым действием, в одной команде с подготовкой прогона"],
    ["Изменения вне разрешённого", "нет: snapshot-diff — код 0 (менялись только папка прогона, его handoff-ы и STATE.md)"],
    ["Контракты между агентами", "проверяет код в sai/tools — 111 тестов, все проходят"],
    ["Независимая итоговая проверка", "RELEASE-VALIDATOR: PASS (REQ-002, REQ-003, REQ-004)"],
    ["Источники оценок", DATA.sources.map((s) => `<span class="mono">${esc(s)}</span>`).join(", ")],
  ].map(([k, v]) => `<div class="proof-row"><span class="muted">${esc(k)}</span><span>${v}</span></div>`).join("");
  return `<section>
    <div class="sec-head"><span class="eyebrow">Чем проверено</span><h2>Почему этому можно верить</h2></div>
    <div class="panel proof">${rows}</div>
  </section>`;
}

function footer() {
  return `<footer>
    <span>Ограничение: папка проекта называется «sai», поэтому аналитики могли догадаться, какая идея была выбрана раньше. Прошлые выводы из источников вырезаны, баллы опираются только на очищенные источники и поиск конкурентов — не на реальные продажи.</span>
    <span>Файлы: <span class="mono">sai/runs/${esc(DATA.run_id)}/</span>, вердикт для владельца — <span class="mono">verdict-${accepted.version}.md</span>.</span>
  </footer>`;
}

document.getElementById("app").innerHTML = [header(), ranking(), timeline(), matrix(), disputes(), verdicts(), next(), proof(), footer()].join("");
</script>

</body>
</html>
