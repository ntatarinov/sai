name: app

on:
  push:
    branches:
      - main
      - "ci/**"
    paths:
      - "app/**"
      - "docs/runbooks/**"
      - "tools/package.json"
      - "tools/src/team/**"
      - "tools/src/pixel-office/mask.js"
      - ".github/workflows/app.yml"

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Get the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node 22.23.4
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.4"
          package-manager-cache: false
      - name: Node version
        run: node -v
      - name: Install the tools dependencies
        working-directory: tools
        run: npm ci
      - name: Install the app dependencies
        working-directory: app
        run: npm ci
      - name: Run the app check
        working-directory: app
        run: npm run check
      - name: Audit the production dependencies
        working-directory: app
        run: npm audit --omit=dev --audit-level=high

  pg:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Get the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node 22.23.4
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.4"
          package-manager-cache: false
      - name: Node version
        run: node -v
      - name: Start Postgres 17 with a password made in this run
        run: |
          pw="$(openssl rand -hex 24)"
          echo "::add-mask::$pw"
          echo "SAI_PG_SUPERUSER_PASSWORD=$pw" >> "$GITHUB_ENV"
          docker run -d --name sai-pg -e POSTGRES_PASSWORD="$pw" -p 127.0.0.1:5432:5432 postgres:17@sha256:0d938e975177bef9f1f61f3f9dbcf2e0aa0a139568f66d3415ed8892eb97f6ac
          for i in $(seq 1 60); do docker exec sai-pg pg_isready -U postgres -d postgres -h 127.0.0.1 && exit 0; sleep 1; done
          exit 1
      - name: Install the app dependencies
        working-directory: app
        run: npm ci
      - name: Run the real Postgres tests
        working-directory: app
        env:
          SAI_PG_HOST: 127.0.0.1
          SAI_PG_PORT: "5432"
        run: npm run test:pg

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Get the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node 22.23.4
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.4"
          package-manager-cache: false
      - name: Node version
        run: node -v
      - name: Make the passwords of this run
        run: |
          for name in POSTGRES_PASSWORD APP_DB_PASSWORD; do
            pw="$(openssl rand -hex 24)"
            echo "::add-mask::$pw"
            echo "$name=$pw" >> "$GITHUB_ENV"
          done
      - name: Build the image
        run: docker compose -f app/compose.yaml build
      - name: Start db and web
        run: docker compose -f app/compose.yaml up -d --wait
      - name: Node version in the image
        run: docker compose -f app/compose.yaml exec -T web node -v
      - name: The closed page, the 404 page, the uniform 404 and the preview redirect
        run: |
          curl -sS -o page.html -w '%{http_code}\n' http://127.0.0.1:8080/ | grep -qx 200
          cmp page.html app/public/index.html
          curl -sS -o nope.html -w '%{http_code}\n' http://127.0.0.1:8080/nope | grep -qx 404
          cmp nope.html app/public/404.html
          test "$(curl -sS http://127.0.0.1:8080/api/x/y)" = '{"error":"not_found"}'
          test "$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' -H 'Host: localhost:8080' http://127.0.0.1:8080/x)" = "307 http://127.0.0.1:8080/x"
      - name: The web container does not run as root
        run: test "$(docker compose -f app/compose.yaml exec -T web id -u)" != "0"
      - name: Migration 0001 is recorded
        run: test "$(docker compose -f app/compose.yaml exec -T db psql -U postgres -d sai -Atc 'select name from schema_migrations')" = "0001_init.sql"
      - name: The app connects as sai_app_login only
        run: |
          curl -sS -o /dev/null http://127.0.0.1:8080/api/health
          rows="$(docker compose -f app/compose.yaml exec -T db psql -U postgres -d sai -Atc "select usename from pg_stat_activity where datname = 'sai' and backend_type = 'client backend' and pid <> pg_backend_pid()")"
          echo "$rows"
          echo "$rows" | grep -qx sai_app_login
          if echo "$rows" | grep -qx postgres; then exit 1; fi
      - name: Smoke against the container
        run: node app/scripts/smoke.js --base http://127.0.0.1:8080 --preview http://localhost:8080
      - name: Logs of the containers
        if: always()
        run: docker compose -f app/compose.yaml logs --no-color --tail 50
      - name: Stop the containers
        if: always()
        run: docker compose -f app/compose.yaml down -v
