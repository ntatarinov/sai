name: app

on:
  push:
    branches:
      - main
      - "ci/**"
    paths:
      - "app/**"
      - "docs/runbooks/**"
      - "tools/package.json"
      - "tools/src/team/**"
      - "tools/src/pixel-office/mask.js"
      - "tools/src/pixel-office/public/layout.js"
      - "tools/src/pixel-office/public/office-sim.js"
      - "tools/src/picker/**"
      - "tools/src/node-floor.js"
      - ".github/workflows/app.yml"

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Get the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node 22.23.4
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.4"
          package-manager-cache: false
      - name: Node version
        run: node -v
      - name: Install the tools dependencies
        working-directory: tools
        run: npm ci
      - name: Install the app dependencies
        working-directory: app
        run: npm ci
      - name: Run the app check
        working-directory: app
        run: npm run check
      - name: Audit the production dependencies
        working-directory: app
        run: npm audit --omit=dev --audit-level=high

  pg:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Get the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node 22.23.4
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.4"
          package-manager-cache: false
      - name: Node version
        run: node -v
      - name: Start Postgres 17 with a password made in this run
        run: |
          pw="$(openssl rand -hex 24)"
          echo "::add-mask::$pw"
          echo "SAI_PG_SUPERUSER_PASSWORD=$pw" >> "$GITHUB_ENV"
          docker run -d --name sai-pg -e POSTGRES_PASSWORD="$pw" -p 127.0.0.1:5432:5432 postgres:17@sha256:0d938e975177bef9f1f61f3f9dbcf2e0aa0a139568f66d3415ed8892eb97f6ac
          for i in $(seq 1 60); do docker exec sai-pg pg_isready -U postgres -d postgres -h 127.0.0.1 && exit 0; sleep 1; done
          exit 1
      - name: Install the app dependencies
        working-directory: app
        run: npm ci
      - name: Run the real Postgres tests
        working-directory: app
        env:
          SAI_PG_HOST: 127.0.0.1
          SAI_PG_PORT: "5432"
        run: npm run test:pg

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Get the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node 22.23.4
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.4"
          package-manager-cache: false
      - name: Node version
        run: node -v
      - name: Make the passwords of this run
        run: |
          for name in POSTGRES_PASSWORD APP_DB_PASSWORD SECRET_PEPPER; do
            pw="$(openssl rand -hex 32)"
            echo "::add-mask::$pw"
            echo "$name=$pw" >> "$GITHUB_ENV"
          done
      - name: Build the image
        run: docker compose -f app/compose.yaml build
      - name: Start db and web
        run: docker compose -f app/compose.yaml up -d --wait
      - name: Node version in the image
        run: docker compose -f app/compose.yaml exec -T web node -v
      - name: The closed page, the 404 page, the uniform 404 and the preview redirect
        run: |
          curl -sS -o page.html -w '%{http_code}\n' http://127.0.0.1:8080/ | grep -qx 200
          cmp page.html app/public/index.html
          curl -sS -o nope.html -w '%{http_code}\n' http://127.0.0.1:8080/nope | grep -qx 404
          cmp nope.html app/public/404.html
          test "$(curl -sS http://127.0.0.1:8080/api/x/y)" = '{"error":"not_found"}'
          test "$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' -H 'Host: localhost:8080' http://127.0.0.1:8080/x)" = "307 http://127.0.0.1:8080/x"
      - name: The demo questionnaire answers 200
        run: test "$(curl -sS -o /dev/null -w '%{http_code}' 'http://127.0.0.1:8080/api/demo/questionnaire?lang=ru')" = "200"
      - name: The web container does not run as root
        run: test "$(docker compose -f app/compose.yaml exec -T web id -u)" != "0"
      - name: Every migration is recorded
        run: test "$(docker compose -f app/compose.yaml exec -T db psql -U postgres -d sai -Atc 'select name from schema_migrations order by name')" = "$(ls app/db/migrations | sort)"
      - name: The app connects as sai_app_login only
        run: |
          curl -sS -o /dev/null http://127.0.0.1:8080/api/health
          rows="$(docker compose -f app/compose.yaml exec -T db psql -U postgres -d sai -Atc "select usename from pg_stat_activity where datname = 'sai' and backend_type = 'client backend' and pid <> pg_backend_pid()")"
          echo "$rows"
          echo "$rows" | grep -qx sai_app_login
          if echo "$rows" | grep -qx postgres; then exit 1; fi
      - name: Smoke against the container
        run: node app/scripts/smoke.js --base http://127.0.0.1:8080 --preview http://localhost:8080
      - name: Logs of the containers
        if: always()
        run: docker compose -f app/compose.yaml logs --no-color --tail 50
      - name: Stop the containers
        if: always()
        run: docker compose -f app/compose.yaml down -v

  # The migration rehearsal (REQ-120 criterion 3; ARCH §20.4; the code design M2AUTH, 6.3): database A from the
  # previous migrations and their seeds, a logical dump restored into B and compared, then B migrated to the
  # newest migration, seeded and compared in the previous-schema mode, and the app started on B.
  migration-rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Get the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node 22.23.4
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.4"
          package-manager-cache: false
      - name: Node version
        run: node -v
      - name: Install the app dependencies
        working-directory: app
        run: npm ci
      - name: Make the passwords of this run
        run: |
          for name in POSTGRES_PASSWORD APP_DB_PASSWORD SECRET_PEPPER; do
            pw="$(openssl rand -hex 32)"
            echo "::add-mask::$pw"
            echo "$name=$pw" >> "$GITHUB_ENV"
          done
      - name: Start Postgres 17
        run: |
          docker run -d --name sai-reh -e POSTGRES_PASSWORD -p 127.0.0.1:5433:5432 postgres:17@sha256:0d938e975177bef9f1f61f3f9dbcf2e0aa0a139568f66d3415ed8892eb97f6ac
          for i in $(seq 1 60); do docker exec sai-reh pg_isready -U postgres -d postgres -h 127.0.0.1 && exit 0; sleep 1; done
          exit 1
      - name: Create the databases a and b
        run: |
          docker exec sai-reh createdb -U postgres a
          docker exec sai-reh createdb -U postgres b
      - name: The previous set of migrations
        run: |
          mkdir "$RUNNER_TEMP/prev"
          for name in $(ls app/db/migrations | sort | head -n -1); do cp "app/db/migrations/$name" "$RUNNER_TEMP/prev/$name"; done
          ls "$RUNNER_TEMP/prev"
      - name: Migrate A with the previous set
        working-directory: app
        run: MIGRATIONS_DIR="$RUNNER_TEMP/prev" DATABASE_URL="postgres://postgres:$POSTGRES_PASSWORD@127.0.0.1:5433/a" node server/db/migrate.js
      - name: Seed A
        run: |
          for name in $(ls "$RUNNER_TEMP/prev" | sort); do
            docker exec -i sai-reh psql -v ON_ERROR_STOP=1 -U postgres -d a -f - < "app/test/fixtures/rehearsal/$name"
          done
      - name: openssl is in the pinned image
        run: docker exec sai-reh openssl version
      - name: pg_dump of A
        run: docker exec sai-reh pg_dump --format=custom --no-owner --no-acl -U postgres -d a -f /tmp/a.dump
      - name: pg_restore into B
        run: docker exec sai-reh pg_restore --no-owner --no-acl -U postgres -d b /tmp/a.dump
      - name: db-verify A and B
        working-directory: app
        run: SAI_VERIFY_A_URL="postgres://postgres:$POSTGRES_PASSWORD@127.0.0.1:5433/a" SAI_VERIFY_B_URL="postgres://postgres:$POSTGRES_PASSWORD@127.0.0.1:5433/b" node scripts/db-verify.js
      - name: Migrate B to the newest migration
        working-directory: app
        run: DATABASE_URL="postgres://postgres:$POSTGRES_PASSWORD@127.0.0.1:5433/b" node server/db/migrate.js
      - name: Seed B with the newest seed
        run: |
          name="$(ls app/db/migrations | sort | tail -n 1)"
          docker exec -i sai-reh psql -v ON_ERROR_STOP=1 -U postgres -d b -f - < "app/test/fixtures/rehearsal/$name"
      - name: db-verify A and B in the previous-schema mode
        working-directory: app
        run: SAI_VERIFY_A_URL="postgres://postgres:$POSTGRES_PASSWORD@127.0.0.1:5433/a" SAI_VERIFY_B_URL="postgres://postgres:$POSTGRES_PASSWORD@127.0.0.1:5433/b" node scripts/db-verify.js --previous-schema
      - name: Every table of B has a row
        run: docker exec sai-reh psql -v ON_ERROR_STOP=1 -U postgres -d b -c 'do $ declare t text; n bigint; begin for t in select table_name from information_schema.tables where table_schema = $s$public$s$ and table_type = $s$BASE TABLE$s$ loop execute format($f$select count(*) from public.%I$f$, t) into n; if n = 0 then raise exception $m$a public table has no row$m$; end if; end loop; end $'
      - name: Start the app on B
        working-directory: app
        run: |
          NODE_ENV=production PORT=18080 HOST=127.0.0.1 DATABASE_URL="postgres://postgres:$POSTGRES_PASSWORD@127.0.0.1:5433/b" APP_ORIGIN=http://127.0.0.1:18080 PREVIEW_ORIGIN=http://localhost:18080 nohup node server/node-main.js > "$RUNNER_TEMP/app.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/app.pid"
      - name: The selfcheck passed on B
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/api/health | grep -q '"role":"ok"'; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Smoke against the app on B
        working-directory: app
        run: node scripts/smoke.js --base http://127.0.0.1:18080 --preview http://localhost:18080
      - name: Stop the app and remove the database
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/app.pid" ]; then kill "$(cat "$RUNNER_TEMP/app.pid")"; fi
          if [ -f "$RUNNER_TEMP/app.log" ]; then tail -n 50 "$RUNNER_TEMP/app.log"; fi
          if docker inspect sai-reh > /dev/null 2>&1; then docker exec sai-reh rm -f /tmp/a.dump; docker rm -f sai-reh; fi

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Chrome path and version
        run: ls -l /opt/google/chrome/chrome && /opt/google/chrome/chrome --version
      - name: Get the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node 22.23.4
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.4"
          package-manager-cache: false
      - name: Node version
        run: node -v
      - name: Install the app dependencies
        working-directory: app
        run: npm ci
      - name: Run the browser tests
        working-directory: app
        run: npm run test:e2e
