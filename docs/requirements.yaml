        шесть вопросов, у каждого проект, вопрос, причина словами, варианты ответа по
        описанию и что будет при каждом; у критической — ссылка на просмотр черновика
        REQ-015 (открывает его текст) и вид действия; число вопросов окна равно сумме
        чисел «нужно ваше решение» страниц двух проектов (критерий 4 REQ-011); вопрос,
        на который уже ответили, в окне не остаётся"
      - "Ответ из окна равен команде. Тест: «Одобрить», «Изменить» с текстом и
