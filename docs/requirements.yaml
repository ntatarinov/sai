      - "Панель задач на месте панели «Требования» образца, в честной форме: список задач REQ-001 в двух разделах — «Текущие» (задачи и строки основной сессии «в работе») и «История» (остальные, в том числе «нет свежих данных»), в каждом новые сверху, как в критерии 6(д) REQ-001; у элемента — подпись роли: название простыми словами и целиком, одно и то же в «Текущих» и в «Истории» (критерий 1 REQ-036), и код роли, как пришёл, — только в подсказке «код роли: …» у названия, если он отличается от названия (REQ-048, критерий 1; у строки основной сессии — «Основная сессия — обрабатывает запрос»), описание, если оно есть, состояние (слова критериев 5 и 6 REQ-042) и время по критерию 6 REQ-001, у «в работе» и «нет свежих данных» — ещё возраст последнего события (критерий 4 REQ-042) и первые 8 знаков session_id сессии её последнего старта (критерий 6(и) REQ-001); над «Текущими» для каждой идущей сессии — карточка сессии по критерию 3 REQ-042: первые 8 знаков её session_id, «Идёт», время первого события, время и возраст последнего события; полосы хода и «задач N/M · ролей K» нет нигде; список показывает не больше 300 элементов («Текущие» и «История» вместе); если элементов больше 300, показаны первые 300 в порядке критерия 6(д) REQ-001 и есть пометка «показано 300 из N», где N — число всех элементов; в «Истории» — такая же карточка (слово состояния — по критерию 3 REQ-042) для каждой не идущей сессии, у которой есть задачи (задача — в сессии своего последнего старта) и чей элемент показан в «Истории», над самым верхним показанным элементом этой сессии, новые сверху; у не идущей сессии, чьих элементов в «Истории» нет из-за предела 300, карточки нет; номеров, названий и статусов требований нет. Проверка: tools/test/pixel-office-panels.test.js — последовательность событий двух сессий, одна из которых закончилась: элементы в своих разделах и в порядке «новые сверху», у карточки идущей сессии над «Текущими» — «Идёт», 8 знаков id, время первого события, время и возраст последнего события, у карточки закончившейся — в «Истории» — те же поля без «Идёт»; в DOM карточки нет элемента progress, подстрок «задач» и «ролей»; после нового события разделы и возраст меняются; случай «больше 300» — 400 закончившихся сессий по одной задаче: в «Истории» показано 300 элементов, есть пометка «показано 300 из 400», карточек столько, сколько сессий среди показанных элементов (300), у сессии без показанного элемента карточки нет; случай возобновления — старт субагента с agent_id X в сессии A, затем старт с тем же X в сессии B, затем событие окончания этого субагента в сессии B: у элемента задачи показаны первые 8 знаков id сессии B, у сессии A карточки нет (других задач у неё нет), у сессии B карточка есть; случай предела — одна закончившаяся сессия с 301 задачей: в «Истории» показано 300 элементов, одна карточка этой сессии и пометка «показано 300 из 301»"
      - "Страница похожа на образец (WF-04, шаги 3, 4 и 6): DESIGN-QA-VALIDATOR запускает отдельный экземпляр — `cd tools && npm run pixel-office -- --port <свободный порт> --dir <отдельная папка состояния вне проекта>`; в эту папку кладётся копия настоящего журнала владельца (сам журнал только читается); состояния, которых в копии нет, — роли с задачами в числе файлов .claude/agents/ на момент проверки, две «работающие» роли, облачко над персонажем — даются сочинёнными событиями, которые пишутся только в ту же отдельную папку, не в рабочий журнал владельца (R2); снимает страницу отдельно в двух окнах — 1920 × 1080 (Full HD) и 2560 × 1440 (2K) — и сравнивает каждый снимок по устройству и смыслу с docs/design/samples/office-2026-10-02.jpg и с описанием интерфейса REQ-007 (снимок 2K — ещё и со снимком Full HD: те же области, тот же порядок, те же элементы, размеры по правилу масштаба, критерий 17): те же области в том же порядке — шапка сверху, офис с легендой слева, журнал и панель задач справа; есть элементы критериев 9–15; вся страница — шапка, офис со всеми столами и легендой, журнал и панель задач — видна в каждом из двух окон без прокрутки страницы, все элементы легенды видны или достижимы прокруткой своей полосы, прокручиваются только списки внутри журнала и панели задач и, по критерию 18, холст внутри своей панели, если он при размере клетки критерия 18 не помещается (раскладка под FullHD — доработка с образца, адаптация под 2K — просьба владельца 2026-10-05); различия с образцом — только места «не переносится» и «в честной форме» из описания этого требования, а также уплотнение пустого пола по критерию 18(д) (число клеток меньше, состав комнат и столов и их взаимное расположение по смыслу те же), в том числе число и расстановка столов (критерий 1), и каждое названо в описании интерфейса с причиной; вердикт PASS — нет находок Critical и High; в handoff-е DESIGN-QA-VALIDATOR перечислены части обоих снимков, снятые на сочинённых событиях. Затем ORCH показывает владельцу снимки Full HD и 2K рядом с образцом, в отчёте прямо называет части снимка, снятые на сочинённых событиях, и записывает в тот же handoff дословный ответ владельца; ответ — подтверждение сходства (и того, что на 2K страница крупнее и читается). Проверка: `shasum -a 256 docs/design/samples/office-2026-10-02.jpg` — 148eda286845409ff8761ad90bcbd43b727593577dc50fdb4a05ed62b0f810d5; jq по result.verdict handoff-а DESIGN-QA-VALIDATOR в handoffs/PO-20261002-01/, по перечню частей снимка на сочинённых событиях в нём и по записанному в нём ответу владельца"
      - "Масштаб под Full HD и 2K (просьба владельца 2026-10-05; чистый CSS, без скрипта и атрибута style; «окно» — окно просмотра (viewport) в CSS-пикселях): (а) в tools/src/pixel-office/public/style.css размер корневого шрифта задан одним правилом для html по формуле S из описания (не меньше 16 px, не больше 24 px, от меньшей из величин ширина/1920 и высота/1080); (б) все размеры интерфейса — колонка, шапка, зазоры, отступы, шрифты, кнопки, легенда, карточки — в rem/em; в px остаются только линии толщиной 1–2 px, это правило корневого шрифта и пороги в @media; размеры холста, заданные атрибутами по решению D16, в этот перечень не входят: `grep -nE '[0-9.]+px' tools/src/pixel-office/public/style.css` — каждая найденная строка перечислена в handoff-е FRONTEND-DEV с причиной (линия 1–2 px, корневое правило, порог @media), остальных нет; (в) в окне 1920 × 1080 размер корневого шрифта 16 px, в окне 2560 × 1440 — 21,33 px, в окне 3840 × 2160 — 24 px, в окнах 2560 × 1080 (21:9), 1600 × 900 и 1000 × 700 — 16 px, в окне 2560 × 1600 (16:10) — 21,33 px (для каждого из этих значений — 16, 21,33 и 24 px — допуск 0,05 px); значения читаются в браузере DESIGN-QA-VALIDATOR (getComputedStyle корневого элемента) на отдельном экземпляре из критерия 16; (г) в окне 2560 × 1440 ширина правой колонки, высота шапки, зазоры между областями и размеры шрифтов журнала, задач, легенды и кнопок в 4/3 раза больше, чем в окне 1920 × 1080 (допуск 0,1 px); в 1920 × 1080 они равны значениям до правки (колонка 380 px, шапка 60 px, зазоры 14 px, шрифты 9,5–15 px — по прежнему style.css, который берётся любым из двух способов: `git show HEAD:tools/src/pixel-office/public/style.css` — пока правка style.css не закоммичена, — или по копии, которую FRONTEND-DEV кладёт вне проекта до первой правки и называет её sha256 в handoff-е), а в окнах 1600 × 900, 1000 × 700 и 500 × 800 совпадают с этими значениями (масштаб 1,0, раскладки 600–1239 и до 599 px прежние); (д) в окнах 1920 × 1080, 2560 × 1440, 2560 × 1600, 3440 × 1440 и 1920 × 1200 документ не прокручивается (scrollHeight и scrollWidth корневого элемента не больше размеров окна), все элементы легенды видны или достижимы прокруткой своей полосы (границы элемента внутри окна после прокрутки полосы), а ширина области офиса и размер клетки холста (наибольшее целое число пикселей, при котором страница влезает, но не меньше нижней границы критерия 18) в 2560 × 1440 не меньше, чем в 1920 × 1080; (е) масштаб не задаётся скриптом и атрибутом style: `grep -c 'style=' tools/src/pixel-office/public/index.html` — 0, а `grep -nE 'documentElement|setAttribute.*style' tools/src/pixel-office/public/*.js` не находит записи размера или стиля корневого элемента (каждая найденная строка перечислена с причиной); (ж) прежние проверки Full HD (критерии 1–16) проходят без ослабления: `cd tools && npm test` — код 0, «skipped 0» и «todo 0». Проверка: перечисленные команды; снимки и измерения DESIGN-QA-VALIDATOR (на отдельном экземпляре, окна и значения — по перечню выше), их вывод — в его handoff-е; `cd tools && node --test`"
      # 2026-10-15, прогон PIXEL-20261015-01, WF-01 шаг 1, доработка r1 (REQ-ANALYST): было → стало по таблице REQ-048, decisions/0057, дополнение, п. 2; номер и статус не менялись; (в) подпись на холсте — короткая roleLabel (D13) → название простыми словами в одну-две строки (критерий 2 REQ-048).
      - "Читаемость на экранах владельца (просьба владельца 2026-10-06; «окно» — окно просмотра в CSS-пикселях, пороги — в CSS px, плотность пикселей их не меняет; сходство с образцом, критерий 16, не ослабляется: уплотнение пустого пола по пункту (д) расхождением с образцом не считается). Журнал проверки — основная сессия и 18 ролей, то есть 19 столов, как на снимке владельца docs/design/samples/office-owner-1470x784-2026-10-06.png (число столов — по его легенде и строке «ролей 18»); имена 18 ролей берутся из легенды этого снимка и записываются в тесте явным списком из 18 разных значений agent_type, а не читаются из файлов .claude/agents/ (порядок файлов в каталоге на результат не влияет); тот же список строит журнал DESIGN-QA-VALIDATOR в отдельной папке состояния. (а) Окна проверки: 1470 × 784 (MacBook 13 дюймов, снимок с плотностью 2), 1920 × 950 (монитор 25 дюймов Full HD с панелями браузера), 1920 × 1080, 2560 × 1440 и узкое 480 × 800. (б) Разборчивость при размере «по умолчанию» (без нажатия кнопок масштаба и без прокрутки холста) в каждом из первых четырёх окон: высота фигуры персонажа на холсте — от верха волос до низа тела — не меньше 20 CSS px и размер шрифта подписи роли на холсте не меньше 10 CSS px; при нынешнем рисунке (фигура — 18 из 24 единиц клетки, шрифт подписи — 9 из 24) это клетка не меньше 27 px (27·18/24 = 20,25; 27·9/24 = 10,1), но порог — высота и шрифт, а не клетка. Клетка по умолчанию при 19 столах: в 1470 × 784 — не меньше 27 px и без прокрутки холста (по расчёту: floor(602 / 22) = 27; 22 · 27 = 594 ≤ 602); в 1920 × 950 — не меньше 27 px и без прокрутки холста (по расчёту ≈ 34: floor(768 / 22)); в 1920 × 1080 — не меньше 27 px и не меньше, чем давала прежняя сетка 40 × 34 по тому же правилу (критерий 17(д)); в 2560 × 1440 — не меньше, чем в 1920 × 1080 (критерий 17(д)). Узкое окно 480 × 800: порог (б) не требуется, но страница не рассыпается — нет горизонтальной прокрутки страницы, все комнаты, столы и элементы пункта (г) достижимы. (в) Подпись роли — название простыми словами в одну или две строки по словам, без «…» (критерий 2 REQ-048; прежняя короткая подпись roleLabel, D13, не используется), то же название — в легенде и в карточке агента (критерии 5 и 11); размер шрифта порога (б) — это размер шрифта, а не ширина, до которой строка подписи может сжиматься. (г) Без потери информации в каждом из пяти окон: остаются все комнаты неподвижной обстановки (критерий 12), все 19 столов и персонажей, легенда на 19 элементов, журнал, панель «Задачи», шапка. В окнах 1470 × 784, 1920 × 950, 1920 × 1080 и 2560 × 1440 страница не прокручивается (scrollHeight и scrollWidth корневого элемента не больше размеров окна, как в критерии 16 для 1920 × 1080), холст при 19 столах помещается в свою панель целиком (прокрутки холста нет), а шапка, легенда, журнал и панель «Задачи» — все элементы видны или достижимы прокруткой своей полосы: легенда — полоса высотой не больше двух строк (≈ 70 px) с прокруткой внутри неё, все 19 элементов достижимы; альтернативное размещение легенды допускается, если на 1470 × 784 под холст остаётся не меньше 594 px без прокрутки страницы. В узком окне 480 × 800 горизонтальной прокрутки страницы нет (scrollWidth корневого элемента не больше ширины окна), недоступное достижимо прокруткой страницы или своей панели. Запасной вариант: если в журнале больше 19 столов (например, 40), клетка не меньше 27 px, ничего не обрезается без возможности добраться до него — холст прокручивается внутри своей панели (или достижим кнопками масштаба, если описание интерфейса их выбрало), страница по-прежнему не прокручивается. (д) Уплотнение офиса — измеримо и проверяется числом клеток. buildLayout(19) возвращает сетку не больше 36 клеток по ширине и не больше 22 по высоте, считая все стены (до правки — 40 × 34). Остаются все три комнаты с подписями «ПЕРЕГОВОРНАЯ» (с доской), «КУХНЯ» и «СЕРВЕРНАЯ», все 19 столов с местами и клетками подхода, проходы, растения и книжные полки; взаимное расположение по смыслу — как на образце: порядок комнат и зоны столов тот же, что в раскладке buildLayout(19) до правки (40 × 34, ROOM_MAP, ROOM_LEFT = 23 и deskSpot в tools/src/pixel-office/public/layout.js на 2026-10-06; тест хранит этот порядок константами с датой 2026-10-06, а не читает его из кода после правки): зона столов (клетки столов, мест и подхода) левее всех трёх комнат (в раскладке до правки наибольший x клеток подхода 18 < ROOM_LEFT 23); переговорная выше (меньше y) серверной и кухни (до правки y 1–6 против 11–15); серверная левее кухни (до правки x 26–28 против 36–37); столы стоят колоннами (столы одной колонны — на одном x). Убирается только пустой пол между ними и у внешней стены, не несущий ни комнаты, ни стола, ни прохода, а внешняя стена обходит только занятую часть: первый и последний ряд и первая и последняя колонка сетки — стена. «Мёртвый» ряд или колонка — ряд или колонка внутри внешней стены, где каждая клетка — пустой пол (kind floor, без мебели, стола, места, растения, полки, стены и подписи). Мёртвых рядов и колонок нет в таком виде: две и более подряд идущие пустые строки или колонки не допускаются, а одиночная пустая строка или колонка допускается только между двумя непустыми как проход шириной в одну клетку (рядом с внешней стеной пустых рядов и колонок нет). Это два отдельных условия, проверяются каждое своим тестом и ни одно не засчитывается вместо другого: (1) предел размера сетки — не больше 36 × 22 — обеспечивает само уплотнение; (2) отсутствие мёртвых рядов и колонок — дополнительная защита от пустых полос, предел размера оно не заменяет. Размер клетки считается по всей сетке: холст равен числу клеток по ширине и высоте, умноженному на клетку. (е) Проверка. Браузер (DESIGN-QA-VALIDATOR, отдельный экземпляр по критерию 16, журнал из пункта «Журнал проверки» в отдельной папке состояния): в каждом из пяти окон — размер холста и число клеток по ширине и высоте, из них клетка; высота фигуры и размер шрифта подписи (основная проверка — расчёт по константам рисования, названным в проекте, в тесте: при клетке 27 высота фигуры 20,25 px и шрифт 10,125 px, запас 0,25 и 0,125 px; измерение в браузере — высота фигуры в пикселях снимка при плотности 1 между волосами и низом тела — подтверждающее, с допуском 0,5 px: измеренное значение не меньше порога − 0,5); scrollWidth и scrollHeight корневого элемента против размеров окна и холста против его панели; для каждого из 19 элементов легенды, заголовков «Журнал» и «Задачи» и шапки — границы в окне после прокрутки своей полосы; цифры записываются в handoff-е. Снимки при 1470 × 784 (плотность 2) и 1920 × 950 сохраняются в docs/design/samples/ как office-compact-1470x784-2026-10-06.png и office-compact-1920x950-2026-10-06.png и сравниваются с образцом по тем же областям и элементам, что в критерии 16; снимок при 1470 × 784 — ещё и со снимком владельца: что стало читаемым, чего нет — не пропало. Тесты npm run check (tools/test/pixel-office-layout.test.js и tools/test/pixel-office-office.test.js): buildLayout(19) — число клеток по ширине не больше 36 и по высоте не больше 22 (точные значения записаны в тесте), три подписанные комнаты, 19 столов, их взаимное расположение по (д), нет мёртвых рядов и колонок по определению (д) и первый и последний ряд и колонка — стена; функция расчёта клетки возвращает для любой области не меньше нижней границы 27 и для области не меньше 36·27 × 22·27 = 972 × 594 — клетку не меньше 27 при 19 столах без прокрутки холста; по вызовам рисования при этой клетке высота фигуры не меньше 20 и размер шрифта подписи (из значения font) не меньше 10 — у основной сессии и у роли; для журнала из 19 столов на холсте нарисованы все 19 столов и персонажей и все три подписанные комнаты; для журнала из 40 столов клетка не меньше 27 и холст прокручиваемый; `cd tools && npm test` — код 0, «skipped 0» и «todo 0»"
  - id: REQ-008
    title: Pixel Office, часть 3 — просмотр истории запроса владельца (исходное сообщение, как его понял оркестратор, кто что сделал, хронология) — по образцу владельца docs/design/samples/history-view-sample-2026-10-05.jpg
    owner: BACKEND-DEV   # данные — хук, сервер, журнал, команда записи «как понял» и обязанность ORCH — правка его роли (критерий 16) — это часть (а); окно просмотра делает FRONTEND-DEV — часть (б)
    status: in_progress   # ORCH 2026-10-06: статус done по правилу шапки невозможен, пока depends_on (REQ-001, REQ-007) не done, — работа по REQ-008 завершена и проверена, статус вернётся в done, когда зависимости закроются. 2026-10-06 (прогон PO-20261005-02, WF-02, шаг 10): RELEASE-VALIDATOR — PASS по критериям 1–19 (handoffs/PO-20261005-02/step-09-release-validator.json; cd tools && npm run check — 483 из 483, два прогона в его ходе); статус поставлен последним действием шага после этого PASS. Названные остатки — не критерии, REQ-008 не держат: (1) подтверждение владельцем сходства окна с образцом docs/design/samples/history-view-sample-2026-10-05.jpg (по устройству и смыслу сходно — снимки docs/design/samples/history-window-1920x1080-2026-10-06.png и history-window-2560x1440-2026-10-06.png; решение за владельцем); (2) настоящая сессия Claude Code с реальным сообщением (нужно согласие владельца на расход лимита). Не получены вживую: состояния «хранение отключено», «нет связи», «ошибка» (закрыты тестами), узкий экран (замер не делался). depends_on REQ-001 и REQ-007 пока in_progress (их остатки — выше в их блоках)
