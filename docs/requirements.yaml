  - id: REQ-007
    title: Pixel Office, часть 2 — офис и страница как на образце владельца (docs/design/samples/office-2026-10-02.jpg) — комнаты и обстановка, персонажи ролей с правдивыми перемещениями и репликами, легенда, доска, шапка, журнал с фильтрами и панель задач по тем же событиям хуков, что журнал и список задач REQ-001
    owner: FRONTEND-DEV
    status: in_progress   # 2026-10-05: итоговая проверка прогона PO-20261002-01 — PASS по проверенному (handoffs/PO-20261002-01/step-09-release-validator-r1.json); не проверено поимённо: критерий 7 — настоящая сессия Claude Code (нужно согласие владельца на расход его лимита); критерий 16 — подтверждение владельцем сходства страницы со скриншотом
    depends_on: [REQ-001]   # офис строится на событиях, правилах задач и странице REQ-001; первая часть — прогон PO-20260930-01, правка по образцу — прогон PO-20261002-01
    original_request: >
