    original_request: >
      «Что ты делаешь? в пикель офисе не понятно что делается и не ясно вообще на какой
      стадии» — слова владельца, 2026-10-11, сообщение в сессии Claude Code со скриншотом
      строки «Сейчас: SECURITY-REVIEW… — SECURITY-REVIEWER ISS-0010 · и ещё 2 в работе»
      (опечатка «пикель» — владельца, не исправлена). Тот же текст ORCH записал дословно в
      задание этого шага: handoffs/REQ-20261011-01/step-03-req-analyst.json, поле
      context.owner_words. Жалоба из двух частей: «не понятно что делается» — этим
      требованием (строка на каждого агента, полные названия ролей); «не ясно … на какой
      стадии» — требованием REQ-037 (запись этапа, решение 0028). Основание — слова
      владельца о цели Pixel Office, дословно в original_request REQ-001: «Красивый офис с
      фейковой логикой хуже простого офиса с настоящей агентной работой» и «Это не просто
      декоративная анимация и не dashboard со статусами» (требование прежнего проекта
      владельца).
    description: >
      Что получает владелец. Сейчас строка «Сейчас» шапки Pixel Office показывает первый
      элемент «в работе» и число остальных: «Сейчас: SECURITY-REVIEW… — <описание> · и
      ещё 2 в работе» (tools/src/pixel-office/public/panels.js, nowLine; тексты —
      texts.js, NOW_PREFIX, NOW_MORE). Что делают остальные агенты, не видно, а название
      роли обрезано: roleLabel (office-model.js, LABEL_MAX = 16) берёт из «Sai Security
      Reviewer (SECURITY-REVIEWER)» только текст скобок и режет его до 15 знаков с «…»;
      сама строка к тому же обрезается правилом style.css (`.now-text`: nowrap и
      text-overflow: ellipsis; в окне шириной до 599 px вместо этого -webkit-line-clamp: 2,
      style.css, @media (max-width: 599px)). После этой работы в блоке «Сейчас» у каждого
      работающего агента своя строка с названием роли простыми словами и описанием задачи,
      ничего не обрезано.

      Что в этой работе нет. «Стадия» (над каким прогоном идёт работа, шаг, что дальше) —
      отдельное требование REQ-037 (depends_on этого): ему нужна запись оркестратора,
      решение decisions/0028. Здесь строка прогона и номер шага не показываются, и
      «Название прогона и шаг не переданы» тоже не пишется: это текст REQ-037.

      Что показывает экран (содержание; расположение и вид — описание интерфейса
      docs/design/REQ-036-*.md, GUI-DESIGN-ANALYST, WF-04):
      1. Блок «Сейчас»: по одной строке на каждый элемент «в работе» раздела «Текущие»
         панели «Задачи», в том же порядке: «<название роли простыми словами> —
         <описание задачи>»; без описания — только название роли; строка основной сессии —
         прежний текст «Основная сессия — обрабатывает запрос» (MAIN_ROW). Число строк
         равно числу элементов «в работе»; текста «и ещё N» нет.
      2. Нет работы — «Сейчас: в работе ничего нет» (как сейчас).
      3. Названия ролей не обрезаются ни кодом, ни стилем: в блоке «Сейчас», в строках
         агентов и в подписи роли любого элемента панели «Задачи» — и «Текущие» (в работе),
         и «История» (завершённые) — полное название простыми словами, одно и то же в обоих
         разделах (одна таблица): пока агент работает, подпись «Проверка безопасности», и
         когда завершился, она та же, а не «SECURITY-REVIEW…»; если не помещается — перенос на следующую строку. Подписи
         персонажей на холсте и в легенде/доске (кратко, решение D13, критерии 10, 11, 13
         REQ-007) этой работой не меняются: roleLabel остаётся для холста.
      4. Много агентов: блок «Сейчас» прокручивается внутри себя; на окнах 1920 × 1080 и
         1470 × 784 страница целиком не прокручивается и не теряет офис; на узких окнах
         (480 × 800, 390 × 844) вертикальная прокрутка страницы допустима, как сегодня
         (критерий 17 REQ-007), горизонтальной нет нигде.

      Название роли простыми словами. Таблица «код роли → название» лежит в
      tools/src/pixel-office/public/texts.js, ключ — код в скобках поля `name:` файла
      роли (`.claude/agents/*.md`; сейчас 37 файлов: `grep -h '^name:' .claude/agents/*.md
      | wc -l`). Примеры названий (окончательные формулировки пишет FRONTEND-DEV, правила —
      критерий 1): SECURITY-REVIEWER — «Проверка безопасности», REVIEWER — «Ревью кода»,
      TEST-RUNNER — «Запуск проверки», BACKEND-DEV — «Серверная часть», ORCH —
      «Оркестратор». Роль, которой в таблице нет (например, `Explore`, `general-purpose`
      или роль из другого окружения), показывается как пришла, целиком.

      Связь с REQ-007 (замечание 4 проверки). Эта работа меняет два принятых критерия
      REQ-007: 9 («Шапка»: строка «Сейчас» — первый элемент и число остальных) и 15
      («Панель задач»: у элемента «подпись и полное имя роли», где подпись — roleLabel;
      тест pixel-office-panels.test.js:542 ждёт «ORCH», а PN-02 — строки :186 «Сейчас:
      Explore · и ещё 1 в работе» и :200 «· и ещё 2 в работе»). Остальные критерии
      REQ-007 сверены: 10 (облачка), 11 (легенда), 13 (доска) показывают подписи холста
      (D13) и не меняются; 16 (сходство со скриншотом) — за владельцем, он будет
      подтверждать новый вид; 18 (читаемость, бюджет высоты) не меняется и проверяется в
      критерии 7 этого блока. Блок REQ-007 — чужой, его правит не этот блок и не WF-02, а
      отдельный шаг WF-01 до WF-02 этого требования (по образцу step-00c в
      PO-20261002-01): REQ-ANALYST переписывает только критерии 9 и 15 REQ-007 в
      docs/requirements.yaml под новую форму, REQ-VALIDATOR проверяет, и только потом
      начинается WF-02 по REQ-036. Шаг WF-01 других файлов не правит. Описание
      docs/design/REQ-007-office-ui.md (строки 319–320) переписывает CODE-DESIGNER этого
      требования в WF-02, шаг 1, в составе проекта; принятые тесты (PN-02, панель)
      заменяет TEST-DESIGNER в WF-02, шаг 5, по таблице «прежняя проверка → новая». Таблица лежит в docs/design/REQ-036-*.md, её пишет CODE-DESIGNER в составе проекта (WF-02, шаг 1), тесты по ней заменяет TEST-DESIGNER. Иначе
      код этого требования сделает красными принятые тесты REQ-007. Правило правки тестов
      — критерий 9 этого блока: тесты не удаляются и не ослабляются, а заменяются.

      Бюджет высоты критерия 18 REQ-007. На 1470 × 784 шапка 60 px, под холст остаётся
      602 px при нужных 594 — запас 8 px (критерий 18 REQ-007). Блок из строк агентов
      шрифтом не меньше шрифта журнала в шапку без роста её высоты не помещается.
      Требование этого не решает: бюджет критерия 18 не меняется, шапка остаётся 60 px,
      блок строк стоит там, где место уже прокручивается или не отнимается у холста.
      Где именно — выбор описания интерфейса и проекта CODE-DESIGNER (открытый вопрос 2);
      проверка выбора — критерий 7 (браузер, scrollHeight) и неизменный тест критерия 18.

      Какие данные есть сегодня (проверено по коду 2026-10-11). Строка журнала Pixel
      Office имеет только поля из LINE_KEYS (tools/src/pixel-office/public/schema.js):
      время, источник, вид события хука, session_id, agent_id, agent_type (роль),
      tool_use_id, launched_agent_id, subagent_type, description (до 100 знаков, как
      написал оркестратор при запуске субагента), текст сообщения владельца и запись
      оркестратора (note_text, req_id, request_time). Для этой работы хватает agent_type
      и description; ни прогона, ни шага в журнале нет — это REQ-037.

      Безопасность. Q7 и решение 0013: описание и роль — данные, в страницу выводятся
      как текст (textContent), не как разметка; секрет, попавший в описание, уже заменён
      «[скрыто]» при записи (hook.js, mask.js) и на странице не появляется; текст
      сообщения владельца и записи «как понял» в блоке «Сейчас» не выводятся. Q8, Q9,
      Q11, R3 неприменимы (магазинов, SQL, адресов от пользователя, фото нет). Q10:
      роль или описание нестандартного вида (пусто, 100 знаков, разметка, незнакомая
      роль) не ломают страницу; страница при сбое связи сохраняет прежний вид (PN-02).
      R2: на экране нет ни одной фразы, названия и числа, которых нет в журнале; название
      роли простыми словами — перевод кода роли по таблице, а не новое событие.

      Файлы (от корня Sai): tools/src/pixel-office/public/ (texts.js, panels.js,
      office-model.js — только использование в панели, app.js, index.html, style.css) и
      тесты и их помощники — шаблон tools/test/pixel-office-* (*.test.js, pixel-office-helpers.js, фикстуры — pixel-office-* в корне tools/test/ или в принятом месте фикстур tools/test/fixtures/pixel-office/; других файлов в tools/test/ правка не касается); новые — docs/design/REQ-036-*.md
      (описание интерфейса), снимки в docs/design/samples/; раздел «## Pixel Office»
      tools/README.md. Вне этих файлов: критерии 9 и 15 REQ-007 в docs/requirements.yaml —
      отдельный шаг WF-01; docs/design/REQ-007-office-ui.md (строки 319–320) —
      CODE-DESIGNER этого требования в составе проекта. Код
      сервера, схема журнала, оркестратор — не здесь.

      Вне области: стадия прогона, запись этапа и заполнение описаний задач оркестратором
      (REQ-037), подписи персонажей на холсте (D13), журнал и его фильтры, окно «Просмотр
      истории» (REQ-008), Sai Team (REQ-011, REQ-012), хуки Claude Code и состав их
      полей, перевод журнала на простой язык, цвета и анимация офиса.

      Открытые вопросы (ответ — запись decisions/ или слово владельца):
      1. Подписи персонажей на холсте остаются краткими (D13)? Предложение: да, холст
         ограничен клеткой; полное название — в блоке «Сейчас» и в панели.
      2. Где стоит блок строк и откуда его высота при бюджете критерия 18 REQ-007
         (запас 8 px на 1470 × 784): CODE-DESIGNER и GUI-DESIGN-ANALYST; ответ записан
         в проекте и описании интерфейса до кода.
      3. Подтверждение владельца (критерий 16 REQ-007) теперь касается нового вида шапки
         и панели; сказать владельцу в отчёте.
    acceptance_criteria:
      # 2026-10-15, прогон PIXEL-20261015-01, WF-01 шаг 1, доработка r4 (REQ-ANALYST): было → стало, REQ-048, decisions/0058; номер и статус не менялись; G3: «подпись того же персонажа на холсте (D13) остаётся краткой, как сегодня» → «подпись на холсте — то же название простыми словами в одну-две строки (критерий 2 REQ-048)».
      - "Названия ролей простыми словами и целиком. Тест tools/test/pixel-office-panels.test.js:
        для каждого кода из `grep -h '^name:' .claude/agents/*.md` (код в скобках; сейчас
        37) в таблице texts.js есть запись; название — 1–40 знаков, без латинских букв и
        без слов «agent», «prompt», «token», «JSON»; названия разных кодов различны; роль
        вне таблицы (`Explore`, `general-purpose`, строка из 60 знаков) в строке показана
        как пришла, целиком. Поведение вместо grep по имени функции: журнал с запуском
        роли «Sai Security Reviewer (SECURITY-REVIEWER)» → textContent строки блока
        «Сейчас» равен «Проверка безопасности — <описание>», textContent подписи роли
        элемента «в работе» панели — «Проверка безопасности», подстроки «SECURITY-REVIEW…»
        нет нигде в блоке «Сейчас» и в панели; после SubagentStop того же агента его
        элемент в разделе «История» панели «Задачи» имеет подпись роли «Проверка
        безопасности» (тот же текст, что у элемента в разделе «Текущие»), подстроки
        «SECURITY-REVIEW…» в «Истории» нет; подпись того же персонажа на холсте — то же
        название простыми словами в одну-две строки (критерий 2 REQ-048; decisions/0058, п. 1 заменяет D13). То же в настоящем браузере (критерий 7) на
        1470 × 784 и 390 × 844: название роли видно целиком, элемент не обрезан — и в
        «Текущих», и в «Истории»"
      - "У каждого агента своя строка. Тест на фикстурном журнале: n агентов «в работе» → в
        блоке «Сейчас» ровно n строк, у каждой своё название роли и своё описание из
        журнала, текста «и ещё» нет: `grep -rn 'NOW_MORE' tools/src/pixel-office/` пусто и
        `grep -rn '· и ещё' tools/src/pixel-office/` пусто. Примеры «вход → ожидаемое»: 1
        агент → 1 строка; 5 агентов (три роли, две из них по два раза с разными
        описаниями) → 5 строк, каждое описание на своём месте; агент без описания → только
        название роли; основная сессия и 2 агента → 3 строки, первая — «Основная сессия —
        обрабатывает запрос»; агент завершился (SubagentStop) → через опрос его строки
        нет; нет работы → «Сейчас: в работе ничего нет». Порядок строк — как у списка
        «Текущие» панели «Задачи» (правило d REQ-001)"
      - "Названия не обрезаются (плохие условия, включая узкий экран). Тест на настоящем
        коде страницы с фикстурами: описание в 100 знаков из широких букв, название роли
        вне таблицы в 60 знаков, длинное слово без пробелов — textContent строки содержит
        текст целиком, код не добавляет «…». Правила style.css: тест читает файл и
        проверяет, что у селекторов блока «Сейчас» и его строк (имена — из описания
        интерфейса) нет `text-overflow` и `-webkit-line-clamp`, в том числе внутри
        `@media (max-width: 599px)`; в настоящем браузере в окнах 1470 × 784, 480 × 800 и
        390 × 844 у каждой строки computed style text-overflow не ellipsis,
        -webkit-line-clamp — none, scrollWidth не больше clientWidth, текст переносится"
      - "Много агентов. Тест и браузер: двенадцать агентов «в работе» → двенадцать строк;
        блок «Сейчас» прокручивается внутри себя (scrollHeight больше clientHeight, у блока
        overflow-y: auto или scroll), ни одна строка не заменена словами «и ещё»; на окнах
        1920 × 1080 и 1470 × 784 страница целиком не прокручивается (scrollHeight и
        scrollWidth документа не больше размера окна); на 480 × 800 и 390 × 844
        вертикальная прокрутка страницы допустима (как в критерии 7 и критерии 17
        REQ-007), scrollWidth документа не больше ширины окна"
      - "Данные только из журнала, догадки нет (R2). Тест: названия строк строятся только из
        agent_type и description; запрос владельца, запись «как понял» с req_id и ее note_text
        в блоке «Сейчас» не выводятся; страница отправляет только GET:
        `grep -rnE \"method *: *['\\\"](POST|PUT|PATCH|DELETE)\" tools/src/pixel-office/public/`
        пусто (как в критерии 3 REQ-007); при потере связи блок хранит последнее состояние
        (PN-02)"
      - "Секреты и разметка (Q7, решение 0013). Тест: образец секрета из
        tools/test/pixel-office-hook.test.js (вымышленный ключ вида sk-… и пара password=…)
        в описании и роли → в файле журнала, ответе сервера и textContent страницы образца
        нет, на его месте «[скрыто]»; текст «<script>alert(1)</script>» в описании показан
        как текст: `grep -rn 'innerHTML\\|outerHTML\\|insertAdjacentHTML\\|document.write'
        tools/src/pixel-office/public/` пусто"
