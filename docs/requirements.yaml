    description: >
      Что получает владелец. На той же странице, что список задач и журнал REQ-001, по
      той же ссылке — офис и страница, устроенные как на образце владельца
      docs/design/samples/office-2026-10-02.jpg (sha256
      148eda286845409ff8761ad90bcbd43b727593577dc50fdb4a05ed62b0f810d5; сохранён ORCH по
      WF-04, шаг 0): сверху шапка; слева офис с комнатами, обстановкой и персонажами
