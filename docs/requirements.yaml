  - id: REQ-040
    title: Сверка живых документов с фактами — машинный блок «Факты» в README.md (раздел «Что ещё не готово») и в верху STATE.md пишет команда `npm run facts -- --write` из docs/requirements.yaml, docs/issues/, decisions/ и docs/anti-patterns.md; `npm run facts` в `npm run check` сверяет блок с файлами и пишет понятную ошибку; ORCH запускает `--write` при каждом изменении статуса требования или дефекта
    owner: BACKEND-DEV   # команда, блок и тесты в tools/; первый блок в README.md и STATE.md ставит команда `--write` в том же прогоне; правило запуска в документах процессов и файлах ролей ORCH и DOC-UPDATER — DOC-UPDATER на шаге 10 по проекту
    status: pending
    depends_on: []   # нужны только существующие файлы; от REQ-038 и REQ-039 не зависит
    original_request: >
      «Сформируй требования которые ты считаешь полезными для sonnet, после этого я запущу
      это все твое на sonnet» — слова владельца, 2026-10-11, сообщение в сессии Claude Code
      (дословно — в поле context.owner_words handoffs/REQ-20261011-02/
      step-01-req-analyst.json). Основание — аудит ORCH 2026-10-11: README.md, CLAUDE.md и
      STATE.md отставали от фактов, и это находили только люди и итоговая проверка.
      Пример того же дня: README.md, раздел «Что ещё не готово», пишет «из 37 — 6 в статусе
      done, 8 — in_progress, 23 — pending»; это верно до записи этого прогона, а после
      добавления REQ-038…REQ-041 требований 41 и pending 27 — текст отстал в тот же час.
    description: >
      Что получает владелец. Числа о требованиях, дефектах, решениях и журнале ошибок в
      README.md и STATE.md никто не набирает руками: их пишет команда `cd tools && npm run
      facts -- --write` из файлов-источников, а `cd tools && npm run facts` (шаг `npm run
      check`) сверяет написанное с файлами. Забыли пересобрать — `npm run check` красный и
      печатает, что и где разошлось, и как исправить, например «README.md:141 — блок
      «Факты» отстал: pending: в тексте 23, по docs/requirements.yaml 27; запустите `cd
      tools && npm run facts -- --write`».

      Блок «Факты». Машинный блок — строки между строкой-маркером `<!-- facts:begin -->` и
      строкой-маркером `<!-- facts:end -->` (каждый маркер — отдельная строка целиком). Его
      текст целиком собирает команда; руками он не правится. Текст блока (значения на
      2026-10-11 после записи этого прогона):

        Факты (пишет `cd tools && npm run facts -- --write`, руками не править):
        - Требования (`docs/requirements.yaml`): всего 41 — done 6, in_progress 8, pending 27, blocked 0, cancelled 0.
        - Открытые дефекты (`docs/issues/`, «Статус: open»): 17; следующий номер — ISS-0023.
        - Следующий номер решения (`decisions/`) — 0035; следующий номер ошибки процесса (`docs/anti-patterns.md`) — AP-066.

      Точная запись строк (пробелы, знаки, порядок) закрепляется проектом CODE-DESIGNER и
      тестом; числа и их источники закреплены здесь:
      - всего — число блоков `  - id: REQ-NNN` в docs/requirements.yaml;
      - done, in_progress, pending, blocked, cancelled — число блоков с этим значением поля
        status (комментарий после «#» не учитывается; перечень статусов — шапка
        docs/requirements.yaml);
      - открытые дефекты — число файлов docs/issues/ISS-NNNN-*.md, у которых первое
        «Статус:» в файле — open (вид строки на 2026-10-11: «Серьёзность: LOW. Статус: open.
        …»; закрытый: «Статус: closed, 2026-10-11, …»);
      - следующий номер дефекта — «ISS-» и наибольший номер файла docs/issues/ плюс один,
        четыре цифры;
      - следующий номер решения — наибольший номер NNNN среди файлов decisions/NNNN-*.md и
        строк таблицы decisions/README.md плюс один, четыре цифры;
      - следующий номер ошибки процесса — «AP-» и наибольший номер заголовка `### AP-NNN` в
        docs/anti-patterns.md плюс один, три цифры.

      Где стоит блок (по одному в файле, это места записи требования). README.md — в
      разделе «## Что ещё не готово», сразу после первой строки раздела («По `STATE.md` …»);
      в пунктах этого раздела «**Требования:**» и «**Открытые дефекты**» числа убираются и
      заменяются ссылкой на блок (остальной текст пунктов, например «из них ISS-0002 —
      HIGH», остаётся). STATE.md — над первым заголовком «## » (верх файла: его читают
      первым, и он не уходит вниз, когда DOC-UPDATER пишет новый раздел даты); числа в
      разделах дат — история и не сверяются.

      Команда. `cd tools && npm run facts` — сверка, входит в `npm run check` перед `npm
      run test` (как traces и handoffs-check: TC-20 и проверка «check кончается на npm run
      test» проходят без правки). Собирает текст блока из источников и сравнивает с блоком
      в README.md и STATE.md. Расхождение числа — строка «<файл>:<строка> — блок «Факты»
      отстал: <что>: в тексте <X>, по <источник> <Y>; запустите `cd tools && npm run facts
      -- --write`»; все расхождения, а не первое; блок отличается не числом (текст правили
      руками) — «<файл>:<строка> — блок «Факты» изменён руками; запустите …»; маркера нет,
      маркер повторён или не закрыт, блок не в своём месте — строка об этом. Итог «facts:
      блоков проверено <N>, расхождений <M>». Сверка ничего не пишет.
      `cd tools && npm run facts -- --write` — пересборка: заменяет строки между маркерами
      в обоих файлах собранным текстом; байты вне блока не меняются; запись — временный
      файл в той же папке и переименование (как в служебном коде по decisions/0004);
      повторный запуск без изменения источников ничего не меняет и печатает «facts: блок
      без изменений: <файл>». Если в любом из двух файлов маркеры не на месте (нет,
      повторены, не закрыты) — `--write` не пишет ни одного файла и печатает, что
      исправить, код 1: первый блок ставится руками только маркерами, текст — командой.
      Коды — как у traces: 0 — расхождений нет (сверка) или записано (`--write`); 1 —
      расхождение или ошибка маркеров; 2 — источник не читается, ошибка вызова, ошибка
      записи на диск. Ошибка — одна строка stderr «facts: <код>: <текст>», без стека.

      Что меняется в процессе (правило, без которого `npm run check` краснел бы в каждом
      прогоне). Блок отстаёт в тот момент, когда меняется источник: статус требования,
      новое требование, новый или закрытый дефект, новое решение, новая запись журнала
      ошибок. Поэтому ORCH обязан запускать `cd tools && npm run facts -- --write` после
      каждого шага, который изменил источник, до запуска следующего шага, и прикладывать
      вывод `cd tools && npm run facts` (код 0) к своей проверке. Названные места:
      WF-02, шаг 0 (статус pending → in_progress) и шаг 10 (статус done; перед шагом 11);
      WF-03, шаг 0 (новый дефект) и шаг 10 (дефект закрыт); WF-01, конец — шаг 3 (новое
      требование), а также после шага 1 и каждой доработки, если дальше в прогоне
      запускается `npm run check`; запись решения в decisions/ и новая запись в
      docs/anti-patterns.md. DOC-UPDATER, изменив источник на шаге 10, запускает `--write`
      в том же шаге (повторный запуск ORCH ничего не меняет). Запуск `--write` — запись в
      README.md и STATE.md: при параллельных прогонах — по правилу общего файла (WF-02,
      шаг 0, п. 3). Если ORCH следует правилу, `npm run check` в прогоне не краснеет на
      facts.

      Точные места записи (перечень закрытый). Код — tools/src/facts/ (новая папка);
      tools/package.json — скрипт facts и шаг check; тесты — tools/test/facts-*.test.js и
      фикстуры tools/test/fixtures/facts/; README.md — один блок «Факты» в разделе «Что ещё
      не готово» и замена чисел в пунктах «Требования» и «Открытые дефекты» этого раздела
      ссылкой на блок; STATE.md — один блок над первым заголовком «## »; tools/README.md —
      раздел о команде; docs/workflows/WF-01-requirement.md (шаг 3), docs/workflows/
      WF-02-development.md (шаг 0 и шаг 10), docs/workflows/WF-03-defect.md (шаг 0 и шаг
      10) — по одному предложению с правилом запуска `--write`; .claude/agents/
      orchestrator.md и .claude/agents/doc-updater.md — по одному пункту с тем же правилом.
      Файлы учёта прогона — как в REQ-038.

      Безопасность и сбои. Q7 — команда читает только документы Sai и печатает числа и
      номера; Q10 — битый маркер, нечитаемый источник или сбой записи дают понятную строку,
      а не стек, и не оставляют файл наполовину записанным. Q8, Q9, Q11, R3 неприменимы; R2
      не затрагивается.

      Вне области: число тестов (меняется от кода самого прогона, изнутри `npm run check`
      его не узнать; его сверяет RELEASE-VALIDATOR своим запуском — открытый вопрос 1);
      проверка прозы вне блока; CLAUDE.md (чисел о требованиях и дефектах в нём нет);
      docs/product/requirements-catalog.md (столбец статусов — проза); PLAN.md; разделы дат
      STATE.md.

      Открытые вопросы:
      1. Нужно ли в блоке число тестов (с ключом, который читает сохранённый вывод `npm
         test`) — отдельной работой.
      2. Нужны ли в блоке открытые дефекты по серьёзности (сейчас README пишет «из них
         ISS-0002 — HIGH») — отдельной работой.
    acceptance_criteria:
      - "Блок поставлен. `grep -c '^<!-- facts:begin -->$' README.md STATE.md` и `grep -c '^<!-- facts:end -->$' README.md STATE.md` — по 1 в каждом файле; в README.md блок внутри раздела: `awk '/^## Что ещё не готово/{f=1;next} /^## /{f=0} f' README.md | grep -c 'facts:begin'` равно 1; в STATE.md — над первым заголовком: `awk '/^## /{exit} 1' STATE.md | grep -c 'facts:begin'` равно 1; в пунктах раздела README.md чисел больше нет: `awk '/^## Что ещё не готово/{f=1;next} /^## /{f=0} f' README.md | grep -cE 'из [0-9]+ — [0-9]+ в статусе|Открытые дефекты — [0-9]+'` равно 0"
