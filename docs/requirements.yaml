      по имени и паролю. По умолчанию всё по-прежнему работает только на этом
      компьютере; доступ коллег с других компьютеров включается явно — настройкой,
      названной в записи решения владельца. Из лучшего у [образца] (платформа
      процессов) берётся смысл: вход и сессия как граница доступа. Минимум: без
      внешней службы входа, входа через почту или телефон и ключей доступа.

      Это первая из трёх частей (деление REQ-018 по замечанию F11 прогона
      REQ-20261006-01): здесь — пользователи и вход; роли и таблица прав — REQ-023;
      рабочие пространства — REQ-024. До REQ-023 у всех вошедших одни и те же права —
      те, что даёт страница REQ-011; пользователей создаёт и удаляет и пароли
      сбрасывает только владелец установки (владелец этого компьютера) командами
      терминала (`npm run team -- …`; имена команд — проект): доступ к терминалу и есть
      доступ владельца. Регистрации, добавления и удаления пользователей со страницы
      нет. Удалённый пользователь не входит, все его сессии недействительны; его
      прежние записи в журналах не меняются.

      Журнал входа — журнал уровня установки (один на SAI_TEAM_HOME, не на
      пространство): сюда пишутся вход, неверный вход, выход, сброс пароля, создание и
      удаление пользователя. При неверном входе пространство неизвестно — поэтому
      такие события пишутся сюда, а не в журнал пространства (REQ-024). Строка — одна
      JSON-строка: время UTC, вид события, пользователь (при неверном входе с
      несуществующим именем — пометка «неизвестное имя», введённое имя не пишется),
