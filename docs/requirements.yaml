    original_request: >
      Слова владельца, сообщение в сессии Claude Code, 2026-10-13; дословно — в
      docs/owner-requests/2026-10-13-pixel-office.md, раздел о заимствованиях из прежнего
      проекта владельца: «Единая обработка ошибок. Пользователь должен понимать, что не
      удалось получить или отобразить.» Объём и порядок — decisions/0049 и decisions/0051
      (п. 1: ошибки выделены из REQ-042 в это требование); основание — изучение
      handoffs/PIXEL-20261013-01/step-00-architecture-auditor.json (result.report_markdown,
      дефекты D7 и D8).
    description: >
      Что получает владелец. Если сервер Pixel Office жив, но не может прочитать журнал,
      страница говорит об этом, а не «Нет связи с сервером Pixel Office»; и все ошибки
      сервера, включая 403 и 405, отвечают телом одного вида — JSON с кодом.

      Как сейчас (проверено по коду 2026-10-13, файлы — от корня Sai). 1.
      tools/src/pixel-office/public/app.js (getJson, requestCycle): на любой ответ, кроме 200,
      страница пишет «Нет связи с сервером Pixel Office» (NO_CONNECTION, texts.js), в том числе
      на 500 с телом {"error":"read_failed"} (server.js), когда сервер жив, а журнал не читается
      (D7). 2. tools/src/pixel-office/server.js (route, sendEmpty): 403 (чужой Host) и 405
      (метод не тот) отвечают пустым телом, остальные ошибки (400, 401, 404, 413, 500) — JSON
      {"error": код} (D8).

      Что в этой работе нет. Состояния задач, слова состояний, порог «нет свежих данных» —
      REQ-042; хук, подписи, схема журнала, правило чтения; коды и статусы ответов (меняется
      только тело 403 и 405); окно «Просмотр истории» (его «Нет связи» не меняется).

      Планка. Q7: в теле ответа только код, секретов и данных журнала нет. R2: страница не
      придумывает причин — слово «журнал не читается» ставится только по ответу 500 с кодом
      read_failed. Q8 неприменим: данных клиентов нет, Pixel Office — служебный инструмент
      (решение 0003). Q10: реалистичный сбой «журнал не читается» разобран критерием 1; внешних
      сервисов нет. Q11 неприменим: адресов, которые задаёт клиент или пользователь и по
      которым ходит сервер, нет. R3 сейчас не применим (решение 0033).

