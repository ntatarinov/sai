      tools/README.md (раздел «## Sai Team — пользователи»), запись
      decisions/NNNN-*.md (пишет DOC-UPDATER по слову ORCH после решения владельца).

      Вне области: роли и права (REQ-023), рабочие пространства (REQ-024), внешняя
      служба входа, вход через почту или телефон, группы, ключи API, приглашения по
      почте, https-сертификаты, оплата и тарифы.
    acceptance_criteria:
