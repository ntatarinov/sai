  - id: REQ-018
    title: Sai Team, часть 8 — пользователи и вход — имя и пароль, сессия и её срок, сброс пароля владельцем, режим доступа (по умолчанию только 127.0.0.1, проверка Host и Origin)
    owner: BACKEND-DEV   # пользователи, сессии, режим доступа; страница входа — FRONTEND-DEV
    status: pending
