      владелец просил, поэтому он не необязателен и не откладывается: первая часть
      сделана в прогоне PO-20260930-01 (решение ORCH по находке S1,
      handoffs/PO-20260930-01/step-00a-req-analyst-r2.json), правка по образцу — прогон
      PO-20261002-01 по WF-04: описание интерфейса, сборка, ворота WF-02, снимок против
      образца, подтверждение владельца.

      Источник — только события REQ-001. Офис, легенда, доска, облачка, строка «Сейчас»,
      журнал с фильтрами, панель задач и карточка агента строятся из того же массива
      событий (и времени запусков сервера), что журнал и список задач REQ-001, по тем же
      правилам: задачи и их состояния — по критерию 6 REQ-001, строки «не из хуков» — по
      критерию 4 REQ-001 (не меняют ни состояний, ни перемещений, ни облачков). Своего
      хранилища, сервера и пути записи у REQ-007 нет. Идущая сессия — session_id, у
      которого есть событие после последнего запуска сервера и последнее событие
      которого — не событие окончания сессии и не старше STALE_AFTER_MS (критерий 3
      REQ-042): сессия, возобновлённая с тем же session_id (факт 12 REQ-001), снова идёт.

      Элементы образца — что переносится (в скобках — номер критерия).

      Шапка. Название — как «Pixel Office»: так называется страница Sai, а «Agent
      Office» — имя страницы эталона (9). Значок «LIVE» с подписью «реальные события
      Agent Runtime» — в честной форме: «LIVE» виден, только пока есть связь с сервером, а
      подпись — пометка «REAL — события хуков Claude Code» критерия 4 REQ-001 (9). Строка
      «Сейчас: <номер требования> — <название требования>» — в честной форме: «Сейчас:» и первый
      элемент «в работе» панели задач — роль и описание задачи или строка основной сессии
      (9); номера и названия требования в событиях хуков нет. Кнопки «Пауза», «1×», «2×»,
      «4×» — в честной форме: управляют только ходьбой персонажей, история не
      проигрывается (решение D8, decisions/0005), а состояния, облачка, журнал и список от
      них не зависят (9). Ссылка «← Учётная система» — не переносится: у Sai нет
      системы, к которой она вела бы.

      Офис. Обстановка делится на две части. Неподвижная — тёмный клетчатый пол и стены
      вне зоны столов, растения, книжные полки, переговорная (большой стол, места вокруг
      него, доска на стене), кухня (стойка с кофемашиной, места отдыха), отдельные места
      отдыха в зале, серверная (стойки за стенами) и подписи «ПЕРЕГОВОРНАЯ», «КУХНЯ»,
      «СЕРВЕРНАЯ» — переносится как есть и не зависит ни от событий, ни от времени (12);
      от событий в ней зависит только доска-канбан со столбцами ролей — в честной форме:
      столбец на каждую роль с задачей в идущих сессиях (на образце — участники текущего
      требования) и «+N» для не поместившихся (13). Растущая — зона столов: столы с
      ноутбуком и стулом, перегородки между их колонками и место под них — в честной
      форме: столов столько, сколько ролей с задачами, и ещё стол основной сессии, а не
      12, как на образце; новые столы добавляются вместе с журналом, занятые не
      сдвигаются (раздел «Столы», критерий 1); экран ноутбука светится, пока роль работает
      (2). Места для всех в переговорной и места отдыха — обстановка: собраний и отдыха
      хуки не дают, поэтому туда никто не ходит (3). Раскладка под FullHD — доработка с
      образца (в его панели читается «…FullHD») — переносится: в окне 1920 × 1080 вся
      страница видна без прокрутки страницы, прокручиваются только списки журнала и
      панели задач (16).

      Персонажи. Фигурка цвета роли на стуле у своего стола, короткая подпись роли (у
      Sai — правило roleLabel, решение D13) и выделение выбранного персонажа —
      переносятся (1, 5). Персонаж «ORCH» образца — у Sai персонаж «Основная сессия»: роль
      основной сессии в событиях хуков не названа (1). Облачка реплик — в честной форме: короткие фразы из закрытого
      списка, каждая привязана к событию и видна только первые 10 секунд после него (10).
      Облачко «Да, конечно» — ответ на вопрос — не переносится. Персонажи, которые в
      простое стоят у чужого стола, сидят в переговорной или стоят у кухни, — не
      переносятся: на образце это следствие событий «вопрос», «совещание» и отдыха,
      которых хуки не дают; у Sai свободный персонаж сидит за своим столом (3). Легенда
      «<роль> · свободен / работает» с меткой цвета у работающих — переносится (11).

      Журнал. Заголовок «Журнал», фильтры «Всё», «Работа», «Офис», подпись пояса и
      счётчик «N из M» — в честной форме: «Работа» — события работы основной сессии и
      субагентов, «Офис» — строки, вызвавшие перемещение в офисе, пояс — часов
      компьютера владельца (критерий 6(е) REQ-001), а не постоянный «Алматы» (14). У
      строки — время, роль, вид события и описание задачи, а цветная полоса у строки
      переносится как метка вида события (14); номер требования и текст итога
      в строке — не переносятся: номера требования в событиях хуков нет, а тексты итогов
      REQ-001 не хранит (критерий 3 REQ-001, Q7).

      Панель «Требования» (текущее с полосой хода «задач N/M · агентов K» и история) — в
      честной форме: панель «Задачи» — список задач REQ-001 в разделах «Текущие» и
      «История», а над ними для каждой идущей сессии карточка сессии (15) без полосы хода и
      «задач N/M · ролей K»: показатель без источника убран (REQ-042, критерий 3); полоса
      хода и «задач N/M · агентов K» у карточек истории образца не переносятся, вместо них
      такая же карточка — у каждой не идущей сессии с
      задачами, чей элемент показан в разделе «История» (15). Список задач показывает не
      больше 300 элементов («Текущие» и «История» вместе; при большем числе — пометка
      «показано 300 из N», решение D19, decisions/0008): карточка стоит над самым верхним
      показанным элементом своей сессии, а у сессии, чьих элементов из-за предела не видно,
      карточки нет, как нет и самих элементов. Задача, возобновлённая в другой сессии, считается
      в сессии своего последнего старта (критерий 6(и) REQ-001); метки «в работе» и «выполнено» у карточек образца — метки состояния задачи
      REQ-001: «в работе», «нет свежих данных», «закончила работу, итог не записан»,
      «окончание не записано», «сервер перезапускался, события не записывались» (15; слова
      — REQ-042, критерий 5). Номера, названия и
      статусы требований — не переносятся: в событиях хуков их
      нет, а новый источник (файлы требований и handoff-ов) расширил бы границу REQ-001
      (критерий 5 REQ-001: сервер отдаёт для чтения только события и время своих
      запусков) — это решение владельца, вопрос записан в handoff-е шага 00a прогона
      PO-20261002-01. Элементы REQ-001, которых на образце нет (время запусков сервера,
      пометки пустого журнала и нет связи, карточка агента), остаются; где они стоят,
      решает описание интерфейса.

      Столы — растущая часть обстановки. У основной сессии и у каждой роли, у которой в
      списке задач REQ-001 есть задача, — свой стол с ноутбуком и стулом при любом числе
      таких ролей: число столов не зашито, офис добавляет столы (а с ними перегородки
      между их колонками и место под них) вместе с журналом, уже занятые столы не
      сдвигаются, неподвижная обстановка от этого не меняется. Столы раздаются по первому
      появлению роли в журнале; место зависит только от журнала. Почему не постоянное
      число: на 2026-10-02 в .claude/agents/ уже 37 файлов ролей (было 23), шаг 2c
      итерации 2 (PLAN.md) добавляет роли, а столы получают и встроенные типы
      (general-purpose, Explore, Plan), и роли сессий, начатых в других папках
      (decisions/0007); любое постоянное число со временем оставило бы роль без стола.
      Правило записано в дополнении D11 (decisions/0005, 2026-10-02).

      Перемещения. Персонаж запустившего — основной сессии или субагента (вызов Agent
      изнутри субагента несёт agent_id этого субагента, критерий 3 REQ-001) — идёт к столу
      роли запущенного субагента и возвращается: задачу передали. По окончании задачи
      персонаж субагента идёт к столу запустившего и возвращается: результат вернули.
      Если запустившего определить нельзя, перемещения нет. Других перемещений нет:
      вопросов, совещаний и отдыха хуки не дают, свободный персонаж сидит за своим
      столом. Путь — по той же сетке, что рисуется (как в образце: поиск кратчайшего пути
      по этой сетке, findPath), поэтому пройти
      сквозь стену, стол или мебель нельзя по построению. «Пауза» останавливает ходьбу, а
      «1×», «2×», «4×» меняют её скорость; какие маршруты есть и когда меняются
      состояния, от них не зависит.

      Облачка. Фраза над персонажем появляется, только когда её даёт событие: «Только что
      получил задачу» — первое начало задачи, над персонажем роли субагента; «Закончил
      работу» — окончание задачи, над ним же; «Получил запрос» — отправка запроса, над
      персонажем основной сессии; «Вернул ответ» — конец ответа, закрывший строку основной
      сессии, над ним же (слова — критерий 8 REQ-042, решение 0051: событие окончания не
      доказывает успеха). Облачко видно, только пока по часам компьютера прошло от 0 до 10 секунд
      после времени события: так «только что» остаётся правдой, а события, догруженные
      после обрыва связи, облачков не дают. Других фраз нет — ни текстов из событий, ни
      ответов на вопросы.

      Что меняется в проекте: файлы страницы и офиса в tools/src/pixel-office/public/;
      новые тесты tools/test/pixel-office-office.test.js,
      tools/test/pixel-office-layout.test.js и tools/test/pixel-office-panels.test.js и
      общий с REQ-001 файл помощников тестов tools/test/pixel-office-helpers.js (один
      новый файл, без .test.js, чтобы `npm test` не запускал его как тест; прежние тесты,
      в том числе tools/test/helpers.js, не меняются); описание интерфейса по образцу — в
      docs/design/ (WF-04, шаг 1), логика офиса и страницы — в проекте
      docs/design/REQ-001-pixel-office.md; снимки DESIGN-QA-VALIDATOR — вне проекта или в
      docs/design/samples/ с пометкой actual в имени (WF-04, шаг 4); handoff-ы — в
      handoffs/PO-20260930-01/ и handoffs/PO-20261002-01/; статус — в блоке REQ-007
      docs/requirements.yaml. Сервер, хук, .claude/settings.json и tools/package.json
      REQ-007 не меняет.

      Размер окна и масштаб (просьба владельца 2026-10-05). Здесь и ниже «окно» — окно просмотра (viewport) в CSS-пикселях. Два опорных размера окна
      страницы: 1920 × 1080 (Full HD) и 2560 × 1440 (2K). Масштаб интерфейса
      S = min(ширина окна / 1920, высота окна / 1080), не меньше 1,0 и не больше 1,5.
      При 1920 × 1080 S = 1,0 — вид тот же, что до этой правки; при 2560 × 1440
      S = 4/3: размеры правой колонки, шапки, зазоров, отступов, шрифтов (журнал, задачи,
      легенда, кнопки, карточки) в 4/3 раза больше, чем при 1920 × 1080. Масштаб задаётся
      одним правилом таблицы стилей для корневого элемента страницы (размер корневого
      шрифта: 16 px при S = 1,0, ≈ 21,33 px при S = 4/3, не больше 24 px при S = 1,5);
      все размеры интерфейса — колонка, шапка, зазоры, шрифты, кнопки, отступы, легенда,
      карточки — выражены в единицах от корневого шрифта, а не в пикселях; пикселями
      остаются линии толщиной 1–2 px и пороги в условиях @media. Скрипт масштаб не
      задаёт и атрибут style не используется (правило страницы REQ-001, решение D16).
      Офис (холст) занимает наибольшее целое число пикселей на клетку, при котором
      страница влезает без прокрутки страницы, но не меньше клетки, при которой
      выполняются пороги критерия 18 (поправка 2026-10-06: до неё нижней границы у клетки
      не было); после масштабирования все элементы легенды видны или достижимы прокруткой своей полосы. При ширине окна меньше 1920
      масштаб S = 1,0 и поведение прежнее, кроме размера клетки холста (критерий 18): узкие
      раскладки 600–1239 и до 599 px не меняются. Другие соотношения сторон (16:10, 21:9)
      не ломаются: масштаб считается по меньшей стороне, страница видна без прокрутки
      страницы. Вне области: окна больше 3840 × 2160 сверх предела S = 1,5 и экраны с
      масштабом системы, отличным от 100 %, не проверяются отдельно; исключение — снимок
      окна 1470 × 784 критерия 18 делается с плотностью пикселей 2, как на экране
      владельца (А), а пороги критерия 18 измеряются в CSS px окна просмотра.

      Читаемость на экранах владельца (просьба владельца 2026-10-06). Реальные экраны
      владельца: (А) MacBook 13 дюймов M4 — на снимке владельца окно 2940 × 1568 физических точек
      при плотности 2, то есть область страницы ≈ 1470 × 784 CSS px; (Б) монитор 25 дюймов Full
      HD — область страницы около 1920 × 950 CSS px (окно браузера с панелями, плотность 1).
      На снимке (А) холст занимает ≈ 600 × 507 CSS px, сетка 40 × 34 клетки, клетка ≈ 15 px,
      фигура персонажа ≈ 11 px, подпись роли ≈ 5,6 px, и их не разобрать; прежние критерии 16–17 измеряли окно целиком
      1920 × 1080 и этого не ловили — это пробел требования. Что должно стать правдой: на
      обоих экранах персонажи и подписи читаются, и при этом ничего не пропадает (критерий
      18): остаются все комнаты, столы и персонажи, легенда, журнал, панель «Задачи» и шапка.
      Нынешняя сетка 40 × 34 клетки для 19 столов при клетке 27 px (минимум, при котором
      выполняются пороги критерия 18) даёт ≈ 1080 × 918 CSS px — в окна 1470 × 784 и
      1920 × 950 она заведомо не помещается, и прокрутка холста стала бы главным режимом.
      Поэтому уплотнение офиса обязательно и измеримо: для 19 столов сетка — не больше 36 × 22 клеток (число клеток по ширине и высоте, считая все стены; клетка 27 px даёт ≤ 972 × 594 CSS px; прежний предел 36 × 24 = 972 × 648 в окно 1470 × 784 по высоте не помещался). Высота на 1470 × 784, по style.css и снимку владельца: шапка 60 px, внешние поля 2 × 14 px, панель офиса 784 − 60 − 28 = 696 px, её внутренние отступы 2 × 12 = 24 px, остаётся 672 px под легенду и холст. Прежняя легенда на 19 элементов (7 строк) занимает ≈ 159 px, под холст остаётся ≈ 513 px, то есть не больше 19 строк по 27 px — поэтому легенда сжимается до не более двух строк высоты (≈ 70 px), а её содержимое прокручивается внутри её полосы, все 19 элементов достижимы (информация не теряется); под холст остаётся 672 − 70 = 602 px ≥ 594 (запас 8 px; клетка по расчёту 27). Альтернативное размещение легенды допускается, если на 1470 × 784 под холст при нём остаётся не меньше 594 px без прокрутки страницы — это выбор описания интерфейса (WF-04). На 1920 × 950 (корневой шрифт 16 px): панель 950 − 60 − 28 = 862 px, минус отступы 24 и сжатая легенда 70 — ≈ 768 px под холст ≥ 594 (с прежней легендой ≈ 679 px — тоже ≥ 594); на 1920 × 1080 и 2560 × 1440 места больше (расчёт клетки — в тесте критерия 18(е)). Все
      комнаты (переговорная с доской, кухня, серверная), все 19 столов, проходы и
      растения остаются; состав и взаимное расположение комнат и зоны столов — как на образце по смыслу и как в раскладке до правки: зона столов левее всех комнат, переговорная вверху, серверная левее кухни, столы колоннами; убирается только пустой
      пол между ними и у внешней стены, не несущий ни комнаты, ни стола, ни прохода, и
      внешняя стена обходит только занятую часть (критерий 18(д); образец и критерии 12 и
      16 этим не нарушаются). Прокрутка холста внутри панели остаётся запасным вариантом —
      только когда в журнале больше 19 столов, — а не основным режимом; масштаб с кнопками
      «+», «−», «по размеру» или прокрутка — выбор описания интерфейса (WF-04) для этого
      запасного случая. Порог при размере «по умолчанию» задан высотой фигуры и размером
      шрифта подписи, а в клетках он равен 27 px (при нынешнем рисунке). Критерий 18 меняет два места,
      записанных ранее, и они названы в handoff-е этой правки для ORCH: правило клетки
      «наибольшее целое при отсутствии прокрутки страницы» (decisions/0012, раздел
      «Граница»; описание интерфейса REQ-007, п. 1.0 «Холст не масштабируется по S, а
      подбирается») получает нижнюю границу; правило масштаба S «не меньше 1,0» (D22)
      не меняется. Прокрутка внутри панели холста — новое поведение страницы, в решениях
      0005, 0008 и 0012 его нет.

      Числа — перевод аналитика, не слова владельца: 4/3, 1,0 и 1,5 — масштаб 2560 × 1440
      к 1920 × 1080 и пределы масштаба (в просьбе владельца названы только «full hd и
      2k»); 20 px (высота фигуры), 10 px (шрифт подписи), сетка не больше 36 × 22 клеток (было 36 × 24 в r1: 24 строки по 27 px = 648 px не помещаются в ≈ 513 px по замечанию REQ-VALIDATOR r1), легенда в не более чем две строки с прокруткой внутри полосы, клетка не меньше 27 px и 18 ролей — решения ORCH 2026-10-06 (первоначальные 24 и 11 px заменены: при них клетка 32 px и офис ≈ 1280 × 1088 CSS px не помещается в окна 1470 × 784 и 1920 × 950); 19
      столов подсчитано аналитиком по легенде снимка владельца (в задании названо 13, это
      не подтвердилось); 1470 × 784, 1920 × 950 и 480 × 800 — окна из просьбы владельца и
      задания; 10 секунд — сколько видно облачко
      после события (страница получает событие не позже чем через 5 секунд, критерий 7
      REQ-001, остальное — запас); 1920 × 1080 — окно снимка: FullHD, раскладка под который —
      доработка с образца; 1×, 2×, 4× — кнопки образца; 37 — число файлов в
      .claude/agents/ на 2026-10-02 (ls .claude/agents/*.md | wc -l), правило столов от
      него не зависит.

      Вне области. Совещания, вопросы и ответы, сбор в переговорной и уход персонажей на
      отдых — хуки таких событий не дают, показать их значило бы выдумать (R2);
      переговорная, её места и места отдыха остаются обстановкой. Проигрывание истории с
      начала (решение D8, decisions/0005): «Пауза» и скорости касаются только ходьбы по
      маршрутам, появившимся после открытия страницы. Номера, названия и статусы
