# Требования Sai. Одно требование — один блок в списке requirements; номер REQ-NNN не
# используется повторно. Поля: id, title, owner (роль, которая делает основную работу),
# status, depends_on (какие требования должны быть done раньше), original_request (слова
# владельца дословно, с датой и местом), description, acceptance_criteria (у каждого
# критерия сказано, чем он проверяется: командой, тестом или содержимым конкретного файла).
# Как требование пишут и проверяют — docs/workflows/WF-01-requirement.md.
# Статусы: pending | in_progress | blocked | done | cancelled.
# Статус done ставит только DOC-UPDATER после PASS от RELEASE-VALIDATOR.

requirements:
  - id: REQ-001
    title: Pixel Office, часть 1 — события хуков Claude Code, журнал и список задач на локальной ссылке (владелец вживую видит, какие задачи выполняют агенты Sai)
    owner: BACKEND-DEV   # хук, сервер, журнал; страницу задач делает FRONTEND-DEV; офис — REQ-007 (маршрут — handoffs/PO-20260930-01/)
    status: in_progress   # 2026-10-05: итоговая проверка прогона PO-20261002-01 — PASS по проверенному (handoffs/PO-20261002-01/step-09-release-validator-r1.json); не проверено поимённо: критерий 1 и пункты UAT в критериях 3 (д), 9, 10 (в), (ж) — настоящая сессия Claude Code, нужно согласие владельца на расход его лимита; кроме того, depends_on REQ-002 ещё in_progress
    depends_on: [REQ-002]   # tools/ и `npm run check` из REQ-002; REQ-002 сейчас in_progress (2026-10-01 добавлен критерий 11, ISS-0002), и пока он снова не done, REQ-001 не может стать done; стек — decisions/0003 по decisions/0002, решение 0001 не нужно
    original_request: >
      «не теряй pixel office» (владелец, 2026-09-25). Ранее, в прежнем проекте владельца: «Если в Pixel
      Office Business Analyst встал из-за стола и пошёл к Accountant Agent, это должно
      происходить потому, что в реальной задаче аналитик запросил консультацию
      бухгалтера. Красивый офис с фейковой логикой хуже простого офиса с настоящей
      агентной работой.»
      Там же фраза перед этой: «Это не просто декоративная анимация и не dashboard со
      статусами.» (требование прежнего проекта владельца о живом офисе агентов,
      раздел «Исходный запрос»; в Sai не хранится). Затем (в сессии Claude Code, между 2026-09-25 и
      2026-09-28; точная дата не записана): «запусти pixel office и дай ссылку чтобы
      смотреть на агентов» и «запусти pixel office и дай ссылку чтобы я смотрел задачи
      какие выполняют». И (2026-09-30): «Ты мощный и сильный разработчик и тебе надо
      изучить проект и то что не было завершено. И теперь стои задача все закончить,
      справишься?» Три последние цитаты и их даты — из decisions/0003, раздел
      «Поручения владельца, дословно». И (2026-10-02, сообщение владельца вместе со
      скриншотом; дословно — в задании handoffs/PO-20261002-01/step-00a-req-analyst.json):
      «Все должно быть в проекте sai».
    description: >
      Что получает владелец. Команда `cd tools && npm run pixel-office` запускает сервер
      Pixel Office и печатает ссылку http://127.0.0.1:<порт>/. По ссылке — страница, на
      которой вживую (новое событие — не позже чем через 5 секунд, без перезагрузки)
      видно, какие задачи сейчас выполняют агенты Sai: список задач и журнал событий.
      Всё это строится из одного источника — событий, которые присылают сами хуки Claude
      Code в момент срабатывания, с этим временем (планка R2). Офис с персонажами и
      карточка агента — на той же странице и из того же потока событий — это REQ-007: он
      отделён от REQ-001 по находке S1 проверки
      (handoffs/PO-20260930-01/step-00b-req-validator.json), и оба делаются в прогоне
      PO-20260930-01 (правка REQ-007 по образцу владельца — в прогоне PO-20261002-01).
      Ссылка открывается только на компьютере владельца. Стек —
      decisions/0003: служебный код в tools/, не код продукта (платная версия Pixel
      Office — линия 1 бизнес-плана — продукт, её стек решает 0001; этот код не
      становится кодом продукта без отдельного решения), Node 22 без зависимостей во
      время выполнения (decisions/0002), одна команда проверки `cd tools && npm run
      check` (Q4). Код — в tools/src/pixel-office/, страница и её файлы — в
      tools/src/pixel-office/public/, тесты — tools/test/pixel-office-*.test.js.

      Отличие от прежнего проекта владельца (образец; его код и требования о живом офисе
      в Sai не хранятся). Там журнал был написан вручную в коде (domain/AgentOfficeSeed.cs) с
      искусственным временем, сжатым в один день (AP-002). Здесь источник событий —
      только хуки Claude Code; заранее написанных событий нет. Из образца сохраняется
      сделанное правильно: одна модель событий для журнала, задач и (в REQ-007) офиса и
      карточки; страница только читает; право на запись узкое и есть только у источника
      событий; у каждого события помечен источник (REAL или SIMULATION).

      Задача на странице — один запуск субагента (инструмент Agent): роль (agent_type),
      короткое описание, начало, окончание и состояние — «в работе», «завершена» или
      «окончание не записано» (правила — критерий 6). Работа основной сессии (от
      отправки запроса до конца ответа) — отдельная строка «Основная сессия —
      обрабатывает запрос», без текста запроса в самой строке (текст — только в окне просмотра
      истории, REQ-008, по решению 0011).

      Факты о хуках — из официальной документации Claude Code, открытой 2026-09-30:
      https://code.claude.com/docs/en/hooks (разделы «Hook lifecycle», «Hook locations»,
      «Hook handler fields», «Reference scripts by path», «Common input fields»,
      «SessionStart», «UserPromptSubmit», «PreToolUse input» → «Agent», «SubagentStart»,
      «SubagentStop», «Stop», «SessionEnd», «Exit code output», «Timeouts», «HTTP
      response handling», «Run hooks in the background», «Workspace trust»),
      https://code.claude.com/docs/en/settings («Where Claude Code keeps the local file
      in a git repository»), https://code.claude.com/docs/en/cli-reference
      (--include-hook-events, --fork-session) и
      https://code.claude.com/docs/en/agent-sdk/typescript
      (SDKHookResponseMessage). Требование опирается на них: (1) есть события
      SessionStart, UserPromptSubmit, PreToolUse, PostToolUse, SubagentStart,
      SubagentStop, Stop и SessionEnd; во входе инструмента Agent (tool_input) — prompt
      (текст задачи), description (короткое описание) и subagent_type, а PostToolUse
      этого инструмента несёт tool_response.agentId («Identifier for the subagent run»);
      (2) поля времени во входе хуков нет — время события читается с часов в момент
      срабатывания; (3) полные тексты: UserPromptSubmit несёт текст запроса (prompt),
      Stop и SubagentStop — текст последнего ответа (last_assistant_message), Agent — текст
      задачи (tool_input.prompt) и результат (tool_response.content), Stop — описания
      фоновых задач (background_tasks); (4) SubagentStart срабатывает и при
      возобновлении субагента, а SubagentStop — и для внутренних агентов Claude Code
      (подсказки, /btw) с agent_type сессии или пустым; Stop не срабатывает при
      прерывании пользователем, при ошибке API вместо него приходит StopFailure; после
      Stop сессия может ждать фоновую работу, которая её «разбудит»; (5) код выхода не 0
      и не 2 даёт в сессии уведомление об ошибке хука, как и хук, который не смог
      запуститься (нет файла, код 127), и хук UserPromptSubmit, прерванный по timeout; а
      stdout хуков UserPromptSubmit, UserPromptExpansion, SessionStart и PostModelSwitch
      добавляется в контекст Claude; (6) timeout обработчика command по умолчанию — 600
      секунд (на UserPromptSubmit — 30); async-хуки при завершении сессии -p убиваются;
      SessionStart поддерживает только обработчики command и mcp_tool; сбой подключения
      HTTP-хука — неблокирующая ошибка, а секрет в его заголовок попадает только из
      переменных окружения (allowedEnvVars); (7) обработчик запускается в текущем
      каталоге сессии, cwd идёт за Claude после `cd`, а ${CLAUDE_PROJECT_DIR} — «the
      project root where the session started»; (8) общий .claude/settings.json читается
      из основного рабочего каталога сессии, поэтому через sai/.claude/settings.json
      видны только сессии, запущенные в sai/ или перенесённые туда командой /cd (сессии
      другой папки — только по копии обработчиков в её настройках, decisions/0007);
      локальный .claude/settings.local.json у
      сессии, запущенной в подкаталоге git-репозитория, читается и пишется в корне
      репозитория, а старый локальный файл в каталоге запуска тоже читается; у sai/
      своего .git нет: `git -C sai rev-parse --show-toplevel` печатает корень общего
      git-репозитория, в котором лежит sai/, то есть локальный файл для сессий в sai/ —
      .claude/settings.local.json в корне этого репозитория; (9) интерактивная сессия не
      запускает хуки из файлов
      настроек, пока не принят диалог доверия к папке, а сессия -p считает папку
      доверенной; (10) с v2.1.198 субагенты по умолчанию фоновые: PostToolUse инструмента
      Agent приходит сразу при запуске (status async_launched, с agentId и description), а
      не по окончании; (11) `claude -p --output-format stream-json --verbose
      --include-hook-events` выводит события хуков, а сообщение hook_response несёт
      hook_event, outcome (success, error или cancelled), exit_code, stdout и stderr;
      (12) при возобновлении (--resume, --continue, /resume) session_id сохраняется —
      новый даёт только --fork-session («When resuming, create a new session ID instead
      of reusing the original»); SessionStart тогда приходит с source «resume», а
      SessionEnd бывает с reason «resume» и «clear».

      Обработчик — command, а не http: критерий 10 требует кода выхода 0 и пустого
      stdout при любом сбое, критерий 11 — чтения секрета из файла, SessionStart
      принимает только command и mcp_tool, а http-обработчик берёт секрет только из
      переменных окружения (факт 6). Вопросы дизайну (CODE-DESIGNER отвечает со
      ссылками на эти разделы и проверяет ответы на реальной сессии): какие события
      подключать; как связать описание с запуском через agent_id, tool_use_id,
      tool_response.agentId и tool_input.subagent_type (что agentId у PostToolUse и
      agent_id у SubagentStart — один идентификатор, документация не говорит, в её
      примерах форматы разные); если связать нельзя — описания нет (критерий 6); async
      или нет (факт 6); как хук находит Node 22, не полагаясь на node в PATH (проверено
      REQ-ANALYST 2026-09-30 на компьютере владельца: node из стандартного каталога
      Homebrew — Node 25.2.1, а Node 22 — в каталоге Homebrew для node@22, его добавляет в
      PATH профиль оболочки; Claude Code запущен
      как расширение VS Code 2.1.284, команды `claude` в PATH оболочки нет); что Claude
      Code подставляет в CLAUDE_PROJECT_DIR для сессии, запущенной в sai/ внутри
      общего git-репозитория (sai/ — его подкаталог), — sai/ или корень репозитория; какие
      файлы
      настроек читает сессия, запущенная в sai/ (факт 8); приходит ли UserPromptSubmit,
      когда фоновая работа «будит» сессию (факт 4); как отличить сообщения hook_response
      обработчиков Pixel Office от других; какой командой шаг UAT запускает реальную
      сессию.

      Что хранится и показывается. В журнал попадают только время, источник, вид
      события (hook_event_name), session_id и — если есть во входе хука — agent_id,
      agent_type, tool_use_id, идентификаторы связи вызова Agent с запуском
      (tool_response.agentId и tool_input.subagent_type) и описание задачи
      (tool_input.description, не длиннее 100 символов). Идентификаторы связи нужны,
      потому что SubagentStart и SubagentStop несут только agent_id и agent_type, а
      запуски одной роли идут параллельно (три IDEA-ANALYST в WF-06): без них описание
      нельзя честно привязать к запуску. Не хранятся и не показываются: текст запроса
      владельца, текст задачи субагента (tool_input.prompt), ответы и результаты
      (last_assistant_message, tool_response, кроме agentId, background_tasks), пути
      (transcript_path, agent_transcript_path, cwd, scratchpad_dir), название сессии
      (session_title) и всё прочее из входа хука. Почему: (а) чтобы видеть, какие задачи
      выполняют агенты, хватает роли, короткого описания и времени; (б) в полных текстах
      бывает что угодно — вставленные ключи и пароли, личные данные, данные других
      проектов, — а журнал лежит на диске без шифрования и читается без входа: копия этих
      текстов сделала бы журнал вторым местом утечки (Q7); (в) полный разговор уже хранит
      сам Claude Code; (г) как и в образце, страница не показывает внутренних рассуждений
      модели (требование образца, «Вне области»). Пути странице не нужны и раскрывают устройство
      диска.

      Где что лежит. Журнал и секрет для записи — вне репозитория, в каталоге
      ~/.sai-pixel-office/ (права 0700): журнал events.jsonl (только дописывается) и
      секрет write-secret (права 0600). Не в sai/, потому что `npm run snapshot` снимает
      весь каталог sai/ (tools/src/snapshot.js пропускает только tools/node_modules и
      .git), а snapshot-diff прогонов (REQ-004, критерий 4; REQ-006, критерий 14)
      требует, чтобы вне объявленных путей ничего не менялось: журнал внутри sai/
      менялся бы при каждой сессии любого прогона и ломал бы эти проверки; к тому же
      журнал — рабочие данные, а не часть проекта. Тесты работают только с временными
      каталогами и портами. Сервер слушает только 127.0.0.1 и отвечает только на запросы
      с Host 127.0.0.1:<порт> или localhost:<порт>, чтобы журнал не прочитал чужой сайт,
      открытый в браузере владельца; чтение — без входа, поэтому журнал может прочитать
      любая учётная запись этого компьютера (ещё одна причина хранить только нужное).
      Секрет закрывает путь записи от страниц в браузере владельца и от других
      пользователей компьютера. Сервер не принимает событие, время которого отличается
      от его часов больше чем на 60 секунд, — через путь записи событие задним числом не
      дописать. Прямую запись в файл журнала от имени владельца (так может любой агент)
      техника не запрещает — её запрещает только мандат (R2). Строки, чьё время не
      сходится с порядком журнала, страница помечает «не из хуков» (критерий 4), но это
      обнаружение, а не защита. Пусть после настоящих строк вписано k строк «из
      будущего» со временем F, а за ними пришли m настоящих строк со временем раньше
      F − 120 секунд: каждая вписанная строка конфликтует с каждой такой настоящей. Пока
      m ≤ k — а для этого хватает одной вписанной строки, — помечены настоящие, а
      вписанные считаются настоящими; с m = k + 1 пометка переходит на вписанные.
      Настоящие строки со временем не раньше F − 120 секунд с вписанными не
      конфликтуют, поэтому если до момента F − 120 секунд настоящих строк больше не
      придёт, неверная пометка останется навсегда. Правило опирается на то, что часы
      компьютера не переводят назад. Хуки
      задаются в Sai только в .claude/settings.json (граница decisions/0003; слова
      владельца 2026-10-02 «Все должно быть в проекте sai») — не в пользовательских
      настройках Claude Code и не в других файлах настроек Sai. Копия обработчиков в
      настройках проекта папки, где начинаются сессии владельца, допустима только по
      decisions/0007 — временная мера этого компьютера, не часть Sai. Поэтому критерий 12
      проверяет файлы настроек Sai и пользовательские настройки Claude Code, а пока Sai
      лежит внутри общего git-репозитория (до своего репозитория, шаг 2f итерации 2), — и
      папку .claude корня этого репозитория: там может лежать локальный файл настроек,
      который читают сессии, начатые в sai/ (факт 8); общий файл там проверяется для
      надёжности. Копию по decisions/0007 он не проверяет.

      Сбои (Q10). Хук работает внутри сессии владельца, поэтому при любом сбое Pixel
      Office он завершается с кодом 0 не позже чем через 2 секунды и ничего не пишет в
      stdout (критерий 10): событие теряется, сессия этого не замечает. Задача без
      события окончания, после начала которой был запуск сервера или событие окончания
      её сессии, показывается как «окончание не записано», а не «в работе»; на задачи,
      начатые после возобновления сессии с тем же session_id (факт 12), прежнее событие
      окончания не влияет. Один
      случай страница распознать не может: событие окончания потеряно, сервер не
      перезапускался, а сессия продолжает работать или убита без события окончания
      сессии, — тогда задача остаётся «в работе» до следующего запуска сервера. Поэтому
      рядом с «в работе» показано время последнего события сессии, а README называет этот
      случай (критерии 6 и 13). Строка основной сессии без конца ответа остаётся
      «обрабатывает запрос» до следующего запроса, конца сессии или запуска сервера
      (критерий 6(г)).

      Что меняется в проекте — полный список записи REQ-001 и REQ-007; для прогона
      PO-20260930-01 он внутри его объявления (handoffs/BP-20260930-01/parallel-runs.jsonl,
      строки 1 и 3). Код: tools/src/pixel-office/ (сервер, хук, страница — в public/).
      Тесты: только новые файлы — tools/test/pixel-office-*.test.js и один общий файл
      помощников tools/test/pixel-office-helpers.js (общий для тестов REQ-001 и REQ-007;
      без .test.js намеренно: `npm test` — это `node --test "test/**/*.test.js"`, и
      помощники не должны запускаться как тест); прежние тесты, в том числе
      tools/test/helpers.js, не меняются. tools/README.md (новый). tools/package.json —
      только скрипт
      pixel-office, который вызывает код из tools/src/pixel-office/ напрямую, не через
      tools/src/cli.js (его меняет параллельный прогон ISS-0002-20260930-01).
      tools/eslint.config.js — глобальные имена браузера для
      tools/src/pixel-office/public/ (сейчас в нём только globals.node).
      .claude/settings.json (новый) — только обработчики Pixel Office. Документы
      конвейера: docs/design/ (дизайн), handoffs/PO-20260930-01/ и для правки REQ-007 по
      образцу — handoffs/PO-20261002-01/, в
      docs/requirements.yaml — только блоки REQ-001 и REQ-007 (блоки REQ-005 и REQ-006
      защищает REQ-006), при необходимости — decisions/, docs/anti-patterns.md,
      docs/issues/. STATE.md меняет DOC-UPDATER в конце прогона (Q14); в объявлении
      прогона его нет, но REQ-006 (критерий 14, --allow STATE.md) разрешает его всем
      прогонам. Не меняются: tools/package-lock.json, tools/.prettierignore и
      tools/.gitignore (критерий 14), tools/src/ вне pixel-office/ (tools/src/snapshot.js защищает
      критерий 14 REQ-006), .claude/agents/, CLAUDE.md. Вне проекта —
      ~/.sai-pixel-office/.

      Вне области. Офис, персонажи, перемещения и карточка агента — REQ-007. Из образца
      (для просьб владельца не нужно): вход и права agent-office.view и
      agent-office.write (здесь — только локальный адрес и секрет для записи); карточка
      требования (дословный запрос, постановка, задачи с итогами, решения с вариантами,
      «что работает» и «что осталось») и API рантайма для заведения требований и задач
      (POST /requirements, /tasks, …/complete) — хуки таких данных не дают; события
      «вопрос», «ответ» и «совещание» и сбор в переговорной — хуки их не дают, показать их
      значило бы выдумать; проигрывание истории с начала (пауза и скорости 1×/2×/4× —
      не здесь: они вошли в REQ-007 как управление ходьбой персонажей); фильтр по
      требованию; постоянный пояс Asia/Almaty (требование образца) — время
      показывается по часам компьютера владельца с подписью пояса; режим симуляции
      (buildSimulation в wwwroot/agent-office.js) — остаётся только пометка источника;
      постоянный состав из 12 ролей образца — роли берутся из agent_type; .NET 8 и EF
      Core — стек задаёт decisions/0003; AgentOfficeSeed.cs не переносится вовсе
      (AP-002). Не из образца: собственный список задач Claude Code (события TaskCreated и
      TaskCompleted), ожидание разрешений (Notification, PermissionRequest), действия с
      отдельными инструментами, сессии вне sai/ и других проектов (копия обработчиков в
      папке, где начинаются сессии владельца, — только по decisions/0007, критерий 12),
      очистка и ротация
      журнала, платная версия Pixel Office (линия 1 бизнес-плана, REQ-006).

      Числа — перевод аналитика, не слова владельца: 5 секунд — задержка обновления
      страницы (как опрос в образце, требование образца «Известное поведение»); 2 секунды —
      предел работы хука; 3–5 секунд — timeout обработчика в settings.json (не меньше
      предела хука, вместо 600 или 30 секунд по умолчанию); 60 секунд — допуск времени при
      записи; 120 секунд — порог конфликта в правиле чтения (удвоенный допуск записи); 100 символов —
      длина описания задачи; 100 000 строк и 1 секунда — проверка скорости правила чтения
      и списка задач (журнал не чистится, критерий 4).

      Проверки названы в каждом критерии: тесты tools/test/pixel-office-*.test.js в
      `npm run check`, grep, jq и find, шаг UAT «реальная сессия» (UAT-RUNNER — между
      TEST-RUNNER и RELEASE-VALIDATOR, решение ORCH 4 в step-00b-req-validator.json) и
      шаг «обычная сессия владельца».

      Планка. Q8 и R3 не применимы: данных магазинов и фото покупателей нет. Q9 — SQL
      нет. Q11 — адресов, которые задаёт магазин или покупатель, нет; хук обращается
      только к 127.0.0.1. R2 — критерии 1–4 и 6; Q10 — критерии 7, 8 и 10; Q7 — критерии 8
      и 11; Q4 и Q6 — критерий 14; R1 — мерж подтверждает владелец.

      Известное ограничение (решение ORCH 1 в step-00b-req-validator.json, дополнено
      decisions/0007): видны только сессии, в настройках которых есть обработчики Pixel
      Office. В Sai это .claude/settings.json — сессии, запущенные в sai/ (факт 8);
      сессии из папки, где начинаются сессии владельца, видны по копии обработчиков в её
      настройках проекта — это decisions/0007, временная мера этого компьютера, не часть
      Sai (критерий 12). Задача — запуск субагента (решение ORCH 2); собственный список задач
      Claude Code — отдельное требование. Вопросы дизайну — в абзаце об обработчике.
    acceptance_criteria:
      - "Реальная сессия Claude Code, запущенная в sai/, сама создаёт события, без ручных действий (R2). Проверка: шаг UAT «реальная сессия» (UAT-RUNNER, весь вывод — в его handoff-е): (а) `cd tools && npm run pixel-office` — строка со ссылкой; (б) путь и версия бинарника Claude Code, время начала `date -u +%Y-%m-%dT%H:%M:%SZ`; (в) из корня Sai (вывод `pwd` приложен) — реальная сессия с `-p --output-format stream-json --verbose --include-hook-events` (остальная команда — из дизайна) с запросом, при котором основная сессия запускает ровно одного субагента с короткой задачей, не меняющей файлов: код выхода 0; у каждого сообщения hook_response обработчиков Pixel Office outcome — success, exit_code — 0, stdout пуст (jq); (г) время окончания; (д) строки журнала, добавленные за сессию: событие начала и событие окончания задачи этого субагента с его agent_type, время обоих — между (б) и (г), source — REAL у строк хука, ключи строк — только из критерия 3 в редакции decisions/0011 (jq keys; у строки UserPromptSubmit допустимы ещё prompt_kind, prompt_text, prompt_truncated — шаг UAT этого запроса их допускает и не требует; строки source ORCH пишет только команда pixel-office-note, критерий 5 REQ-008, и пункт (д) их не считает; строка с любым другим ключом — провал пункта); (е) из корня Sai `grep -rlF --exclude-dir=node_modules <session_id этой сессии> .` находит файлы только в папке handoff-ов того прогона, к которому относится этот шаг UAT, — ./handoffs/<RUN-ID>/, где RUN-ID — поле run_id handoff-а, в который UAT-RUNNER записывает вывод шага, — и нигде больше в проекте; проверка из корня Sai: `grep -rlF --exclude-dir=node_modules <session_id этой сессии> . | grep -v '^\\./handoffs/<RUN-ID>/'` — пустой вывод (код 1 у второго grep), а первый grep находит хотя бы один файл; (ж) сервер остановлен, (в) повторяется: код выхода 0, hook_response обработчиков Pixel Office — outcome success, exit_code 0, stdout пуст, sha256 журнала до и после равны (hook_response для SessionEnd выводится только у фоновых обработчиков — SessionEnd проверяет тест критерия 10). Шаг «обычная сессия владельца»: при запущенном сервере в рабочей сессии Claude Code, открытой в sai/ так, как работает владелец (например, в расширении VS Code; это может быть сессия ORCH), запускается хотя бы один субагент; UAT-RUNNER прикладывает строки журнала этой сессии — начало и окончание задачи, — а ORCH записывает в тот же handoff дословный ответ владельца, были ли в сессии уведомления об ошибке хука; ответ — «нет»"
      - "Время — момент срабатывания хука, без вычисленных смещений (R2, AP-002): время ставится по часам компьютера владельца в момент срабатывания хука (обработчиком при запуске или сервером при приёме — выбор дизайна) и хранится в UTC, ISO 8601 с миллисекундами; время из запроса сервер сохраняет без изменений, только если оно отличается от его часов не больше чем на 60 секунд, иначе — ответ 400 и sha256 журнала не меняется; журнал только дописывается, строки в нём идут в том порядке, в каком сервер их принял: новая запись не меняет ни байта прежних строк; 20 одновременных записей со временем от −59 до +59 секунд относительно часов сервера дают 20 целых строк, и правило чтения критерия 4 не помечает ни одну; первый запуск с пустым каталогом состояния даёт пустой журнал. Проверка: tools/test/pixel-office-hook.test.js (время записанного события — между моментом перед срабатыванием хука и моментом после его завершения); tools/test/pixel-office-server.test.js (±60 секунд, дописывание, 20 одновременных записей без пометок правила чтения — тест вызывает ту же функцию правила, что и страница, пустой журнал при первом запуске); `grep -rEn '[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}' tools/src/pixel-office; echo $?` — ни одной найденной строки и код 1 (каталог есть, в коде Pixel Office вне тестов нет записанных моментов времени; код 2 — ошибка, не проходит)"
      - "Хранится только нужное, чтобы видеть задачи: строка журнала содержит только время, source, вид события (hook_event_name), session_id и — если есть во входе хука — agent_id, agent_type, tool_use_id, идентификаторы связи вызова Agent с запуском (tool_response.agentId и tool_input.subagent_type) и описание задачи (tool_input.description инструмента Agent, не длиннее 100 символов, длиннее — обрезается). Текст запроса (prompt) — только по условиям decisions/0011 и только для UserPromptSubmit: поля prompt_kind, prompt_text, prompt_truncated (критерии 1–2 и 7 REQ-008), список расширен ровно этими тремя полями и больше ничем; отдельная строка записи оркестратора (source ORCH, поля note_text, req_id, request_time, session_id, request_time_auto) приходит не от хука, а отдельным путём записи сервера (критерий 6 REQ-008) и тоже ничем не расширяется; текст задачи субагента (tool_input.prompt), ответы и результаты (last_assistant_message, tool_response, кроме agentId, background_tasks), пути (transcript_path, agent_transcript_path, cwd, scratchpad_dir), session_title, собственное поле source во входе SessionStart (startup, resume, clear, compact, fork — это не source журнала, хук его не передаёт) и все прочие поля входа хука не попадают ни в журнал, ни на страницу. Проверка: tools/test/pixel-office-hook.test.js — на вход подаются примеры входа из документации для каждого подключённого события, в которых запрещённые поля содержат уникальные метки: каждый пример даёт ровно одну строку журнала (в том числе пример SessionStart со своим полем source), ключи строки журнала — подмножество списка (для UserPromptSubmit — списка и трёх полей decisions/0011; для всех прочих событий этих трёх полей нет, тест падает на любом лишнем ключе), ни одной метки в журнале нет (grep -c — 0 по всем значениям, кроме значения поля prompt_text строк UserPromptSubmit: текст сообщения владельца там законно содержит любые слова и проверяется критериями 1 и 7 REQ-008; тест вынимает prompt_text из этих строк (jq 'del(.prompt_text)') и ищет метки в остатке, так что метка, лежащая во входе UserPromptSubmit не в prompt, а в запрещённом поле — например cwd или transcript_path, — в журнале по-прежнему не встречается; для всех строк прочих событий проверка полная), а у UserPromptSubmit поле prompt остаётся запрещённым ключом: в строке нет ключа prompt, текст лежит только в prompt_text, после маскирования и обрезки (критерии 1 и 7 REQ-008); tools/test/pixel-office-server.test.js — строка source ORCH содержит только ключи note_text, req_id, request_time, request_time_auto, session_id, время и source, agentId и subagent_type сохранены, описание из 150 символов сохранено первыми 100; шаг UAT «реальная сессия», пункт (д)"
      - "REAL и SIMULATION, правило чтения (R2, AP-002): source = REAL ставит сервер при записи; запрос на путь записи хука (/api/events), в теле которого есть поле source, отклоняется (400, sha256 журнала не меняется); source = ORCH ставит сервер только на отдельном пути записи оркестратора (/api/note, критерий 6 REQ-008), и тело запроса его там тоже не задаёт — путь хука source ORCH принять не может ни при каком теле. Режима симуляции нет. Сервер дописывает строки в порядке приёма (критерий 2), поэтому из двух принятых строк более поздняя в файле не раньше более ранней больше чем на 120 секунд (удвоенный допуск записи). Правило чтения: (а) строка с source не REAL и не ORCH — «не из хуков» (строка source ORCH — запись оркестратора, а не событие хука: она подписана «Оркестратор записал», не помечается «не из хуков», не входит в правила (б) и (в), которые читают только строки REAL, и не используется для задач и состояний — критерий 9 REQ-008); (б) среди непомеченных строк с source REAL конфликт — пара, в которой более поздняя в файле строка раньше более ранней больше чем на 120 секунд; пока конфликты есть, «не из хуков» помечается строка, входящая в наибольшее число конфликтов, а при равенстве — более поздняя в файле; помеченная строка из конфликтов выбывает; конфликт есть тогда и только тогда, когда какая-то строка раньше самого позднего времени среди строк перед ней больше чем на 120 секунд, поэтому журнал без конфликтов проверяется за один проход; (в) последняя строка файла, если она не помечена, помечается, когда её время позже часов компьютера в момент чтения больше чем на 60 секунд. Кроме правила (в), пометки зависят только от содержимого журнала; в журнале из одних принятых сервером строк конфликтов нет и ничего не помечается. Помеченная строка показывается в журнале со своим source и пометкой «не из хуков» и не используется для задач и их состояний (и в REQ-007 — для офиса). В шапке страницы — пометка «REAL — события хуков Claude Code». Проверка: tools/test/pixel-office-server.test.js (source REAL, отказ при поле source); tools/test/pixel-office-page.test.js — пометка в шапке и сценарии: журнал из одних принятых строк (время каждой — в пределах ±59 секунд от времени приёма, приём по порядку) — пометок нет; строка SIMULATION — помечена только она; вписанная после настоящих строк строка с source REAL на 10 минут раньше их — помечена только она, в том числе когда перед ней всего две настоящие строки с промежутком 10 минут; строка на час вперёд, после которой идёт час настоящих строк, — помечена только она; один и тот же журнал с настоящей последней строкой при чтении в момент T и в T + 2 часа даёт одинаковые пометки; последняя строка на час вперёд при чтении раньше её времени помечена по правилу (в); сгенерированный журнал из 100 000 принятых строк и он же с пятью вписанными строками (на час вперёд и на час назад, не ближе 1 000 строк к концу) — правило чтения и построение списка задач (критерий 6) вместе укладываются в 1 секунду на каждом, во втором помечены ровно пять вписанных строк"
      - "Один поток событий: сервер отдаёт для чтения только события и время своих запусков; журнал событий и список задач (и в REQ-007 — офис и карточка агента) строятся на странице из одного и того же массива событий; отдельного хранилища задач или состояний нет ни на сервере, ни на странице. Проверка: tools/test/pixel-office-page.test.js — одна последовательность событий даёт согласованные журнал и список задач, после добавления одного события оба меняются согласованно; tools/test/pixel-office-server.test.js — ответы чтения содержат только события и запуски сервера, в каталоге состояния — только файлы, названные в дизайне"
      - "Задачи — по правилам: задача — один запуск субагента с ролью (agent_type), описанием, началом, окончанием и состоянием «в работе», «завершена» или «окончание не записано»; (а) повторный старт того же субагента (тот же agent_id) — та же задача снова «в работе», а не вторая; (б) событие окончания без записанного начала задачи не создаёт и остаётся только в журнале (факт 4 описания); (в) задача без события окончания — «окончание не записано», если после её начала был запуск сервера или событие окончания её сессии; событие окончания сессии касается только задач, начатых до него: после возобновления с тем же session_id (факт 12 описания) новые задачи идут «в работе»; время каждого запуска сервера показано на странице; рядом с «в работе» — время начала задачи и время последнего события её сессии; (г) работа основной сессии — строка «Основная сессия — обрабатывает запрос» от события отправки запроса до события конца ответа, без текста запроса в самой строке (текст сообщения владельца — только в окне «Просмотр истории», REQ-008, и в журнале по условиям decisions/0011; тест страницы: в тексте строки задачи подстроки сообщения нет); если конца ответа нет (прерывание, ошибка API), строка закрывается как «окончание не записано» при следующем запросе той же сессии или при событии окончания сессии после её начала, а если не было ни того, ни другого — при запуске сервера после её начала (как у задач в (в)); строка, закрытая только запуском сервера, остаётся открытой для конца ответа: пришедший позже конец ответа закрывает её как «завершена»; событие конца ответа без открытой строки ничего не меняет — начало не придумывается; (д) сначала задачи «в работе», затем остальные, новые сверху; (е) время — по часам компьютера владельца с подписью пояса, в журнале — UTC; (ж) при пустом журнале — «Событий от хуков пока нет» и подсказка; текст подсказки говорит, что видны только сессии Claude Code, в настройках которых есть обработчики Pixel Office: запущенные в sai/, а сессии другой папки — только если в её настройках проекта есть копия обработчиков; пояснение требования, а не текст подсказки: на этом компьютере такая копия есть по decisions/0007; (з) описание показывается, только если идентификаторы (agent_id, tool_use_id, tool_response.agentId) однозначно связывают его с этим запуском, иначе у задачи описания нет — угаданных описаний не бывает; (и) задача принадлежит сессии своего последнего старта: если субагента с тем же agent_id запустили снова в другой сессии (например, после --fork-session), это та же задача (правило (а)), но её сессия — новая; счёт задач по сессиям (критерий 15 REQ-007) и «её сессия» в правиле (в) относятся к новой сессии, а не к сессии первого старта, и событие окончания прежней сессии такую задачу не закрывает. Проверка: tools/test/pixel-office-page.test.js — отдельный сценарий на каждое правило (а)–(и); для (е) — запуск под TZ=Asia/Almaty: 2026-09-20T04:00:00Z показывается как 09:00 с подписью Asia/Almaty; для (в) — событие окончания сессии, затем SessionStart с source resume и тем же session_id, затем старт субагента: задача «в работе»; для (г) — отправка запроса, затем запуск сервера: строка «окончание не записано», затем конец ответа: строка «завершена»; для (з) — два вызова Agent одного subagent_type с разными описаниями и два старта: при связывающих событиях у каждой задачи своё описание и никогда чужое, без них у обеих описания нет; для (и) — старт субагента с agent_id X в сессии A, затем старт с тем же X в сессии B: одна задача, её сессия — B; событие окончания сессии A задачу оставляет «в работе», событие окончания сессии B делает её «окончание не записано»"
      - "Одна команда и ссылка, живое обновление: `cd tools && npm run pixel-office` запускает сервер и печатает строку «Pixel Office: http://127.0.0.1:<порт>/»; GET по этой ссылке — 200 и страница; порт по умолчанию постоянный (номер — в tools/README.md), так что ссылка не меняется между запусками; если на порту уже работает Pixel Office — печатается та же строка, код выхода 0; если порт занят другим процессом — сообщение на русском без трассировки стека (нет строк «    at »), код выхода 1. Открытая страница показывает новое событие не позже чем через 5 секунд после записи, без перезагрузки; если сервер недоступен — пишет «Нет связи с сервером Pixel Office», продолжает показывать загруженное и после восстановления догружает пропущенные события. Проверка: tools/test/pixel-office-server.test.js — команда с временным каталогом состояния и портом: разбор строки, GET, повторный запуск, занятый порт; tools/test/pixel-office-page.test.js — поддельные часы и сеть: новое событие за 5 секунд, обрыв и восстановление; `grep -F 'http://127.0.0.1:' tools/README.md` — не меньше 1 строки"
      - "Право на запись только у источника событий, страница только читает: у сервера два пути записи — /api/events (события хуков) и /api/note (запись оркестратора, REQ-008), оба подписаны одним HMAC-секретом и требуют его; других путей записи нет: любой другой путь и метод на запись — 404 или 405 и ничего не пишет; запрос без секрета или с неверным — 401 на обоих путях; тело не JSON, неизвестный вид события или нет обязательного поля — 400; в каждом случае sha256 журнала до и после равны и сервер продолжает отвечать на GET; если записать в журнал нельзя (файл только для чтения, диск полон), — 500, и сервер продолжает отвечать на GET; испорченная строка в файле журнала при чтении пропускается с предупреждением в stderr сервера, сервер не падает. Код страницы отправляет только GET-запросы; ни один отдаваемый сервером файл и ни один ответ GET не содержит секрета; текст из событий выводится как текст, а не как HTML (описание <img src=x onerror=alert(1)> не создаёт элемента); ответы с HTML идут с заголовком Content-Security-Policy, в котором default-src 'self' и нет 'unsafe-inline' для скриптов, а у каждого <script> в отдаваемом HTML есть src. Проверка: tools/test/pixel-office-server.test.js (перечень путей и методов записи — ровно два пути с подписью, остальные пути — 404 или 405 с неизменным журналом; 401, 400, неизменность журнала, 500 при журнале только для чтения во временном каталоге, испорченная строка, секрет, созданный тестом, не встречается ни в одном отдаваемом файле и ответе GET, заголовок CSP, у каждого <script> в каждом HTML-ответе есть src); tools/test/pixel-office-page.test.js (поддельный fetch — только GET; экранирование)"
      - "Сервер доступен только с компьютера владельца (граница decisions/0003): слушает только 127.0.0.1; запрос с заголовком Host, отличным от 127.0.0.1:<порт> и localhost:<порт>, получает 403 без чтения и записи журнала; в ответах нет заголовка Access-Control-Allow-Origin; страница ничего не загружает с других адресов. Проверка: tools/test/pixel-office-server.test.js (адрес прослушивания, Host, отсутствие заголовка Access-Control-Allow-Origin); `grep -rEn 'https?://' tools/src/pixel-office/public; echo $?` — ни одной найденной строки и код 1 (код 2 — каталога нет, не проходит); шаг UAT «реальная сессия»: `lsof -nP -iTCP:<порт> -sTCP:LISTEN` показывает только 127.0.0.1:<порт>"
      - "Хук быстрый, тихий и не зависит от окружения (Q10): обработчик — command; его команда из sai/.claude/settings.json записывает событие, когда запущена из любого текущего каталога (sai/, sai/tools, временный каталог вне sai/) и когда в PATH нет node или node в PATH — не v22 (например, v25.2.1, как node по умолчанию на компьютере владельца), если Node 22 на компьютере есть (как хук его находит — дизайн); при любом сбое — сервер не запущен (соединение отклонено), сервер завис (принял соединение и не отвечает), сервер ответил 401 или 500, нет каталога состояния или файла секрета, на входе не JSON, программа хука не может запуститься (в каталоге, на который указывает CLAUDE_PROJECT_DIR, нет файлов хука; Node 22 не найден) — команда завершается с кодом 0 и пустым stdout (факт 5 описания); во всех случаях — не позже чем через 2 секунды. У каждого обработчика Pixel Office в sai/.claude/settings.json timeout — от 3 до 5 секунд, чтобы Claude Code не прервал хук раньше его собственного предела. Проверка: tools/test/pixel-office-hook.test.js — команда обработчика, взятая из sai/.claude/settings.json, на каждый случай с замером времени (событие записано — при другом каталоге и другом node в PATH; код 0 и пустой stdout — во всех случаях); `jq -e --arg p pixel-office '[.hooks[][].hooks[] | select(tostring | contains($p)) | (.timeout // 0) as $t | $t >= 3 and $t <= 5] | length > 0 and all' .claude/settings.json` из корня sai — true; шаг UAT «реальная сессия», пункты (в) и (ж)"
      - "Журнал и секрет вне репозитория (Q7): каталог ~/.sai-pixel-office/ с правами 0700, журнал ~/.sai-pixel-office/events.jsonl, секрет ~/.sai-pixel-office/write-secret с правами 0600 — не меньше 32 случайных байт, создаётся при первом запуске, если его нет; команда запуска секрет не печатает; хук читает секрет из файла при срабатывании — в sai/.claude/settings.json и в коде его нет; тесты работают только с временными каталогами. Проверка: tools/test/pixel-office-server.test.js (права каталога и файла, длина секрета в файле не меньше 43 символов, два первых запуска с разными пустыми каталогами дают разные секреты, секрет не встречается в stdout и stderr команды запуска); шаг UAT «реальная сессия»: `ls -ld ~/.sai-pixel-office` — drwx------, `ls -l ~/.sai-pixel-office/write-secret` — -rw-------, из корня Sai `grep -rqF -f ~/.sai-pixel-office/write-secret --exclude-dir=node_modules .; echo $?` — 1 (секрет в вывод не попадает); критерий 14 — после `HOME=<временный каталог> npm run check` в этом каталоге нет .sai-pixel-office"
      - >-
        Обработчики Pixel Office в Sai — только в .claude/settings.json (граница decisions/0003; слова владельца 2026-10-02 «Все должно быть в проекте sai»): там — обработчик Pixel Office на каждое событие, которое называет дизайн, и он запускает хук из tools/src/pixel-office/; ни в одном другом файле настроек Claude Code внутри Sai (в том числе .claude/settings.local.json и каталоги .claude/ в подкаталогах Sai) и ни в одном файле пользовательских настроек Claude Code (каталог ~/.claude/) обработчиков Pixel Office нет; пока Sai лежит внутри общего git-репозитория (до своего репозитория, шаг 2f итерации 2), их нет и в файлах настроек папки .claude корня этого репозитория (общем и локальном): локальный файл корня читают сессии, начатые в sai/ (факт 8 описания), а общий проверяется для надёжности; сейчас папки .claude в корне нет, но файлы там могут появиться. Копия обработчиков в настройках проекта папки, где начинаются сессии владельца, допустима только по decisions/0007 — временная мера этого компьютера, не часть Sai; этот критерий её не проверяет. Проверка: tools/test/pixel-office-settings.test.js — читает ../.claude/settings.json: события из дизайна, путь к хуку, timeout; шаг UAT «реальная сессия» и RELEASE-VALIDATOR из корня Sai: `find . ~/.claude -name node_modules -prune -o -path '*/.claude/settings*.json' -print | xargs grep -l pixel-office` печатает ровно одну строку — ./.claude/settings.json; пока Sai лежит внутри общего git-репозитория (до шага 2f итерации 2), из корня Sai: `R="$(git rev-parse --show-toplevel)" && test -n "$R" && { test ! -d "$R/.claude" || ! find "$R/.claude" -maxdepth 1 -name 'settings*.json' -exec grep -l pixel-office {} + | grep -q .; }; echo $?` печатает 0; если git не нашёл корень, команда печатает не 0 (сейчас — 128) и проверка не пройдена; 1 — в файлах настроек папки .claude корня есть обработчики Pixel Office; после шага 2f этот пункт не применяется: корнем станет сам Sai, и его .claude проверяет первая команда
      - "tools/README.md: раздел «## Pixel Office» — команда `npm run pixel-office` и вид строки со ссылкой с номером порта по умолчанию, как остановить сервер, каталог ~/.sai-pixel-office/ и что в нём, что из входа хука хранится и что нет, что видны только сессии, «в настройках которых есть обработчики Pixel Office», — запущенные в sai/, а сессии другой папки — только «при копии обработчиков» в её настройках проекта (со ссылкой https://code.claude.com/docs/en/settings), и что интерактивной сессии нужно принять диалог доверия к папке (https://code.claude.com/docs/en/hooks); в нём подраздел «### Ограничения» — задача может остаться «в работе», если событие окончания потеряно, а сервер не перезапускался (до следующего запуска сервера); страницу без входа может прочитать любая учётная запись этого компьютера через 127.0.0.1; правило чтения — обнаружение, а не защита: одной вписанной строки «из будущего» хватает, чтобы пометить «не из хуков» настоящие строки, пришедшие после неё со временем раньше её времени больше чем на 2 минуты; пометка снимается, когда таких строк станет на одну больше, чем вписанных, а если они больше не придут — остаётся навсегда (критерий 4); раздел «## Проверка» — команда `npm run check` (Q4: команда описана в README). Проверка: `grep -F` в tools/README.md каждой из строк «## Pixel Office», «npm run pixel-office», «~/.sai-pixel-office/», «https://code.claude.com/docs/en/settings», «в настройках которых есть обработчики Pixel Office», «при копии обработчиков», «https://code.claude.com/docs/en/hooks», «### Ограничения», «остаться «в работе»», «учётная запись», «одной вписанной строки», «навсегда», «## Проверка», «npm run check» — не меньше 1 строки на каждую; раздел о хранении текста по decisions/0011 (поправка 0011): подраздел «### Хранение текста» — что хранится (текст сообщений владельца и записи оркестратора «как понял»; ответы модели, входы и выходы инструментов и сообщения агентов — нет), предел 4 000 и 2 000 знаков, метка «[скрыто]», как отключить (SAI_PIXEL_OFFICE_STORE_TEXT=0), команда `npm run pixel-office-note` и «остаточный риск» маскирования с названными примерами нераспознаваемого — полный перечень проверок в критерии 15 REQ-008; `grep -nF` строк «### Хранение текста», «[скрыто]», «остаточный риск», «pixel-office-note», «SAI_PIXEL_OFFICE_STORE_TEXT» — не меньше 1 строки на каждую"
      - "Одна команда проверки, и её не обходят (Q4, Q6, decisions/0002 и 0003): на копии всего каталога sai/ без node_modules во временной папке `cd tools && npm ci && HOME=<временный каталог> npm run check` проходит — prettier --check, eslint --max-warnings 0, node --test, все тесты, включая прежние тесты WF-06 и тесты REQ-007; после прогона в <временный каталог> нет .sai-pixel-office. Зависимостей во время выполнения и новых зависимостей разработки нет: `jq -e '(.dependencies // {}) | length == 0' tools/package.json` — true; tools/package.json меняется только добавлением скриптов pixel-office, (REQ-008, decisions/0011) pixel-office-note и (REQ-009) team — `jq -S -c 'del(.scripts[\"pixel-office\"], .scripts[\"pixel-office-note\"], .scripts[\"team\"])' tools/package.json | shasum -a 256` — 5c59292586d92e95c1ea507ef7a46790a125677172c3fe3abfd90dedd9edf0a4 (то же значение, что было при одном скрипте pixel-office: без этих трёх скриптов файл не изменился; прежние скрипты проверки, зависимости разработки и engines, ключа prettier нет); тем же прогоном `jq -r '.scripts | keys | join(\",\")' tools/package.json` называет ровно прежние ключи плюс pixel-office, pixel-office-note и team (REQ-010 и REQ-013 новых скриптов не заводят: их команды — подкоманды `npm run team --`), а значение скрипта pixel-office-note фиксирует проект REQ-008 (одна строка вида `node src/pixel-office/<файл>.js`; проверка — jq -r на это значение, оно записывается в проект до реализации и меняется только вместе с проектом); sha256 tools/package-lock.json — 92d27c4ea99a9e6bb95a4b86bb045a02b934e280e9fe99d8c5c7ab5ed87b5bde. Из проверки ничего не исключено и ничего не пропущено: sha256 tools/.prettierignore — cd446cc56527781766c31a3be7e148c9c4727f5ae7f3c1056382bc29c022b338 (в нём, как сейчас, только node_modules и package-lock.json); sha256 tools/.gitignore — 4d56952b0fb13bf8f9b6c13a6d4c34a075bac3af447636a1df4335d7576e2f97 (prettier 3 учитывает и его; в нём, как сейчас, только node_modules/); своих настроек у prettier нет — из tools/ `npx prettier --find-config-path src/pixel-office/public/index.html; echo $?` — 1 («Can not find configure file»: ни .prettierrc в tools/ и выше, ни ключа prettier в package.json); tools/eslint.config.js получает только блок с files и languageOptions.globals (глобальные имена браузера для tools/src/pixel-office/public/), поэтому из tools/: правила всех файлов прежние — `find src test -name '*.js' | xargs -n 1 npx eslint --print-config | jq -S -c .rules | sort -u | shasum -a 256` — 856ee00120171941ee04ed2318fd4d5a4264a59fcff999b4fb5a1b22f695be08 (одна строка правил на все файлы; любое изменение правил — словом или числом, в любом блоке — меняет сумму); глобальные имена вне public/ прежние — `find src test -name '*.js' -not -path 'src/pixel-office/public/*' | xargs -n 1 npx eslint --print-config | jq -S -c .languageOptions.globals | sort -u | shasum -a 256` — bec0f88d493c5af9403051ad0ff2c4216dbab9ca43f4f5fbf7fedb8934b825bd; из корня sai `grep -nwE 'off|warn|ignores' tools/eslint.config.js; echo $?` — только 1; `grep -rnE 'eslint-disable|/[*][[:space:]]*eslint[[:space:]]|prettier-ignore' tools/src/pixel-office tools/test; echo $?` — только 1 (ловит и правила в комментариях вида /* eslint no-undef: 0 */, которых --print-config не видит); `grep -rnE '[.](skip|todo)[(]|(skip|todo):' tools/test; echo $?` — только 1 (код 2 — каталога нет, не проходит); `ls tools/test/pixel-office-hook.test.js tools/test/pixel-office-server.test.js tools/test/pixel-office-page.test.js tools/test/pixel-office-settings.test.js` — код 0; в итоге node --test — «skipped 0» и «todo 0» (пропущенный тест код выхода не меняет). Проверка: вывод команд приложен (TEST-RUNNER; RELEASE-VALIDATOR повторяет сам)"

