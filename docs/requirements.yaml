    description: >
      Бизнес-план ответа на вопрос владельца «что сделать с агентами, что востребовано
      сейчас или в будущем». Три продуктовые линии: (1) Pixel Office — видеть, что
      делают ИИ-агенты, и (3) видеодетекция на КПП — люди, машины, что в руках, вынос
