      - "Сверка (тест, вход → ожидаемое; документы при этом не изменены — хеши до и после): блок README с pending 27 при 28 блоках pending → строка «README.md:<строка> — блок «Факты» отстал: pending: в тексте 27, по docs/requirements.yaml 28; запустите `cd tools && npm run facts -- --write`», код 1; блок STATE со следующим номером ISS-0022 при файле ISS-0022 → строка о следующем номере дефекта с ISS-0022 и ISS-0023; три расхождения сразу → три строки; в блок вписано слово руками → «блок «Факты» изменён руками», код 1; числа в разделе даты STATE.md ниже блока устарели → расхождения нет; блока нет → строка об этом, код 1"
