      - "Настоящий репозиторий. После работы `cd tools && npm run facts` — код 0. На копии вне проекта, где добавлен docs/issues/ISS-0023-x.md со «Статус: open», — код 1 и строки расхождения для README.md и STATE.md (открытые дефекты, следующий номер дефекта). Сверка ничего не пишет (хеши README.md, STATE.md и источников до и после равны); время работы — не больше 2 секунд"
      - "Сбои. Тест: нет docs/requirements.yaml или нет прав на чтение docs/issues/ → stderr «facts: …», код 2, без стека; README.md без раздела «Что ещё не готово» → строка «README.md — нет раздела «Что ещё не готово»», код 1"
      - "Документы, место записи и проверка. tools/README.md описывает блок, источники, сверку, `--write` и правило запуска: `grep -c 'facts' tools/README.md` не меньше 3. `git diff --name-only base/<RUN-ID>` плюс `git status --porcelain` — только файлы закрытого перечня. В README.md и STATE.md добавленные строки (`git diff -U0 base/<RUN-ID> -- README.md STATE.md | grep '^+[^+]'`) — только строки блока (маркеры и строки между ними) и в README.md переписанные строки пунктов, которые начинаются с «- **Требования» или «- **Открытые дефекты»; удалённые строки (`grep '^-[^-]'`) — только прежние строки этих двух пунктов (проверка — чтением diff). `cd tools && npm run check` — код 0; на копии без node_modules `cd tools && npm ci && npm run check` — код 0; `cd tools && npm run traces` — код 0"
  - id: REQ-041
    title: Лёгкий маршрут WF-02 для малых правок — классы изменений (документы; тесты; тексты интерфейса; код) и обязательный набор ворот для каждого класса без понижения планки, кто определяет класс, смешанная правка, проверка на эталонных примерах прогона PROD-20261011-01; до правки — запись решения владельца (quality-bar §5)
    owner: DOC-UPDATER   # правка документов процесса (WF-02, handoffs.md, файлы ролей ORCH и RELEASE-VALIDATOR, quality-bar §5 — одна ссылка); запись решения — ORCH по словам владельца до начала WF-02
    status: pending
    depends_on: [REQ-038, REQ-040]   # класс «документы» опирается на автоматическую проверку учёта (REQ-038) и фактов (REQ-040) внутри `npm run check`; без них ворота класса держатся только на чтении глазами — так ошибки и прошли в PROD-20261011-01
    original_request: >
      «Сформируй требования которые ты считаешь полезными для sonnet, после этого я запущу
      это все твое на sonnet» — слова владельца, 2026-10-11, сообщение в сессии Claude Code
      (дословно — в поле context.owner_words handoffs/REQ-20261011-02/
      step-01-req-analyst.json). Основание — аудит ORCH 2026-10-11: процесс тяжёлый, на одно
      требование уходит 40–50 шагов агентов (в handoffs/PROD-20261011-01/ — 44 handoff-а на
      REQ-035 и ISS-0020), а правки одного README или одного теста идут тем же длинным
      маршрутом или, наоборот, мимо ворот (AP-058). Для агентов на модели Sonnet маршрут
      должен быть короче там, где это не ослабляет проверку.
    description: >
      Что получает владелец. Малая правка проходит только те ворота, которые ловят ошибки
      её рода, и ни одних меньше: правка документа не ждёт проекта кода и ворот
      безопасности, правка теста не ждёт проекта, а любая правка кода идёт полным WF-02.
      Шагов и денег меньше, а правило «где шаг не нужен, это записывается с причиной»
      (WF-02, вступление) выполняется классом изменения, записанным в handoff.

      Решение до правки (quality-bar §5, Q12). Планка говорит: «Если процесс начинает весить
      больше самой работы, можно предложить упрощение — только через решение владельца, при
      котором каждый пункт §2 остаётся проверяемым». Поэтому до правки WF-02 ORCH записывает
      decisions/NNNN-*.md (следующий свободный номер, на 2026-10-11 — 0035) со словами
      владельца дословно и с датой; без этой записи работа не начинается. Меняет ли лёгкий
      маршрут планку — открытый вопрос 1 владельцу; если владелец скажет «да», запись
      оформляется как исключение по quality-bar §1, п. 3 (с причиной и сроком).

      Классы изменений. Пересечение правил решает старшинство: файл под tools/test/** — всегда
      «Тесты», даже если это *.md; «Документы» — только *.md вне tools/, tools/README.md и перечисленные файлы
      учёта. Класс считается по перечню изменённых файлов прогона: `git diff
      --name-only base/<RUN-ID>` плюс `git status --porcelain` (decisions/0031). Классы по
      возрастанию веса:
      1. «Документы» — меняются только: *.md вне tools/ и файл tools/README.md (в том числе README.md,
         STATE.md, PLAN.md, CLAUDE.md, tools/README.md, docs/**/*.md, decisions/*.md,
         .claude/agents/*.md), handoffs/**, а в docs/requirements.yaml — только поле status
         (правка текста требования — WF-01, не этот маршрут).
      2. «Тесты» — кроме документов меняются только файлы tools/test/** (тесты, помощники,
         фикстуры, в том числе *.md под tools/test/, например tools/test/fixtures/team/README.md,
         который читают тесты); ожидание теста меняется только по уже проверенному критерию, а не под
         код (Q6).
      3. «Тексты интерфейса» — кроме документов и тестов меняются только строковые
         литералы — значения в объекте TEXT файла tools/src/web/texts.js (`export const TEXT
         = Object.freeze({ … })`), и подписи в HTML страниц tools/src/web/public/index.html и
         tools/src/pixel-office/public/index.html (текст между тегами; теги, атрибуты и
         скрипты не меняются). Функции и код не меняются. В tools/src/web/texts.js кроме
         TEXT есть функции с шаблонными строками (progressOf, dueIn, waitsCount,
         createdNotStarted, resumeFailed) и другие словари: правка в теле функции, в том
         числе текста её шаблонной строки, и правка вне объекта TEXT — класс «код».
         Остальное тоже «код»: новый ключ TEXT, импорт, любое изменение вне строкового
         литерала, tools/src/pixel-office/public/texts.js (объекта TEXT в нём нет) и
         tools/src/team/language.js (строит фразы кодом).
      4. «Код» — всё остальное, в том числе tools/package.json, package-lock.json,
         настройки линтера и форматирования, данные проверок (tools/traces/*,
         tools/handoffs/exceptions.tsv из REQ-038: они меняют то, что проверка пропускает).

      Ворота каждого класса (номера шагов — WF-02; шаг 0, учёт шага 10 и шаг 11 с
      подтверждением мержа владельцем (R1) — во всех классах):
      - «Документы»: автор (роль по виду документа; для учётных файлов — DOC-UPDATER или
        ORCH) сам запускает `cd tools && npm run check` (в нём traces, handoffs-check
        REQ-038, facts REQ-040) и прикладывает вывод → шаг 9 RELEASE-VALIDATOR: свой запуск
        `npm run check`, каждое изменённое утверждение о поведении, числе или файле сверено
        с кодом, тестом или файлом, учёт. Не нужны: 1, 1b, 2, 3, 4, 5, 5b, 6, 7, 8 —
        причина: нет кода и тестов, а тесты, которые читают документы, запускает шаг 9.
      - «Тесты»: шаг 5 TEST-DESIGNER → 5b TEST-DESIGN-VALIDATOR (сам запускает тесты; для
        новой проверки — мутант) → 6 TEST-RUNNER → 9. Не нужны: 1, 1b, 2, 3, 4, 7, 8 —
        причина: код не меняется.
      - «Тексты интерфейса»: шаг 2 (FRONTEND-DEV или CODE-FIXER) → 3 SECURITY-REVIEWER → 4
        REVIEWER (правдив ли текст при каждом исходе, которого страница не знает, — AP-064)
        → 5 и 5b, если тесты ждут прежний текст (`grep -rn '<прежний текст>' tools/test/` не
        пусто) → 6 → 7, если интерфейс по образцу → 8, если текст показывается в
        состоянии, достижимом на запущенной системе (так ISS-0020 нашёл BA-ANALYST, step-25)
        → 9. Не нужны: 1, 1b — причина: устройство кода не меняется.
      - «Код»: полный WF-02 без изменений.
      «Короткий путь» WF-02 (один файл, ORCH) остаётся как есть; лёгкий маршрут — между ним и
      полным WF-02.

      Кто определяет класс и что при смешанной правке. ORCH на шаге 0 по плану файлов пишет
      в context каждого handoff-а поле change_class: класс, перечень файлов, причина. Класс
      смешанной правки — самый тяжёлый из входящих; ворота — ворота этого класса, плюс 5 и
      5b, если меняются тесты. Роль, которой нужно изменить файл вне класса, не правит его,
      а останавливается и пишет об этом в result.issues; ORCH поднимает класс новым
      handoff-ом и проводит недостающие ворота. RELEASE-VALIDATOR на шаге 9 сам считает
      класс по фактическому перечню файлов: фактический тяжелее записанного — FAIL с
      возвратом к первому недостающему шагу.

      Планка не понижается (таблица «пункт → где проверяется» в WF-02): Q1 — правка
      привязана к REQ или ISS с проверенными критериями, лёгкий маршрут критериев не
      создаёт; Q2 — в каждом классе есть проверяющий не автор (RELEASE-VALIDATOR, TEST-
      DESIGN-VALIDATOR, SECURITY-REVIEWER и REVIEWER); Q3, Q4 — шаг 9 запускает `npm run
      check` сам; Q5 — новые тесты проходят 5b; Q6 — 5b и 9; Q7 — не traces (traces ищет
      пути и названия, а не секреты): в классах «Документы» и «Тесты» — шаг 9,
      RELEASE-VALIDATOR сам ищет секреты в изменении (`git diff base/<RUN-ID>` и новые
      файлы) командой grep по закрытому перечню шаблонов секретов, записанному в разделе
      (ключи вида sk-…, ghp_…, github_pat_…, AKIA…, строка «-----BEGIN … PRIVATE KEY», и
      присваивание значения длиной от 8 знаков словам api_key, apikey, token, secret,
      password), и разбирает каждое совпадение; в классе «Тексты интерфейса» — шаг 3
      SECURITY-REVIEWER (поиск секретов и в изменении, и в файлах страницы) и тот же поиск
      шага 9; в классе «Код» — как в WF-02; Q8–Q11, R2 — касаются только кода, а код идёт полным WF-02; Q12,
      Q13 — как в WF-02; Q14 — handoffs-check (REQ-038) и шаг 10; R1 — шаг 11; R3 —
      неприменим.

      Эталонные примеры (прогон PROD-20261011-01; WF-02 получает таблицу: правка, файлы,
      класс, шаги лёгкого маршрута, шаги полного WF-02 той же правки отдельным прогоном,
      ошибки, найденные тогда, и какие ворота лёгкого маршрута их ловят):
      (а) step-35 — CODE-FIXER изменил только tools/README.md (result.artifacts_out) →
          «Документы»: 0, автор, 9, 10, 11 — 5 шагов против 13 полного маршрута (0, 1, 1b,
          2, 3, 4, 5, 5b, 6, 8, 9, 10, 11). Ошибку прежнего текста README нашёл тест CTL-14f
          (step-34); в лёгком маршруте этот тест запускает `npm run check` автора и шага 9.
      (б) step-22 — TEST-DESIGNER изменил только тесты (L1–L3 из step-21; 7 файлов в
          result.artifacts_out) → «Тесты»: 0, 5, 5b, 6, 9, 10, 11 — 7 шагов против 13.
          Тогда после step-22 сразу шёл TEST-RUNNER (step-23) без повторного TEST-DESIGN-
          VALIDATOR — лёгкий маршрут требует 5b, то есть не пропускает того, что прошло
          тогда (AP-058).
      (в) step-41 → step-42 → step-43 — исправление учёта (времена в handoff-ах step-08 и
          step-20, поправки orch_correction) → «Документы». Тогда понадобилось три круга
          RELEASE-VALIDATOR: F1 в step-41 (completed_at позже коммита) и F2 в step-42 (время
          в at_note позже коммита). В лёгком маршруте обе ошибки ловит `npm run
          handoffs-check` автора (REQ-038, правила H7 и H9) до шага 9.
      Задание ORCH называло step-42 «правкой теста»; по файлу это RELEASE-VALIDATOR, круг 2,
      сверка правки учёта (handoffs/PROD-20261011-01/step-42-release-validator.json, task) —
      поэтому пример (в) — класс «Документы».

      Точные места записи (перечень закрытый): docs/workflows/WF-02-development.md (новый
      раздел «## Лёгкий маршрут» после «## Короткий путь»; в «## Ворота» — одно предложение
      со ссылкой; разделы «Короткий путь» и шаги 1–11 не меняются), docs/workflows/
      handoffs.md (поле context.change_class в «Частых необязательных полях»),
      .claude/agents/orchestrator.md (шаг 0: определить и записать класс),
      .claude/agents/release-validator.md (шаг 9: пересчитать класс), docs/quality-bar.md
      (§5, одно предложение-ссылка на «Лёгкий маршрут» рядом со ссылкой на «Короткий путь»;
      пункты §2 и §3 не меняются), decisions/NNNN-*.md и строка в decisions/README.md.
      Файлы учёта прогона — handoffs/<RUN-ID>/, STATE.md, docs/requirements.yaml (только
      status), docs/anti-patterns.md, docs/product/*, docs/releases/. Кода и тестов работа
      не меняет.

      Вне области: WF-01 (требования), WF-03 (дефекты), WF-04 — открытый вопрос 2; новые
      роли; изменение ворот класса «код»; команда, которая сама считает класс по перечню
      файлов (возможна позже как подкоманда REQ-039 — открытый вопрос 3).

      Открытые вопросы владельцу:
      1. Меняет ли лёгкий маршрут планку? Мнение REQ-ANALYST: нет — каждый пункт §2
         остаётся проверяемым, и у каждого класса есть проверяющий не автор; но quality-bar
         §5 требует решения владельца в любом случае, а при ответе «да» нужна запись
         исключения по §1, п. 3 (причина и срок). Без записи работа не начинается.
      2. Нужен ли такой же лёгкий маршрут в WF-03 (дефекты).
      3. Нужна ли команда, которая считает класс по `git diff` (сейчас считают ORCH и
         RELEASE-VALIDATOR по правилам из раздела).
    acceptance_criteria:
      - "Решение до правки (Q12, quality-bar §5). До шага 0 WF-02: `ls decisions/` находит новую запись (номер — следующий свободный), в ней слова владельца дословно с датой и ответ на открытый вопрос 1; `grep -n '<номер>' decisions/README.md` находит строку со статусом, принятым владельцем; если ответ «меняет планку» — в записи причина и срок (quality-bar §1, п. 3). Записи нет — требование в WF-02 не идёт (проверяет ORCH на шаге 0 и RELEASE-VALIDATOR на шаге 9)"
      - "Раздел и классы. `awk '/^## Лёгкий маршрут/{f=1;next} /^## /{f=0} f' docs/workflows/WF-02-development.md` не пусто и содержит четыре класса («Документы», «Тесты», «Тексты интерфейса», «Код»), для каждого — правило по путям файлов, ворота номерами шагов WF-02 и причину для каждого ненужного шага; раздел стоит после «## Короткий путь»; `git diff base/<RUN-ID> -- docs/workflows/WF-02-development.md` не меняет строк разделов «Короткий путь» и «Шаги» (проверка — чтением diff)"
      - "Класс по файлам (вход → класс; RELEASE-VALIDATOR применяет правила раздела сам): [docs/anti-patterns.md, STATE.md] → «Документы»; [tools/README.md] → «Документы»; [docs/requirements.yaml со сменой только status] → «Документы»; [docs/requirements.yaml с правкой критерия] → не лёгкий маршрут, WF-01; [tools/test/team-web-control.test.js, docs/design/x.md] → «Тесты»; [tools/test/fixtures/team/README.md] → «Тесты» (не «Документы»); [tools/src/foo/NOTES.md] → «Код»; [tools/src/web/texts.js, изменено только значение строки в объекте TEXT] → «Тексты интерфейса»; [tools/src/web/texts.js, изменён текст шаблонной строки в функции progressOf] → «Код»; [tools/src/web/texts.js с новым ключом TEXT] → «Код»; [tools/src/web/public/index.html, изменён только текст подписи между тегами] → «Тексты интерфейса»; [tools/src/pixel-office/public/texts.js] → «Код»; [tools/src/team/language.js] → «Код»; [tools/package.json] → «Код»; [tools/handoffs/exceptions.tsv] → «Код»; [tools/src/web/texts.js (строка), tools/test/team-web-control.test.js] → «Тексты интерфейса» с шагами 5 и 5b. Каждый пример есть в разделе: `grep -c` по именам файлов примеров в разделе — не меньше 1 на каждый"
      - "Кто определяет класс. В разделе: ORCH на шаге 0 пишет context.change_class (класс, файлы, причина); роль, которой нужен файл вне класса, останавливается и пишет в result.issues; RELEASE-VALIDATOR на шаге 9 пересчитывает класс по `git diff --name-only base/<RUN-ID>` и `git status --porcelain` и при более тяжёлом фактическом классе выносит FAIL с возвратом к первому недостающему шагу. `grep -c 'change_class' docs/workflows/handoffs.md .claude/agents/orchestrator.md .claude/agents/release-validator.md` — не меньше 1 в каждом; тесты документов (tools/test/*-docs.test.js, в том числе DC-02) проходят без правки"
