      доработок — только снимок; источник остального (сетка, поиск пути, рисование,
      подписи) — эталонный код reference/pixel-office-osnova/wwwroot/. Офис — то, о чём
      владелец просил, поэтому он не необязателен и не откладывается: первая часть
      сделана в прогоне PO-20260930-01 (решение ORCH по находке S1,
      handoffs/PO-20260930-01/step-00a-req-analyst-r2.json), правка по образцу — прогон
