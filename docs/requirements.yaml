      # 2026-10-13, прогон PIXEL-20261013-01, WF-01 шаг 1: критерий изменён по REQ-042 и decisions/0049 (число идущих сессий считает только сессии со свежими данными)
      - "Состав офиса и столы — растущая часть обстановки: персонаж «Основная сессия» — с числом идущих сессий, если их больше одной (идущая сессия — как в описании и только со свежими данными: у сессии, чьё последнее событие старше STALE_AFTER_MS, «Идёт» снято, критерий 3 REQ-042), — и персонажи только тех ролей, у которых в списке задач REQ-001 есть хотя бы одна задача; у основной сессии и у каждой такой роли — свой стол с ноутбуком и стулом при любом числе ролей: роли без стола не бывает, число столов не зашито, вместе со столами растут перегородки между их колонками и место под них, а неподвижная обстановка (критерий 12) не меняется; столы раздаются по первому появлению роли в журнале, место зависит только от журнала (две загрузки одного журнала дают одинаковые места), а строки новой роли, дописанные в конец журнала без пометок «не из хуков», не сдвигают уже занятые столы (дополнение D11, decisions/0005). Проверка: tools/test/pixel-office-layout.test.js — для N = 1, N = K + 3 и N = 3·(K + 3), где K — число файлов .claude/agents/*.md, прочитанное тестом при запуске, а 3 — встроенные типы general-purpose, Explore и Plan: у N ролей и основной сессии N + 1 разных столов, у каждого — ноутбук и стул, место и клетка подхода каждого стола проходимы и связны между собой, места и клетки подхода первых N + 1 столов при N и при N + 1 ролях совпадают; tools/test/pixel-office-office.test.js — состав по последовательности событий, одинаковые места при двух загрузках, новая роль в конце журнала не двигает прежние, подсчёт идущих сессий, в том числе событие окончания сессии, затем SessionStart с source resume и тем же session_id, затем старт субагента: сессия идёт, её задача «в работе»; две сессии без события окончания, у одной последнее событие моложе STALE_AFTER_MS, у другой старше (поддельные часы): число идущих сессий 1"
      # 2026-10-13, прогон PIXEL-20261013-01, WF-01 шаг 1: критерий изменён по REQ-042 и decisions/0049 («нет свежих данных» и перезапуск не делают персонажа работающим)
      - "Состояния: персонаж роли «работает», пока у роли есть задача «в работе» по критерию 6 REQ-001 (при нескольких — с их числом), сразу по событию — не после анимации, и на паузе, и при любой скорости; задача «окончание не записано», «сервер перезапускался, события не записывались» или «нет свежих данных» (критерии 2, 5 и 6 REQ-042) персонажа работающим не делает; экран ноутбука на столе роли светится, только пока роль «работает»; строка «не из хуков» (критерий 4 REQ-001) не меняет ни одного состояния. Проверка: tools/test/pixel-office-office.test.js — состояние сразу после события, в том числе на паузе и при 4×; два параллельных запуска одного agent_type; «окончание не записано»; «нет свежих данных» (поддельные часы позже STALE_AFTER_MS после последнего события сессии) и «сервер перезапускался…» — персонаж не «работает», экран не светится, новое событие сессии возвращает «работает»; строка «не из хуков»; по вызовам рисования экран ноутбука светится у стола работающей роли и не светится у остальных"
      - "Перемещения — только по двум событиям: начало задачи — персонаж запустившего (основной сессии или субагента — по данным хуков; если запустившего определить нельзя, перемещения нет) идёт к столу роли субагента и возвращается; окончание задачи — персонаж субагента идёт к столу запустившего и возвращается; других перемещений нет: свободный персонаж сидит за своим столом, ни один маршрут не ведёт в переговорную, на кухню или в серверную, строки «не из хуков» перемещений не вызывают. Проверка: tools/test/pixel-office-office.test.js — маршруты появляются только после событий начала и окончания задачи, у каждого маршрута верные начальная и конечная клетки, вызов Agent изнутри субагента ведёт от стола этого субагента, ни одна конечная клетка маршрута не лежит в комнате, после всех маршрутов каждый персонаж — на своём месте за столом"
      - "Сетка (как в проверке связности планировки образца; способ проверки — тесты Sai ниже): каждое место за столом и клетка подхода к нему проходимы, не лежат на стене, столе или мебели, и все такие клетки связны между собой; обстановка рисуется по той же сетке, по которой строятся маршруты, и её клетки, кроме стульев у столов (это места персонажей), непроходимы; маршрут строится только по проходимым клеткам; недостижимая цель оставляет персонажа на месте. Проверка: tools/test/pixel-office-layout.test.js (планировка, связность обходом в ширину, непроходимость клеток обстановки); tools/test/pixel-office-office.test.js — прогон перемещений по последовательности событий: ни в один момент персонаж не стоит на клетке стены, стола или мебели (как проверка «Проходимость» образца; проверяется тестом Sai, а не сверкой с кодом образца)"
      # 2026-10-13, прогон PIXEL-20261013-01, WF-01 шаг 1 доработка r3 по FAIL ворот: критерий изменён по REQ-042, decisions/0051 (слова состояний в карточке агента)
      - "Карточка агента и один поток событий: щелчок по персонажу выделяет его на холсте и открывает карточку — роль, её задачи «в работе», задачи «нет свежих данных» и «сервер перезапускался…» (со своими словами состояния и, у первых, с возрастом — критерий 2(в) REQ-042) и последние закончившие работу, последние события роли; офис, легенда, доска, облачка, строка «Сейчас», журнал с фильтрами, панель задач и карточка строятся из того же массива событий, что журнал и список задач REQ-001, и после добавления одного события все они меняются согласованно. Проверка: tools/test/pixel-office-office.test.js и tools/test/pixel-office-panels.test.js — одна последовательность событий, затем ещё одно событие: каждое представление пересчитано из того же массива и согласовано с остальными; щелчок выделяет персонажа и открывает его карточку"
      - "Правила страницы REQ-001 действуют для всех файлов страницы и офиса (Q7, граница decisions/0003): код отправляет только GET-запросы, выводит текст из событий как текст, а не как HTML (в шапке, легенде, журнале, панели задач, карточке, подписях и на доске), ничего не загружает с других адресов и не нарушает Content-Security-Policy REQ-001 (нет встроенных скриптов и обработчиков в атрибутах). Проверка: тест секрета критерия 8 REQ-001 в tools/test/pixel-office-server.test.js охватывает все файлы tools/src/pixel-office/public/; tools/test/pixel-office-office.test.js и tools/test/pixel-office-panels.test.js — поддельный fetch: только GET; описание и роль <img src=x onerror=alert(1)> в строке «Сейчас», журнале, панели задач, легенде, подписи, на доске и в карточке не создают элемента; `grep -rEn 'https?://' tools/src/pixel-office/public; echo $?` — ни одной найденной строки и код 1; `grep -rniE ' on[a-z]+=|javascript:' tools/src/pixel-office/public; echo $?` — ни одной найденной строки и код 1 (без учёта регистра: onClick= в HTML — тоже обработчик; код 2 — каталога нет, не проходит); тест критерия 8 REQ-001 в tools/test/pixel-office-server.test.js — у каждого <script> в HTML, который отдаёт сервер, в том числе с файлами офиса, есть src"
      - "Офис на реальных событиях (R2): в шаге UAT «реальная сессия» REQ-001 UAT-RUNNER прогоняет логику офиса (команда — из дизайна) на строках журнала, добавленных за сессию, и прикладывает вывод: роль субагента есть в офисе; за сессию ровно два маршрута «туда и обратно» — персонаж основной сессии к столу субагента и персонаж субагента к столу основной сессии; после события окончания персонаж субагента не «работает». Проверка: вывод команды в handoff-е шага UAT"
