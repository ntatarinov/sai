    title: Автоматическая проверка учёта прогонов — команда `npm run handoffs-check` (входит в `npm run check`) проверяет каждый handoffs/**/*.json — читается, статус, времена с часов и не позже коммита, поправки ORCH, пути этого компьютера; старые нарушения — в базе исключений, по одной записи на нарушение, с хешем значения, сверенным с коммитом базы
