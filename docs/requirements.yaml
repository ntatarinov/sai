      - "Приёмка в браузере с нажатиями — только на стенде с вымышленными данными (decisions/0054, дополнение 2, п. 2). Стенд — как в критерии 10 REQ-044, журнал-образец по правилам критерия 9 REQ-042 с основной сессией (два запроса владельца, запись оркестратора, Stop), ролями A и B (B запущен A1), задачей вне окна запроса и не меньше чем 301 элементом списка (чтобы самый старый не был в панели). Журнал владельца, его копии и снимки с них не используются. Шаги и ожидаемое, буквально: 1) нажать на персонажа основной сессии — карточка строки последнего запроса: «Основная сессия», 8 знаков сессии, «Задача» с основанием и временем, текст «историю запроса открывает её строка в панели «Задачи» или в журнале», кнопки «открыть историю запроса» в карточке нет; 2) в «кого запустила в этом запросе» нажать A — карточка A1, в ней тоже нет «открыть историю запроса»; 3) в карточке A1 нажать «события в журнале» — карточка закрыта, в журнале фильтр «Задача» A1, последнее событие A1 раскрыто и в фокусе; 4) Tab до кнопки легенды A, Enter — карточка A1; нажать «к задаче в панели» — карточка закрыта, элемент A1 в панели «Задачи» виден и в фокусе; 5) на этом элементе нажать «открыть историю запроса» — окно «Просмотр истории»; Escape — окно закрыто, фокус на этой кнопке, карточки нет; 6) в журнале раскрыть передачу задания B, нажать «кому» — карточка B; Escape — фокус на кнопке «кому»; 7) у самой старой задачи стенда в её карточке — текст «задача не показана в панели…»; 8) у задачи вне окна запроса — в её элементе панели нет «открыть историю запроса», в карточке основной сессии её нет в «кого запустила в этом запросе». Сценарии пишет BA-ANALYST (docs/uat/REQ-047.md, WF-02, шаг 8), итог и снимки стенда — docs/uat/REQ-047-RUN.md; RELEASE-VALIDATOR на шаге 9 повторяет шаги 1, 3, 5 и 6 сам"
      # 2026-10-15, прогон PIXEL-20261015-01, WF-01 шаг 1, доработка r1 (REQ-ANALYST): было → стало по таблице REQ-048, decisions/0057, дополнение, п. 2; номер и статус не менялись; «идущих сессий: N» → описание строки CARD_SESSIONS без прежних слов.
      - "Документация и проверка не обходится (Q4, Q6, AP-005). tools/README.md, раздел «## Pixel Office»: карточка основной сессии, переходы карточка ↔ панель ↔ журнал, окно истории — из панели и журнала, не из карточки, и карточка закрывается при его открытии (decisions/0014, решения 5 и 6), предел панели для перехода. Проверка: `awk '/^## Pixel Office/{f=1;next} /^## /{f=0} f' tools/README.md | grep -c 'карточка основной сессии'` не меньше 1 (сейчас 0); `cd tools && node --test test/pixel-office-docs.test.js` — код 0. Принятые тесты прежней карточки основной сессии (строка числа идущих сессий CARD_SESSIONS в шапке) и часть теста AC-02 REQ-044 о нажатии на стол основной сессии не удаляются и не слабеют, а заменяются: каждая замена — в таблице «прежняя проверка → новая» проекта docs/design/REQ-047-*.md; часть критерия 1 REQ-044 о прежней карточке основной сессии и шаг 8 его приёмки (критерий 10) заменяются критерием 1 этого блока — текст REQ-044 правит отдельный шаг WF-01 до WF-02 (описание, «Связь с REQ-044»); число строк `^test(` и вхождений `assert[.]` в каждом файле tools/test/pixel-office-*.test.js не меньше, чем на метке base/<RUN-ID> (как критерий 11 REQ-044). `cd tools && npm run check` — код 0, «skipped 0» и «todo 0»; в тексте нет путей этого компьютера и названий других проектов"
      # 2026-10-15, прогон PIXEL-20261015-01, WF-01 шаг 1, доработка r1 (REQ-ANALYST): новый критерий 8 по наблюдению Н2 приёмки REQ044-20261014-01 (docs/uat/REQ-036-044-045-RUN.md) и decisions/0057, дополнение, п. 3.
      # 2026-10-15, прогон PIXEL-20261015-01, WF-01 шаг 1, доработка r2 (REQ-ANALYST): было → стало, decisions/0057 (решение ORCH по I1 доработки r1): правило «самое позднее собственное событие» → сначала запуски, требующие внимания («нет свежих данных», «сервер перезапускался, события не записывались»), затем самое позднее событие; тест MC-08 — три случая, в том числе сценарий 35.
      # 2026-10-15, прогон PIXEL-20261015-01, WF-01 шаг 1, доработка r4 (REQ-ANALYST): было → стало, REQ-048, decisions/0058; номер и статус не менялись; G9: в случае (в) теста MC-08 названы сессии и порядок относительно записи запуска сервера (A1 до неё, A2 после неё в S2, A3 в другой сессии S3).
      - "Запуск по умолчанию, когда у роли нет запуска «в работе» (Н2). Нажатие на персонажа или стол роли и кнопка её легенды открывают: (1) если у роли есть запуск «в работе» — как прежде, первый запуск «в работе» по правилу d REQ-001; (2) иначе, если есть запуски, требующие внимания, — в состоянии «нет свежих данных» или «сервер перезапускался, события не записывались» (UNCONFIRMED_STATES, model.js; слова — критерий 5 REQ-042), — тот из них, у кого самое позднее собственное событие; (3) иначе — запуск с самым поздним собственным событием среди всех запусков роли. Собственное событие — доверенная строка (критерий 7 REQ-042) SubagentStart или SubagentStop с agent_id этого запуска (то же определение, что у «последнего события агента», критерий 4 (б) REQ-044); «самое позднее» — по порядку строк в файле; строки PostToolUse о передаче задания и записи оркестратора в выбор не входят. Это правило заменяет часть критерия 1 REQ-044 о запуске по умолчанию для случая без «в работе» (описание, «Связь с REQ-044»). У основной сессии правило критерия 1 не меняется. Проверка: тест MC-08 в tools/test/pixel-office-page.test.js, поддельные часы и записи запуска сервера — (а) роль без «в работе» и без запусков, требующих внимания: A1 начат первым, A2 начат вторым, затем SubagentStop A2, затем SubagentStop A1 — открывается A1 (по прежнему правилу d открылся бы A2, начатый позже); (б) сценарий 35 приёмки REQ044-20261014-01: sample-a начат, sample-b начат позже и закончил работу (SubagentStop), затем запись запуска сервера — sample-a «сервер перезапускался, события не записывались», sample-b «закончила работу, итог не записан»: открывается sample-a, хотя собственное событие sample-b позже; (в) два запуска, требующих внимания, и один закончивший работу: A1 начат до записи запуска сервера (после неё — «сервер перезапускался…»); A2 начат после записи запуска сервера в сессии S2, и в S2 после этого нет доверенных строк дольше STALE_AFTER_MS («нет свежих данных»); A3 — в другой сессии S3, начат и закончил работу последним (его SubagentStop — самая поздняя строка журнала; в сессии S2 строк после A2 нет, иначе A2 снова был бы «в работе», критерий 1 REQ-042) — открывается A2; в каждом случае строка PostToolUse с launched_agent_id другого запуска после всех строк и помеченная правилом чтения строка SubagentStart другого запуска выбор не меняют; при запуске «в работе» открывается он (правило (1))"
  - id: REQ-048
    title: Pixel Office — понятный язык — одно название роли простыми словами везде (холст, легенда, доска, панель «Задачи», окно истории, карточка) и технические слова на экране заменены понятными без смены смысла (список «было → стало»)
    owner: FRONTEND-DEV   # вся работа — страница (tools/src/pixel-office/public/); вид — описание интерфейса GUI-DESIGN-ANALYST (decisions/0054, п. 3), устройство — проект CODE-DESIGNER; прогон WF-02 вместе с REQ-049, REQ-046 и REQ-047 (decisions/0058, п. 2); «понятный вид» — REQ-049; критерии других требований с прежними словами — отдельный шаг WF-01 до WF-02 (описание, «Связь с другими требованиями»)
    status: pending
    depends_on: [REQ-001, REQ-007, REQ-008, REQ-036, REQ-042, REQ-044, REQ-045]   # журнал, правило чтения и пустой журнал — REQ-001; шапка, холст, легенда, доска и панель «Задачи» — REQ-007; окно «Просмотр истории» и запись оркестратора — REQ-008; таблица названий ролей ROLE_NAMES и строки «Сейчас» — REQ-036; слова состояний, возраст и запрет слов успеха — REQ-042; карточка экземпляра и её слова — REQ-044; таблица слов журнала и раскрытие строки — REQ-045. Статусы на 2026-10-15: REQ-001, REQ-007, REQ-008 — in_progress; REQ-036, REQ-042, REQ-044, REQ-045 — done. Исключение по порядку работ — decisions/0057, дополнение, п. 1 (распространяет decisions/0050, п. 1 на REQ-048): REQ-048 строится и проходит ворота WF-02 при незавершённых REQ-001, REQ-007 и REQ-008; на критерии и планку исключение не действует; после деления на REQ-048 и REQ-049 (decisions/0058, п. 2) действует на оба; зависимости по фактам: REQ-042 — done, REQ-036, REQ-044, REQ-045 переводятся в in_progress в шаге 0 прогона и снова done после RELEASE-VALIDATOR этого прогона (decisions/0058, п. 3)
    original_request: >
      Слова владельца, сообщение в сессии Claude Code 2026-10-14, после показа
      переделанного Pixel Office; дословно — в
      docs/owner-requests/2026-10-14-pixel-office-interactive.md:
      «Честно говоря, я думал, то, что Pixel Office будет более интерактивный, но я этого не увидел. Мне сейчас это самое главное. Когда я нажимаю на рабочий стол агента, либо на агента, когда я вижу журнал, тому прочее, это должно быть более интерактивно. Потому что там написано все непонятно для пользователя.»
      Слова владельца, сообщение в сессии Claude Code 2026-10-15, после выпуска REQ-036, REQ-044 и REQ-045; дословно — в decisions/0057 (раздел «Основание»):
      «Какой итог? что осталось сделать? Сделай все сам»
      Просьба того же владельца 2026-10-13, сообщение в сессии Claude Code; дословно — в
      docs/owner-requests/2026-10-13-pixel-office.md. «Журнал событий»: «Журнал должен быть понятен человеку, который не знаком с внутренней реализацией Claude Code.» «Не переименовывай технические события так, чтобы менялся их смысл.» «Пользователь должен иметь возможность открыть событие и понять, что произошло, а не только увидеть техническое название.»
      «Интерактивный офис»: «При этом не жертвуй читаемостью ради декоративности.» Основной сценарий: «Пользователь видит активных агентов и их доступные задачи.»
      «Визуальный уровень и удобство»: «контрастность и читаемость;», «типографику и иерархию информации;»
      Объём и порядок — decisions/0057, п. 2 (а) («понятный язык и вид») и п. 3 (номер REQ-048); деление на «язык» (REQ-048) и «вид» (REQ-049) и полное название на холсте — decisions/0058, п. 1 и 2.
    description: >
      Что получает владелец. Одна роль везде называется одинаково и простыми словами — на
      холсте, в легенде, на доске, в панели «Задачи», в окне «Просмотр истории» и в
      карточке; код роли виден только там, где его попросили (подсказка, раскрытие).
      Слова «хук», «LIVE», «REAL», «экземпляр», «сессия Claude Code», «агенты переднего
      плана», «pixel-office-note» и подобные на экране заменены словами, понятными
      человеку, который не знает, как устроен Claude Code, — без смены смысла. Строка
      «Сейчас» и раскрытие строки журнала — REQ-049 («понятный вид», decisions/0058, п. 2).

      Основание — находки прогона REQ044-20261014-01: раздел «Понятность для владельца» и
      наблюдения Н1 и Н4 в docs/uat/REQ-036-044-045-RUN.md
      (handoffs/REQ044-20261014-01/step-08b-uat-runner.json, step-08c-ba-analyst-signoff.json),
      находки F5, F6 и F8 ревью (handoffs/REQ044-20261014-01/step-04-reviewer.json); Н5, F4 и F7 — REQ-049.

      Как сейчас (проверено по коду 2026-10-15, файлы — от корня Sai, папка
      tools/src/pixel-office/public/). 1. У роли три имени (F6, Н1): на холсте и на доске —
      roleLabel (office-model.js: текст скобок, обрезка до 15 знаков и «…», например
      «SECURITY-REVIEW…»; доска рисует его в ширине 37 единиц шрифтом 7, office-view.js,
      drawBoard); в легенде — код роли целиком (app.js, кнопка легенды, c.full: «Sai
      Security Reviewer (SECURITY-REVIEWER)»); в панели «Задачи» — название простыми словами
      и под ним второй строкой код роли (app.js, item-full); в карточке экземпляра — код
      строкой под заголовком (card-code); в окне «Просмотр истории» — код в столбце «Агент»
      и в «кто» хронологии (history.js, role). Название простыми словами — roleName
      (words.js) по таблице ROLE_NAMES (texts.js, REQ-036). 2. Подпись персонажа, пришедшего
      к чужому столу, ложится на подпись хозяина стола (Н4; office-view.js, подписи —
      fillText под фигурой, ширина до LABEL_MAX_WIDTH = 130). 3. Технические слова на экране
      (F5, раздел «Понятность для владельца»): шапка — HEADER_BADGE «REAL — события хуков
      Claude Code» (и в index.html), LIVE «LIVE»; журнал — у помеченной строки значение
      source («REAL», «SIMULATION») и «не из хуков», в раскрытии «Источник: хук Claude Code»,
      «другой источник: …», «правило чтения», «pixel-office-note», «внутренних агентов»,
      «фоновых агентов», «сессии Claude Code»; пустой журнал — «Событий от хуков пока нет» и
      подсказка про «обработчики»; карточка — «экземпляр», «экземпляров роли», «Полные
      идентификаторы», «порог свежести», «хук не записывает», «агентов переднего плана», «у
      фоновых»; окно истории и раскрытие записи оркестратора — «привязано автоматически»;
      прежняя карточка основной сессии — «идущих сессий». Под словами строки служебного
      сообщения стоит вторая подпись «служебное сообщение» (F8; app.js, history-service).

      Что будет (содержание; расположение и вид — описание интерфейса, устройство — проект).
      1. Одно название роли везде — roleName; на холсте подпись в одну или две строки по
      словам, без «…»; подписи двух персонажей не накладываются (Н4).
      2. Слова экрана — по таблице «было → стало» ниже; смысл каждого слова не меняется
      (сверено с фактами описания REQ-001 и таблицей REQ-045); свёрнутое раскрытие
      «Технические поля» остаётся как есть (ключи строки журнала — для тех, кому они
      нужны); слова «Основная сессия», «сессия» (номер сессии), «Задача», «Агент», слова
      состояний REQ-042 и облачков не меняются.
      3. Холст: decisions/0058, п. 1 — полное название роли простыми словами, заменяет
      короткую подпись D13 (decisions/0005) и D20 (decisions/0008); риск наложения подписей,
      ради которого был D13 (проба P15), закрывается тестом (критерий 2), а не сокращением.

      Таблица «было → стало» (слова на странице — точные; константы — texts.js; «Где» — что
      видит человек):
        1. Шапка, HEADER_BADGE (и текст в index.html): «REAL — события хуков Claude Code» → «Источник событий — Claude Code».
        2. Шапка, LIVE: «LIVE» → «на связи».
        3. Пустой журнал, EMPTY_JOURNAL: «Событий от хуков пока нет» → «Событий от Claude Code пока нет».
        4. Пустой журнал, EMPTY_HINT → «Видны только разговоры с Claude Code, запущенные в папке sai/: там Claude Code настроен присылать события Pixel Office. Разговоры из другой папки видны, только если в её настройках есть такая же настройка.»
        5. Строка журнала, помеченная правилом чтения: значение source («REAL», «SIMULATION» и другие) и «не из хуков» (NOT_FROM_HOOKS) → только «не подтверждена»; значение source — только в свёрнутом раскрытии «Технические поля».
        6. Раскрытие, пометка (MARK_PREFIX): «не из хуков: » → «не подтверждена: ».
        7. Раскрытие, «Источник» (SOURCE_WORDS): «хук Claude Code» → «Claude Code»; «другой источник: {source}» → «не Claude Code» (значение source — только в «Технических полях»); «запись оркестратора» — без изменений.
        8. Журнал, случай 1 таблицы REQ-045: слова «Сессия Claude Code открыта» → «Открыт разговор с Claude Code»; «что это значит» → «В Claude Code начат новый разговор (сессия) или продолжен прежний: при продолжении номер сессии тот же. Что именно произошло, Claude Code сейчас не сообщает.»
        9. Журнал, случай 2: слова «Сессия Claude Code закрыта» → «Закрыт разговор с Claude Code»; «что это значит» → «Разговор (сессия) закончился: окно закрыли, разговор очистили или переключили. Причину Claude Code сейчас не сообщает.»
        10. Журнал, случай 4, «что это значит» → «Сообщение от системы, а не от человека: напоминание, уведомление о задаче, которая шла параллельно, сообщение из другого разговора с Claude Code или пометка о продолжении прежнего разговора. Его текст не хранится.»
        11. Журнал, случай 6, «чего не доказывает» → «Не доказывает, что вся работа закончена или удалась: агенты, запущенные параллельно, могут ещё работать, и сессия может продолжить сама, когда они вернутся. При прерывании человеком и при ошибке этого события нет.»
        12. Журнал, случай 9, «что это значит» → «Агент закончил свой ход и вернул ответ тому, кто его запустил. Текст ответа Pixel Office не хранит: итог не записан. Такое событие присылают и служебные помощники самого Claude Code — их начала в журнале нет, а роль совпадает с ролью разговора или пуста.»
