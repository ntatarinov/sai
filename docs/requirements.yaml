      владелец просил, поэтому он не необязателен и не откладывается: первая часть
      сделана в прогоне PO-20260930-01 (решение ORCH по находке S1,
      handoffs/PO-20260930-01/step-00a-req-analyst-r2.json), правка по образцу — прогон
      PO-20261002-01 по WF-04: описание интерфейса, сборка, ворота WF-02, снимок против
      образца, подтверждение владельца.

      Источник — только события REQ-001. Офис, легенда, доска, облачка, строка «Сейчас»,
      журнал с фильтрами, панель задач и карточка агента строятся из того же массива
      событий (и времени запусков сервера), что журнал и список задач REQ-001, по тем же
      правилам: задачи и их состояния — по критерию 6 REQ-001, строки «не из хуков» — по
      критерию 4 REQ-001 (не меняют ни состояний, ни перемещений, ни облачков). Своего
      хранилища, сервера и пути записи у REQ-007 нет. Идущая сессия — session_id, у
      которого есть событие после последнего запуска сервера и последнее событие
      которого — не событие окончания сессии: сессия, возобновлённая с тем же session_id
      (факт 12 REQ-001), снова идёт.

      Элементы образца — что переносится (в скобках — номер критерия).

      Шапка. Название — как «Pixel Office»: так называется страница Sai, а «Agent
      Office» — имя страницы эталона (9). Значок «LIVE» с подписью «реальные события
      Agent Runtime» — в честной форме: «LIVE» виден, только пока есть связь с сервером, а
      подпись — пометка «REAL — события хуков Claude Code» критерия 4 REQ-001 (9). Строка
      «Сейчас: <номер требования> — <название требования>» — в честной форме: «Сейчас:» и первый
      элемент «в работе» панели задач — роль и описание задачи или строка основной сессии
      (9); номера и названия требования в событиях хуков нет. Кнопки «Пауза», «1×», «2×»,
      «4×» — в честной форме: управляют только ходьбой персонажей, история не
      проигрывается (решение D8, decisions/0005), а состояния, облачка, журнал и список от
      них не зависят (9). Ссылка «← Учётная система» — не переносится: у Sai нет
      системы, к которой она вела бы.

      Офис. Обстановка делится на две части. Неподвижная — тёмный клетчатый пол и стены
      вне зоны столов, растения, книжные полки, переговорная (большой стол, места вокруг
      него, доска на стене), кухня (стойка с кофемашиной, места отдыха), отдельные места
      отдыха в зале, серверная (стойки за стенами) и подписи «ПЕРЕГОВОРНАЯ», «КУХНЯ»,
      «СЕРВЕРНАЯ» — переносится как есть и не зависит ни от событий, ни от времени (12);
      от событий в ней зависит только доска-канбан со столбцами ролей — в честной форме:
      столбец на каждую роль с задачей в идущих сессиях (на образце — участники текущего
      требования) и «+N» для не поместившихся (13). Растущая — зона столов: столы с
      ноутбуком и стулом, перегородки между их колонками и место под них — в честной
      форме: столов столько, сколько ролей с задачами, и ещё стол основной сессии, а не
      12, как на образце; новые столы добавляются вместе с журналом, занятые не
      сдвигаются (раздел «Столы», критерий 1); экран ноутбука светится, пока роль работает
      (2). Места для всех в переговорной и места отдыха — обстановка: собраний и отдыха
      хуки не дают, поэтому туда никто не ходит (3). Раскладка под FullHD — доработка с
      образца (в его панели читается «…FullHD») — переносится: в окне 1920 × 1080 вся
      страница видна без прокрутки страницы, прокручиваются только списки журнала и
      панели задач (16).

      Персонажи. Фигурка цвета роли на стуле у своего стола, короткая подпись роли (у
      Sai — правило roleLabel, решение D13) и выделение выбранного персонажа —
      переносятся (1, 5). Персонаж «ORCH» образца — у Sai персонаж «Основная сессия»: роль
      основной сессии в событиях хуков не названа (1). Облачка реплик — в честной форме: короткие фразы из закрытого
      списка, каждая привязана к событию и видна только первые 10 секунд после него (10).
      Облачко «Да, конечно» — ответ на вопрос — не переносится. Персонажи, которые в
      простое стоят у чужого стола, сидят в переговорной или стоят у кухни, — не
      переносятся: на образце это следствие событий «вопрос», «совещание» и отдыха,
      которых хуки не дают; у Sai свободный персонаж сидит за своим столом (3). Легенда
      «<роль> · свободен / работает» с меткой цвета у работающих — переносится (11).

      Журнал. Заголовок «Журнал», фильтры «Всё», «Работа», «Офис», подпись пояса и
      счётчик «N из M» — в честной форме: «Работа» — события работы основной сессии и
      субагентов, «Офис» — строки, вызвавшие перемещение в офисе, пояс — часов
      компьютера владельца (критерий 6(е) REQ-001), а не постоянный «Алматы» (14). У
      строки — время, роль, вид события и описание задачи, а цветная полоса у строки
      переносится как метка вида события (14); номер требования и текст итога
      в строке — не переносятся: номера требования в событиях хуков нет, а тексты итогов
      REQ-001 не хранит (критерий 3 REQ-001, Q7).

      Панель «Требования» (текущее с полосой хода «задач N/M · агентов K» и история) — в
      честной форме: панель «Задачи» — список задач REQ-001 в разделах «Текущие» и
      «История», а над ними для каждой идущей сессии полоса хода и «задач N/M · ролей K»
      (15); полоса хода и «задач N/M · агентов K» у карточек истории образца считаются из
      событий так же, поэтому переносятся: такая же сводка — у каждой не идущей сессии с
      задачами, чей элемент показан в разделе «История» (15). Список задач показывает не
      больше 300 элементов («Текущие» и «История» вместе; при большем числе — пометка
      «показано 300 из N», решение D19, decisions/0008): сводка стоит над самым верхним
      показанным элементом своей сессии, а у сессии, чьих элементов из-за предела не видно,
      сводки нет, как нет и самих элементов. Задача, возобновлённая в другой сессии, считается
      в сессии своего последнего старта (критерий 6(и) REQ-001); метки «в работе» и «выполнено» у карточек образца — метки состояния задачи
      REQ-001: «в работе», «завершена», «окончание не записано» (15). Номера, названия и
      статусы требований — не переносятся: в событиях хуков их
      нет, а новый источник (файлы требований и handoff-ов) расширил бы границу REQ-001
      (критерий 5 REQ-001: сервер отдаёт для чтения только события и время своих
      запусков) — это решение владельца, вопрос записан в handoff-е шага 00a прогона
      PO-20261002-01. Элементы REQ-001, которых на образце нет (время запусков сервера,
      пометки пустого журнала и нет связи, карточка агента), остаются; где они стоят,
      решает описание интерфейса.

      Столы — растущая часть обстановки. У основной сессии и у каждой роли, у которой в
      списке задач REQ-001 есть задача, — свой стол с ноутбуком и стулом при любом числе
      таких ролей: число столов не зашито, офис добавляет столы (а с ними перегородки
      между их колонками и место под них) вместе с журналом, уже занятые столы не
      сдвигаются, неподвижная обстановка от этого не меняется. Столы раздаются по первому
      появлению роли в журнале; место зависит только от журнала. Почему не постоянное
      число: на 2026-10-02 в .claude/agents/ уже 37 файлов ролей (было 23), шаг 2c
      итерации 2 (PLAN.md) добавляет роли, а столы получают и встроенные типы
      (general-purpose, Explore, Plan), и роли сессий, начатых в других папках
      (decisions/0007); любое постоянное число со временем оставило бы роль без стола.
      Правило записано в дополнении D11 (decisions/0005, 2026-10-02).

      Перемещения. Персонаж запустившего — основной сессии или субагента (вызов Agent
      изнутри субагента несёт agent_id этого субагента, критерий 3 REQ-001) — идёт к столу
      роли запущенного субагента и возвращается: задачу передали. По окончании задачи
      персонаж субагента идёт к столу запустившего и возвращается: результат вернули.
      Если запустившего определить нельзя, перемещения нет. Других перемещений нет:
      вопросов, совещаний и отдыха хуки не дают, свободный персонаж сидит за своим
      столом. Путь — по той же сетке, что рисуется (как в образце: поиск кратчайшего пути
      по этой сетке, findPath), поэтому пройти
      сквозь стену, стол или мебель нельзя по построению. «Пауза» останавливает ходьбу, а
      «1×», «2×», «4×» меняют её скорость; какие маршруты есть и когда меняются
      состояния, от них не зависит.

      Облачка. Фраза над персонажем появляется, только когда её даёт событие: «Только что
      получил задачу» — первое начало задачи, над персонажем роли субагента; «Готово» —
      окончание задачи, над ним же; «Получил запрос» — отправка запроса, над персонажем
      основной сессии; «Ответ готов» — конец ответа, закрывший строку основной сессии, над
      ним же. Облачко видно, только пока по часам компьютера прошло от 0 до 10 секунд
      после времени события: так «только что» остаётся правдой, а события, догруженные
      после обрыва связи, облачков не дают. Других фраз нет — ни текстов из событий, ни
      ответов на вопросы.

      Что меняется в проекте: файлы страницы и офиса в tools/src/pixel-office/public/;
      новые тесты tools/test/pixel-office-office.test.js,
      tools/test/pixel-office-layout.test.js и tools/test/pixel-office-panels.test.js и
      общий с REQ-001 файл помощников тестов tools/test/pixel-office-helpers.js (один
      новый файл, без .test.js, чтобы `npm test` не запускал его как тест; прежние тесты,
      в том числе tools/test/helpers.js, не меняются); описание интерфейса по образцу — в
      docs/design/ (WF-04, шаг 1), логика офиса и страницы — в проекте
      docs/design/REQ-001-pixel-office.md; снимки DESIGN-QA-VALIDATOR — вне проекта или в
      docs/design/samples/ с пометкой actual в имени (WF-04, шаг 4); handoff-ы — в
      handoffs/PO-20260930-01/ и handoffs/PO-20261002-01/; статус — в блоке REQ-007
      docs/requirements.yaml. Сервер, хук, .claude/settings.json и tools/package.json
      REQ-007 не меняет.

      Размер окна и масштаб (просьба владельца 2026-10-05). Здесь и ниже «окно» — окно просмотра (viewport) в CSS-пикселях. Два опорных размера окна
      страницы: 1920 × 1080 (Full HD) и 2560 × 1440 (2K). Масштаб интерфейса
      S = min(ширина окна / 1920, высота окна / 1080), не меньше 1,0 и не больше 1,5.
      При 1920 × 1080 S = 1,0 — вид тот же, что до этой правки; при 2560 × 1440
      S = 4/3: размеры правой колонки, шапки, зазоров, отступов, шрифтов (журнал, задачи,
      легенда, кнопки, карточки) в 4/3 раза больше, чем при 1920 × 1080. Масштаб задаётся
      одним правилом таблицы стилей для корневого элемента страницы (размер корневого
      шрифта: 16 px при S = 1,0, ≈ 21,33 px при S = 4/3, не больше 24 px при S = 1,5);
      все размеры интерфейса — колонка, шапка, зазоры, шрифты, кнопки, отступы, легенда,
      карточки — выражены в единицах от корневого шрифта, а не в пикселях; пикселями
      остаются линии толщиной 1–2 px и пороги в условиях @media. Скрипт масштаб не
      задаёт и атрибут style не используется (правило страницы REQ-001, решение D16).
      Офис (холст) занимает наибольшее целое число пикселей на клетку, при котором
      страница влезает без прокрутки страницы, но не меньше клетки, при которой
      выполняются пороги критерия 18 (поправка 2026-10-06: до неё нижней границы у клетки
      не было); после масштабирования все элементы легенды видны или достижимы прокруткой своей полосы. При ширине окна меньше 1920
      масштаб S = 1,0 и поведение прежнее, кроме размера клетки холста (критерий 18): узкие
      раскладки 600–1239 и до 599 px не меняются. Другие соотношения сторон (16:10, 21:9)
      не ломаются: масштаб считается по меньшей стороне, страница видна без прокрутки
      страницы. Вне области: окна больше 3840 × 2160 сверх предела S = 1,5 и экраны с
      масштабом системы, отличным от 100 %, не проверяются отдельно; исключение — снимок
      окна 1470 × 784 критерия 18 делается с плотностью пикселей 2, как на экране
      владельца (А), а пороги критерия 18 измеряются в CSS px окна просмотра.

      Читаемость на экранах владельца (просьба владельца 2026-10-06). Реальные экраны
      владельца: (А) MacBook 13 дюймов M4 — на снимке владельца окно 2940 × 1568 физических точек
      при плотности 2, то есть область страницы ≈ 1470 × 784 CSS px; (Б) монитор 25 дюймов Full
      HD — область страницы около 1920 × 950 CSS px (окно браузера с панелями, плотность 1).
      На снимке (А) холст занимает ≈ 600 × 507 CSS px, сетка 40 × 34 клетки, клетка ≈ 15 px,
      фигура персонажа ≈ 11 px, подпись роли ≈ 5,6 px, и их не разобрать; прежние критерии 16–17 измеряли окно целиком
      1920 × 1080 и этого не ловили — это пробел требования. Что должно стать правдой: на
      обоих экранах персонажи и подписи читаются, и при этом ничего не пропадает (критерий
      18): остаются все комнаты, столы и персонажи, легенда, журнал, панель «Задачи» и шапка.
      Нынешняя сетка 40 × 34 клетки для 19 столов при клетке 27 px (минимум, при котором
      выполняются пороги критерия 18) даёт ≈ 1080 × 918 CSS px — в окна 1470 × 784 и
      1920 × 950 она заведомо не помещается, и прокрутка холста стала бы главным режимом.
      Поэтому уплотнение офиса обязательно и измеримо: для 19 столов сетка — не больше 36 × 22 клеток (число клеток по ширине и высоте, считая все стены; клетка 27 px даёт ≤ 972 × 594 CSS px; прежний предел 36 × 24 = 972 × 648 в окно 1470 × 784 по высоте не помещался). Высота на 1470 × 784, по style.css и снимку владельца: шапка 60 px, внешние поля 2 × 14 px, панель офиса 784 − 60 − 28 = 696 px, её внутренние отступы 2 × 12 = 24 px, остаётся 672 px под легенду и холст. Прежняя легенда на 19 элементов (7 строк) занимает ≈ 159 px, под холст остаётся ≈ 513 px, то есть не больше 19 строк по 27 px — поэтому легенда сжимается до не более двух строк высоты (≈ 70 px), а её содержимое прокручивается внутри её полосы, все 19 элементов достижимы (информация не теряется); под холст остаётся 672 − 70 = 602 px ≥ 594 (запас 8 px; клетка по расчёту 27). Альтернативное размещение легенды допускается, если на 1470 × 784 под холст при нём остаётся не меньше 594 px без прокрутки страницы — это выбор описания интерфейса (WF-04). На 1920 × 950 (корневой шрифт 16 px): панель 950 − 60 − 28 = 862 px, минус отступы 24 и сжатая легенда 70 — ≈ 768 px под холст ≥ 594 (с прежней легендой ≈ 679 px — тоже ≥ 594); на 1920 × 1080 и 2560 × 1440 места больше (расчёт клетки — в тесте критерия 18(е)). Все
      комнаты (переговорная с доской, кухня, серверная), все 19 столов, проходы и
      растения остаются; состав и взаимное расположение комнат и зоны столов — как на образце по смыслу и как в раскладке до правки: зона столов левее всех комнат, переговорная вверху, серверная левее кухни, столы колоннами; убирается только пустой
      пол между ними и у внешней стены, не несущий ни комнаты, ни стола, ни прохода, и
      внешняя стена обходит только занятую часть (критерий 18(д); образец и критерии 12 и
      16 этим не нарушаются). Прокрутка холста внутри панели остаётся запасным вариантом —
      только когда в журнале больше 19 столов, — а не основным режимом; масштаб с кнопками
      «+», «−», «по размеру» или прокрутка — выбор описания интерфейса (WF-04) для этого
      запасного случая. Порог при размере «по умолчанию» задан высотой фигуры и размером
      шрифта подписи, а в клетках он равен 27 px (при нынешнем рисунке). Критерий 18 меняет два места,
      записанных ранее, и они названы в handoff-е этой правки для ORCH: правило клетки
      «наибольшее целое при отсутствии прокрутки страницы» (decisions/0012, раздел
      «Граница»; описание интерфейса REQ-007, п. 1.0 «Холст не масштабируется по S, а
      подбирается») получает нижнюю границу; правило масштаба S «не меньше 1,0» (D22)
      не меняется. Прокрутка внутри панели холста — новое поведение страницы, в решениях
      0005, 0008 и 0012 его нет.

      Числа — перевод аналитика, не слова владельца: 4/3, 1,0 и 1,5 — масштаб 2560 × 1440
      к 1920 × 1080 и пределы масштаба (в просьбе владельца названы только «full hd и
      2k»); 20 px (высота фигуры), 10 px (шрифт подписи), сетка не больше 36 × 22 клеток (было 36 × 24 в r1: 24 строки по 27 px = 648 px не помещаются в ≈ 513 px по замечанию REQ-VALIDATOR r1), легенда в не более чем две строки с прокруткой внутри полосы, клетка не меньше 27 px и 18 ролей — решения ORCH 2026-10-06 (первоначальные 24 и 11 px заменены: при них клетка 32 px и офис ≈ 1280 × 1088 CSS px не помещается в окна 1470 × 784 и 1920 × 950); 19
      столов подсчитано аналитиком по легенде снимка владельца (в задании названо 13, это
      не подтвердилось); 1470 × 784, 1920 × 950 и 480 × 800 — окна из просьбы владельца и
      задания; 10 секунд — сколько видно облачко
      после события (страница получает событие не позже чем через 5 секунд, критерий 7
      REQ-001, остальное — запас); 1920 × 1080 — окно снимка: FullHD, раскладка под который —
      доработка с образца; 1×, 2×, 4× — кнопки образца; 37 — число файлов в
      .claude/agents/ на 2026-10-02 (ls .claude/agents/*.md | wc -l), правило столов от
      него не зависит.

      Вне области. Совещания, вопросы и ответы, сбор в переговорной и уход персонажей на
      отдых — хуки таких событий не дают, показать их значило бы выдумать (R2);
      переговорная, её места и места отдыха остаются обстановкой. Проигрывание истории с
      начала (решение D8, decisions/0005): «Пауза» и скорости касаются только ходьбы по
      маршрутам, появившимся после открытия страницы. Номера, названия и статусы
      требований, карточка требования и выбор требования — в событиях хуков их нет
      (вопрос о новом источнике — в handoff-е шага 00a прогона PO-20261002-01). Тексты
      итогов, найденных дефектов и выводов — REQ-001 их не хранит (критерий 3 REQ-001,
      Q7). Постоянный пояс «Алматы» — время показывается по поясу часов компьютера
      (критерий 6(е) REQ-001). Постоянный состав ролей эталона — роли берутся из
      agent_type. Ссылка «← Учётная система» и переключатель режима эталона — у Sai нет ни
      учётной системы, ни режима симуляции (критерий 4 REQ-001).

      Планка. Q8, R3, Q9 и Q11 не применимы, как в REQ-001: данных магазинов, фото
      покупателей, SQL и адресов, которые задаёт магазин или покупатель, нет. R2 —
      критерии 2, 3, 5, 7 и 10–16; Q7 и правила страницы REQ-001 — критерий 6; Q10 —
      критерий 9 (при обрыве связи страница работает дальше, «LIVE» гаснет; критерий 7
      REQ-001); Q4 и Q6 — критерий 8; Q12 — новый источник для номеров требований
      требование само не решает: это вопрос владельцу в handoff-е шага 00a прогона
      PO-20261002-01; правило столов записано в дополнении D11 (decisions/0005); R1 — мерж подтверждает владелец.
    acceptance_criteria:
      - "Состав офиса и столы — растущая часть обстановки: персонаж «Основная сессия» — с числом идущих сессий, если их больше одной (идущая сессия — как в описании), — и персонажи только тех ролей, у которых в списке задач REQ-001 есть хотя бы одна задача; у основной сессии и у каждой такой роли — свой стол с ноутбуком и стулом при любом числе ролей: роли без стола не бывает, число столов не зашито, вместе со столами растут перегородки между их колонками и место под них, а неподвижная обстановка (критерий 12) не меняется; столы раздаются по первому появлению роли в журнале, место зависит только от журнала (две загрузки одного журнала дают одинаковые места), а строки новой роли, дописанные в конец журнала без пометок «не из хуков», не сдвигают уже занятые столы (дополнение D11, decisions/0005). Проверка: tools/test/pixel-office-layout.test.js — для N = 1, N = K + 3 и N = 3·(K + 3), где K — число файлов .claude/agents/*.md, прочитанное тестом при запуске, а 3 — встроенные типы general-purpose, Explore и Plan: у N ролей и основной сессии N + 1 разных столов, у каждого — ноутбук и стул, место и клетка подхода каждого стола проходимы и связны между собой, места и клетки подхода первых N + 1 столов при N и при N + 1 ролях совпадают; tools/test/pixel-office-office.test.js — состав по последовательности событий, одинаковые места при двух загрузках, новая роль в конце журнала не двигает прежние, подсчёт идущих сессий, в том числе событие окончания сессии, затем SessionStart с source resume и тем же session_id, затем старт субагента: сессия идёт, её задача «в работе»"
      - "Состояния: персонаж роли «работает», пока у роли есть задача «в работе» по критерию 6 REQ-001 (при нескольких — с их числом), сразу по событию — не после анимации, и на паузе, и при любой скорости; задача «окончание не записано» персонажа работающим не делает; экран ноутбука на столе роли светится, только пока роль «работает»; строка «не из хуков» (критерий 4 REQ-001) не меняет ни одного состояния. Проверка: tools/test/pixel-office-office.test.js — состояние сразу после события, в том числе на паузе и при 4×; два параллельных запуска одного agent_type; «окончание не записано»; строка «не из хуков»; по вызовам рисования экран ноутбука светится у стола работающей роли и не светится у остальных"
      - "Перемещения — только по двум событиям: начало задачи — персонаж запустившего (основной сессии или субагента — по данным хуков; если запустившего определить нельзя, перемещения нет) идёт к столу роли субагента и возвращается; окончание задачи — персонаж субагента идёт к столу запустившего и возвращается; других перемещений нет: свободный персонаж сидит за своим столом, ни один маршрут не ведёт в переговорную, на кухню или в серверную, строки «не из хуков» перемещений не вызывают. Проверка: tools/test/pixel-office-office.test.js — маршруты появляются только после событий начала и окончания задачи, у каждого маршрута верные начальная и конечная клетки, вызов Agent изнутри субагента ведёт от стола этого субагента, ни одна конечная клетка маршрута не лежит в комнате, после всех маршрутов каждый персонаж — на своём месте за столом"
      - "Сетка (как в проверке связности планировки образца; способ проверки — тесты Sai ниже): каждое место за столом и клетка подхода к нему проходимы, не лежат на стене, столе или мебели, и все такие клетки связны между собой; обстановка рисуется по той же сетке, по которой строятся маршруты, и её клетки, кроме стульев у столов (это места персонажей), непроходимы; маршрут строится только по проходимым клеткам; недостижимая цель оставляет персонажа на месте. Проверка: tools/test/pixel-office-layout.test.js (планировка, связность обходом в ширину, непроходимость клеток обстановки); tools/test/pixel-office-office.test.js — прогон перемещений по последовательности событий: ни в один момент персонаж не стоит на клетке стены, стола или мебели (как проверка «Проходимость» образца; проверяется тестом Sai, а не сверкой с кодом образца)"
      - "Карточка агента и один поток событий: щелчок по персонажу выделяет его на холсте и открывает карточку — роль, её задачи «в работе» и последние завершённые, последние события роли; офис, легенда, доска, облачка, строка «Сейчас», журнал с фильтрами, панель задач и карточка строятся из того же массива событий, что журнал и список задач REQ-001, и после добавления одного события все они меняются согласованно. Проверка: tools/test/pixel-office-office.test.js и tools/test/pixel-office-panels.test.js — одна последовательность событий, затем ещё одно событие: каждое представление пересчитано из того же массива и согласовано с остальными; щелчок выделяет персонажа и открывает его карточку"
      - "Правила страницы REQ-001 действуют для всех файлов страницы и офиса (Q7, граница decisions/0003): код отправляет только GET-запросы, выводит текст из событий как текст, а не как HTML (в шапке, легенде, журнале, панели задач, карточке, подписях и на доске), ничего не загружает с других адресов и не нарушает Content-Security-Policy REQ-001 (нет встроенных скриптов и обработчиков в атрибутах). Проверка: тест секрета критерия 8 REQ-001 в tools/test/pixel-office-server.test.js охватывает все файлы tools/src/pixel-office/public/; tools/test/pixel-office-office.test.js и tools/test/pixel-office-panels.test.js — поддельный fetch: только GET; описание и роль <img src=x onerror=alert(1)> в строке «Сейчас», журнале, панели задач, легенде, подписи, на доске и в карточке не создают элемента; `grep -rEn 'https?://' tools/src/pixel-office/public; echo $?` — ни одной найденной строки и код 1; `grep -rniE ' on[a-z]+=|javascript:' tools/src/pixel-office/public; echo $?` — ни одной найденной строки и код 1 (без учёта регистра: onClick= в HTML — тоже обработчик; код 2 — каталога нет, не проходит); тест критерия 8 REQ-001 в tools/test/pixel-office-server.test.js — у каждого <script> в HTML, который отдаёт сервер, в том числе с файлами офиса, есть src"
      - "Офис на реальных событиях (R2): в шаге UAT «реальная сессия» REQ-001 UAT-RUNNER прогоняет логику офиса (команда — из дизайна) на строках журнала, добавленных за сессию, и прикладывает вывод: роль субагента есть в офисе; за сессию ровно два маршрута «туда и обратно» — персонаж основной сессии к столу субагента и персонаж субагента к столу основной сессии; после события окончания персонаж субагента не «работает». Проверка: вывод команды в handoff-е шага UAT"
      - "Проверка не обходится (Q4, Q6): команда критерия 14 REQ-001 проходит вместе с тестами REQ-007; `ls tools/test/pixel-office-office.test.js tools/test/pixel-office-layout.test.js tools/test/pixel-office-panels.test.js` — код 0; в итоге node --test — «skipped 0» и «todo 0»; проверки Q6 критерия 14 REQ-001 охватывают и эти файлы. Проверка: вывод команд критерия 14 REQ-001 и команды ls (TEST-RUNNER; RELEASE-VALIDATOR повторяет сам)"
      - "Шапка, в честной форме: название «Pixel Office»; значок «LIVE» — только пока последний опрос сервера удался: до первого удачного опроса и при «Нет связи с сервером Pixel Office» (критерий 7 REQ-001) его нет, а пометка «REAL — события хуков Claude Code» (критерий 4 REQ-001) видна всегда; строка «Сейчас: …» — первый элемент раздела «Текущие» панели задач (критерий 15): у задачи — подпись роли (как у персонажа) и описание, если оно есть (критерий 6(з) REQ-001), у строки основной сессии — «Основная сессия — обрабатывает запрос», и число остальных элементов «в работе», если они есть; при пустом разделе — «Сейчас: в работе ничего нет»; кнопки «Пауза» (на паузе — «Продолжить»), «1×», «2×», «4×»: на паузе персонажи стоят, новые маршруты ждут и проходятся после «Продолжить»; при 2× и 4× персонаж проходит тот же путь вдвое и вчетверо быстрее, чем при 1×; при открытии страницы — 1× без паузы; ссылки «← Учётная система» и выбора требования нет. Проверка: tools/test/pixel-office-panels.test.js — поддельные fetch и часы: «LIVE» после удачного опроса, нет «LIVE» до первого опроса и после неудачного, пометка REAL во всех трёх случаях; строка «Сейчас» на каждый случай — задача с описанием, задача без описания, только строка основной сессии, несколько элементов «в работе», пусто — и её смена после нового события; tools/test/pixel-office-office.test.js — поддельные кадры: на паузе за 10 секунд кадров ни один персонаж не сдвинулся, а событие за это время сразу изменило состояние; после «Продолжить» маршрут пройден; один и тот же путь при 2× и 4× занимает половину и четверть кадров пути при 1× (с точностью до одного кадра)"
      - "Облачка — только фразы, привязанные к событиям (R2): над персонажем роли субагента — «Только что получил задачу» по первому началу задачи и «Готово» по окончанию задачи; над персонажем основной сессии — «Получил запрос» по отправке запроса и «Ответ готов» по концу ответа, закрывшему строку основной сессии; облачко видно, только пока по часам компьютера прошло от 0 до 10 секунд после времени события; других фраз нет — ни текстов из событий, ни фраз без события; строки «не из хуков», повторный старт задачи, конец ответа без открытой строки, окончание без записанного начала и события SessionStart, SessionEnd и PostToolUse облачков не дают. Проверка: tools/test/pixel-office-office.test.js — поддельные часы: на каждый из четырёх случаев — облачко с этой фразой над нужным персонажем в момент события и через 10 секунд, его нет через 11 секунд и раньше времени события; строка, полученная через 30 секунд после её времени (как после обрыва связи), облачка не даёт; в каждом перечисленном случае без облачка облачков нет; все фразы облачков во всех сценариях теста — из этих четырёх"
      - "Легенда как на образце: по элементу на основную сессию и на каждую роль с задачей, в порядке столов, — полное имя роли (у основной сессии — «Основная сессия») и состояние: у роли «работает», пока у неё есть задача «в работе», иначе «свободен»; у основной сессии «работает», пока открыта её строка «обрабатывает запрос», иначе «свободна»; метка цвета роли — только у работающих; состояние меняется сразу по событию. Проверка: tools/test/pixel-office-office.test.js — по последовательности событий: имена, порядок, состояния, метка цвета только у работающих, смена состояния сразу после событий начала и окончания"
      - "Неподвижная обстановка как на образце (R2): тёмный клетчатый пол и стены вне зоны столов; растения и книжные полки; переговорная с подписью «ПЕРЕГОВОРНАЯ» — большой стол, места вокруг него и доска на стене; кухня с подписью «КУХНЯ» — стойка с кофемашиной и места отдыха; отдельные места отдыха в зале; серверная с подписью «СЕРВЕРНАЯ» — стойки за стенами. Уплотнение пустого пола по критерию 18(д) расхождением с образцом не считается, если состав комнат и их взаимное расположение по смыслу те же. Этот неподвижный слой не зависит ни от событий, ни от времени: при любом журнале и в любой момент он один и тот же; от событий зависит только содержимое доски (критерий 13); зона столов — столы с ноутбуками и стульями, перегородки между их колонками и место под них — растущая часть со своей проверкой (критерий 1); случайных величин в коде страницы и офиса нет. Проверка: tools/test/pixel-office-layout.test.js — в сетке есть три комнаты с этими подписями и названной обстановкой; клетки неподвижного слоя одинаковы при пустом журнале и при N = 1, N = K + 3 и N = 3·(K + 3) ролях (N и K — как в критерии 1); tools/test/pixel-office-office.test.js — вызовы рисования неподвижного слоя одинаковы для двух разных журналов (пустого и с K + 3 ролями) и для одного журнала в моменты, разделённые минутой (без маршрутов и облачков; содержимое доски не сравнивается); `grep -rn 'Math.random' tools/src/pixel-office/public; echo $?` — ни одной найденной строки и код 1 (код 2 — каталога нет, не проходит); как это выглядит — снимок по критерию 16"
      - "Доска в переговорной — канбан по ролям, в честной форме: столбец на каждую роль, у которой есть задача в идущих сессиях, в порядке первого появления роли в журнале, — цвет и подпись роли (как у персонажа) и число её задач в этих сессиях «в работе», «завершена» и «окончание не записано»; роли, чьи столбцы не поместились, — одной меткой «+N», где N — их число; нет идущих сессий — на доске нет столбцов; доска меняется сразу по событию. Проверка: tools/test/pixel-office-office.test.js — по последовательности событий двух сессий, одна из которых закончилась: столбцы только ролей идущей сессии и верные числа по состояниям; ролей больше, чем помещается столбцов, — «+N» с верным N; после окончания последней идущей сессии столбцов нет"
      - "Журнал как на образце, в честной форме: заголовок «Журнал»; фильтры «Всё», «Работа», «Офис», при открытии страницы — «Всё»: «Всё» — все строки журнала REQ-001, в том числе помеченные «не из хуков»; «Работа» — строки видов UserPromptSubmit, Stop, PostToolUse, SubagentStart и SubagentStop; «Офис» — строки, по которым в офисе появился маршрут (критерий 3); выбранный фильтр не сбрасывается новыми событиями; подпись «время — <пояс>» с поясом часов компьютера (критерий 6(е) REQ-001); счётчик «N из M»: M строк подходят под фильтр, N из них показано (предел показа задаёт дизайн REQ-001); у строки — время, роль, вид события, описание задачи, если оно связано с запуском (критерий 6(з) REQ-001), и пометка «не из хуков» у помеченных; номера требования и текста итога нет. Проверка: tools/test/pixel-office-panels.test.js — последовательность со всеми видами событий, помеченной строкой и двумя маршрутами: каждый фильтр показывает ровно свои строки, счётчик равен числу показанных и числу подходящих строк, фильтр сохраняется после нового события, под TZ=Asia/Almaty в подписи пояса — Asia/Almaty"
      - "Панель задач на месте панели «Требования» образца, в честной форме: список задач REQ-001 в двух разделах — «Текущие» (задачи и строки основной сессии «в работе») и «История» (остальные), в каждом новые сверху, как в критерии 6(д) REQ-001; у элемента — подпись и полное имя роли (у строки основной сессии — «Основная сессия — обрабатывает запрос»), описание, если оно есть, состояние и время по критерию 6 REQ-001; над «Текущими» для каждой идущей сессии — первые 8 знаков её session_id, полоса хода и «задач N/M · ролей K», где M — число задач этой сессии (задача, возобновлённая в другой сессии, — в сессии своего последнего старта, критерий 6(и) REQ-001), N — сколько из них «завершена», K — число разных ролей среди них; M, N и K считаются по всем задачам сессии, включая те, чьих элементов нет в списке из-за предела 300; список показывает не больше 300 элементов («Текущие» и «История» вместе); если элементов больше 300, показаны первые 300 в порядке критерия 6(д) REQ-001 и есть пометка «показано 300 из N», где N — число всех элементов; в «Истории» — такая же сводка для каждой не идущей сессии, у которой есть задачи и чей элемент показан в «Истории» (как полоса хода у карточек истории образца), над самым верхним показанным элементом этой сессии, новые сверху; у не идущей сессии, чьих элементов в «Истории» нет из-за предела 300, сводки нет; номеров, названий и статусов требований нет. Проверка: tools/test/pixel-office-panels.test.js — последовательность событий двух сессий, одна из которых закончилась: элементы в своих разделах и в порядке «новые сверху», числа N, M, K и доля полосы N/M у сводки идущей сессии над «Текущими» и у сводки закончившейся — в «Истории», после нового события разделы и числа меняются; случай «больше 300» — 400 закончившихся сессий по одной задаче: в «Истории» показано 300 элементов, есть пометка «показано 300 из 400», сводок столько, сколько сессий среди показанных элементов (300), у сессии без показанного элемента сводки нет; случай возобновления — старт субагента с agent_id X в сессии A, затем старт с тем же X в сессии B, затем событие окончания этого субагента в сессии B: у сессии A задача не входит ни в M, ни в N, ни в K (при отсутствии других задач у A все три равны 0), у сессии B M = 1, N = 1 (задача «завершена»), K = 1; случай предела для чисел — одна закончившаяся сессия с 301 задачей: в «Истории» показано 300 элементов, а в сводке этой сессии M = 301"
      - "Страница похожа на образец (WF-04, шаги 3, 4 и 6): DESIGN-QA-VALIDATOR запускает отдельный экземпляр — `cd tools && npm run pixel-office -- --port <свободный порт> --dir <отдельная папка состояния вне проекта>`; в эту папку кладётся копия настоящего журнала владельца (сам журнал только читается); состояния, которых в копии нет, — роли с задачами в числе файлов .claude/agents/ на момент проверки, две «работающие» роли, облачко над персонажем — даются сочинёнными событиями, которые пишутся только в ту же отдельную папку, не в рабочий журнал владельца (R2); снимает страницу отдельно в двух окнах — 1920 × 1080 (Full HD) и 2560 × 1440 (2K) — и сравнивает каждый снимок по устройству и смыслу с docs/design/samples/office-2026-10-02.jpg и с описанием интерфейса REQ-007 (снимок 2K — ещё и со снимком Full HD: те же области, тот же порядок, те же элементы, размеры по правилу масштаба, критерий 17): те же области в том же порядке — шапка сверху, офис с легендой слева, журнал и панель задач справа; есть элементы критериев 9–15; вся страница — шапка, офис со всеми столами и легендой, журнал и панель задач — видна в каждом из двух окон без прокрутки страницы, все элементы легенды видны или достижимы прокруткой своей полосы, прокручиваются только списки внутри журнала и панели задач и, по критерию 18, холст внутри своей панели, если он при размере клетки критерия 18 не помещается (раскладка под FullHD — доработка с образца, адаптация под 2K — просьба владельца 2026-10-05); различия с образцом — только места «не переносится» и «в честной форме» из описания этого требования, а также уплотнение пустого пола по критерию 18(д) (число клеток меньше, состав комнат и столов и их взаимное расположение по смыслу те же), в том числе число и расстановка столов (критерий 1), и каждое названо в описании интерфейса с причиной; вердикт PASS — нет находок Critical и High; в handoff-е DESIGN-QA-VALIDATOR перечислены части обоих снимков, снятые на сочинённых событиях. Затем ORCH показывает владельцу снимки Full HD и 2K рядом с образцом, в отчёте прямо называет части снимка, снятые на сочинённых событиях, и записывает в тот же handoff дословный ответ владельца; ответ — подтверждение сходства (и того, что на 2K страница крупнее и читается). Проверка: `shasum -a 256 docs/design/samples/office-2026-10-02.jpg` — 148eda286845409ff8761ad90bcbd43b727593577dc50fdb4a05ed62b0f810d5; jq по result.verdict handoff-а DESIGN-QA-VALIDATOR в handoffs/PO-20261002-01/, по перечню частей снимка на сочинённых событиях в нём и по записанному в нём ответу владельца"
      - "Масштаб под Full HD и 2K (просьба владельца 2026-10-05; чистый CSS, без скрипта и атрибута style; «окно» — окно просмотра (viewport) в CSS-пикселях): (а) в tools/src/pixel-office/public/style.css размер корневого шрифта задан одним правилом для html по формуле S из описания (не меньше 16 px, не больше 24 px, от меньшей из величин ширина/1920 и высота/1080); (б) все размеры интерфейса — колонка, шапка, зазоры, отступы, шрифты, кнопки, легенда, карточки — в rem/em; в px остаются только линии толщиной 1–2 px, это правило корневого шрифта и пороги в @media; размеры холста, заданные атрибутами по решению D16, в этот перечень не входят: `grep -nE '[0-9.]+px' tools/src/pixel-office/public/style.css` — каждая найденная строка перечислена в handoff-е FRONTEND-DEV с причиной (линия 1–2 px, корневое правило, порог @media), остальных нет; (в) в окне 1920 × 1080 размер корневого шрифта 16 px, в окне 2560 × 1440 — 21,33 px, в окне 3840 × 2160 — 24 px, в окнах 2560 × 1080 (21:9), 1600 × 900 и 1000 × 700 — 16 px, в окне 2560 × 1600 (16:10) — 21,33 px (для каждого из этих значений — 16, 21,33 и 24 px — допуск 0,05 px); значения читаются в браузере DESIGN-QA-VALIDATOR (getComputedStyle корневого элемента) на отдельном экземпляре из критерия 16; (г) в окне 2560 × 1440 ширина правой колонки, высота шапки, зазоры между областями и размеры шрифтов журнала, задач, легенды и кнопок в 4/3 раза больше, чем в окне 1920 × 1080 (допуск 0,1 px); в 1920 × 1080 они равны значениям до правки (колонка 380 px, шапка 60 px, зазоры 14 px, шрифты 9,5–15 px — по прежнему style.css, который берётся любым из двух способов: `git show HEAD:tools/src/pixel-office/public/style.css` — пока правка style.css не закоммичена, — или по копии, которую FRONTEND-DEV кладёт вне проекта до первой правки и называет её sha256 в handoff-е), а в окнах 1600 × 900, 1000 × 700 и 500 × 800 совпадают с этими значениями (масштаб 1,0, раскладки 600–1239 и до 599 px прежние); (д) в окнах 1920 × 1080, 2560 × 1440, 2560 × 1600, 3440 × 1440 и 1920 × 1200 документ не прокручивается (scrollHeight и scrollWidth корневого элемента не больше размеров окна), все элементы легенды видны или достижимы прокруткой своей полосы (границы элемента внутри окна после прокрутки полосы), а ширина области офиса и размер клетки холста (наибольшее целое число пикселей, при котором страница влезает, но не меньше нижней границы критерия 18) в 2560 × 1440 не меньше, чем в 1920 × 1080; (е) масштаб не задаётся скриптом и атрибутом style: `grep -c 'style=' tools/src/pixel-office/public/index.html` — 0, а `grep -nE 'documentElement|setAttribute.*style' tools/src/pixel-office/public/*.js` не находит записи размера или стиля корневого элемента (каждая найденная строка перечислена с причиной); (ж) прежние проверки Full HD (критерии 1–16) проходят без ослабления: `cd tools && npm test` — код 0, «skipped 0» и «todo 0». Проверка: перечисленные команды; снимки и измерения DESIGN-QA-VALIDATOR (на отдельном экземпляре, окна и значения — по перечню выше), их вывод — в его handoff-е; `cd tools && node --test`"
      - "Читаемость на экранах владельца (просьба владельца 2026-10-06; «окно» — окно просмотра в CSS-пикселях, пороги — в CSS px, плотность пикселей их не меняет; сходство с образцом, критерий 16, не ослабляется: уплотнение пустого пола по пункту (д) расхождением с образцом не считается). Журнал проверки — основная сессия и 18 ролей, то есть 19 столов, как на снимке владельца docs/design/samples/office-owner-1470x784-2026-10-06.png (число столов — по его легенде и строке «ролей 18»); имена 18 ролей берутся из легенды этого снимка и записываются в тесте явным списком из 18 разных значений agent_type, а не читаются из файлов .claude/agents/ (порядок файлов в каталоге на результат не влияет); тот же список строит журнал DESIGN-QA-VALIDATOR в отдельной папке состояния. (а) Окна проверки: 1470 × 784 (MacBook 13 дюймов, снимок с плотностью 2), 1920 × 950 (монитор 25 дюймов Full HD с панелями браузера), 1920 × 1080, 2560 × 1440 и узкое 480 × 800. (б) Разборчивость при размере «по умолчанию» (без нажатия кнопок масштаба и без прокрутки холста) в каждом из первых четырёх окон: высота фигуры персонажа на холсте — от верха волос до низа тела — не меньше 20 CSS px и размер шрифта подписи роли на холсте не меньше 10 CSS px; при нынешнем рисунке (фигура — 18 из 24 единиц клетки, шрифт подписи — 9 из 24) это клетка не меньше 27 px (27·18/24 = 20,25; 27·9/24 = 10,1), но порог — высота и шрифт, а не клетка. Клетка по умолчанию при 19 столах: в 1470 × 784 — не меньше 27 px и без прокрутки холста (по расчёту: floor(602 / 22) = 27; 22 · 27 = 594 ≤ 602); в 1920 × 950 — не меньше 27 px и без прокрутки холста (по расчёту ≈ 34: floor(768 / 22)); в 1920 × 1080 — не меньше 27 px и не меньше, чем давала прежняя сетка 40 × 34 по тому же правилу (критерий 17(д)); в 2560 × 1440 — не меньше, чем в 1920 × 1080 (критерий 17(д)). Узкое окно 480 × 800: порог (б) не требуется, но страница не рассыпается — нет горизонтальной прокрутки страницы, все комнаты, столы и элементы пункта (г) достижимы. (в) Подпись роли — по-прежнему короткая подпись roleLabel (D13), полное имя — в легенде и в карточке агента (критерии 5 и 11); никакого нового сокращения не вводится, и размер шрифта порога (б) — это размер шрифта, а не ширина, до которой подпись сжимается по D13. (г) Без потери информации в каждом из пяти окон: остаются все комнаты неподвижной обстановки (критерий 12), все 19 столов и персонажей, легенда на 19 элементов, журнал, панель «Задачи», шапка. В окнах 1470 × 784, 1920 × 950, 1920 × 1080 и 2560 × 1440 страница не прокручивается (scrollHeight и scrollWidth корневого элемента не больше размеров окна, как в критерии 16 для 1920 × 1080), холст при 19 столах помещается в свою панель целиком (прокрутки холста нет), а шапка, легенда, журнал и панель «Задачи» — все элементы видны или достижимы прокруткой своей полосы: легенда — полоса высотой не больше двух строк (≈ 70 px) с прокруткой внутри неё, все 19 элементов достижимы; альтернативное размещение легенды допускается, если на 1470 × 784 под холст остаётся не меньше 594 px без прокрутки страницы. В узком окне 480 × 800 горизонтальной прокрутки страницы нет (scrollWidth корневого элемента не больше ширины окна), недоступное достижимо прокруткой страницы или своей панели. Запасной вариант: если в журнале больше 19 столов (например, 40), клетка не меньше 27 px, ничего не обрезается без возможности добраться до него — холст прокручивается внутри своей панели (или достижим кнопками масштаба, если описание интерфейса их выбрало), страница по-прежнему не прокручивается. (д) Уплотнение офиса — измеримо и проверяется числом клеток. buildLayout(19) возвращает сетку не больше 36 клеток по ширине и не больше 22 по высоте, считая все стены (до правки — 40 × 34). Остаются все три комнаты с подписями «ПЕРЕГОВОРНАЯ» (с доской), «КУХНЯ» и «СЕРВЕРНАЯ», все 19 столов с местами и клетками подхода, проходы, растения и книжные полки; взаимное расположение по смыслу — как на образце: порядок комнат и зоны столов тот же, что в раскладке buildLayout(19) до правки (40 × 34, ROOM_MAP, ROOM_LEFT = 23 и deskSpot в tools/src/pixel-office/public/layout.js на 2026-10-06; тест хранит этот порядок константами с датой 2026-10-06, а не читает его из кода после правки): зона столов (клетки столов, мест и подхода) левее всех трёх комнат (в раскладке до правки наибольший x клеток подхода 18 < ROOM_LEFT 23); переговорная выше (меньше y) серверной и кухни (до правки y 1–6 против 11–15); серверная левее кухни (до правки x 26–28 против 36–37); столы стоят колоннами (столы одной колонны — на одном x). Убирается только пустой пол между ними и у внешней стены, не несущий ни комнаты, ни стола, ни прохода, а внешняя стена обходит только занятую часть: первый и последний ряд и первая и последняя колонка сетки — стена. «Мёртвый» ряд или колонка — ряд или колонка внутри внешней стены, где каждая клетка — пустой пол (kind floor, без мебели, стола, места, растения, полки, стены и подписи). Мёртвых рядов и колонок нет в таком виде: две и более подряд идущие пустые строки или колонки не допускаются, а одиночная пустая строка или колонка допускается только между двумя непустыми как проход шириной в одну клетку (рядом с внешней стеной пустых рядов и колонок нет). Это два отдельных условия, проверяются каждое своим тестом и ни одно не засчитывается вместо другого: (1) предел размера сетки — не больше 36 × 22 — обеспечивает само уплотнение; (2) отсутствие мёртвых рядов и колонок — дополнительная защита от пустых полос, предел размера оно не заменяет. Размер клетки считается по всей сетке: холст равен числу клеток по ширине и высоте, умноженному на клетку. (е) Проверка. Браузер (DESIGN-QA-VALIDATOR, отдельный экземпляр по критерию 16, журнал из пункта «Журнал проверки» в отдельной папке состояния): в каждом из пяти окон — размер холста и число клеток по ширине и высоте, из них клетка; высота фигуры и размер шрифта подписи (основная проверка — расчёт по константам рисования, названным в проекте, в тесте: при клетке 27 высота фигуры 20,25 px и шрифт 10,125 px, запас 0,25 и 0,125 px; измерение в браузере — высота фигуры в пикселях снимка при плотности 1 между волосами и низом тела — подтверждающее, с допуском 0,5 px: измеренное значение не меньше порога − 0,5); scrollWidth и scrollHeight корневого элемента против размеров окна и холста против его панели; для каждого из 19 элементов легенды, заголовков «Журнал» и «Задачи» и шапки — границы в окне после прокрутки своей полосы; цифры записываются в handoff-е. Снимки при 1470 × 784 (плотность 2) и 1920 × 950 сохраняются в docs/design/samples/ как office-compact-1470x784-2026-10-06.png и office-compact-1920x950-2026-10-06.png и сравниваются с образцом по тем же областям и элементам, что в критерии 16; снимок при 1470 × 784 — ещё и со снимком владельца: что стало читаемым, чего нет — не пропало. Тесты npm run check (tools/test/pixel-office-layout.test.js и tools/test/pixel-office-office.test.js): buildLayout(19) — число клеток по ширине не больше 36 и по высоте не больше 22 (точные значения записаны в тесте), три подписанные комнаты, 19 столов, их взаимное расположение по (д), нет мёртвых рядов и колонок по определению (д) и первый и последний ряд и колонка — стена; функция расчёта клетки возвращает для любой области не меньше нижней границы 27 и для области не меньше 36·27 × 22·27 = 972 × 594 — клетку не меньше 27 при 19 столах без прокрутки холста; по вызовам рисования при этой клетке высота фигуры не меньше 20 и размер шрифта подписи (из значения font) не меньше 10 — у основной сессии и у роли; для журнала из 19 столов на холсте нарисованы все 19 столов и персонажей и все три подписанные комнаты; для журнала из 40 столов клетка не меньше 27 и холст прокручиваемый; `cd tools && npm test` — код 0, «skipped 0» и «todo 0»"
  - id: REQ-008
    title: Pixel Office, часть 3 — просмотр истории запроса владельца (исходное сообщение, как его понял оркестратор, кто что сделал, хронология) — по образцу владельца docs/design/samples/history-view-sample-2026-10-05.jpg
    owner: BACKEND-DEV   # данные — хук, сервер, журнал, команда записи «как понял» и обязанность ORCH — правка его роли (критерий 16) — это часть (а); окно просмотра делает FRONTEND-DEV — часть (б)
    status: in_progress   # ORCH 2026-10-06: статус done по правилу шапки невозможен, пока depends_on (REQ-001, REQ-007) не done, — работа по REQ-008 завершена и проверена, статус вернётся в done, когда зависимости закроются. 2026-10-06 (прогон PO-20261005-02, WF-02, шаг 10): RELEASE-VALIDATOR — PASS по критериям 1–19 (handoffs/PO-20261005-02/step-09-release-validator.json; cd tools && npm run check — 483 из 483, два прогона в его ходе); статус поставлен последним действием шага после этого PASS. Названные остатки — не критерии, REQ-008 не держат: (1) подтверждение владельцем сходства окна с образцом docs/design/samples/history-view-sample-2026-10-05.jpg (по устройству и смыслу сходно — снимки docs/design/samples/history-window-1920x1080-2026-10-06.png и history-window-2560x1440-2026-10-06.png; решение за владельцем); (2) настоящая сессия Claude Code с реальным сообщением (нужно согласие владельца на расход лимита). Не получены вживую: состояния «хранение отключено», «нет связи», «ошибка» (закрыты тестами), узкий экран (замер не делался). depends_on REQ-001 и REQ-007 пока in_progress (их остатки — выше в их блоках)
    depends_on: [REQ-001, REQ-007]   # событие UserPromptSubmit, журнал, путь записи с подписью, правила задач (критерий 6) и страница — REQ-001; окно открывается из панелей REQ-007; делается ПОСЛЕ адаптации страницы под 2K (прогон PO-20261005-01 — те же файлы страницы tools/src/pixel-office/public/)
    original_request: >
      «Оркестратор должен видеть сообщение и показывать как понял он мое сообщение. вот
      скриншот» (владелец, 2026-10-05, сообщение в сессии Claude Code со скриншотом;
      скриншот ORCH сохранил как docs/design/samples/history-view-sample-2026-10-05.jpg;
      слова — и в decisions/0011, раздел «Основание»).
    description: >
      Что получает владелец. По каждому своему запросу в Pixel Office открывается окно
      «Просмотр истории» (образец — скриншот владельца: окно из старого офиса другого
      проекта владельца; там данные были сидированные, здесь показывается только
      настоящее, планка R2). В окне, сверху вниз: заголовок; мета — когда начат, когда
      завершён, статус; «Исходный запрос» — текст сообщения владельца; «Как оркестратор
      понял» — то, что оркестратор записал о своём понимании; таблица «Кто работал и что
      сделал» — задача, агент, описание, итог; «Хронология» — время, кто, что.
      Только данные и действия; как окно выглядит — описание интерфейса (WF-04/WF-02,
      GUI-DESIGN-ANALYST), как устроен код — проект CODE-DESIGNER.

      Решение уже принято: decisions/0011-pixel-office-stores-owner-requests.md (2026-10-05)
      — Pixel Office хранит текст сообщений владельца и записи оркестратора «как понял»
      на условиях (а)–(е) этой записи. Оно меняет прежнюю границу decisions/0003 и 0007
      «тексты запросов и ответов не хранятся»; остальные границы 0003, 0005, 0007
      сохраняются и проверяются здесь же: один путь записи с подписью, текст из событий —
      всегда как текст, нет внешних адресов, только 127.0.0.1. Это требование
      расширяет критерии REQ-001 1(д) и UAT, 3, 4, 6(г), 13 и 14 (список полей строки журнала,
      «текст запроса не хранится», правило чтения source, строка основной сессии, README,
      закрепление tools/package.json): поправки уже внесены в их текст (доработка r1) как
      расширения, каждое со своей проверкой, ничего не ослаблено. Путей записи у сервера
      теперь два: прежний /api/events (хук, критерий 8 REQ-001 — для него без изменений) и
      новый /api/note (запись оркестратора, критерии 4–6 ниже); критерий 8 REQ-001
      («один путь записи, требует секрет») читается так: запись событий хука — один
      путь, запись оркестратора — другой путь с тем же секретом.

      Затрагиваются файлы (от корня Sai): tools/src/pixel-office/hook.js (+ hook.sh не
      меняется по смыслу), protocol.js, server.js, journal.js, config.js, страница —
      tools/src/pixel-office/public/ (panels.js, app.js, model.js, index.html, style.css,
      texts.js), tools/src/cli.js или отдельный файл команды в tools/src/, tools/package.json
      (npm-скрипт pixel-office-note), tools/README.md (раздел «## Pixel Office»), тесты
      tools/test/pixel-office-*.test.js, роль .claude/agents/orchestrator.md. Не
      затрагиваются: docs/design/REQ-001-pixel-office.md (его правит CODE-DESIGNER
      прогона PO-20261005-01; проект для этого требования — отдельный документ или
      раздел, который писать после того прогона), ключ записи и порт (прежние).

      Что хранится. Из события UserPromptSubmit в строку журнала добавляются поля
      prompt_kind («owner» — сообщение владельца; «service» — служебное), для «owner» —
      prompt_text (текст после маскирования и обрезки) и, если текст обрезан,
      prompt_truncated: true. Служебным считается сообщение, которое начинается с
      `<system-reminder>`, `[SYSTEM NOTIFICATION`, `<task-notification`, `Another Claude
      session` или `This session is being continued`; у него prompt_text нет. Маскирование
      до записи: вероятные секреты заменяются меткой «[скрыто]»; предел — 4 000 знаков.
      Запись оркестратора — отдельная строка журнала: source «ORCH», время с часов в
      момент записи, note_text (до 2 000 знаков, после того же маскирования), по желанию
      req_id (вида REQ-NNN), session_id и request_time (время запроса владельца, к которому
      относится запись, как оно записано в журнале); если request_time не задан, сервер сам
      привязывает запись к последнему сообщению владельца (критерий 11) и ставит
      request_time_auto: true. Запись идёт отдельным путём сервера /api/note: он принимает
      только note_text, req_id, request_time, session_id и сам ставит source ORCH и время;
      путь хука /api/events по-прежнему отвечает 400 на любой source и на любое поле вне
      списка хука (критерии 4 и 6). Оба пути подписаны тем же HMAC-секретом и дают те же 401,
      403, 405 и 413. Окно запроса — от сообщения
      владельца до следующего сообщения владельца той же сессии (служебные сообщения
      границ не ставят). Запись «как понял» относится к запросу, чьё время указано в
      request_time; без него сервер находит последнее на момент записи сообщение владельца
      (не служебное) — по session_id записи, если он дан, иначе по всему журналу — и ставит
      его время сам; если такого нет — запись остаётся в журнале и ни к какому окну не
      относится. В окне показывается последняя запись ORCH этого запроса.

      Имена полей, пути и переменной (prompt_kind, prompt_text, prompt_truncated, note_text,
      req_id, request_time, request_time_auto, /api/note, SAI_PIXEL_OFFICE_STORE_TEXT, pixel-office-note) — перевод
      аналитика, не слова владельца; CODE-DESIGNER может заменить их, одновременно
      заменив их в тестах критериев. Предел 4 000 и 2 000 знаков и метка «[скрыто]» —
      из decisions/0011 (предел записки 2 000 — из задания ORCH).

      Остаточный риск, названный прямо: маскирование (критерий 7: набор правил, один на двух
      линиях — сервер на обоих путях записи и хук до отправки) распознаёт вероятные секреты,
      а не все; не распознаётся секрет в произвольной форме с пробелами и секрет словами; секрет в необычной форме может попасть в локальный журнал (только на
      компьютере владельца, права 0600). Это принято решением 0011 и повторяется в
      отчёте владельцу.

      Вне области: хранение ответов модели, входов и выходов инструментов и сообщений
      агентов (хранить нельзя — граница 0011); отправка текста наружу; полнотекстовый
      поиск; редактирование и удаление записей; номера требований, выведенные из событий
      хуков без записи ORCH; другие сессии, кроме сообщений владельца. Критерии Q4–Q6,
      Q8–Q11 к этому требованию не применяются как отдельные пункты, кроме тех, что
      названы в критериях (Q4 — одна команда проверки; Q8 нет магазинов, Q9–Q11 нет
      внешних сервисов, фото и адресов от пользователя).

      Размер (AP-016) и порядок поставки: один блок, две части. (а) Данные и обязанность
      ORCH — критерии 1–8, 14–19 (хук, сервер, журнал, команда, маскирование, Q10, роль ORCH,
      README и проверка); (б) страница — критерии 9–13 (окно просмотра, после адаптации под
      2K). Сначала поставляется (а) и проходит ворота, потом (б), которая читает данные из
      (а); статус требования done — только когда готовы обе части.
    acceptance_criteria:
      - "Хук добавляет текст сообщения владельца. Тест tools/test/pixel-office-hook.test.js запускает hook.js с входом UserPromptSubmit, где prompt — обычный текст «сделай X»: строка журнала содержит prompt_kind = «owner» и prompt_text = «сделай X»; со входом, где prompt длиннее 4 000 знаков: prompt_text не длиннее 4 000 знаков (плюс метка «обрезано» не входит в предел, она в prompt_truncated: true), prompt_truncated = true; для входа ровно 4 000 знаков prompt_truncated нет. Прочие события (кроме UserPromptSubmit) не получают ни одного из новых полей; разрешённый список остальных полей строки (критерий 3 REQ-001) не расширяется: тест сравнивает ключи строк всех видов событий с перечнем и падает на любом лишнем ключе, кроме названных новых полей"
      - "Служебные сообщения без текста. Тест подаёт в hook.js по одному входу UserPromptSubmit с prompt, начинающимся с каждой из пяти меток из description («<system-reminder>», «[SYSTEM NOTIFICATION», «<task-notification», «Another Claude session», «This session is being continued»): в строке prompt_kind = «service», поля prompt_text нет, и ни одна подстрока такого prompt (кроме метки вида — если она не записывается, то никакая) в events.jsonl не встречается: `grep -c` по файлу журнала для уникальной подстроки из тела сообщения — 0. Сообщение владельца, у которого метка стоит не в начале («сделай <system-reminder>»), остаётся «owner»"
      - "hook.js по-прежнему тихий и быстрый (Q10): тест запускает hook.js с входами критериев 1–2 и 4: stdout пуст, stderr пуст, код выхода 0, время работы при запущенном сервере и при остановленном — в пределах, установленных критерием 10 REQ-001 (тот же тест, расширенный новыми входами); при остановленном сервере строка не пишется нигде, кроме прежнего места, и текст сообщения не попадает ни в stdout, ни в stderr, ни в файл вне каталога состояния (тест ищет подстроку теста во всех файлах временного каталога и каталога состояния, кроме events.jsonl)"
      - "Путь записи хука — прежний /api/events — проверяет новые поля и отклоняет лишнее. Тест tools/test/pixel-office-server.test.js отправляет на него подписанные запросы и ждёт: prompt_text не строка, длиннее 4 000 знаков, у события не UserPromptSubmit, у prompt_kind = «service» — 400, у prompt_kind вне «owner»/«service» — 400; любое поле вне списка хука (критерий 3 REQ-001 с тремя полями) — 400, в том числе note_text, req_id, request_time, session_id как поле записи оркестратора и поле source с любым значением (в том числе «ORCH» и «REAL») — 400; после каждого отказа sha256 events.jsonl и число его строк не изменились (проверка неизменного состояния). Корректный запрос — 204: это прежнее поведение /api/events (REQ-001 не меняется; число 204 — в tools/src/pixel-office/server.js, `sendEmpty(res, 204)`, и в tools/test/pixel-office-server.test.js, а не в тексте блока REQ-001); 200 — только у /api/note, критерий 5, строка добавлена с временем и source = REAL, поставленными сервером; запрос, в теле которого есть source или время, — 400 как прежде (критерий 4 REQ-001). Отдельный тест: запрос на /api/events с телом, годным для /api/note, — 400 и журнал без изменений, то есть путь хука не может записать строку source ORCH"
      - "Запись оркестратора «как понял» — команда, путь /api/note. Из каталога tools: `npm run pixel-office-note -- --help` печатает использование и завершается кодом 0; `npm run pixel-office-note -- --text \"текст понимания\" --req REQ-008` (форма вызова одна, везде: `pixel-office-note --text \"<текст>\" [--req REQ-NNN]`; текст задаётся только опцией --text, до 2 000 знаков, позиционного текста нет — тест вызывает команду с текстом без --text: код выхода не 0, запрос не отправлен, журнал не изменён; --req, --session и --request-time необязательны; ORCH --session не передаёт, критерий 16) при запущенном сервере: код выхода 0, в журнал добавлена одна строка с source = ORCH, note_text, req_id = REQ-008, время с часов в момент записи (критерий 2 REQ-001), request_time (привязка — критерий 11) и без каких-либо других ключей, кроме session_id (только если --session передан) и request_time_auto (при привязке сервером); успех записи оркестратора — ответ 200 (не 204: 204 — успех /api/events); команда подписывает тело HMAC-секретом из каталога состояния и пишет на путь /api/note, который не равен пути хука (тест перехватывает запросы к серверу: ровно один запрос на запись, путь /api/note, ни одного запроса на /api/events). Тест tools/test/pixel-office-server.test.js. Секрет: он не принимается ни в аргументах, ни в переменных окружения команды (в --help и в разборе аргументов такого параметра нет; тест передаёт --secret и получает отказ с кодом выхода не 0 и без записи) и не печатается — содержимое файла write-secret не встречается ни в stdout, ни в stderr (тест ищет значение секрета в выводе)"
      - "Отказы на пути записи оркестратора /api/note и его отличие от пути хука. Тест на сервере: запрос без заголовка подписи или с неверной подписью — 401; с чужим Host — 403 (до чтения тела); метод не POST — 405 с Allow; тело больше предела BODY_MAX — 413; поле вне note_text, req_id, request_time, session_id — 400, в том числе source (с любым значением) и поля хука (prompt_kind, prompt_text, prompt_truncated, hook_event_name, agent_id и прочие); note_text длиннее 2 000 знаков или не строка — 400; пустой note_text — 400; req_id не по виду REQ-NNN (например «REQ-8», «../x») — 400; request_time не времени или времени из будущего больше чем на 60 секунд от часов — 400; session_id не строка или длиннее 200 знаков — 400; после каждого отказа sha256 events.jsonl не изменился. Принятая запись: 200 (у /api/events успех — 204, критерий 4), source = ORCH и время поставил сервер (в теле их нет), строка не помечается как событие хука. Те же коды 401/403/405/413 даёт и /api/events (тест на обоих путях одной таблицей); любой путь, кроме /api/events и /api/note, на запись — 404 или 405 и ничего не пишет, список путей и методов в тесте сравнивается с этим перечнем. Команда при остановленном сервере: код выхода не 0, сообщение «сервер не запущен» в stderr, журнал не создан и не изменён"
      - "Маскирование секретов — до записи в журнал, для сообщений и для записей ORCH, на двух линиях: сервер маскирует на обоих путях записи (/api/events и /api/note) — это обязательная линия, потому что она единая; хук маскирует до отправки — вторая линия, и текст из хука не должен выходить из процесса в открытом виде. Набор правил: ключи sk-, sk-ant-, sk-proj- (с дефисами и подчёркиваниями в хвосте); ghp_, gho_, ghs_, github_pat_; AKIA и ASIA с 16 знаками; JWT (три части base64url через точку); PEM-блоки (от -----BEGIN до -----END, и обрезанный блок без END — до конца текста); URL вида схема://пользователь:пароль@хост; заголовки Authorization и Bearer; пары `имя=значение` и `имя: значение` для token, secret, password, passwd, api_key, apikey, authorization (имя в любом регистре, значение — до пробела или кавычки); длинные случайные строки — токен, то есть непрерывный отрезок знаков из [A-Za-z0-9_+=-] длиной 32 и более, ограниченный с обеих сторон пробелом, кавычкой, скобкой, знаком препинания, началом или концом текста, но не знаком «/» или «.» (отрезок, у которого с любой стороны вплотную «/» или «.» — часть пути, адреса или имени файла, — этим правилом не маскируется; точка или запятая в самом конце, как знак препинания, границей служит), в котором есть строчная буква и хотя бы одна цифра или прописная буква (то есть два из трёх классов — строчные, прописные, цифры — и строчные среди них; слово из одних строчных, одни цифры и шестнадцатеричная строка из прописных букв и цифр этим правилом не маскируются). Примеры теста: путь docs/design/samples/history-view-sample-2026-10-05 и начало пути tools/src/pixel-office/public/panels.js НЕ маскируются; строка Zm9vYmFyMTIzNDU2Nzg5MGFiY2RlZmdoaWprbG1ub3A= маскируется; 40 строчных букв подряд (слово без цифр и без прописных) НЕ маскируются; строка из 40 знаков с цифрами и строчными без «/» и «.» маскируется; она же внутри пути (с «/» вплотную) не маскируется. Тест (tools/test/pixel-office-hook.test.js и -server.test.js): на каждое правило — пример, который хук присылает уже замаскированным (перехват тела запроса), и тот же пример в открытом виде, отправленный на оба пути сервера напрямую, — в events.jsonl нет значения секрета (`grep -F` значения — код 1), на его месте «[скрыто]», остальной текст сохранён. Обычный текст, числа, пути, номера требований вида «REQ-008» и хеши короче 32 знаков не портятся. Секрет на границе 4 000 знаков не оставляет в журнале ни одной части длиной 8 знаков и более (маскирование до обрезки). Остаточный риск — не распознаётся секрет в произвольной форме с пробелами, секрет словами («пароль — имя кота и год»), секрет base64 со знаком «/» или «.» (длинное правило их не берёт — только специальные правила выше) и секрет из одних прописных букв и цифр — тест это фиксирует как известный непокрытый случай и README называет его (критерий 15)"
      - "Отключение хранения текста. Тест запускает hook.js и сервер с SAI_PIXEL_OFFICE_STORE_TEXT=0: в строке UserPromptSubmit нет prompt_text, остаётся prompt_kind и время (задачи и журнал работают как раньше); команда `pixel-office-note --text \"<текст>\"` при том же значении переменной — код выхода 0 (отключение хранения — не сбой: и хук, и команда завершаются с кодом 0; код 1 команда даёт только при недоступном сервере и неверном ответе, критерии 6 и 17), запись source ORCH с note_text не создаётся, команда печатает в stderr «хранение текста отключено»; сервер при этой переменной отвергает запись с prompt_text или note_text (400). Страница при такой строке показывает в окне запроса «текст не сохраняется» вместо раздела «Исходный запрос» (тест страницы на фикстуре без prompt_text)"
      - "Страница показывает только настоящее (R2). Тест tools/test/pixel-office-page.test.js (или -panels.test.js) на копии страницы без сети: у запроса, события которого есть в журнале, окно «Просмотр истории» собирается только из строк журнала; журнал пуст — окно открыть не на чем (запросов нет), ничего не показывается из примера владельца: поиск по public/ — ни заголовка, ни номера, ни текстов запроса, понимания, задачи и хронологии со скриншота образца (тест берёт строки из docs/design/samples/history-view-sample-2026-10-05.jpg, переписанные в тест как список запрещённых фраз; в список не входит название другого проекта, видное на скриншоте [образец] — оно не переписывается ни в тест, ни в требование, ни в код. Проверка списка фраз — тест-grep по public/. Проверка названия — по существу, а не готовой командой (команда содержала бы само название): REQ-VALIDATOR и TEST-DESIGN-VALIDATOR открывают скриншот, читают название и одноразовой командой у себя, не записывая название в файлы, убеждаются, что его нет в блоке REQ-008 (блок выбирается `awk '/^  - id: REQ-008$/{f=1} f&&/^  - id: /&&!/REQ-008$/{exit} f' docs/requirements.yaml`), во всём tools/ и в public/ — результат 0 вхождений; остальные блоки docs/requirements.yaml (REQ-001, REQ-007 ссылаются на эталон) в проверку не входят) и никакого заранее записанного текста запроса или понимания (тест грепает public/ и берёт данные только из фикстуры журнала). Запись ORCH в окне подписана «Оркестратор записал» и отличается от событий хуков; ни одна запись ORCH не выдаётся за событие хука и не меняет задачи, их состояния и офис (тест: при добавлении записи ORCH список задач и состояния персонажей по критерию 6 REQ-001 те же, что до неё)"
      - "Открытие окна и его разделы. Тест страницы на фикстуре журнала (одно сообщение владельца, в окне — две задачи субагентов, одна ещё не окончена, одна запись ORCH, одно служебное сообщение): запрос владельца виден в списке задач и в журнале и открывается окном «Просмотр истории»; служебное сообщение окном не открывается и подписано «служебное сообщение»; в окне, в порядке сверху вниз, разделы: «Просмотр истории» (метка), заголовок, мета, «Исходный запрос», «Как оркестратор понял», «Кто работал и что сделал», «Хронология». Заголовок — первая строка сообщения (до 120 знаков), а если запись ORCH задаёт req_id — «REQ-NNN — » и первая строка записи. Мета — когда начат (время сообщения), когда завершён (время последнего Stop основной сессии в окне; нет — «окончание не записано» или «в работе», по правилам критерия 6 REQ-001) и статус. «Исходный запрос» — текст сообщения, абзацы (пустые строки) сохранены. Таблица — столбцы «Задача», «Агент», «Что делал», «Итог»: строки — задачи, начатые в окне запроса, состояние каждой — по критерию 6 REQ-001 (в работе, завершена, окончание не записано), «Итог» — только то, что есть в событиях (состояние задачи; текста ответа агента нет — он не хранится), пустое поле не заполняется выдуманным. «Хронология» — события окна: время (с часов события), кто (роль или «Оркестратор»), что (вид события); записи ORCH — с подписью «Оркестратор записал» и текстом записи"
      - "«Как оркестратор понял» — честно. Тест страницы: у запроса с несколькими записями ORCH (разное время, один request_time) показывается последняя по времени записи, а более ранние остаются в «Хронологии»; у запроса без записи ORCH раздел показывает «оркестратор не записал, как понял» и пустого блока или придуманного текста нет; запись, у которой request_time совпадает с запросом из другой сессии, относится к тому запросу, чьё время указано; запись без request_time привязывается автоматически (тест на сервере): сервер сам находит последнее не служебное сообщение владельца в журнале — по session_id записи, если он дан, иначе по всему журналу, и пишет его время в request_time с request_time_auto = true; при отсутствии такого сообщения request_time нет, запись ни к какому окну не относится; страница подписывает такую запись «привязано автоматически», а запись с явным request_time этой подписи не получает (тест страницы). Границы окна: сообщение владельца той же сессии открывает следующее окно, сообщения других сессий и служебные — нет; события, начатые до первого сообщения сессии в журнале, в окно не входят"
      - "Текст — всегда как текст, а не разметка (граница 0003). Тест страницы подаёт сообщение с `<script>window.__x=1</script>`, `<img src=x onerror=...>` и `&lt;b&gt;`: в окне это видно как буквальный текст, `window.__x` не задан, в DOM окна нет созданных элементов script/img из текста; страница по-прежнему не использует innerHTML, outerHTML, insertAdjacentHTML, document.write и eval для этого текста (`grep -nE` по tools/src/pixel-office/public/*.js — прежний результат, критерий 13 REQ-007 о том же), атрибут style у страницы не используется, адресов внешних ресурсов (кроме 127.0.0.1) в public/ нет"
      - "Окно управляется клавиатурой и кнопкой. Тест страницы (браузерный тест, прежний способ проверки страницы REQ-007) открывает окно: оно закрывается кнопкой «Закрыть» и клавишей Esc; после закрытия фокус возвращается на элемент, из которого окно открыли; пока окно открыто, фокус не уходит на страницу под ним (Tab по кругу внутри окна); окно доступно с клавиатуры (открывается Enter с фокуса на запросе); на размерах окна браузера 1920 × 1080 и 2560 × 1440 (адаптация под 2K — прогон PO-20261005-01) окно целиком видно, у содержимого есть своя прокрутка внутри окна, а не страницы, горизонтальной прокрутки нет. Проверка в два места: (i) измерение в браузере на этих двух размерах (снимки и размеры элементов) — WF-02, шаг 7, DESIGN-QA-VALIDATOR; (ii) тест контракта CSS в `cd tools && npm run check` (в проекте docs/design/REQ-008-history.md он назван PN-22; имя теста — как в проекте) — правила окна, дающие внутреннюю прокрутку и отсутствие горизонтальной; критерий закрыт, когда пройдены оба"
      - "Права и расположение файлов, прежние границы сохранены (Q7, R3). Тест: после записей критериев 1 и 5 events.jsonl и write-secret имеют права 0600, каталог ~/.sai-pixel-office/ — 0700 (`stat`), файлов в каталоге состояния — только STATE_FILES из config.js (новых файлов для текстов нет); сервер слушает только 127.0.0.1 и отвечает 403 на чужой Host (критерий 9 REQ-001, тесты проходят; их перечень, изменённый по decisions/0011 — ниже, остальные без изменений); у сервера два пути записи, /api/events и /api/note (список путей и методов в тесте сравнивается с этим перечнем, критерий 6) и нет ни одного исходящего запроса (`grep -nE \"https?\\.request|fetch\\(|net\\.connect\" tools/src/pixel-office/server.js` — пусто, код 1, как до работы); ни текст сообщений, ни записей ORCH не попадает в stdout сервера, в консоль страницы и в имена файлов (тест ищет уникальную подстроку в выводе сервера, собранном за прогон теста). Изменяются по decisions/0011 только эти тесты REQ-001, каждое изменение — расширение: tools/test/pixel-office-hook.test.js (ключи строк UserPromptSubmit — три новых поля, критерий 3 REQ-001; тест «prompt не хранится» теперь «prompt не хранится как ключ, текст — в prompt_text»), tools/test/pixel-office-server.test.js (список путей записи — два пути; ключи строки source ORCH; отказ source на /api/events остаётся), tools/test/pixel-office-page.test.js (правило чтения: строки source ORCH не помечаются «не из хуков»; строка основной сессии без текста запроса остаётся), tools/test/pixel-office-settings.test.js — при необходимости только если он сравнивает список полей или путей; прочие тесты проходят без изменений, число прежних тестов не уменьшилось и ни одна проверка не удалена и не ослаблена (сравнение имён и числа проверок до и после — вывод `node --test` с числом тестов и diff по git, приложены TEST-RUNNER)"
      - "tools/README.md, раздел «## Pixel Office», описывает: что теперь хранится (текст сообщений владельца, записи ORCH — по decisions/0011) и что нет; как отключить хранение (SAI_PIXEL_OFFICE_STORE_TEXT=0); команду `npm run pixel-office-note` с примером в единой форме `pixel-office-note --text \"<текст>\" [--req REQ-NNN]` (текст — опцией --text); остаточный риск необнаруженного секрета с названными примерами (что не распознаётся: секрет в произвольной форме с пробелами, секрет словами; что распознаётся — набор правил критерия 7 одним перечнем); подраздел «### Хранение текста»; два пути записи и что оба подписаны и только на 127.0.0.1; как стереть историю (удалить ~/.sai-pixel-office/events.jsonl при остановленном сервере). Проверка: `grep -nF` в tools/README.md каждой из строк «pixel-office-note», «--text», «SAI_PIXEL_OFFICE_STORE_TEXT», «0011», «### Хранение текста», «остаточный риск», «[скрыто]», «/api/note», «--session», «и у сервера, и у Claude Code (в обоих местах)» — не меньше 1 строки на каждую; в README сказано, что без --session привязка идёт по последнему сообщению владельца во всём журнале и при двух параллельных сессиях может попасть на чужое сообщение, а ORCH --session не передаёт (не видит свой session_id), так что этот риск принят (`grep -nF \"без --session\" tools/README.md` — не меньше 1 строки), и строка «переменную SAI_PIXEL_OFFICE_STORE_TEXT задавать и у сервера, и у Claude Code (в обоих местах)» с пояснением: если хранение выключено только у сервера, а хук Claude Code всё ещё шлёт prompt_text, сервер отвечает 400 и событие теряется целиком (известный риск критерия 8), и что секрет base64 со знаком «/» или «.» длинным правилом маскирования не распознаётся; разделы README не потеряны (`grep -c '^## ' tools/README.md` не меньше прежнего). И одна команда проверки (Q4): `cd tools && npm run check` проходит — prettier --check, eslint и все тесты, новые файлы под prettier и eslint (не в списке исключений), число прежних тестов не уменьшилось"
      - "Обязанность ORCH — запись «как понял» (проверяется содержимым роли, а не кодом страницы; код не обязывает оркестратора, поэтому честная проверка — текст роли и разбор его работы). В .claude/agents/orchestrator.md есть пункт: на каждое сообщение владельца, с которого начинается работа, до раздачи агентам ORCH записывает «как понял» командой `cd tools && npm run pixel-office-note -- ...` (`pixel-office-note --text \"<текст>\" [--req REQ-NNN]`, текст — опцией --text; --req — когда номер требования известен; --session и --request-time необязательны, ORCH --session не передаёт, потому что не видит свой session_id: без них сервер сам привязывает запись к последнему сообщению владельца, критерий 11, request_time_auto), и что если сервер не запущен, команда не удалась или хранение отключено — ORCH не придумывает запись и называет это в отчёте владельцу; ORCH не вписывает в запись секреты и персональные данные из сообщения. Проверка (команда в роли стоит в обратных кавычках или в блоке кода, пояснения — вне кавычек команды или в других строках): `grep -nE \"pixel-office-note\" .claude/agents/orchestrator.md` — не пусто; `grep -nE \"до раздачи|до запуска агентов\" .claude/agents/orchestrator.md` — не пусто; `grep -nE 'pixel-office-note[^`]*--text' .claude/agents/orchestrator.md` — не пусто (строка команды содержит --text); запрет --session — по тексту самой команды, а не по строке с её именем: `grep -oE 'pixel-office-note[^`]*' .claude/agents/orchestrator.md | grep -c -e '--session'` — 0 (код выхода grep -c 1), то есть в команде, от слова pixel-office-note до закрывающей кавычки или конца строки, --session нет, а пояснение «--session не передаётся» рядом, после закрывающей обратной кавычки, проверку не ломает (проверено на примере: строка с командой без --session и пояснением после кавычки даёт 0; строка с --session внутри кавычек даёт 1) (REQ-VALIDATOR и REVIEWER читают пункт и подтверждают, что он говорит именно это); роль не просит ничего вне decisions/0011. Что оркестратор записывает на каждое сообщение фактически, код не проверяет — это проверка роли, а не страницы; раздел «Как оркестратор понял» честно показывает отсутствие записи (критерий 11)"
      - "Q10 — команда pixel-office-note не виснет и не раскрывает секрет. Тест tools/test/pixel-office-server.test.js: (а) соединение и ответ — по 3 секунды: поддельный сервер, принимающий соединение и молчащий, — команда завершается с кодом 1 не позже чем за 3,5 секунды, в stderr сообщение «сервер не ответил за 3 с» и нет значения секрета и текста записи; сервер, не принимающий соединение (порт закрыт) — код 1 за те же 3,5 секунды; (б) поддельный сервер отвечает 401, 403, 413 и 500 (по одному прогону на код): команда завершается с кодом 1, в stderr — короткая причина по коду («подпись не принята», «адрес отклонён», «запись слишком велика», «ошибка сервера»), нет ни значения секрета, ни значения подписи, ни тела запроса, ни note_text (тест ищет их в stdout и stderr — 0 вхождений), журнал не меняется; (в) при включённом хранении код выхода 0 — только при ответе 200 от /api/note; ответ 204 команда за успех не считает (204 — успех /api/events, команда на него не ходит); при отключённом хранении (критерий 8) код выхода 0 без всякого запроса — это не сбой и не противоречие: ответа /api/note в этом случае нет, и тест проверяет, что запрос не отправлен"
      - "Q10 — хук не виснет на огромном вводе. Тест tools/test/pixel-office-hook.test.js: из входа prompt берётся и обрабатывается не более 64 КБ (остаток отбрасывается до маскирования, и prompt_truncated = true), маскирование и обрезка укладываются в жёсткий выход хука 1,5 секунды (HOOK_HARD_EXIT_MS); входы: prompt 5 МБ из обычного текста, 5 МБ одного знака без пробелов, патологическая строка (повторы `sk-` и `a=` на 1 МБ, длинные цепочки знаков из правила «длинные случайные строки», незакрытый PEM-заголовок на 1 МБ) — на каждом хук завершается за 2 секунды с кодом выхода 0, stdout и stderr пусты, в журнал попадает усечённый замаскированный текст или ничего (в строке нет prompt_text, остальные поля на месте), хук не зависает; правила маскирования выполняются за время, линейное по длине (тест на 64 КБ патологического текста не медленнее 200 мс в самом маскировании)"
      - "Команда pixel-office-note соединяется только с локальным сервером. Тест tools/test/pixel-office-server.test.js: адрес берётся только как 127.0.0.1 и порт из файла port в каталоге состояния (так же читает порт хук, критерий 10 REQ-001), в команде нет параметра адреса или порта (--host, --port, --url в разборе аргументов нет; тест передаёт каждый из них — отказ, код выхода не 0, запрос не отправлен); при файле port с нечисловым содержимым или портом вне 1–65535 — код 1 без запроса; подмена переменной окружения адреса (HTTP_PROXY, NODE_OPTIONS не используются) не меняет адрес: перехват сокетов в тесте видит только 127.0.0.1; `grep -nE \"https?://[^1l]|0[.]0[.]0[.]0|localhost\" tools/src/pixel-office/<файл команды>` — только 1 (код 1: ни внешнего адреса, ни имени)"

  - id: REQ-009
    title: Sai Team, часть 1 — ядро проекта — состояние, журнал событий как единственный источник правды, хранение, восстановление, чтение, каталог ролей и человеческий язык событий (без интерфейса)
    owner: BACKEND-DEV
    status: in_progress   # прогон PROD-20261006-01 (2026-10-06): ядро построено и принято по всем критериям, проверяемым без настоящего Claude (789 тестов, повторные ворота безопасности, ревью и тестов, мутанты, пробы гонки, чистая копия); остаток — depends_on REQ-002 ещё in_progress, done невозможен (шапка файла)
    depends_on: [REQ-002]   # tools/ и одна команда проверки cd tools && npm run check (decisions/0002); REQ-002 сейчас in_progress (2026-10-01 добавлен критерий 11, ISS-0002), и пока он снова не done, REQ-009 не может стать done — как у REQ-001
    original_request: >
      «Твоя задача — ДОВЕСТИ ПРОДУКТ ДО РАБОЧЕГО СОСТОЯНИЯ.»; «Главный ориентир:
      максимально автономная виртуальная команда + предельно простой UX для бизнеса +
      Pixel Office как живое зеркало реальной работы + качество продукта не хуже
      [образца], а в ключевых сценариях лучше.»; «Главная задача этой сессии — получить
      максимально большой РЕАЛЬНЫЙ прирост готовности продукта, а не максимально
      подробный отчёт о том, что когда-нибудь нужно сделать.»; «Не подменяй реальную
      интеграцию mock-данными. Не подменяй работающую автономность визуальной
      имитацией.»; «Запрещено создавать красивый интерфейс, за которым нет реальной
      системы. Не создавай: случайные статусы; фиктивные проценты; fake agent activity;
      имитацию работы; декоративные task updates; захардкоженные сценарии для демо.»
      (владелец, 2026-10-06, сообщение в сессии Claude Code; дословные куски переданы
      ORCH в задании прогона PROD-20261006-01, шаги 02a и 02a-r1; название чужого
      проекта заменено ORCH на «[образец]»; полного текста сообщения в файлах Sai нет).
    description: >
      Что получает владелец. Первый кусок «реальной системы» из видения владельца:
      проект с целью, задачами и памятью, который живёт в файлах на его компьютере,
      переживает аварийную остановку и читается одной правдой — журналом событий, и
      каталог ролей виртуальной команды с человеческими названиями. Это ядро, на котором
      стоят исполнители (REQ-010) и движок (REQ-013); интерфейса здесь нет. Следующие
      требования, которые здесь только называются и критериев которых здесь нет
      (номера REQ-011 и REQ-012 зарезервированы за ними, блоков у них пока нет, и
      другим требованиям эти номера не отдаются; REQ-013 — движок): REQ-011 «бизнес-интерфейс: чат, проект, задачи, результаты» и REQ-012 «Pixel
      Office как зеркало состояния проекта на человеческом языке». Анализ, на котором
      стоит требование: docs/product/current-state.md (готовность около 10 %: нет
      движка, проектов, задач, чата) и docs/product/parity-matrix.md (раздел 6 —
      вертикальный срез, пункты 1–2: хранение проекта и журнал событий).

      Основание для кода (критерий 1). Слова владельца «Твоя задача — ДОВЕСТИ ПРОДУКТ
      ДО РАБОЧЕГО СОСТОЯНИЯ.» (2026-10-06) ORCH принимает как решение о старте
      разработки продукта Sai Team. До кода должны быть: запись этого решения в
      STATE.md (раздел «Решение владельца о старте») и запись decisions/0015 (её
      поручает ORCH роли DOC-UPDATER), которая для кода tools/src/team/ принимает стек и
      команду проверки по Q4 вместо зарезервированной 0001: Node 22, без зависимостей
      во время выполнения, как decisions/0002 и 0003, команда проверки
      `cd tools && npm run check` (в неё входит `npm test`), и записывает решения ORCH
      D-A…D-F, на которых стоят REQ-009, REQ-010 и REQ-013.

      Проект: цель (текст пользователя), статус (создан; планирование; в работе; на
      паузе; ждёт решения пользователя; остановлен; выполнен; не удалось), потолок
      стоимости в долларах США (budget_usd — число не меньше 0; 0 значит «потолка нет»:
      ядро хранит такое значение и создаёт проект с потолком 0 по API, а реальный запуск
      без потолка запрещает исполнитель REQ-010), исполнитель (executor — его значения
      задаёт REQ-010), память проекта — факты, решения, файлы, результаты. Задача: роль (из
      каталога ролей этого требования, критерий 10), описание, критерий готовности,
      depends_on (задачи того же проекта), статус (ждёт; в работе; на проверке; готово;
      не удалось; ждёт решения пользователя; прервана), число попыток, результаты-файлы.
      Внутренние коды статусов и полей задаёт проект CODE-DESIGNER
      (docs/design/REQ-009-*.md); критерии ниже проверяют смысл, а не написание кода.

      Событие — строка журнала проекта: время (с часов, ISO 8601 UTC), проект, задача
      (или пусто), источник — ENGINE, AGENT или USER, тип, данные. Журнал только
      дописывается и — единственный источник правды: состояние проекта и задач
      выводится воспроизведением событий по порядку; любой другой файл с состоянием
      (если проект его заведёт для скорости) — только производный, его удаление не
      меняет состояния. Сообщения пользователя и ответы системы — события вида CHAT
      (память разговора проекта, источник USER или ENGINE). Время: событие источника
      ENGINE не раньше предыдущего события журнала (допуск 0); событие источника USER
      или AGENT может быть раньше предыдущего не больше чем на 2 секунды (часы разных
      процессов); больше — отказ.

      Хранение (решение ORCH D-A; записывается в 0015, критерий 1): каталог
      ~/.sai-team (права 0700; для тестов и запуска — переменная SAI_TEAM_HOME),
      в нём своя папка на проект с events.jsonl (0600) и папкой files/ для
      результатов-файлов (папки 0700, файлы 0600). Добавление события — одна строка
      целиком или ничего, с fsync до ответа «записано».

      Писатель. Право записи в проект держит ровно один процесс — писатель: процесс,
      который взял право записи через API ядра и ещё не отдал его. Право берётся
      файлом-замком в папке проекта, созданным атомарно (создание с отказом, если файл
      есть), с pid писателя внутри. Любая команда записи (в этом требовании —
      `npm run team -- say`; дальше — команды REQ-010 и REQ-013), пока право держит
      другой живой процесс, получает отказ с понятным текстом и кодом выхода не 0, файлы
      проекта не меняются. Замок, pid которого не принадлежит живому процессу,
      устаревший: следующий писатель снимает его и пишет об этом событие ENGINE. Команды
      чтения права записи не берут и файлы проекта не меняют никогда.

      Восстановление после аварийной остановки выполняет только писатель — сразу после
      того, как взял право записи: оборванная последняя строка отбрасывается (файл
      усекается до последней целой строки) и называется (событие ENGINE и сообщение
      команды); испорченная строка не последней — проект не открывается на запись, с
      понятным сообщением, ничего не пропускается молча; задачи «в работе» получают
      событие и статус «прервана» (их перезапуск по правилам — REQ-013). Команда чтения
      при оборванной последней строке показывает состояние по целым строкам и говорит,
      что последняя строка не дописана, а файлы не меняет.

      Чтение: список проектов; один проект с задачами и прогрессом; журнал событий
      постранично. Прогресс = число задач «готово» и число всех задач («3 из 5») —
      только из воспроизведённого состояния; без задач прогресса нет; процентов нет
      нигде. Для проверки без интерфейса — команды `npm run team -- projects`,
      `npm run team -- project <id>`, `npm run team -- events <id> [--after N]
      [--limit M]`, `npm run team -- say <id> --text "<текст>"` (сообщение
      пользователя — событие CHAT, USER); вывод — JSON. Точная форма вывода — в
      проекте CODE-DESIGNER. Проекты и задачи в тестах этого требования создаются
      через API ядра; команды создания проекта и задач дают REQ-010 и REQ-013.

      Каталог ролей (файл в tools/src/team/): ровно десять ролей — Руководитель
      проекта, Бизнес-аналитик, Исследователь, Финансовый аналитик, Юрист, Маркетолог,
      Дизайнер, Разработчик, Проверяющий (QA), Специалист поддержки; у каждой
      внутренний код, человеческое название и описание для пользователя. У каждой роли
      есть место для внутреннего соответствия (промт и инструменты исполнителя); его
      содержимое задаёт REQ-010, а ядро уже здесь никогда не показывает внутренние поля
      каталога в выводе команд и во фразах.

      Модуль «язык»: событие (вместе с состоянием, воспроизведённым до него) → фраза для
      бизнеса таблицей правил «тип события → фраза», где у каждой строки названы входное
      событие и роль из каталога, если фраза о роли; без технического (контекст,
      токены, промт, JSON, коды выхода не показываются). Образцы фраз из слов владельца
      и их входные события — в критерии 11.

      Безопасность. Q7: в журнале и файлах проекта нет секретов: все строки данных
      события перед записью проходят maskSecrets из tools/src/pixel-office/mask.js
      (правила M1–M10, decisions/0013); ключи — только в переменных окружения, их
      значения никуда не пишутся. Q8 в Sai — про магазины; магазинов здесь нет, но
      тот же принцип действует для проектов: путь к данным одного проекта не даёт
      данных другого и не выходит из своей папки (критерий 7). Q9, Q11, R3
      неприменимы: базы с SQL нет, ядро по сети не ходит, фото покупателей нет. Q10:
      сбой диска не роняет процесс (критерий 13). R2: события ENGINE пишутся в момент
      настоящего изменения состояния, ничего задним числом.

      Код: Node 22 без зависимостей во время выполнения (decisions/0002, 0003; для
      tools/src/team/ — 0015); node:sqlite не используется (в Node 22
      экспериментальный, docs/product/current-state.md, раздел 3). Файлы (от корня
      Sai): tools/src/team/ (новые модули ядра, каталог ролей, модуль «язык» и команды
      team), tools/test/team-*.test.js, tools/package.json (скрипт team), tools/README.md
      (раздел «## Sai Team — ядро»). Не затрагиваются: tools/src/pixel-office/ (из него
      только импортируется mask.js; файлы не меняются), журнал и каталог Pixel Office
      ~/.sai-pixel-office.

      Вне области: интерфейс (REQ-011, REQ-012), исполнители (REQ-010), движок —
      планировщик, расписание, проверка, согласования, завершение (REQ-013),
      многопользовательность и рабочие пространства, внешние интеграции, любые
      настоящие действия вовне, удаление проектов командой (удаление — вручную папкой,
      описано в README).
