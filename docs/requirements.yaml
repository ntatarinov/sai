      образца, подтверждение владельца.

      Источник — только события REQ-001. Офис, легенда, доска, облачка, строка «Сейчас»,
      журнал с фильтрами, панель задач и карточка агента строятся из того же массива
      событий (и времени запусков сервера), что журнал и список задач REQ-001, по тем же
      правилам: задачи и их состояния — по критерию 6 REQ-001, строки «не из хуков» — по
      критерию 4 REQ-001 (не меняют ни состояний, ни перемещений, ни облачков). Своего
      хранилища, сервера и пути записи у REQ-007 нет. Идущая сессия — session_id, у
      которого есть событие после последнего запуска сервера и последнее событие
      которого — не событие окончания сессии: сессия, возобновлённая с тем же session_id
      (факт 12 REQ-001), снова идёт.

      Элементы образца — что переносится (в скобках — номер критерия).

      Шапка. Название — как «Pixel Office»: так называется страница Sai, а «Agent
      Office» — имя страницы эталона (9). Значок «LIVE» с подписью «реальные события
      Agent Runtime» — в честной форме: «LIVE» виден, только пока есть связь с сервером, а
      подпись — пометка «REAL — события хуков Claude Code» критерия 4 REQ-001 (9). Строка
