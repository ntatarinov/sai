      docs/owner-requests/2026-10-13-pixel-office.md. Основной сценарий: «Пользователь видит активных агентов и их доступные задачи.» «Журнал событий»: «Пользователь должен иметь возможность открыть событие и понять, что произошло, а не только увидеть техническое название.»
      «Агенты»: «Не создавай длинные карточки с бесполезными цифрами. Важные сведения должны быть видны сразу, подробности — доступны по раскрытию.»
      «Визуальный уровень и удобство»: «типографику и иерархию информации;», «доступность основных действий с клавиатуры;»
      Объём и порядок — decisions/0057, п. 2 (а) («понятный язык и вид»); деление на «язык» (REQ-048) и «вид» (REQ-049) — decisions/0058, п. 2.
    description: >
      Что получает владелец. В строке «Сейчас» видно, сколько агентов работает, и всех их
      можно показать одним нажатием, не теряя офиса. Нажатая строка журнала раскрывается так,
      что сразу видно главное — «Что произошло» и «Чего это не доказывает», а у каждой строки
      написано словами, что её можно раскрыть.

      Основание — находки прогона REQ044-20261014-01: наблюдение Н5 (docs/uat/REQ-036-044-045-RUN.md;
      handoffs/REQ044-20261014-01/step-08b-uat-runner.json, step-08c-ba-analyst-signoff.json),
      находки F4 и F7 ревью (handoffs/REQ044-20261014-01/step-04-reviewer.json).

      Как сейчас (проверено по коду 2026-10-15, файлы — от корня Sai, папка
      tools/src/pixel-office/public/). 1. Блок «Сейчас»: строки прокручиваются внутри поля
      (style.css, .now-list), в окнах 1920 × 1080 и 1470 × 784 сразу видны около двух строк
      (Н5, F7); число работающих не показано (слова «и ещё N» запрещены REQ-036); подсказка о
      том, что строк больше, — едва заметная тень у нижнего края. Высота шапки закреплена
      бюджетом критерия 18 REQ-007 (под холст на 1470 × 784 — не меньше 594 px). 2.
      Раскрытие строки журнала (F4): в окне 1470 × 784 область журнала 275 px, раскрытие
      512 px; первыми идут «Когда», «Источник», «Сессия», «Агент», «Задача», а «Что
      произошло» и «Чего это не доказывает» — ниже края; признак того, что строку можно
      раскрыть, — мелкая серая стрелка «▸» у правого края (app.js, row-icon).

      Что будет (содержание; расположение и вид — описание интерфейса, устройство — проект).
      1. «Сейчас»: подпись «в работе: N» и кнопка «Показать всех (N)», когда строки не
      помещаются в видимую часть блока; полный список — поверх страницы; бюджет высоты
      критерия 18 REQ-007 и критерии 4 и 7 REQ-036 не меняются.
      2. Раскрытие строки журнала: у строки видно слово «подробнее» («свернуть» у раскрытой);
      раскрытие начинается с «Что произошло» и «Чего это не доказывает» (порядок полей —
      критерий 3 REQ-045 в редакции REQ-048), журнал прокручивается к нему.

      Что в этой работе нет. Слова экрана и одно название роли — REQ-048; сами слова событий
      журнала — REQ-045 и REQ-048; фильтры и поиск журнала — REQ-046; цвета, анимация;
      сервер, хук, схема журнала.

      Планка. R2: «в работе: N» и «Показать всех (N)» — число элементов «в работе» модели
      (критерий 6 REQ-001), ничего не придумывается; раскрытие показывает те же поля, что
      раньше, в другом порядке. Q7: тексты — textContent, строки списка — те же, что в блоке
      «Сейчас» (REQ-036). Слова успеха запрещены как в критерии 8 REQ-042. Q10: внешних
      сервисов нет (страница ходит только на свой сервер 127.0.0.1); плохие условия —
      один и тринадцать элементов «в работе», раскрытие последней строки, потеря связи —
      страницу не роняют (критерий 3). Q8 неприменим: данных клиентов нет, Pixel Office —
      служебный инструмент (decisions/0003). Q11 неприменим: адресов от клиента или
      пользователя, по которым ходит сервер, нет. R3 сейчас не применим (decisions/0033).
      Журнал владельца — только командами счёта без вывода текстов (decisions/0054,
      дополнение 2, п. 2).

      Файлы (от корня Sai): tools/src/pixel-office/public/ (app.js, panels.js, texts.js,
      index.html, style.css), tools/test/pixel-office-*.test.js,
      tools/test/pixel-office-helpers.js, tools/test/fixtures/pixel-office/, раздел «## Pixel
      Office» tools/README.md, проект docs/design/REQ-049-*.md и описание интерфейса,
      документы приёмки docs/uat/REQ-049*.md.

      Открытые выборы (ответ — описание интерфейса или проект): где кнопка «Показать всех» и
      как показан полный список; как выглядит слово «подробнее» в строке журнала.
    acceptance_criteria:
      # 2026-10-15, прогон PIXEL-20261015-01, WF-01 шаг 1, доработка r4 (REQ-ANALYST): блок выделен из REQ-048 по FAIL ворот G1 (handoffs/PIXEL-20261015-01/step-02-req-validator.json) и decisions/0058, п. 2; критерии 1 и 2 — прежние критерии 4 и 5 REQ-048, критерии 3–6 — их доли прежних критериев 6, 7, 9 и 10 REQ-048.
      - "Строка «Сейчас»: видно, сколько работает, и всех можно показать. Когда элементов «в работе» N ≥ 1, в блоке «Сейчас» видна подпись «в работе: N» (константа NOW_COUNT = «в работе: {n}» в tools/src/pixel-office/public/texts.js); строки — как в критериях 1–2 REQ-036 (по строке на элемент, без «и ещё»). Если строки не помещаются в видимую часть блока (scrollHeight списка больше clientHeight), рядом видна кнопка «Показать всех (N)» (NOW_SHOW_ALL = «Показать всех ({n})»); нажатие или Enter и Space на ней показывает все N строк одним списком поверх страницы без внутренней прокрутки при N ≤ 12 в окнах 1470 × 784 и 1920 × 1080, кнопка становится «Скрыть» (NOW_HIDE); «Скрыть», Escape или нажатие вне списка закрывают его, фокус возвращается на кнопку; новые события обновляют и открытый список. Размеры холста и шапки не меняются: тест критерия 18 REQ-007 и тесты критериев 4 и 7 REQ-036 проходят без правки (под холст на 1470 × 784 — не меньше 594 px). Нет элементов «в работе» — прежние «Сейчас: в работе ничего нет» и вторая часть REQ-042 (критерий 13), кнопки и подписи нет. Проверка: тест VW-01 в tools/test/pixel-office-page.test.js — 1, 2 и 8 элементов «в работе»: подпись «в работе: 1/2/8»; при scrollHeight больше clientHeight (поддельные размеры) — кнопка «Показать всех (8)»; нажатие — список из 8 строк в том же порядке, кнопка «Скрыть»; Escape — список закрыт, document.activeElement — кнопка; новое событие при открытом списке — 9 строк; без «в работе» — кнопки и подписи нет; браузер — критерий 5, шаг 1; идентификаторы VW-01…VW-04 свободны (`grep -rn '\"VW-' tools/test/` сейчас ничего не находит)"
      - "Раскрытие строки журнала видно и начинается с главного (F4). У каждой строки журнала, которую можно раскрыть, видно слово «подробнее» (ROW_MORE), у раскрытой — «свернуть» (ROW_LESS), у строки атрибут aria-expanded со значением false или true; стрелка, если остаётся, — не единственный признак. Раскрытие начинается с «Что произошло» (слова и «что это значит») и «Чего это не доказывает», затем «Когда», «Источник», «Сессия», «Агент», «Задача», пометка, «Технические поля» (критерий 3 REQ-045 в редакции REQ-048). После раскрытия журнал прокручивается так, что верх раскрытия у верхнего края видимой части журнала (или раскрытие видно целиком, если помещается); раскрытие последней строки тоже. Проверка: тест VW-02 в tools/test/pixel-office-page.test.js — поддельные размеры: строка в середине длинного журнала, нажатие — scrollTop списка равен offsetTop раскрытия (или раскрытие целиком в видимой части); порядок полей раскрытия по data-ключам; текст «подробнее» у закрытой и «свернуть» у раскрытой строки, aria-expanded; браузер — критерий 5, шаг 2: в окне 1470 × 784 у строки случая 6 и случая 9 таблицы REQ-045 нижний край поля «Чего это не доказывает» не ниже нижнего края видимой части журнала без ручной прокрутки"
      - "Плохие и пустые условия не ломают страницу (Q10 — кривой ввод). Случаи: один и тринадцать элементов «в работе» в блоке «Сейчас» (при тринадцати открытый список прокручивается внутри себя, страница — нет); раскрытие последней строки журнала; раскрытие строки с самым длинным текстом «Чего это не доказывает» (случай 6); связь с сервером потеряна при открытом списке «Показать всех» и при открытом раскрытии — содержимое прежнее (PN-02). Ни в одном случае нет исключения, а в тексте страницы нет «undefined», «null», «NaN» и «[object». Проверка: тест VW-03 в tools/test/pixel-office-page.test.js — по сценарию на каждый случай; исключений нет (reportOnce не вызван); textContent не совпадает с выражением undefined|null|NaN|[[]object"
      - "Правда и безопасность (R2, Q7). Числа «в работе: N» и «Показать всех (N)» равны числу элементов «в работе» модели; строки открытого списка — те же, что строки блока «Сейчас», в том же порядке; описание вида <img src=x onerror=alert(1)> в строке открытого списка показано буквально и не создаёт элемента img; `grep -rnE 'innerHTML|outerHTML|insertAdjacentHTML|document[.]write' tools/src/pixel-office/public/` — пусто (код 1; сейчас пусто); слов успеха нет: `grep -rniE 'заверш|готов|выполнен|успешн' tools/src/pixel-office/public/ | grep -v HISTORY_META_FINISHED` — пусто (код 1; сейчас пусто); страница отправляет только GET (критерий 10 REQ-042). Q8 и Q11 неприменимы, R3 не применим, внешних сервисов нет (описание, «Планка»). Проверка: тест VW-04 в tools/test/pixel-office-page.test.js и команды выше"
      - "Приёмка в браузере с нажатиями — только на стенде с вымышленными данными (decisions/0054, дополнение 2, п. 2). Стенд — отдельный экземпляр сервера `cd tools && npm run pixel-office -- --port <свободный порт> --dir <отдельная папка состояния вне проекта>`, журнал-образец по правилам критерия 9 REQ-042 с 19 ролями (как в критерии 7 REQ-048), 8 элементами «в работе», концом ответа основной сессии и окончанием агента. Журнал владельца, его копии и снимки с них не используются. Шаги и ожидаемое, буквально: 1) окно 1470 × 784: в блоке «Сейчас» — «в работе: 8» и «Показать всех (8)»; нажать — видны все 8 строк без прокрутки; Escape — список закрыт, фокус на кнопке; высота холста (getBoundingClientRect) не меньше 594 px; 2) у строки журнала видно «подробнее»; нажать на строку конца ответа основной сессии (случай 6 таблицы REQ-045) — журнал прокручен к раскрытию, первыми видны «Что произошло» и «Чего это не доказывает», нижний край «Чего это не доказывает» не ниже нижнего края журнала; то же для окончания агента (случай 9); у раскрытой строки — «свернуть»; 3) только клавиатурой: Tab до кнопки «Показать всех», Enter — список; Escape; Tab до строки журнала, Enter — раскрытие; у каждого элемента в фокусе видно кольцо фокуса (getComputedStyle: outline-style не none или box-shadow не none); 4) окна 1920 × 1080 и 375 × 812 — нет горизонтальной прокрутки (document.documentElement.scrollWidth не больше window.innerWidth). Сценарии пишет BA-ANALYST (docs/uat/REQ-049.md, WF-02, шаг 8), итог и снимки стенда — docs/uat/REQ-049-RUN.md; RELEASE-VALIDATOR на шаге 9 повторяет шаги 1 и 2 сам"
      - "Документация и проверка не обходится (Q4, Q6, AP-005). tools/README.md, раздел «## Pixel Office»: подпись «в работе: N» и кнопка «Показать всех», слово «подробнее» и порядок раскрытия строки журнала. Проверка: `awk '/^## Pixel Office/{f=1;next} /^## /{f=0} f' tools/README.md | grep -c 'Показать всех'` не меньше 1 (сейчас 0); `cd tools && node --test test/pixel-office-docs.test.js` — код 0. Принятые тесты, чьи ожидания меняет это требование (порядок полей раскрытия, row-icon, блок «Сейчас»), не удаляются и не слабеют, а заменяются: каждая замена — в таблице «прежняя проверка → новая» проекта docs/design/REQ-049-*.md с идентификатором прежнего теста; число строк `^test(` и вхождений `assert[.]` в каждом файле tools/test/pixel-office-*.test.js не меньше, чем на метке base/<RUN-ID> (`git show base/<RUN-ID>:tools/test/<файл> | grep -c '^test('` против рабочего файла; метка — decisions/0031, имя — context.base_tag handoff-ов; метки нет — «база не задана», PASS на этом пункте нет). `cd tools && npm run check` — код 0, «skipped 0» и «todo 0»; в тексте нет путей этого компьютера и названий других проектов"
