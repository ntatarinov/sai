      - "Исследования — задания и шаг 1b: в task.description handoff-ов step-01-market-researcher-session-review-platforms.json и step-01-market-researcher-session-review-tools.json наличие разбора сессии в Claude Code и других платформах поставлено вопросом, а каждое утверждение о продукте или о владельце — со ссылкой на файл проекта (AP-012). Шаг 1b — отдельный запуск PLAN-VALIDATOR на каждый файл, оба параллельно (step-01b-plan-validator-<файл>.json): result.verdict «PASS»; в result.urls_opened — не меньше 3 ссылок из разных разделов и все ссылки строки Claude Code (platforms) или строк Pretty Prompt и Microsoft Prompt Coach (tools), значения этих строк сверены с открытыми страницами. FAIL — тот же исследователь дорабатывает свой файл в отдельном handoff-е step-01-market-researcher-<файл>-rN.json с result.changes (AP-013), затем снова 1b (step-01b-plan-validator-<файл>-rN.json); не больше двух доработок на файл; FAIL после второй доработки — REQ-006 blocked. Шаг 2a начинается только после PASS обоих файлов. Проверка: RELEASE-VALIDATOR читает task.description; jq по handoff-ам шагов 1 и 1b"
