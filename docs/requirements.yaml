    original_request: >
      Слова владельца, сообщение в сессии Claude Code 2026-10-14, после показа
      переделанного Pixel Office; дословно — в
      docs/owner-requests/2026-10-14-pixel-office-interactive.md:
      «Честно говоря, я думал, то, что Pixel Office будет более интерактивный, но я этого не увидел. Мне сейчас это самое главное. Когда я нажимаю на рабочий стол агента, либо на агента, когда я вижу журнал, тому прочее, это должно быть более интерактивно. Потому что там написано все непонятно для пользователя.»
      Просьба того же владельца 2026-10-13, сообщение в сессии Claude Code; дословно — в
      docs/owner-requests/2026-10-13-pixel-office.md. «Журнал событий»: «Добавь полезные фильтры по сессии, агенту, задаче и типу события. Если объём данных это оправдывает, предусмотрите поиск и удобную навигацию по истории.»
      «Для каждого события отображай доступные дату и время, источник, связанного агента, задачу и контекст.»
      «Задачи и правая панель»: «Обеспечь переход от задачи к агенту, истории событий и связанным сообщениям.»
      «Визуальный уровень и удобство»: «доступность основных действий с клавиатуры;»
      Объём и порядок — decisions/0054, дополнение 2, п. 1 (REQ-046 — навигация журнала).
    description: >
      Что получает владелец. Журнал можно сузить до одной сессии, одного агента, одной
      задачи или одного типа события, найти строку по слову и дойти до самых ранних строк;
      от события можно перейти к задаче в панели «Задачи» и к окну «Просмотр истории»
      запроса.

      Как сейчас (проверено по коду 2026-10-14, файлы — от корня Sai). panels.js, FILTERS и
      filterJournal: фильтры только «Всё», «Работа», «Офис»; показываются последние 200
      подходящих строк (JOURNAL_LIMIT), более ранние недоступны; счётчик «N из M»
      (JOURNAL_COUNT в texts.js: M строк подходят, N показано). Переходов от строки к задаче
      нет; строка запроса владельца открывает «Просмотр истории» (REQ-008).

      Поиск и более ранние строки — нужны (просьба: «если объём данных это оправдывает»).
      Объём — счёт по журналу владельца на 2026-10-14 командами без вывода текстов
      (decisions/0054, дополнение 2, п. 2): 3719 строк за 2026-10-01…2026-10-14 —
      UserPromptSubmit 1083, Stop 702, SubagentStop 701, SubagentStart 689, PostToolUse 525,
      SessionStart 11, SessionEnd 1, записи оркестратора 7; 4 разных session_id, 534 разных
      agent_id. Показ ограничен 200 строками, а строк в 18 раз больше; фильтр по одному типу
      оставляет до 1083 строк, по одной сессии — сотни; без поиска строку по слову из
      описания (например, номеру дефекта) не найти, а строки раньше последних 200 не видны
      совсем. Поэтому: поиск по тексту строки и кнопка «Показать более ранние». Панель
      «Задачи» показывает 300 элементов (LIST_LIMIT), а задач и строк основной сессии в
      журнале владельца 534 и 1083 — переход к старой задаче в панели невозможен, это
      называется прямо.

      Задача события (N2). У строки PostToolUse две задачи: того, кто передал задание, и
      запущенного агента. Задача этой строки для переходов «к задаче в панели», «события
      этой задачи» (какую задачу ставит фильтр «Задача») и «открыть историю запроса» — задача
      запущенного агента (ключ launched_agent_id); в состав фильтра «Задача» строка при этом
      входит у обеих задач (критерий 1): строка говорит «Задание передано агенту …», то есть
      о его задаче; задача передавшего видна через «кто» строки и переход «кто передал»
      (REQ-047). Задачи с ключом launched_agent_id нет — «задача не найдена: её начало не
      записано», переходов к задаче и истории нет. Так же REQ-046 читает поле «Задача»
      раскрытия (REQ-045, критерий 3) у случая 10. У SubagentStart и SubagentStop задача —
      по agent_id строки; у UserPromptSubmit и Stop — строка основной сессии этого запроса;
      у записи оркестратора — строка основной сессии её запроса (правило 5, docs/design/REQ-008-history.md, п. 7.3),
      если запись привязана, иначе задачи нет; у SessionStart и SessionEnd задачи нет.

      Что будет (содержание; вид — описание интерфейса). Фильтры «Сессия», «Агент», «Тип
      события», «Задача» вместе с прежними; поиск; «Показать более ранние»; в раскрытии
      события (REQ-045) — переходы «к задаче в панели», «открыть историю запроса» и
      «события этой задачи». Счётчик один — прежний «N из M» (JOURNAL_COUNT): M — строки,
      подходящие под все фильтры и поиск, N — показанные; кнопка «Показать более ранние»
      увеличивает N, второй подписи нет (L3).

      Что в этой работе нет. Слова событий, раскрытие и записи оркестратора — REQ-045;
      карточка агента — REQ-044; переходы из карточки к журналу и задаче и от события к
      карточке — REQ-047; поиск по тексту сообщения владельца (prompt_text) — он только в
      окне «Просмотр истории»; новые события хуков — отдельное требование (decisions/0057, п. 3); сервер, хук, схема журнала.

      Планка. R2: значения фильтров берутся только из журнала; связь события с задачей —
      только по идентификаторам (agent_id, launched_agent_id) и по строке основной сессии
      из модели (критерий 6 REQ-001). Q7: варианты фильтров и найденные строки выводятся
      как текст; поиск не просматривает prompt_text. Q10: внешних сервисов нет; плохие
      условия — фильтр по исчезнувшему значению, пустой результат, 128-знаковые
      идентификаторы — страницу не роняют (критерий 5). Q8 неприменим (данных клиентов нет,
      decisions/0003). Q11 неприменим (адресов от пользователя, по которым ходит сервер,
      нет). R3 сейчас не применим (decisions/0033). Журнал владельца — только командами
      счёта (decisions/0054, дополнение 2, п. 2).

      Файлы (от корня Sai): tools/src/pixel-office/public/ (panels.js, app.js, texts.js,
      index.html, style.css), tools/test/pixel-office-*.test.js,
      tools/test/pixel-office-helpers.js, tools/test/fixtures/pixel-office/, раздел «## Pixel
      Office» tools/README.md, проект docs/design/REQ-046-*.md и описание интерфейса,
      документы приёмки docs/uat/REQ-046*.md.

      Открытых выборов нет, кроме вида фильтров и поля поиска — описание интерфейса.
    acceptance_criteria:
      # 2026-10-14, прогон PIXEL-20261014-01, WF-01 шаг 1, доработка r2 по повторным воротам (handoffs/PIXEL-20261014-01/step-02-req-validator-r1.json): N1 — depends_on ссылается на 0054, дополнение 2, п. 3; N2 — абзац «Задача события» описания и критерий 3; N3 — правило совпадения фильтра «Агент» (критерий 1, шаг 1 приёмки); N4 — правила окон — docs/design/REQ-008-history.md, п. 7.3.
      # 2026-10-14, прогон PIXEL-20261014-01, WF-01 шаг 1, доработка r1 (handoffs/PIXEL-20261014-01/step-02-req-validator.json, F1): новый блок из прежних критериев 4–6 REQ-045 и их долей приёмки и документации; L3 — точные тексты вариантов «Тип события» и один счётчик; F3 — приёмка только на стенде.
      # 2026-10-15, прогон PIXEL-20261015-01, WF-01 шаг 1, доработка r1 (REQ-ANALYST): было → стало по таблице REQ-048, decisions/0057, дополнение, п. 2; номер и статус не менялись; варианты «Тип события» «Сессия Claude Code открыта/закрыта» → «Открыт/Закрыт разговор с Claude Code».
      - "Фильтры по сессии, агенту, задаче и типу. Прежние «Всё», «Работа», «Офис» остаются (критерий «Журнал как на образце» REQ-007); к ним добавляются: «Сессия» — варианты «все сессии» и каждая session_id журнала: «Сессия <8 знаков> · с <дата и время первого события>»; «Агент» — варианты «все агенты», «Основная сессия», «Оркестратор» и каждая роль с задачей в порядке столов, названием простыми словами (REQ-036); строка подходит под «Агент», если её столбец «кто» (REQ-045, критерий 2) относится к выбранному варианту: у SubagentStart и SubagentStop — роль по agent_type строки, у PostToolUse — передавший (роль по agent_type строки, а без agent_id — «Основная сессия»), у событий основной сессии — «Основная сессия», у записи оркестратора — «Оркестратор»; роль получателя у PostToolUse под «Агент» не учитывается (задания, переданные агенту, — фильтр «Задача»); «Тип события» — варианты, точно: «все типы», «Открыт разговор с Claude Code», «Закрыт разговор с Claude Code», «Владелец отправил запрос», «В сессию пришло служебное сообщение», «В сессию пришло сообщение», «Основная сессия вернула ответ», «Агент получил задание и начал работу», «Агент продолжил работу», «Агент закончил работу и вернул ответ», «Задание передано агенту», «Оркестратор записал, как понял запрос» (случаи 1–11 таблицы REQ-045, у случаев 7–10 без роли); «Задача» — ставится переходом «события этой задачи» (критерий 3) и показан снимаемой пометкой «Задача: <роль> <8 знаков ключа>» с кнопкой снятия; задача — один agent_id (его SubagentStart, SubagentStop и строки PostToolUse с этим agent_id или launched_agent_id) или одна строка основной сессии (её UserPromptSubmit, закрывший её Stop и записи оркестратора, привязанные к её запросу по правилу 5 (docs/design/REQ-008-history.md, п. 7.3)). Фильтры действуют вместе (И) и вместе с поиском (критерий 2); счётчик — один, прежний «N из M» (JOURNAL_COUNT): M — строки, подходящие под все фильтры и поиск, N — показанные; выбранное не сбрасывается новыми событиями; нет совпадений — «Под выбранные фильтры не подходит ни одно событие» и кнопка «Сбросить фильтры» (снимает все, кроме прежнего «Всё/Работа/Офис», который становится «Всё»). Все элементы — с подписью, доступны Tab и Enter или Space (или стрелками у списка выбора). Проверка: тест JN-01 в tools/test/pixel-office-panels.test.js — две сессии, три роли, основная сессия, запись оркестратора: каждый фильтр по отдельности и сочетание «Сессия» + «Агент» + «Тип» дают ровно свои строки, счётчик равен числу показанных и подходящих; «Агент» = роль A даёт начала, продолжения и окончания агентов A и передачи заданий, сделанные агентами A, но не передачи заданий агентам A от других; «Задача» A1 даёт её начало, продолжение, окончание, передачу ей задания и передачи, сделанные ею; «Задача» строки основной сессии — её запрос, её Stop и её запись оркестратора; литералы вариантов «Тип события» записаны в тесте; после новой строки выбранное сохраняется; варианты списков — только из журнала; «Работа» и «Офис» дают прежние строки; идентификаторы JN-01…JN-07 свободны (`grep -rn '\"JN-' tools/test/` сейчас ничего не находит)"
      - "Поиск и более ранние строки (объём обоснован в описании). Поле «Поиск в журнале» (с подписью): строка подходит, если без учёта регистра содержит введённый текст хотя бы в одном из: слова события, «кто» (название простыми словами и код роли), описание задачи, полное значение session_id, agent_id, launched_agent_id, текст записи оркестратора; prompt_text не просматривается. Пустое поле — поиск не действует. Кнопка «Показать более ранние» видна, когда M больше N, и добавляет к показу ещё JOURNAL_LIMIT более ранних строк (N растёт в том же счётчике «N из M»); смена фильтра или поиска возвращает показ к последним JOURNAL_LIMIT. Проверка: тест JN-02 в tools/test/pixel-office-panels.test.js — 450 строк: «200 из 450», после нажатия «400 из 450», после второго «450 из 450» и кнопки нет; поиск фрагмента описания одной задачи находит её передачу, начало и окончание и ничего лишнего; поиск по полному agent_id; поиск в другом регистре; поиск по тексту записи оркестратора; текст, который есть только в prompt_text, ничего не находит"
      - "Переходы от события. В раскрытии события (REQ-045, критерий 3): «к задаче в панели» — элемент задачи этого события (у PostToolUse — задачи запущенного агента, описание, «Задача события») или строки основной сессии в панели «Задачи» прокручен в видимую область и в фокусе (пометка data-target); элемента нет среди показанных (предел 300, LIST_LIMIT в panels.js) — кнопки нет, текст «задача не показана в панели: там последние 300 элементов»; «открыть историю запроса» — окно «Просмотр истории» запроса, к окну которого относится задача события (history.windowOfTask, windowOfMainRow) или сам запрос; окна нет — кнопки нет, текст «запрос не определён: событие вне окна запроса владельца»; после закрытия окна фокус возвращается на эту кнопку; «события этой задачи» — фильтр «Задача» (критерий 1). У SessionStart и SessionEnd переходов к задаче и истории нет (в раскрытии — «к задаче не относится»); у PostToolUse, чей launched_agent_id не совпал ни с одной задачей, — тоже нет (текст «задача не найдена: её начало не записано»). Проверка: тест JN-03 в tools/test/pixel-office-page.test.js — у начала агента в окне запроса все три перехода приводят к своему элементу; у строки PostToolUse, где передавший — агент A1, а запущенный — B, «к задаче в панели» ведёт к элементу B, «события этой задачи» ставит «Задача» B; у PostToolUse с launched_agent_id без задачи переходов нет; задача 301-я по порядку — текст вместо кнопки; событие вне окна запроса — текст вместо кнопки; после закрытия окна истории document.activeElement — кнопка «открыть историю запроса»; SessionStart — переходов нет"
      - "Текст — только как текст (Q7). Роль, описание, идентификаторы и текст записи оркестратора вида <img src=x onerror=alert(1)> в вариантах фильтров, в пометке «Задача» и в найденных строках показаны буквально и не создают элемента img; поиск по строке <img не ломает страницу; `grep -rnE 'innerHTML|outerHTML|insertAdjacentHTML|document[.]write' tools/src/pixel-office/public/` — пусто (код 1; сейчас пусто); страница отправляет только GET (критерий 10 REQ-042). Проверка: тест JN-04 в tools/test/pixel-office-page.test.js и команда выше"
      - "Плохие и пустые условия не ломают навигацию (Q10 — кривой ввод). Случаи: пустой журнал (фильтры с одним вариантом «все…», прежний EMPTY_JOURNAL); фильтр по сессии или задаче, которой после замены журнала нет, — сбрасывается на «все» без исключения; поиск без совпадений — текст критерия 1 и «Сбросить фильтры»; идентификаторы по 128 знаков в вариантах и пометке; связь с сервером потеряна при выбранных фильтрах — выбранное и показ прежние (PN-02). В тексте журнала и вариантов нет «undefined», «null», «NaN» и «[object». Проверка: тест JN-05 в tools/test/pixel-office-page.test.js — по сценарию на каждый случай; исключений нет (reportOnce не вызван)"
      - "Приёмка в браузере с нажатиями — только на стенде с вымышленными данными (decisions/0054, дополнение 2, п. 2). Стенд — как в критерии 10 REQ-044, журнал-образец по правилам критерия 9 REQ-042 с не меньше чем 450 строками в двух сессиях, ролями A и B, записью оркестратора и задачей, начатой вне окна запроса. Журнал владельца, его копии и снимки с них не используются. Шаги и ожидаемое, буквально: 1) выбрать «Агент» = роль A — только строки, у которых «кто» — роль A: начала, продолжения и окончания агентов A и передачи заданий, сделанные ими (передачи заданий агентам A от основной сессии в список не входят); добавить «Тип события» = «Агент получил задание и начал работу» — только начала A; «Сбросить фильтры» — снова все; 2) в раскрытии события A нажать «события этой задачи» — пометка «Задача: <роль> <8 знаков>», строки только этой задачи; снять пометку — фильтр снят; 3) нажать «к задаче в панели» — элемент задачи в панели «Задачи» виден и в фокусе; 4) нажать «открыть историю запроса» — окно «Просмотр истории»; Escape — фокус на этой кнопке; у задачи вне окна — текст «запрос не определён…»; 5) «Всё», без фильтров: счётчик «200 из M»; нажимать «Показать более ранние», пока кнопка не исчезнет, — «M из M», первая строка — самая ранняя строка журнала стенда; 6) ввести в «Поиск в журнале» фрагмент описания одной задачи стенда («Образец …») — только строки этой задачи; 7) окна 1470×784 и 375×812 — нет горизонтальной прокрутки (document.documentElement.scrollWidth не больше window.innerWidth), варианты фильтров не рвутся по буквам (Range.getClientRects, как в критерии 14 (а) REQ-042), у каждого элемента фильтров в фокусе видно кольцо фокуса. Сценарии пишет BA-ANALYST (docs/uat/REQ-046.md, WF-02, шаг 8), итог и снимки стенда — docs/uat/REQ-046-RUN.md; RELEASE-VALIDATOR на шаге 9 повторяет шаги 1, 2, 5 и 6 сам"
      - "Документация и проверка не обходится (Q4, Q6, AP-005). tools/README.md, раздел «## Pixel Office»: фильтры, поиск (что просматривается, что нет), «Показать более ранние», переходы от события, предел панели «Задачи» для перехода. Проверка: `awk '/^## Pixel Office/{f=1;next} /^## /{f=0} f' tools/README.md | grep -c 'Показать более ранние'` не меньше 1 (сейчас 0); тот же awk с `grep -c 'Поиск в журнале'` не меньше 1 (сейчас 0); `cd tools && node --test test/pixel-office-docs.test.js` — код 0. Принятые тесты, чьи ожидания меняет это требование (filterJournal и счётчик в pixel-office-panels.test.js), не удаляются и не слабеют, а заменяются: каждая замена — в таблице «прежняя проверка → новая» проекта docs/design/REQ-046-*.md; число строк `^test(` и вхождений `assert[.]` в каждом файле tools/test/pixel-office-*.test.js не меньше, чем на метке base/<RUN-ID> (как критерий 11 REQ-044). `cd tools && npm run check` — код 0, «skipped 0» и «todo 0»; в тексте нет путей этого компьютера и названий других проектов"
  - id: REQ-047
    title: Pixel Office — карточка основной сессии и переходы между карточкой агента, панелью «Задачи» и журналом в обе стороны; окно «Просмотр истории» — из панели и журнала, не из карточки (decisions/0014)
    owner: FRONTEND-DEV   # вся работа — страница (tools/src/pixel-office/public/); вид — описание интерфейса GUI-DESIGN-ANALYST (decisions/0054, п. 3); второй прогон WF-02: REQ-046 + REQ-047 (decisions/0054, дополнение 2, п. 1)
    status: pending
    depends_on: [REQ-001, REQ-007, REQ-008, REQ-042, REQ-044, REQ-046]   # журнал, строки основной сессии (критерий 6) и правило связи z — REQ-001; персонаж, стол и легенда основной сессии, панель «Задачи» — REQ-007; окна запросов (docs/design/REQ-008-history.md, п. 7.3, правила 1–3), окно «Просмотр истории» и то, откуда оно открывается (решения 5 и 6 decisions/0014; п. 7.3, правило 8 того же проекта), — REQ-008; слова состояний и возраст — REQ-042; карточка экземпляра — REQ-044; фильтр «Задача» и раскрытие события с переходами — REQ-046 (через него — REQ-045). Статусы на 2026-10-14: REQ-001, REQ-007, REQ-008 — in_progress; REQ-044 — in_progress с 2026-10-14T12:41:36Z (первый прогон WF-02 REQ044-20261014-01); REQ-046 — pending; REQ-042 — done. (На 2026-10-14, шаг 10 прогона REQ044-20261014-01: REQ-036, REQ-045 и REQ-044 — done; статус этого блока не менялся.) Исключение по порядку работ — decisions/0054, дополнение 2, п. 3 (распространяет decisions/0050, п. 1 на REQ-046 и REQ-047): REQ-047 строится и проходит ворота WF-02 при незавершённых REQ-001, REQ-007 и REQ-008; на критерии и планку исключение не действует; зависимости по фактам (REQ-042, REQ-044, REQ-046) соблюдаются порядком прогонов (дополнение 2, п. 1: REQ-044 — в первом прогоне, REQ-046 и REQ-047 — во втором; внутри второго — REQ-046, затем REQ-047)
    original_request: >
      Слова владельца, сообщение в сессии Claude Code 2026-10-14, после показа
      переделанного Pixel Office; дословно — в
      docs/owner-requests/2026-10-14-pixel-office-interactive.md:
      «Честно говоря, я думал, то, что Pixel Office будет более интерактивный, но я этого не увидел. Мне сейчас это самое главное. Когда я нажимаю на рабочий стол агента, либо на агента, когда я вижу журнал, тому прочее, это должно быть более интерактивно. Потому что там написано все непонятно для пользователя.»
      Просьба того же владельца 2026-10-13, сообщение в сессии Claude Code; дословно — в
      docs/owner-requests/2026-10-13-pixel-office.md. Основной сценарий: «Пользователь открывает агента и изучает его текущую деятельность.» и «Пользователь открывает задачу и видит её историю.»
      «Агенты»: «При нажатии на агента открывай удобную карточку или боковую панель.» Из списка — «идентификатор сессии или другой доступный идентификатор;», «текущий статус и время последнего события;». «Дай пользователю возможность перейти от агента к конкретной задаче, сообщению, событию или сессии.»
      «Задачи и правая панель»: «Обеспечь переход от задачи к агенту, истории событий и связанным сообщениям.»
      Объём и порядок — decisions/0054, дополнение 2, п. 1 (REQ-047 — карточка основной сессии и переходы из карточки агента к журналу и задаче).
    description: >
      Что получает владелец. Нажатие на персонажа или стол основной сессии открывает
      карточку одной строки основной сессии (одного запроса) — с основанием состояния,
      запущенными в нём агентами; из карточки любого агента можно перейти к его задаче в
      панели «Задачи» и к его событиям в журнале, а оттуда — к окну «Просмотр истории»
      запроса так, как его разрешает открывать decisions/0014; из журнала и панели — обратно
      к карточке.

      Как сейчас (проверено по коду 2026-10-14, файлы — от корня Sai). Карточка основной
      сессии — прежняя карточка роли (buildCard для ключа main, office-model.js): «разговоров
      идёт: N» (CARD_SESSIONS, слово — REQ-048) и разделы строк основной сессии по состояниям; REQ-044 её
      не меняет. Карточка экземпляра REQ-044 показывает «кто запустил: Основная сессия» без
      кнопки и не имеет переходов к панели и журналу. Окна запросов — history.js
      (buildHistory: windowOfTask, windowOfMainRow). Откуда открывается окно «Просмотр
      истории», записано в decisions/0014 (решения ORCH 5 и 6, относятся к REQ-008 и не
      отменены): «5. Окно «Просмотр истории» открывается из журнала и из карточек панели
      «Задачи», не из карточки агента. 6. Если карточка агента открыта, при открытии окна она
      закрывается.» Проект docs/design/REQ-008-history.md (п. 7.3, правило 8) это повторяет.
      Это требование их соблюдает. Панель «Задачи» показывает
      300 элементов (LIST_LIMIT, panels.js); в журнале владельца по счёту без вывода текстов
      534 задачи и 1083 строки основной сессии — переход к старой задаче в панели
      невозможен, это называется прямо.

      Что будет (содержание; вид — описание интерфейса). 1. Карточка основной сессии:
      экземпляр — строка основной сессии; по умолчанию — первая строка основной сессии в
      порядке списка модели (правило d REQ-001); переключение на другие строки и сессии.
      2. Переходы из карточки экземпляра и карточки основной сессии: к задаче в панели (прокрутка
      и выделение) и к событиям в журнале (фильтр «Задача», REQ-046); переход закрывает
      карточку и переводит фокус на цель; кнопка у «кто запустил: Основная сессия». Окна
      «Просмотр истории» карточка напрямую не открывает (0014, решение 5): оно открывается из
      элемента панели «Задачи» (REQ-008) и из журнала (строка запроса владельца — REQ-045,
      критерий 3; раскрытие события — REQ-046, критерий 3). 3. Переходы в карточку: из
      раскрытия события журнала («открыть агента») и из элемента панели «Задачи» («агент»).
      4. Окно и фокус: если при открытии окна «Просмотр истории» карточка агента открыта, она
      закрывается (0014, решение 6), фокус уходит в окно, после его закрытия — на элемент,
      из которого окно открыли.
      5. Запуск по умолчанию (Н2, критерий 8; decisions/0057, дополнение, п. 3): если у роли есть
      запуск «в работе» — он, как прежде; иначе сначала запуски, требующие внимания («нет свежих
      данных», «сервер перезапускался, события не записывались»), среди них — с самым поздним
      собственным событием; иначе — запуск с самым поздним собственным событием.

      Что в этой работе нет. Карточка экземпляра субагента — REQ-044; фильтры и поиск —
      REQ-046; слова событий — REQ-045; итог сессии — после требования о событиях хуков (decisions/0054,
      дополнение, п. 2); новые события хуков — отдельное требование (decisions/0057, п. 3); сервер, хук, схема журнала.

      Планка. R2: связи — только по идентификаторам и по окнам запросов (docs/design/REQ-008-history.md, п. 7.3,
      правило 3: задача относится к окну по строке своего первого начала); ничего не придумывается.
      Q7: тексты из журнала — textContent; кнопка «Скопировать» кладёт в буфер только
      session_id. Q10: внешних сервисов нет; плохие условия — сессия без запросов, задача
      вне окна, старая задача вне панели — названы текстом (критерий 5). Q8 неприменим
      (decisions/0003). Q11 неприменим. R3 сейчас не применим (decisions/0033). Журнал
      владельца — только командами счёта (decisions/0054, дополнение 2, п. 2).

      Файлы (от корня Sai): tools/src/pixel-office/public/ (app.js, office-model.js, panels.js,
      history.js — только чтение окон, texts.js, index.html, style.css),
      tools/test/pixel-office-*.test.js, tools/test/pixel-office-helpers.js,
      tools/test/fixtures/pixel-office/, раздел «## Pixel Office» tools/README.md, проект
      docs/design/REQ-047-*.md и описание интерфейса, документы приёмки docs/uat/REQ-047*.md.
      Принятые тесты прежней карточки основной сессии заменяются по таблице проекта, а не
      удаляются (критерий 7).

      Связь с REQ-044 (N5). Критерий 1 REQ-044 говорит, что персонаж, стол и кнопка легенды
      основной сессии открывают прежнюю карточку основной сессии без изменений (тест AC-02:
      «нажатие на стол основной сессии — прежняя карточка с текстом «разговоров идёт: N»»), а
      шаг 8 его приёмки (критерий 10) — что видна прежняя карточка. REQ-047 эту часть
      заменяет своим критерием 1 и тестом MC-02. Текст критерия 1 и шага 8 REQ-044 правит
      отдельный шаг WF-01 до WF-02 этого требования (по образцу правки критериев REQ-007 для
      REQ-036); тест AC-02 в этой части заменяет TEST-DESIGNER по таблице «прежняя проверка →
      новая» (критерий 7). Ещё одну часть критерия 1 REQ-044 — какой запуск роли открывается по
      умолчанию, когда ни одного «в работе» нет (прежде — первый по правилу d REQ-001), — заменяет
      критерий 8 этого блока (Н2, decisions/0057, дополнение, п. 3): сначала запуски «нет свежих
      данных» и «сервер перезапускался…», затем самое позднее собственное событие; текст критерия 1
      REQ-044 уже ссылается на критерий 8. Остальные критерии REQ-044
      не меняются.

      Открытых выборов нет, кроме вида — описание интерфейса.
