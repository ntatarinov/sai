    original_request: >
      «Сформируй требования которые ты считаешь полезными для sonnet, после этого я запущу
      это все твое на sonnet» — слова владельца, 2026-10-11, сообщение в сессии Claude Code;
      ORCH передал их дословно в задании прогона REQ-20261011-02 (в файлах Sai — поле
      context.owner_words в handoffs/REQ-20261011-02/step-01-req-analyst.json). Основание
      выбора этой работы — аудит ORCH 2026-10-11: одни и те же ошибки учёта повторяются из
      прогона в прогон, и каждый раз их находит RELEASE-VALIDATOR вручную, тратя круг
      итоговой проверки: пути этого компьютера в handoff-ах — AP-050, AP-052, AP-062; времена
      не с часов и из будущего — AP-056, AP-061 (docs/anti-patterns.md). Дальше работу ведут
      агенты на модели Sonnet: ошибка учёта должна ловиться командой у автора шага, а не
      кругом итоговой проверки.
    description: >
      Что получает владелец. Сегодня правила docs/workflows/handoffs.md (статус, время с
      часов, пути) проверяют глазами. В прогоне PROD-20261011-01 RELEASE-VALIDATOR потратил
      два лишних круга на времена из будущего (step-41, F1: completed_at позже коммита;
      step-42, F2: время в самой пометке исправления позже коммита), а путь домашнего
      каталога в handoff-ах step-24 и step-37 уронил `npm run check` и сценарий приёмки
      (AP-062). После этой работы `cd tools && npm run handoffs-check` находит такие ошибки
      за секунды, а `cd tools && npm run check` красный, пока ошибка есть: агент видит её сам
      до сдачи шага.

      Зависимость. REQ-038 использует и дополняет код проверки следов tools/src/traces/
      (REQ-014, in_progress). По исключению decisions/0034 работа начинается до done у
      REQ-014; изменения в tools/src/traces/ проходят те же ворота и не ослабляют правила и
      тесты REQ-014 (tools/test/traces-*.test.js, случаи TC-* и TR-*).

      Что проверяется. Каждый файл handoffs/**/*.json, который отслеживает git или который
      лежит в рабочем дереве новым (тот же перечень файлов, что у traces: git-files.js).
      Другие файлы папки handoffs/ (parallel-runs.jsonl, orch-notes.md, snapshot-before.txt)
      эта команда не читает — их пути и так проверяет traces. Нарушение — тройка «файл,
      правило, путь поля JSON»: путь поля записывается через точку и [N] (например,
      result.issues[0].at), для всего файла — «$»; несколько ошибок одного правила в одном
      поле — одно нарушение, ошибки в разных полях — разные нарушения. Правила (код правила —
      для вывода и для базы исключений):
      - H1 JSON. Файл читается как JSON в UTF-8, верхний уровень — объект (поле «$»).
      - H2 Поля. Есть поля верхнего уровня handoff_id, run_id, workflow_id, step, from_agent,
        to_agent, file, status, context, task, created_at, started_at, completed_at, result
        (docs/workflows/handoffs.md, «Поля»); значение может быть null там, где это
        допускают H4 и H5. Каждое отсутствующее поле — своё нарушение.
      - H3 Совпадения. file равен пути файла от корня Sai; run_id равен имени папки
        прогона; handoff_id не повторяется во всём handoffs/.
      - H4 Статус. COMPLETED или FAILED — result объект, result.status равен status,
        completed_at — время по H5. CANCELLED — есть orch_cancellation с полями at (по H5) и
        reason («Проверка учёта» в handoffs.md); completed_at и result у отменённого handoff-а
        могут быть null (их пишет получатель, а отменённый handoff получатель не закрывал).
        IN_PROGRESS — в двух случаях: (а) остановка по правилу роли (handoffs.md, раздел
        «result»): completed_at null, result.status IN_PROGRESS, первая запись result.issues
        с kind «BLOCKED» и полем at по H5; (б) файл ещё не в коммите или изменён
        относительно HEAD — идёт работа (например, свой handoff TEST-RUNNER, пока тот
        запускает `npm run check`). PENDING — только в случае (б). Любое другое значение
        (например, DONE) — нарушение. Иными словами: в коммите лежат только законченные
        handoff-ы (COMPLETED, FAILED, CANCELLED и остановка IN_PROGRESS с «BLOCKED»), а ORCH
        не создаёт handoff-ы заранее (AP-058). Путь поля в нарушении H4 по условиям:
        недопустимое значение status или PENDING/IN_PROGRESS в коммите вне случая (а) — `status`;
        result.status не равен status — `result.status`; result не объект у COMPLETED/FAILED —
        `result`; у CANCELLED нет orch_cancellation или в ней нет at/reason — `orch_cancellation`;
        completed_at не по H5 у COMPLETED/FAILED — `completed_at`; у остановки IN_PROGRESS нет
        первой записи «BLOCKED» — `result.issues`. Хеш в базе — sha256 значения по этому пути.
      - H5 Формат времени. created_at, started_at, completed_at и каждое поле с именем at или
        с окончанием _at на любой глубине (на 2026-10-11 встречаются
        context.interruptions[].at, resumed_at, checked_by_orch_at, result.issues[].at,
        context.task_check.at, context.orch_check.at, orch_correction.at,
        orch_cancellation.at, not_agent_attested.at, orch_note.written_at) — строка вида
        ГГГГ-ММ-ДДTчч:мм:ссZ (ровно то, что печатает `date -u +%Y-%m-%dT%H:%M:%SZ`), или null,
        или строка, которая начинается со слова «неизвестно» (handoffs.md, «Время»: если
        время неизвестно, пишется «неизвестно» и то, что известно). completed_at null
        допустим только при статусе IN_PROGRESS, PENDING или CANCELLED.
      - H6 Не позже часов. Каждое время по H5 не позже часов в момент проверки.
      - H7 Не позже коммита. Значение — строка поля, в котором стоит время (для времени
        внутри at_note по H9 — вся строка at_note). Для каждого времени находится самый
        ранний коммит истории HEAD, в версии файла которого по тому же пути поля стоит
        строка, равная значению (сравнение строк целиком). Время не позже времени этого
        коммита: время коммиттера (`git log --format=%cI`), переведённое в UTC, сравнение в
        секундах; время автора не используется (при перебазировании они различаются). Если
        значения нет ни в одном коммите (файл новый или поле изменено) — граница одна: часы
        (H6). Почему граница — коммит, где появилось значение, а не первый коммит файла:
        handoff иногда входит в коммит раньше, чем записан completed_at, а поправка ORCH
        дописывается позже и сверяется со своим коммитом. На 2026-10-11 так у двух файлов:
        completed_at в handoffs/PROD-20261006-01/step-04-code-designer-r2.json и в
        handoffs/PROD-20261010-01/step-44-code-designer-iss0010.json позже первого коммита
        файла, но не позже коммита, в котором значение появилось, — это не нарушение.
      - H8 Порядок. completed_at не раньше started_at, если оба — время по H5.
      - H9 Поправки ORCH. orch_correction и orch_note — объект или список объектов; у
        каждого by (непустая строка) и at — время по H5–H7 или null; при at null есть
        at_note — непустая строка. В at_note каждое время вида ГГГГ-ММ-ДДTчч:мм[:сс]Z
        подчиняется H6 и H7 — в том числе время в кавычках «…»: исключения для цитат в
        at_note нет (так поймана была бы ошибка step-42, F2: «не позже 2026-10-11T10:25:00Z»
        при коммите 10:23:05Z). Прежнее значение цитируется только в полях was и previous
        того же объекта поправки: к ним H5–H7 не применяются.
      - H10 Путь домашнего каталога. Правило не дублирует traces, а вызывает его функции:
        hasHomePath (tools/src/traces/rules.js) и readExceptions (tools/src/traces/lists.js,
        файл tools/traces/exceptions.tsv). Своего регулярного выражения для домашних
        каталогов и своего чтения tools/traces/exceptions.tsv в коде команды нет, поэтому
        для каждого handoff-а ответ H10 совпадает с ответом traces; в этой команде H10 —
        только для того, чтобы автор шага видел все ошибки учёта одним запуском.
      - H11 Путь временной папки машины: /private/tmp/<…>, /private/var/folders/<…>,
        /var/folders/<…>, /tmp/<…>. Правило устроено как hasHomePath: перед первой «/» —
        начало строки или знак вне [A-Za-z0-9._-], после корня — хотя бы один знак
        [A-Za-z0-9._-]. Не нарушение — путь сразу после заглушки в угловых скобках: перед
        первой «/» стоит «<», один или больше любых знаков кроме «<» и «>» (пробелы внутри
        допустимы), и «>»; так разрешена любая форма после «<scratch>/» («<scratch>/l1/sai»,
        «<scratch>/tmp/x», «<scratch>/private/tmp/…»), «<вне проекта>/…» (handoffs.md,
        «<вне проекта>») и «<корень репозитория Sai>/…». Пример из handoffs — step-03-req-analyst.json
        этого прогона, result.changes[4]: «<вне проекта>/var/folders/z» — не нарушение.
        Команда из AP-052 «grep -rnE '/Users/|/private/tmp|/var/folders' handoffs/» — не
        нарушение (после корня идёт «|» или «'»). Путь временной папки с именем после корня
        без заглушки — нарушение, в том числе условный путь в примере команды проверки:
        в новых handoff-ах такой путь пишется через «<scratch>/». Функция записывается в
        tools/src/traces/rules.js рядом с hasHomePath (одно место для правил путей) и
        экспортируется; поведение `npm run traces` не меняется (применять ли H11 ко всему
        репозиторию — открытый вопрос 2).

      Правила протокола в docs/workflows/handoffs.md. Правила, которые проверяет команда и
      которых в протоколе ещё нет, записываются в нём в том же прогоне — команда не
      единственное место правила: в разделе «Время» — все времена в at_note проверяются,
      прежнее значение цитируется только в полях was и previous; в разделе «Проверка учёта»
      — в коммите только законченные handoff-ы (как в H4), у поправки ORCH (orch_correction,
      orch_note) объект с by и at или at null с at_note, пути временной папки пишутся только
      через «<scratch>/» или «<вне проекта>/», перед сдачей handoff-а `cd tools && npm run
      handoffs-check` — код 0.

      База исключений (старые нарушения). Handoff-ы только дописываются (quality-bar §6,
      п. 8), поэтому старые нарушения не исправляются переписыванием, а записываются в базу.
      Файл — tools/handoffs/exceptions.tsv:
      - строки «#» — комментарии; в шапке строка «# база: <40 hex коммита>» — коммит базы;
      - одна запись — одно нарушение: `<путь файла от корня>`, `<код правила H1–H9 или
        H11>`, `<путь поля JSON>`, `<sha256 значения, 64 hex>`, `<причина, 1–300 знаков>`
        через табуляцию. Хеш значения — sha256 байтов UTF-8 значения поля, записанного
        JSON.stringify без пробелов; для отсутствующего поля (H2) — sha256 пустой строки;
        для поля «$» (H1) — sha256 байтов всего файла;
      - запись снимает только своё нарушение (файл, правило, путь поля) и только пока хеш
        значения в текущем файле равен хешу записи. Новое нарушение того же правила в том
        же файле, но в другом поле, видно (записи для него нет); правка значения поля с
        записью — запись перестаёт совпадать, нарушение снова видно;
      - запись нельзя «обновить»: команда сверяет каждую запись с файлом в коммите базы —
        в версии файла этого коммита по пути поля стоит значение с тем же хешем (для
        отсутствующего поля — поля нет). Не совпало или файла нет в коммите базы — ошибка
        ввода (код 2) с номером строки базы. Поэтому записи для нового handoff-а и для
        нового значения не бывает;
      - коммит базы закреплён записью ORCH в decisions/: строка «База handoffs-check:
        <40 hex>». Команда берёт эту строку из записи decisions/NNNN-*.md с наибольшим
        номером, где она есть, и сверяет с шапкой базы; не совпали, строки нет ни в одной
        записи или коммит базы не предок HEAD — код 2. Сдвиг базы на другой коммит —
        только новой записью ORCH в decisions/ (Q12), правкой одного файла базы его не
        сделать;
      - неиспользованная запись печатается строкой «handoffs-check: исключение не
        использовано: tools/handoffs/exceptions.tsv:<N>» — код выхода она не меняет, как у
        traces;
      - H10 в этой базе не записывается: для путей домашнего каталога действует база traces.
      База снимается один раз в этом прогоне по всем нарушениям H1–H9, H11 текущих файлов
      на коммите базы; число записей равно числу нарушений, которое печатает команда с
      пустой базой. Что найдено скриптами REQ-ANALYST и REQ-VALIDATOR на 2026-10-11 (588
      файлов; CODE-DESIGNER перепроверяет своим запуском, числа — ориентир, а не критерий):
      JSON не читается — 0; нет created_at — 22 файла, нет started_at — 9, нет context или
      task — 17; без handoff_id, run_id, workflow_id, from_agent, to_agent, file, context и
      result — 1 (handoffs/PROD-20261010-01/step-44-code-designer-iss0010.json); статус
      DONE — 1 (handoffs/PO-20261005-01/step-07-design-qa-validator.json), PENDING в
      коммите — 3 (handoffs/WF06-20260926-01/step-10…step-12), IN_PROGRESS без записи
      «BLOCKED» — 1 (handoffs/ISS-0002-20260930-01/step-06-test-designer-r2.json: в issues
      severity «BLOCKING», а не kind «BLOCKED»), CANCELLED с orch_cancellation — 2 (не
      нарушение, completed_at и result null допустимы); result.status не равен status — 16
      (например, handoffs/PROD-20261011-01/step-17-reviewer.json: COMPLETED и FAILED; в
      PO-20261002-01 — «DONE»); время не вида H5 — 13 значений в 8 файлах («около …»,
      диапазоны «…–…», «~», «по Asia/Almaty», время без секунд «2026-10-03T18:00Z» в
      orch_note.at, поле *_at в result.checks); время позже коммита своего значения (H7) —
      1: handoffs/PROD-20261010-01/step-24-test-designer.json, result.issues[0].at
      2026-10-10T15:30:00Z при коммите 15:25:47Z; H9 — 14 нарушений в 10 файлах (например,
      orch_note строкой в handoffs/PROD-20261011-01/step-25 и step-35, поправка без by или
      at) (время в кавычках в at_note по правилу без исключения для цитат: проверено, таких 0); пути временной папки (H11) — 6 старых файлов (проверено разбором 591 файла; «<scratch>/…» не считается); пути домашнего каталога — 4 файла,
      все уже в tools/traces/exceptions.tsv.

      Вывод и коды выхода — как у traces (tools/src/traces/cli.js). Одна строка на
      нарушение: «<путь>:<строка> — <код правила>: <путь поля>: <что не так>»; номер строки
      — строка файла, где стоит поле или значение; для отсутствующего поля и для «$» — 1.
      Порядок — по пути (байты UTF-8), затем по строке, затем по пути поля. Последняя
      строка — «handoffs-check: файлов проверено <N>, нарушений <M>, исключений использовано
      <K> из <L>». Найденный путь компьютера в вывод не попадает — только «путь домашнего
      каталога» или «путь временной папки» (иначе вывод, вставленный в self_check, принесёт
      путь обратно); времена и статусы печатаются. Коды: 0 — нарушений нет (исключённые не
      считаются); 1 — есть нарушение; 2 — ошибка окружения или ввода: git не найден, папка
      не git-репозиторий (те же тексты, что у traces; repoRoot переиспользуется), файл не
      читается с диска, tools/handoffs/exceptions.tsv сломан, запись не сверилась с
      коммитом базы, коммит базы не совпал с записью в decisions/ или недоступен. Ошибка —
      одна строка stderr «handoffs-check: <код>: <текст>», без стека. git вызывается без
      командного интерпретатора, с фиксированными аргументами и core.fsmonitor=false, как в
      git-files.js; все вызовы git и слово child_process в коде команды — только в одном
