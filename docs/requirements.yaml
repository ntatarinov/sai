  - id: REQ-037
    title: Стадия прогона на экране Pixel Office — оркестратор записывает «запись этапа» подписанным путём, экран показывает название прогона, «шаг N из M» и «Дальше» ровно как записано
    owner: BACKEND-DEV   # запись: схема, команда, обработчик сервера в tools/src/pixel-office/ и обязанность в .claude/agents/orchestrator.md (как пункт «как понял» в REQ-008); показ на странице — FRONTEND-DEV в том же прогоне; вид — описание интерфейса GUI-DESIGN-ANALYST (WF-04)
    status: pending
    depends_on: [REQ-036, REQ-008]   # блок строк агентов, под который встаёт заголовок прогона, — REQ-036; подписанный путь записи оркестратора, маскирование 0013 и запись «как понял» — REQ-008 (in_progress). REQ-001 и REQ-007 — через REQ-036. Зависимости от REQ-001, REQ-007, REQ-008 — по исключению decisions/0029 (три причины названы там); done с пометкой «по исключению 0029»
    original_request: >
      «Что ты делаешь? в пикель офисе не понятно что делается и не ясно вообще на какой
      стадии» — слова владельца, 2026-10-11, сообщение в сессии Claude Code со скриншотом
      строки «Сейчас: SECURITY-REVIEW… — SECURITY-REVIEWER ISS-0010 · и ещё 2 в работе»
      (опечатка «пикель» — владельца, не исправлена; дословно ещё в handoffs/
      REQ-20261011-01/step-03-req-analyst.json, поле context.owner_words). Эта работа
      отвечает на вторую половину — «не ясно вообще на какой стадии». Решение ORCH по
      этому требованию — decisions/0028 (вариант А, запись этапа; по общему слову
      владельца 2026-10-10 «закрывай все … сам все сделай» (STATE.md, строки 71–72); владелец может отменить решение).
    description: >
      Что получает владелец. Сейчас Pixel Office не знает, над каким прогоном идёт работа
      и на каком он шаге: в строке журнала нет ни номера прогона, ни шага
      (`grep -nE 'run_id|workflow|step' tools/src/pixel-office/public/schema.js` — пусто;
      `grep -rln 'handoffs/' tools/src/pixel-office/` — пусто), а папку handoffs/ Pixel
      Office не читает. После этой работы оркестратор на каждом шаге записывает «запись
      этапа» — слова оркестратора о том, над чем идёт работа, — и над строками агентов
      (REQ-036) стоит заголовок: «<название прогона>: <название шага> · шаг N из M» и
      «Дальше: <название следующего шага>» с пометками «со слов оркестратора» (R2: это не
      событие хука) и «сессию выбрал сервер по последнему запросу владельца» (сессию выбрал сервер, а не оркестратор). Решение — decisions/0028, вариант А; вариант Б (Pixel Office читает
      handoffs/) отклонён там же.

      Что записывает оркестратор (поля записи этапа; имена и порядок — проект
      CODE-DESIGNER). Подписанный путь тот же, что у записи «как понял» (REQ-008, решение
      0007): подписанный POST на локальный сервер Pixel Office, время и источник ORCH
      ставит сервер, подпись по секрету каталога состояния, адрес только локальный.
      - название прогона простыми словами, 1–80 знаков (например, «Страница для
        бизнеса»);
      - N — номер шага как текст шага, 1–12 знаков, непустой: «7», «5b», «круг 2»;
        оркестратор пишет его так, как называет шаг в handoff-е; «0» не допускается — шаги считаются с 1 (правило этого требования, дополнение к decisions/0028, где такого правила нет; проверка — критерий 4);
      - M — число шагов, целое от 1 до 999, **только если число шагов известно**;
      - название шага простыми словами, 1–60 знаков;
      - название следующего шага, 0–60 знаков (необязательно).
      Что такое N и M (decisions/0028, замечание 2 проверки): N — не порядковый номер
      вычисления, а то, что записал оркестратор; M записывается, только если известно, и
      при доработке оркестратор пишет новую запись с новым M. Экран ничего не вычисляет и
      не угадывает: «шаг N из M», если M записан, иначе «шаг N»; «Дальше: …», только если
      следующий шаг записан (текста «это последний шаг» нет — его никто не записывал);
      если записи этапа нет — «Название прогона и шаг не переданы». Примеры «вход →
      ожидаемое» — в критерии 3 (прогон из 52 шагов с неизвестным M, шаг «5b», доработка
      «круг 2»).

      Связь записи с агентами. Агент и запись этапа связаны только по одинаковому
      session_id, совпадений по времени или «ближайшей записи» нет. Оркестратор свою
      сессию не видит и `--session` не передаёт (orchestrator.md, тест DC-02 /
      pixel-office-docs.test.js, G4: `--session` внутри команды запрещён); как у записи
      «как понял», сервер сам берёт session_id последнего сообщения владельца в журнале
      (journal.lastOwnerPrompt возвращает время и session_id). Это НОВОЕ поведение записи
      этапа, а не поведение записи «как понял»: processNote (server.js) у «как понял» берёт
      из последнего сообщения владельца только время (request_time), session_id пишет лишь
      тот, что передан командой, а без сообщения владельца в журнале принимает запись без
      request_time. У записи этапа сервер ставит session_id последнего сообщения владельца
      и отклоняет запись понятной ошибкой, если сообщения владельца в журнале нет. Запись
      «как понял» не меняется (тесты REQ-008 проходят без правки, критерий 12). Известный
      предел (decisions/0030, п. 3, принято): при нескольких одновременных сессиях владельца
      последнее сообщение может быть из другой сессии, чем сессия оркестратора, и заголовок
      встанет не над теми строками; для одной рабочей сессии (текущий порядок) этого нет.
      Предел назван на экране пометкой «сессию выбрал сервер по последнему запросу владельца» (формулировка пометки — выбор этого требования, в decisions/0030 её нет; проверка — критерий 6);
      проверка шире на журналах — задача CODE-DESIGNER.
      Последняя запись этапа сессии заменяет прежние; заголовок показывается, пока в этой
      сессии есть элемент «в работе».

      Точные места записи (замечание проверки; перечень закрытый). Код — только в tools/src/pixel-office/ и в тестах (шаблон tools/test/pixel-office-*: *.test.js, pixel-office-helpers.js, фикстуры — pixel-office-* или tools/test/fixtures/pixel-office/). Файлы учёта прогона — сценарий docs/uat/REQ-037.md (шаг 8 WF-02), handoffs/<RUN-ID>/, docs/design/REQ-037*.md, decisions/NNNN-*.md и строка новой записи в decisions/README.md, PLAN.md (только строка текущего прогона), STATE.md, docs/requirements.yaml (только status), docs/issues/, docs/anti-patterns.md, docs/product/*, docs/releases/ — процесс создаёт и правит сам, это не код; они перечислены в критерии 2 как разрешённые:
      - public/schema.js — LINE_KEYS (новые поля), NOTE_ONLY_KEYS и NOTE_LINE_KEYS,
        checkNoteLine (запись этапа — запись оркестратора без note_text или с признаком
        вида), isNoteLine и parseLine — чтобы запись этапа читалась страницей, а не
        отбрасывалась;
      - protocol.js — NOTE_BODY_KEYS и validateNoteBody (поля тела, проверки длины и
        вида, отказ «шаг больше числа шагов», когда N состоит только из цифр);
      - note.js — USAGE, OPTIONS, parseArgs и сборка тела команды
        `cd tools && npm run pixel-office-note` (новые параметры записи этапа — имена в
        критерии 8; текст записи «как понял» остаётся как есть); новой команды и правки
        tools/package.json нет;
      - server.js — processNote (или соседний обработчик) и маршрут /api/note: маскирование
        maskSecrets, привязка сессии, запись строки;
      - journal.js — только если разбор строки журнала сервером требует правки;
      - public/panels.js, app.js, texts.js, style.css, index.html — заголовок прогона;
        public/history.js не меняется (окно истории берёт только записи с request_time,
        history.js:174) — запись этапа в окне «Просмотр истории» не появляется.
      Вне tools/src/pixel-office/ и его тестов правятся только названные файлы:
      .claude/agents/orchestrator.md (обязанность записывать этап на каждом шаге и писать
      описание запуска агента простыми словами, без голого кода роли и номера дефекта;
      пункт ставится рядом с пунктом «как понял», по образцу design REQ-008, п. 10; тест
      DC-02 проходит), tools/README.md (раздел «## Pixel Office»), docs/design/REQ-037-*.md,
      docs/design/samples/. Граница «код только в tools/src/pixel-office/ плюс названные
      файлы» проверяется командой в критерии 2. Документы процессов docs/workflows/ не
      меняются: их шаги и номера handoff-ов остаются, оркестратор лишь называет их
      простыми словами.

      Безопасность. Q7 и решение 0013: название прогона, названия шагов и N — данные:
      маскируются maskSecrets до записи в журнал (и повторно сервером), на странице —
      textContent, не разметка; секрет в любом поле заменён «[скрыто]»; текст сообщения
      владельца и запись «как понял» в заголовок не выводятся. Подпись обязательна: запись
      без подписи отклоняется так же, как запись «как понял» без подписи. Q8, Q9, Q11, R3
      неприменимы (магазинов, SQL, адресов от пользователя, фото нет). Q10: запись с
      неверными полями отклоняется понятной ошибкой команды, журнал не меняется, страница
      работает; если сервер не запущен, команда сообщает об этом, запись не придумывается
      (как у «как понял»). R2: на экране нет названия, числа и фразы, которых оркестратор
      не записал; запись показана с пометкой источника.

      Вне области: строки агентов и названия ролей (REQ-036), чтение handoffs/ сервером
      Pixel Office (вариант Б отклонён в 0028), подписи на холсте (D13), окно «Просмотр
      истории» (REQ-008), события хуков и состав их полей, перевод журнала на простой
      язык, автоматическое вычисление шага или числа шагов из файлов процессов.

      Открытые вопросы (ответ — запись decisions/ или слово владельца):
      1. Форма записи этапа в журнале — новые поля у записи оркестратора или отдельный
         вид строки: проект CODE-DESIGNER; запись в decisions/ нужна, только если меняется
         то, что решено в 0028 (подписанный путь, маскирование). Команда закреплена:
         `pixel-office-note` с новыми параметрами (критерий 8), не новая.
      Привязка к сессии (прежний вопрос 2) закрыта decisions/0030, п. 3: по последнему
      сообщению владельца, предел назван открыто; пометка «сессию выбрал сервер по последнему запросу владельца» — выбор этого требования (критерий 6), в 0030 её нет.
    acceptance_criteria:
      - "Решение до кода (Q12). Проверка до начала WF-02: `ls decisions/0028-*.md` находит
        файл, `grep -n '0028' decisions/README.md` находит строку со статусом «Принято»;
        `grep -n '0029' decisions/README.md` находит исключение по зависимостям. В 0028
        определено, что такое N и M (текст шага, M только если известно, новая запись при
