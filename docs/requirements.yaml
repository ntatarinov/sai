        задачи и для непрошедшей проверки дают те же события, что `answer … change` и
        `answer … reject`; в коде нет действий вовне — те же команды, что в критерии 6
        REQ-013 и критерии 14 REQ-011: `grep -rnE
        'node:(http|https|net|tls|dgram)|fetch[(]' tools/src/team/` пусто и `grep -rlE
        'node:(https|net|tls|dgram)' tools/src/web/` пусто"
      - "Повторный и устаревший ответ. Тест: два одинаковых ответа подряд на один
