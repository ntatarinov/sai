      - "REAL и SIMULATION, правило чтения (R2, AP-002): source = REAL ставит сервер при записи; запрос на путь записи хука (/api/events), в теле которого есть поле source, отклоняется (400, sha256 журнала не меняется); source = ORCH ставит сервер только на отдельном пути записи оркестратора (/api/note, критерий 6 REQ-008), и тело запроса его там тоже не задаёт — путь хука source ORCH принять не может ни при каком теле. Режима симуляции нет. Сервер дописывает строки в порядке приёма (критерий 2), поэтому из двух принятых строк более поздняя в файле не раньше более ранней больше чем на 120 секунд (удвоенный допуск записи). Правило чтения: (а) строка с source не REAL и не ORCH — «не из хуков» (строка source ORCH — запись оркестратора, а не событие хука: она подписана «Оркестратор записал», не помечается «не из хуков», не входит в правила (б) и (в), которые читают только строки REAL, и не используется для задач и состояний — критерий 9 REQ-008); (б) среди непомеченных строк с source REAL конфликт — пара, в которой более поздняя в файле строка раньше более ранней больше чем на 120 секунд; пока конфликты есть, «не из хуков» помечается строка, входящая в наибольшее число конфликтов, а при равенстве — более поздняя в файле; помеченная строка из конфликтов выбывает; конфликт есть тогда и только тогда, когда какая-то строка раньше самого позднего времени среди строк перед ней больше чем на 120 секунд, поэтому журнал без конфликтов проверяется за один проход; (в) последняя строка файла, если она не помечена, помечается, когда её время позже часов компьютера в момент чтения больше чем на 60 секунд. Кроме правила (в), пометки зависят только от содержимого журнала; в журнале из одних принятых сервером строк конфликтов нет и ничего не помечается. Помеченная строка показывается в журнале с пометкой «не подтверждена» (её source — в раскрытии строки, REQ-045 и REQ-048) и не используется для задач и их состояний (и в REQ-007 — для офиса). В шапке страницы — пометка «Источник событий — Claude Code». Проверка: tools/test/pixel-office-server.test.js (source REAL, отказ при поле source); tools/test/pixel-office-page.test.js — пометка в шапке и сценарии: журнал из одних принятых строк (время каждой — в пределах ±59 секунд от времени приёма, приём по порядку) — пометок нет; строка SIMULATION — помечена только она; вписанная после настоящих строк строка с source REAL на 10 минут раньше их — помечена только она, в том числе когда перед ней всего две настоящие строки с промежутком 10 минут; строка на час вперёд, после которой идёт час настоящих строк, — помечена только она; один и тот же журнал с настоящей последней строкой при чтении в момент T и в T + 2 часа даёт одинаковые пометки; последняя строка на час вперёд при чтении раньше её времени помечена по правилу (в); сгенерированный журнал из 100 000 принятых строк и он же с пятью вписанными строками (на час вперёд и на час назад, не ближе 1 000 строк к концу) — правило чтения и построение списка задач (критерий 6) вместе укладываются в 1 секунду на каждом, во втором помечены ровно пять вписанных строк"
      - "Один поток событий: сервер отдаёт для чтения только события и время своих запусков; журнал событий и список задач (и в REQ-007 — офис и карточка агента) строятся на странице из одного и того же массива событий; отдельного хранилища задач или состояний нет ни на сервере, ни на странице. Проверка: tools/test/pixel-office-page.test.js — одна последовательность событий даёт согласованные журнал и список задач, после добавления одного события оба меняются согласованно; tools/test/pixel-office-server.test.js — ответы чтения содержат только события и запуски сервера, в каталоге состояния — только файлы, названные в дизайне"
