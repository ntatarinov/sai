  - id: REQ-022
    title: Sai Team, часть 12 — наблюдаемость и доверие — лента «что сделано, кем, почему, результат, что при ошибке» и детали по раскрытию; режим для специалистов отдельно
    owner: FRONTEND-DEV   # лента и раскрытие; данные «почему» в событиях — BACKEND-DEV
    status: pending
    depends_on: [REQ-011, REQ-015]   # страница и сервер — REQ-011; ссылка на файл результата и черновик — просмотр REQ-015; фразы — модуль «язык» REQ-009; проблемы — REQ-021, если сделан раньше
    original_request: >
      «Тебе нужно сформировать требования по проекту, которые были не реализованы или
      реализованы. Accept критерии приемок должны быть. То есть суть в том, что сай
      проект должен самостоятельно работать без участия других проектов, но он должен
      взять лучшее с проектов просто требования составь и все а потом это мы сделаем на
      сонете» (владелец, 2026-10-06, сообщение в сессии Claude Code; дословно — в задании
      handoffs/REQ-20261006-01/step-01-req-analyst.json). Видение того же дня —
      decisions/0015, раздел «Основание».
    description: >
      Что получает пользователь. Работе команды можно доверять, потому что видно всё:
      что сделано, кем, почему, с каким результатом и что произошло при ошибке, — в
      простых словах, а подробности открываются щелчком. Для специалиста — отдельный
      режим с техническими полями; по умолчанию он выключен (Advanced Mode отдельно от
      обычного вида, REQ-011).

      Лента проекта: строка на каждое событие журнала, которое меняет что-то для
      человека (точный список типов — проект; события замка и служебные — только в
      режиме специалиста): что сделано (фраза модуля «язык»), кем (человеческое
      название роли, «вы», «система»), почему (причина из журнала: «по плану», «после
      замечаний проверяющего», «по вашему ответу», «после сбоя — повтор»), результат
      (файл или черновик со ссылкой на его просмотр — REQ-015, итог проверки), что при ошибке (причина словами и что
      дальше — как REQ-021). Если для «почему» в событии нет данных, строка честно
      говорит «причина не записана», а не придумывает; поля причины, которых нет в
      каталоге событий, добавляются новой редакцией проекта REQ-009.

      Раскрытие строки: время, попытка, длительность запуска, расход запуска в
      долларах, замечания проверяющего, файлы — словами. Режим для специалистов
      (переключатель, запоминается в браузере): тип события, номер строки, источник,
      исполнитель, поля данных (маскированные), выгрузка журнала проекта файлом (тот
      же маскированный журнал).

      Безопасность. Q7: даже режим специалиста не показывает значений переменных
      окружения и немаскированных текстов — только то, что в журнале. Принцип Q8:
      лента и выгрузка — только своего проекта. Q10: испорченная строка — пометка в
      ленте. Q9, Q11, R3 неприменимы.

      Файлы (от корня Sai): tools/src/web/, tools/src/team/ (поля причины в
      событиях, если нужны), tools/test/team-web-feed*.test.js, проект
      docs/design/REQ-009-team-core.md (если добавляются поля), tools/README.md. Вне
      области: метрики и сигналы для служб мониторинга, лента по всем проектам сразу,
      журнал действий людей (REQ-019).
    acceptance_criteria:
      - "Лента отвечает на пять вопросов. Тест tools/test/team-web-feed.test.js на
        фикстурном журнале проекта на scripted с планом, задачами, проверкой «не прошла»
        и повтором, передачей другой роли, ответом пользователя и сбоем: у каждой строки
        ленты есть «что сделано», «кем», «почему», «результат» (если есть) и «что при
        ошибке» (для сбоя) — каждое значение равно ожидаемой строке теста; строк ровно
        столько, сколько событий из списка типов проекта"
      - "Нет данных — так и сказано. Тест: событие без поля причины в фикстуре даёт
        «причина не записана»; ни одна строка не содержит причину, которой нет в
        журнале (тест сверяет причину каждой строки с полем события)"
      - "Раскрытие. Тест: данные раскрытия строки запуска содержат время, номер
        попытки, длительность (из событий начала и конца запуска), расход запуска (из
        события расхода, с пометкой «предположительно», если расход принят равным
        потолку — decisions/0018, P4), замечания проверяющего и файлы — каждое сверено
        с журналом"
      - "Обычный вид без технических слов, режим специалиста — отдельно. Тест: тексты
        ленты и раскрытия в обычном виде проходят проверку слов критерия 7 REQ-011;
        технические поля (тип события, номер строки, источник, исполнитель) отдаются
