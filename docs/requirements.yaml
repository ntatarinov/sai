      - "Какие строки считаются событиями (R2). Для критериев 1, 3, 4 и 13 «последнее событие сессии», свежесть и возраст определяют только доверенные строки хука: строки журнала, которые правило чтения (критерий 4 REQ-001) не пометило «не из хуков» — источник REAL, время без конфликта. Запись оркестратора (источник ORCH, REQ-008), строка любого другого источника и любая помеченная строка не меняют ни состояния элемента, ни слова карточки сессии, ни времени и возраста последнего события, ни числа N. Правило записано здесь один раз, остальные критерии ссылаются на него. Проверка: tools/test/pixel-office-page.test.js, тест FS-01 (идентификаторы FS-01…FS-03 свободны: `grep -rn '\"FS-' tools/test/` ничего не находит; ST-07 занят в pixel-office-settings.test.js и не используется): молчащая сессия, последнее событие старше STALE_AFTER_MS, — задача «нет свежих данных», карточка «нет свежих данных», N = 1; затем в той же session_id строка с источником ORCH (запись «как понял») со временем «сейчас» и строка с другим источником, не REAL, со временем «сейчас» — состояние задачи, слово карточки, время и возраст последнего события и N те же, что до них; затем доверенная строка REAL той же сессии со временем «сейчас» — задача «в работе», карточка «Идёт», возраст меньше минуты"
      - "Слова успеха. Событие окончания доказывает конец работы, а не её успех (решения 0049 и 0051, п. 3). В словах состояний, облачках, карточках, доске, легенде и журнале страницы нет слов «заверш…» в любой форме, «готово», «выполнено», «успешно». Облачки: по окончанию задачи над персонажем субагента — «Закончил работу», по концу ответа над персонажем основной сессии — «Вернул ответ» (критерий 10 REQ-007 переписан на эти слова). Единственное названное исключение — подпись времени окончания в окне «Просмотр истории» (HISTORY_META_FINISHED, «завершён»): это подпись времени последнего Stop, а не слово состояния и не облачко. Проверка: `grep -rniE 'заверш|готов|выполнен|успешн' tools/src/pixel-office/public/ | grep -v HISTORY_META_FINISHED` ничего не печатает; tools/test/pixel-office-office.test.js — по событию окончания задачи и по концу ответа облачко равно BUBBLE_TEXTS.done («Закончил работу») и BUBBLE_TEXTS.answer_ready («Вернул ответ») (литералы записаны в тесте), других фраз облачков нет; tools/test/pixel-office-panels.test.js — в сценарии со всеми состояниями тексты карточки агента, легенды, доски и журнала не совпадают с выражением заверш|готов|выполнен|успешн (без учёта регистра)"
      - "Доказательство на образце журнала (D1, D2, D3, D5). Образец — файлы events-*.jsonl в tools/test/fixtures/pixel-office/, вымышленные и только со строками событий журнала: записей запусков сервера в этих файлах нет, их задаёт тест (объекты с полями time и journal_lines). В каждом файле образца: у каждой строки session_id и agent_id начинаются с «sample-», поля prompt_text нет (тексты сообщений владельца образцу не нужны), описание задачи, если оно есть, начинается словом «Образец», каждая строка проходит checkLine (tools/src/pixel-office/public/schema.js), ни одной строки из настоящего журнала владельца. Проверка файлов: `grep -vc 'sample-' <файл>` печатает 0; `grep -c prompt_text <файл>` печатает 0; `grep -cE '\"description\": ?\"' <файл>` равно `grep -cE '\"description\": ?\"Образец' <файл>`. Тесты читают образец и строят страницу тем же кодом, что и в браузере; часы и записи запусков сервера в тесте заданы. Случаи: (D1) задача без окончания, чья сессия молчит дольше STALE_AFTER_MS, — «нет свежих данных», её нет в «Сейчас» и на столе; (D2) две сессии без SessionEnd, одна со свежим событием, другая старше порога, — идёт одна; (D3) на карточках сессий нет полосы и «n/m»; (D5) агент запущен, затем запись запуска сервера, в его сессии есть свежее событие — слово «сервер перезапускался, события не записывались», а не «в работе» и не «окончание не записано», блок «Сейчас» пишет «Сейчас: в работе ничего нет · без свежих данных: 1»; (контроль) агент со свежими событиями без перезапуска — «в работе» и в «Сейчас». Проверка: тесты в tools/test/pixel-office-page.test.js и tools/test/pixel-office-panels.test.js по этим случаям; мутант, который вернул бы прежнее правило (сессия «идёт» и задача «в работе» без возраста, полоса на карточке) делает хотя бы один из них красным — это проверяет TEST-DESIGN-VALIDATOR (WF-02, шаг 5b)"
