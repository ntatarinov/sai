      ORCH 2026-10-11, шаг 1 прогона REQ-20261011-01 (handoffs/REQ-20261011-01/
      step-01-req-analyst.json). Видение владельца, на которое опирается требование,
      — его слова 2026-10-06 (дословно в decisions/0015, раздел «Основание»):
      «Главный ориентир: максимально автономная виртуальная команда + предельно
      простой UX для бизнеса + Pixel Office как живое зеркало реальной работы +
      качество продукта не хуже [образца], а в ключевых сценариях лучше.» И его слова
      2026-10-10 «закрывай все … сам все сделай» (STATE.md; решения 0022, 0027).
    description: >
      Что получает владелец. На странице проекта Sai Team (REQ-011) три кнопки
      управления работой проекта: «Пауза», «Продолжить», «Остановить». Сейчас
      приостановить, возобновить или остановить проект можно только командами
      терминала (`npm run team -- pause|resume|stop <id>`, tools/README.md), а после
      остановки сервера проекты встают на паузу и страница пишет «Проект приостановлен,
      продолжите его командой resume» (REQ-011, решение 0025). Человек без терминала не может ни поставить проект на паузу, ни
      продолжить его. После этой работы может: нажатие делает то же, что команда, а
      страница показывает состояние проекта — «на паузе», «продолжается»,
      «остановлен» — теми же фразами, какие уже записывает язык ядра REQ-009
      («Проект на паузе», «Работа над проектом продолжается», «Проект остановлен»,
      tools/src/team/language.js) и словами статуса («на паузе», «в работе»,
      «остановлен», tools/src/team/schema.js, PROJECT_STATUS_TEXT).

      Какие кнопки видны (правила движка, tools/src/team/engine/commands.js; страница
      нигде не разрешает то, что движок запрещает, но в двух местах сознательно строже
      движка — оба места названы ниже и закреплены строками таблицы критерия 7):
      - «Пауза» — проект в статусе «планирование», «в работе» или «ждёт решения
        пользователя». Движок: новые задачи не начинаются, идущие доводятся до итога
        (tools/README.md, раздел о движке).
      - «Продолжить» — только проект «на паузе». Проект «ждёт решения пользователя»
        продолжается ответом на вопрос (окно решений — REQ-017), а не этой кнопкой;
        кнопки «Продолжить» у него нет.
      - «Остановить» — проект «планирование», «в работе», «на паузе» или «ждёт решения
        пользователя».
      - Проект «создан», «выполнен», «не удалось» и «остановлен» — ни одной кнопки.
      Строже движка: (1) «создан» — проект записан, но движок ещё не взял его (страница
      сама показывает «Проект создан, но работа не началась», REQ-011); движок принял бы
      у такого проекта stop, а страница кнопок не даёт: останавливать нечего, ведёт его
      не движок. (2) «Ждёт решения» из-за исчерпанного потолка расходов: после того как
      потолок поднят командой `budget` из терминала, движок принял бы resume, а страница
      кнопки «Продолжить» у такого проекта не даёт, потому что окно решений и правка
      потолка — вне области (REQ-017, команда budget остаётся терминалом). Прямой запрос
      в этих двух случаях отклоняет страница своим текстом (критерий 7), не доходя до
      движка.
      Остановка необратима: движок отвечает на `resume` остановленного проекта отказом
      «Проект остановлен — продолжить его нельзя» (E_STOPPED), README называет проект
      «остановленным навсегда». Поэтому «Продолжить» у остановленного проекта нет, а
      страница так и пишет: «Проект остановлен. Продолжить его нельзя». «Остановленный»
      в смысле решения 0025 («остановленный проект продолжается командой из терминала»)
      — это проект на паузе после перезапуска сервера: его продолжает кнопка «Продолжить»
      (в README для терминала остаётся команда `resume`, она работает как раньше). Вопрос
      «продолжать ли остановленный проект» закрыт decisions/0030, п. 1: остановка
      необратима; если владелец захочет иное, это изменение REQ-013 и записи 0020, а не
      страницы.

      Подтверждение. «Остановить» сначала открывает подтверждение: «Остановить проект?
      Это нельзя отменить. Начатая работа прервётся, продолжить проект потом нельзя.»
      (слова «Это нельзя отменить» — по decisions/0030, п. 1) и две кнопки —
      «Остановить» и «Не останавливать». Запрос на сервер уходит только после
      «Остановить». Закрытие подтверждения и «Не останавливать» ничего не меняют. «Пауза»
      и «Продолжить» подтверждения не требуют: обратимы. Сервер не доверяет странице:
      запрос остановки без признака подтверждения в теле он отклоняет текстом «Запрос
      не понят. Обновите страницу» (признак называет проект CODE-DESIGNER). Размер запроса: тело запроса управления — не больше 4 КиБ (4096 байт); больше — «Запрос не понят». Общий readBody сервера (tools/src/web/server.js) отвечает «Сообщение слишком большое» только телу больше BODY_MAX = 65 536 байт (tools/src/web/config.js:11); этот ответ принадлежит чату, а не кнопкам, и критерием 6 не проверяется.

      Откуда запись. Страница ничего не пишет в журнал сама. Сервер (tools/src/web/)
      передаёт команду единственным входом команд — `deliver` модуля
      tools/src/team/engine/channel.js (решения 0020, 0024, 0025, W1): если проект ведёт
      живой движок — через файл-очередь inbox/ с ожиданием подтверждения не дольше 10 с
      (как чат, критерий 15 REQ-011); если замка нет или он мёртвый — запись делают
      команды движка через API ядра; если право записи держит не движок —
      «команда не выполнена, повторите через несколько секунд». «Продолжить» проекта на
      паузе, которого сейчас не ведёт ни один движок (например, после перезапуска
      сервера), запускает движок этого проекта в процессе сервера в режиме `resume` — как
      сегодня сервер запускает движок нового проекта (решение 0025, W1); без этого
      запись «проект возобновлён» была бы, а работа не шла бы (`deliver` для `resume`
      без работающего движка бросает E_INTERNAL и ничего не пишет: `channel.js` передаёт
      `config: null`; дефект заведён — docs/issues/ISS-0018, на сервер не влияет, потому что
      сервер запускает движок сам). Эта правка W1 записана: decisions/0030, п. 2 (файл
      tools/src/web/engines.js, режим resume вместо start для проекта на паузе, `child_process`
      по-прежнему запрещён); как именно — проект CODE-DESIGNER. Остановка сервера (Ctrl-C) по-прежнему ставит проекты на
      паузу (REQ-011, решение 0025): после перезапуска кнопка «Продолжить» ведёт их дальше.

      Защита записи — как у чата (решение 0025, W2, критерий 9 REQ-011): каждый запрос
      управления проверяет Host (127.0.0.1:<порт> или localhost:<порт>), Origin (тот же
      адрес), тип тела (application/json) и ключ страницы (заголовок X-Sai-Page, ключ
      этого запуска); ключ прежнего запуска — отдельный отказ «обновите страницу». Один
      запрос — одно действие из трёх; лишние поля, неизвестное действие, тело не JSON —
      «Запрос не понят». Идентификатор проекта, которого нет, или вида «../x» — один и тот
      же ответ «Не найдено». Адрес запроса и форму тела выбирает проект CODE-DESIGNER;
      тесты берут их оттуда.

      Тексты — простым русским, как остальные тексты Sai Team (критерий 7 REQ-011): ни
      «%», ни слова «процент», ни слов из списка критерия 7 REQ-011, ни кодов статусов,
      ролей и ошибок, ни названий команд и частей системы («resume», «pause», «stop»,
      «движок», «канал», «очередь», «ack», «замок»). Тексты ошибок движка (E_STOPPED и
      другие в tools/src/team/errors.js) на странице не показываются: у страницы свои
      тексты — перечень в критерии 7. Прежний текст «Проект приостановлен, продолжите его
      командой resume» заменяется текстом с кнопкой: «Проект на паузе. Нажмите
      «Продолжить», чтобы работа пошла дальше».

      Что видит человек при сбое (Q10). Каждый сбой — понятный текст рядом с кнопками,
      без трассировки и кодов; кнопки снова доступны; сервер отвечает на следующий запрос;
      состояние проекта на странице всегда берётся из журнала при ближайшем обновлении
      (не реже раза в 5 секунд, критерий 8 REQ-011), а не из ответа на нажатие (R2): если
      подтверждение потерялось, а событие записано, страница через обновление покажет
      правду. Сбои: нет подтверждения за 10 с (движок завис), движок завершается, диск не
      принимает записи, другой писатель держит проект, проект уже в другом состоянии
      (команда из терминала или второй вкладки опередила), вопрос без ответа мешает
      продолжить, потолок расходов исчерпан.

      Безопасность. Q7: ни ключ страницы, ни тексты команд в ответах и логах не
      печатаются. Q10: выше. Q8 для проектов: путь одного проекта не даёт управлять
      другим, несуществующий идентификатор — «Не найдено». Q11 неприменим: сервер не
      ходит по адресам, которые задаёт пользователь. Q9 и R3 неприменимы (SQL и фото
