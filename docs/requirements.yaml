      слушает только 127.0.0.1 (decisions/0003, 0011; REQ-011). Запись отвечает: как
      включается иной адрес (по умолчанию — только 127.0.0.1; иной — только явной
      настройкой при запуске сервера, её имя — в записи) и какие Host и Origin
      принимаются в этом режиме; способ входа (имя и пароль; пароль хранится только как
