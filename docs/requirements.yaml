      - "Правила и тесты traces не ослаблены, проверки traces те же. `git diff base/<RUN-ID> -- tools/test/traces-check.test.js tools/test/traces-faults.test.js tools/test/traces-readme.test.js tools/traces/` пусто; единственное разрешённое изменение теста — в tools/test/traces-runtime.test.js добавлена в массив CHILD_PROCESS_FILES одна строка с путём tools/src/handoffs/git-history.js (в массиве путь пишется от tools/src/: `handoffs/git-history.js`), остальные проверки теста не тронуты: `git diff base/<RUN-ID> -- tools/test/traces-runtime.test.js | grep -c '^+[^+]'` равно 1, эта строка содержит `handoffs/git-history.js`, `git diff base/<RUN-ID> -- tools/test/traces-runtime.test.js | grep -c '^-[^-]'` равно 0 (случаи TC-* и TR-* не изменены); `git diff --name-only base/<RUN-ID> -- tools/src/traces/` — только tools/src/traces/rules.js, и в нём изменение только добавляет функцию и экспорт (`git diff base/<RUN-ID> -- tools/src/traces/rules.js | grep -c '^-[^-]'` равно 0); тесты traces-* проходят; `cd tools && npm run traces` — код 0, следов 0"
