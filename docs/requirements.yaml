  - id: REQ-024
    title: Sai Team, часть 14 — рабочие пространства — проекты разделены по пространствам, роль в каждом пространстве своя, перенос прежних проектов
    owner: BACKEND-DEV   # пространства и разделение данных; выбор пространства на странице — FRONTEND-DEV
    status: pending
    depends_on: [REQ-023]   # роли и права — REQ-023; через него — REQ-018 (вход), REQ-015, REQ-016, REQ-017 (данные, которые разделяются, и решения окна); цепочку хешей журнала пространства добавляет REQ-019
    original_request: >
      «Тебе нужно сформировать требования по проекту, которые были не реализованы или
      реализованы. Accept критерии приемок должны быть. То есть суть в том, что сай
      проект должен самостоятельно работать без участия других проектов, но он должен
      взять лучшее с проектов просто требования составь и все а потом это мы сделаем на
      сонете» (владелец, 2026-10-06, сообщение в сессии Claude Code; дословно — в задании
      handoffs/REQ-20261006-01/step-01-req-analyst.json). Видение того же дня —
      decisions/0015, раздел «Основание».
    description: >
      Что получает владелец. Проекты разных команд или направлений не смешиваются:
      каждый проект — в своём рабочем пространстве, и его видят только участники этого
      пространства. Из лучшего у [образца] берётся смысл: рабочее пространство как
      единица разделения данных. Третья из трёх частей бывшего REQ-018 (прогон
      REQ-20261006-01, замечание F11).

      Рабочее пространство — единица разделения, как магазин в Q8: проект принадлежит
      одному пространству; у пользователя в каждом пространстве своя роль по таблице
      REQ-023 (можно быть владельцем в одном и наблюдателем в другом). Текущее
      пространство хранится в сессии на сервере и выбирается пользователем только из
      тех, где он участник; пространство берётся из сессии, а не из запроса. На проект,
      результат, память, вопрос и журнал решений чужого пространства ответ тот же, что
      на несуществующий; окно решений REQ-017 и журнал решений показывают только
      текущее пространство. Создаёт пространство и назначает первого его владельца
      владелец установки (владелец этого компьютера) командой терминала; добавить
      участника в пространство и убрать его оттуда может тоже только он, командой
      терминала (как добавление и удаление пользователя, REQ-018 и таблица прав
      REQ-023); со страницы этих действий нет. Владелец пространства со страницы
      меняет роли участников (REQ-023).

      Журнал пространства — свой у каждого пространства: действия людей внутри него —
      участник добавлен в пространство или убран из него, роль изменена, решение в
      окне REQ-017 (ответ на вопрос), изменение настроек проекта или пространства
      (потолок расходов и другие настройки, которые меняет страница). Вход, неверный
      вход, выход и сброс пароля сюда не пишутся — они в журнале входа REQ-018. Строка
      — одна JSON-строка: время UTC, вид, автор (пользователь сессии или «терминал
      этого компьютера»), пространство, проект (если действие о проекте), кого или
      что касается, прежнее и новое значение (для роли и настроек); паролей и cookie
      нет. Файл только дописывается: строки не правятся и не удаляются, у кода нет
      пути перезаписи или усечения; права файла 0600, папки — 0700. Место и имя
      файла — проект; цепочку хешей и проверку целостности добавляет REQ-019.

      Перенос: проекты, созданные до этого требования, попадают в пространство по
      умолчанию первого владельца без потерь; журналы проектов не меняются
      (принадлежность записывается отдельно — место в проекте CODE-DESIGNER).

      Безопасность. Принцип Q8 для пространств — критерии 1 и 2; движок REQ-013 и
      подбор памяти REQ-016 уже не смешивают проекты, здесь разделение — на уровне
      доступа людей. Q7: как REQ-018. Q10: испорченный файл пространств — сервер не
      стартует с понятным текстом, а не показывает всё всем. Q9, Q11, R3 неприменимы.
      Pixel Office (REQ-012) работает на этом компьютере и в этом требовании не
      разделяется по пространствам.

      Файлы (от корня Sai): tools/src/team/ (пространства, принадлежность проектов,
      команды терминала), tools/src/web/ (выбор пространства, фильтр по сессии),
      tools/test/team-spaces*.test.js, tools/README.md (раздел «## Sai Team —
      пользователи»).

      Вне области: перенос проекта между пространствами, приглашения по почте,
      пространство из нескольких компьютеров, разделение Pixel Office по
      пространствам, оплата и тарифы.
    acceptance_criteria:
      - "Пространства разделены (принцип Q8). Тест tools/test/team-spaces.test.js:
        пользователь пространства A запрашивает список проектов, проект, результат,
        память, окно решений, журнал решений и отвечает на вопрос проекта пространства
        B — список и окно без данных B, остальное — тот же код и тело, что для
        несуществующего идентификатора, журнал B не изменён (хеш); идентификатор
        пространства в теле, адресе или заголовке запроса, отличный от пространства
        сессии, не меняет ответа"
      - "Роль в каждом пространстве своя. Тест: пользователь — владелец в A и
        наблюдатель в B: в A поднять потолок можно, в B любое действие записи — отказ
        по таблице REQ-023, журнал не изменён (хеш)"
      - "Выбор пространства. Тест: пользователь выбирает пространство, где он участник,
        — следующие ответы относятся к нему; выбор пространства, где он не участник, и
        несуществующего — один и тот же отказ, текущее пространство сессии не
        изменилось; пространство создаётся, участник добавляется в пространство и
        убирается из него только командой терминала (такие запросы со страницы от
        любой роли — отказ, файлы пространств и пользователей не изменены, хеш)"
      - "Журнал пространства. Тест tools/test/team-spaces-journal.test.js: добавление
        участника в A и удаление его из A командой терминала, смена роли со страницы,
        ответ на вопрос в окне REQ-017 и подъём потолка в проекте A дают ровно по одной
        строке в журнале пространства A в этом порядке, каждая — JSON с временем UTC,
        видом, автором, пространством, проектом (где есть), кого касается и (для роли и
        потолка) прежним и новым значением; журнал пространства B не изменён (хеш);
        вход, неверный вход и выход в журнале пространства строк не дают; пароль
        фикстуры и значение cookie в файле не встречаются; после каждого события прежнее
        содержимое файла — неизменённое начало нового (только дописывание); `stat` —
        0600 у файла и 0700 у его папки"
      - "Перенос прежних проектов. Тест: SAI_TEAM_HOME с тремя проектами, созданными
        до пространств, после первого запуска — все три в пространстве по умолчанию
        первого владельца, журналы проектов байт-в-байт те же (хеши)"
      - "Сбой (Q10). Тест: испорченный файл пространств — сервер не стартует, код не 0,
        понятный текст, без трассировки стека"
      - "Документация и проверка (Q4). tools/README.md, раздел «## Sai Team —
        пользователи»: пространства, роль в каждом, создание пространства, добавление
        и удаление участника командой терминала, журнал пространства, перенос прежних
        проектов; на копии каталога Sai без node_modules `cd tools && npm ci &&
        npm run check` — код 0; вывод приложен"

  - id: REQ-025
    title: Зрелость Sai не ниже [образца] — рамка приёмки — каждая возможность и каждый признак инженерной зрелости [образца] имеют у Sai равное или лучшее с измеримой проверкой (таблица паритета, раздел 8)
    owner: ORCH   # рамка: сверяет таблицу и требования; работу по строкам делают владельцы требований из столбца «Требование Sai»; запись «не нужно» — DOC-UPDATER по слову владельца
    status: pending
    depends_on: [REQ-001, REQ-002, REQ-009, REQ-010, REQ-011, REQ-012, REQ-013, REQ-014, REQ-015, REQ-016, REQ-017, REQ-018, REQ-019, REQ-020, REQ-021, REQ-022, REQ-023, REQ-024, REQ-026, REQ-027, REQ-028, REQ-029, REQ-030, REQ-031, REQ-032, REQ-033, REQ-034]   # все требования из столбца «Требование Sai» раздела 8 docs/product/parity-matrix.md; REQ-025 — рамка приёмки, текущие работы не ждут её
    original_request: >
      «Sai по зрелости должен быть одинаковым или луше чем sai. пойми это проект моего
      ментора и он сказал чтобы не был хуже чем его. поэтому требование надо провести и
      составить и проверить требование» (владелец, 2026-10-10, сообщение в сессии Claude
      Code; передано ORCH дословно в задании
      handoffs/REQ-20261010-01/step-01-req-analyst.json; опечатки владельца сохранены;
      «sai» во второй раз — владелец имеет в виду [образец], пояснение ORCH). Раньше, 2026-10-06:
      «Главный ориентир: максимально автономная виртуальная команда + предельно простой UX
      для бизнеса + Pixel Office как живое зеркало реальной работы + качество продукта не
      хуже [образца], а в ключевых сценариях лучше.» (дословно — decisions/0015, раздел
      «Основание»). Слова «он должен быть самостоятельным и не хуже проекта [образец]» —
      источник: сообщение владельца в сессии Claude Code 2026-10-06 (decisions/0022, D1; в файлах
      Sai дословно не хранились).
    description: >
      Что получает владелец. Измеримый ответ на вопрос «Sai не хуже [образца]?» — не
      на словах, а построчно: для каждой возможности и каждого признака инженерной
      зрелости [образца] у Sai есть равное или лучшее, и у каждой строки названо, чем это
      проверить. [Образец] — проект ментора владельца; в файлах Sai он называется только
      «[образец]» (decisions/0019).

      Что значит «не хуже». Перечень — раздел 8 docs/product/parity-matrix.md,
      перепроверенный 2026-10-10 чтением кода [образца], а не по прежней таблице раздела 3:
      45 возможностей (П-01…П-45), 19 признаков зрелости (З-01…З-19) и 7 мест, где Sai
      лучше (Л-01…Л-07). У каждой строки в столбце «Требование Sai» — номер требования,
      которое даёт равное или лучшее, или «не нужно» с причиной. «Не нужно» принято
      решением decisions/0022 (D2; владелец может отменить). Где [образец] пуст — цель обычным языком, агенты, живой офис,
      память, обновление без перезагрузки, лента простыми словами — Sai лучше: REQ-011,
      REQ-012, REQ-013, REQ-015, REQ-016, REQ-022 (раздел 8.3).

      Уже равно или лучше (по чтению кода и файлов Sai на 2026-10-10): журнал событий
      только на добавление и восстановление (REQ-009), повторы при сбое (REQ-010), движок
      с параллельностью и согласованиями (REQ-013), самостоятельность без базы, службы
      входа и контейнеров (REQ-014), Pixel Office на настоящих событиях (REQ-001, REQ-007),
      одна команда проверки `cd tools && npm run check` (REQ-002), 996 тестов, планка
      Q1–Q14 и R1–R3, 37 ролей и 7 процессов против 19 ролей и 5 процессов у [образца].
      Эти требования ещё не все в статусе done — строка закрывается их статусом, а не
      этим описанием.

      Пробелы — возможности [образца], которых нет ни в одном требовании Sai. Вариант
      по умолчанию, который предлагает аналитик (решает владелец): новые требования
      REQ-026 (сроки и таймеры), REQ-027 (здоровье, метрики и сигналы тревоги), REQ-028
      (тексты интерфейса: словарь, второй язык, справка), REQ-029 (выгрузка и загрузка
      проекта), REQ-030 (проверка на GitHub при каждой отправке), REQ-031 (тесты
      свойств), REQ-032 (руководства разработчика), REQ-033 (тесты страниц на jsdom), REQ-034
      (версии шаблонов и откат); «не нужно» — 18 строк, перечисленных в критерии (б), у каждой причина в
      таблице. Вебхуки (П-30) — «не нужно» (decisions/0022, D3), потому что противоречат
      REQ-014 (во время работы сеть — только 127.0.0.1); сделать их можно только после
      решения владельца, которое меняет границу REQ-014.

      Тесты (decisions/0022, D4, уточнено decisions/0023, D4). Сравнение — по плотности и
      по видам, а не по числу. Плотность = тесты × 1 000 ÷ строки кода без тестов; обе
      стороны считаются командами критерия (в). На 2026-10-10 у [образца] 5 186 тестов
      на 118 383 строки (91 500 сервера и 26 883 страниц) — 43,8 на 1 000; у Sai 996
      тестов на 23 174 строки tools/src — 43,0. Условие без допуска (слова владельца
      «одинаковым или лучше»): плотность Sai не ниже плотности [образца] на день
      проверки. Сегодня 43,0 против 43,8: разрыв признан и закрывается новыми тестами
      при реализации требований (REQ-026…REQ-034 приносят тесты вместе с кодом);
      REQ-025 не станет done, пока разрыва нет. Те же виды тестов: обычные, свойств
      (REQ-031), страниц на настоящем сервере и коде страниц (REQ-033, аналог
      браузерных тестов [образца]). Абсолютные числа — справка.

      Безопасность и самостоятельность. Ни одной строки кода, текста или названия из
      [образца] в Sai: RELEASE-VALIDATOR читает [образец] только на чтение; `npm run
      traces` (REQ-014) ловит названия. Q8, Q9, Q10, Q11, R3 — в требованиях из столбца
      «Требование Sai», здесь своих путей к данным нет.

      Файлы (от корня Sai): docs/product/parity-matrix.md (раздел 8),
      docs/product/requirements-catalog.md, decisions/NNNN-*.md (запись «что из
      [образца] Sai не делает»; пишет DOC-UPDATER по слову владельца).

      Вне области: перенос кода или текстов [образца]; сравнение с другими проектами;
      обновление таблицы при каждом изменении [образца] — RELEASE-VALIDATOR сверяет
      таблицу с [образцом] на день проверки (критерий (д)), и новая возможность [образца]
      — новая строка через WF-01.
    acceptance_criteria:
      - >-
        (а) Перечень полон и у каждой строки есть ответ. docs/product/parity-matrix.md,
        раздел «## 8. Паритет»: строки П-01…П-45, З-01…З-19, Л-01…Л-07, у каждой пять
        столбцов (№, возможность, у [образца], требование Sai, проверка). Команда
        `awk -F'|' '/^[|] [ПЗЛ]-[0-9][0-9] [|]/{n++; if ($5 !~ /REQ-[0-9]|не нужно|уже лучше/) bad++} END{print n, bad+0}' docs/product/parity-matrix.md`
        печатает `71 0`; каждый номер из столбца «Требование Sai» есть в
        docs/requirements.yaml — команда
        `awk -F'|' '/^[|] [ПЗЛ]-/{print $5}' docs/product/parity-matrix.md | grep -oE 'REQ-[0-9]{3}' | sort -u | while read r; do grep -qx "  - id: $r" docs/requirements.yaml || echo $r; done`
        ничего не печатает; у каждой строки в столбце «Проверка» назван тест, команда,
        файл или номера критериев требования (чтение таблицы)
      - >-
        (б) «Не нужно» принято решением 0022 (владелец может отменить). Запись
        decisions/0022-parity-frame.md (D2, D3) называет каждую строку со словом «не
        нужно» в столбце «Требование Sai» — на 2026-10-10 это П-04, П-07, П-13, П-14, П-19, П-21, П-22, П-23, П-24,
        П-25, П-27, П-30, П-36, П-37, П-40, П-43, П-45, З-11 (18 строк) — с причиной
        в таблице паритета (вебхуки П-30 — D3). Команда `awk -F'|' '/^[|] [ПЗЛ]-/ && $5 ~ /не нужно/{n++} END{print n}' docs/product/parity-matrix.md`
        печатает `18`; ссылка на 0022 есть в разделе 8 таблицы: `grep -c 'decisions/0022' docs/product/parity-matrix.md`
        не меньше 1. Каждая новая строка «не нужно» после 18 — поправкой к 0022. Строка,
        которую владелец отменил, получает новое требование (WF-01), и его номер встаёт
        в столбец «Требование Sai» вместо «не нужно»
      - >-
        (в) Признаки зрелости измеримы, плотность тестов — не ниже. Строки З-01…З-19
        закрыты своими проверками: права — таблица прав и тест на каждый отказ (REQ-023);
        аудит — журнал только на добавление с цепочкой хешей и проверкой командой
        (REQ-019); повторы — тест «временная ошибка → повтор → очередь проблем» (REQ-010,
        REQ-021); таймеры, тревоги, здоровье и метрики, переводы — REQ-026, REQ-027,
        REQ-028; документация — README, требования с критериями, решения, журнал ошибок,
