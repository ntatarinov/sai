      форму того, что владелец уже применяет в своей работе с агентами; в Sai это свои
      роли, правила и процессы, написанные своими словами (шаг 2c итерации 2,
      handoffs/SA-20261001-01/). План честно отделяет собственную работу владельца от
      методов, взятых из чужих образцов: взятое названо по существу, без названия
      проекта-образца, и нигде не подаётся как продукт или работа владельца; права на
