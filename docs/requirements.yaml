      - "Слова событий — одна таблица. В tools/src/pixel-office/public/texts.js одна таблица слов событий на 12 случаев описания (слова на странице, «что это значит», «чего не доказывает», тексты причин пометки), значения равны текстам таблицы описания буквально; журнал, раскрытие события, карточка агента (REQ-044) и хронология окна «Просмотр истории» для событий хуков берут слова из неё; у записи оркестратора в хронологии окна остаётся подпись «Оркестратор записал» (HISTORY_NOTE_BY, критерий 10 REQ-008, decisions/0011 (д)), а слова случая 11 — в журнале и раскрытии. Прежних слов «субагент запущен», «субагент закончил», «вызов субагента», «запрос отправлен», «ответ закончен», «сессия началась», «сессия закончилась» в странице нет. Проверка: тест JR-01 в tools/test/pixel-office-panels.test.js — литералы 12 случаев записаны в тесте и равны значениям таблицы; на последовательности со всеми видами событий (в том числе повторный SubagentStart, UserPromptSubmit трёх видов, запись оркестратора, три вида пометок) у каждой строки журнала слово события равно значению своего случая с подставленной ролью из этой же строки; в хронологии окна у записи оркестратора — HISTORY_NOTE_BY; `grep -rnE 'субагент запущен|субагент закончил|вызов субагента|запрос отправлен|ответ закончен|сессия началась|сессия закончилась' tools/src/pixel-office/public/` — пусто (код 1; сейчас находит 7 строк texts.js); идентификаторы JR-01…JR-09 свободны (`grep -rn '\"JR-' tools/test/` сейчас ничего не находит)"
      - "Строка журнала — событие, а не текущее состояние; прошлые строки не переписываются. У строки: время (часы, минуты, секунды по поясу компьютера, как сейчас), «кто» (у событий основной сессии — «Основная сессия», у SubagentStart и SubagentStop — название роли по agent_type этой строки, у PostToolUse — передавший по этой строке, у записи оркестратора — «Оркестратор»), слова события (роль — только из этой строки, описание таблицы), описание задачи (у PostToolUse — своё; у SubagentStart и SubagentStop — по связи z, как сейчас; у записи оркестратора — нет), 8 знаков сессии и у помеченных правилом чтения — пометка «не подтверждена» без значения source (оно — в раскрытии; слова — REQ-048). Слов состояний (STATE_LABELS), возраста и слов легенды в строке нет. Неизменность: для журнала L и его начала из k строк у каждой строки с номером меньше k время, «кто», слова события, сессия, agent_id и источник одинаковы при k строках и при всех строках и при любом сдвиге часов страницы. Задним числом могут меняться только два поля, и это названо: (1) описание у SubagentStart и SubagentStop — по связи z оно появляется, когда придёт связанная строка PostToolUse, и пропадает, когда связанных строк станет несколько (критерий 6(з) REQ-001); (2) пометка правила чтения («не подтверждена») по правилам (б) и (в) критерия 4 REQ-001 (конфликт времени, время из будущего) — она может появиться или сняться с приходом следующих строк и со сдвигом часов, и вместе с ней тексты «что это значит» и «чего не доказывает» в раскрытии переходят между случаем 12 и случаем вида этой строки; слова события и «кто» при этом не меняются. Это правило чтения и связь идентификаторов, а не текущее состояние агента. Проверка: тест JR-02 в tools/test/pixel-office-panels.test.js — последовательность в двух порядках: (i) передача задания (PostToolUse с subagent_type), затем начало агента, окончание, SessionEnd, запись запуска сервера; (ii) начало агента, окончание, затем передача задания (порядок переднего плана); часы до и после порога STALE_AFTER_MS; виды строк для каждого начала журнала сравниваются с видами для полного журнала: время, «кто», слова, сессия, agent_id и источник равны всегда, у строки PostToolUse слова одинаковы до и после прихода SubagentStart; описание у SubagentStart в (ii) появляется только после строки PostToolUse; отдельно: последняя строка со временем из будущего — пометка future и тексты случая 12, после следующей строки пометки нет и тексты — своего случая, слова события те же; ни в одной строке нет значения из STATE_LABELS"
      # 2026-10-15, прогон PIXEL-20261015-01, WF-01 шаг 1, доработка r4 (REQ-ANALYST): было → стало, REQ-048, decisions/0058; номер и статус не менялись; G4: «не Claude Code, в журнале записано: {source}» → «не Claude Code», значение source — только в «Технических полях»; ссылка на порядок полей — REQ-049, критерий 2 (после деления REQ-048, decisions/0058, п. 2). В таблице описания (случай 12) причина source — «строку записал не Claude Code» без значения.
      - "Событие раскрывается. Нажатие мышью на строку журнала и Enter или Space на строке в фокусе (строка достигается Tab) раскрывает событие; повторное нажатие, кнопка «Закрыть» или Escape при фокусе внутри раскрытия закрывают его, фокус возвращается на строку. В раскрытии, в таком порядке (REQ-049, критерий 2): «Что произошло» — слова и «что это значит»; «Чего это не доказывает»; «Когда» — дата и время с секундами и пояс; «Источник» — «Claude Code» (REAL), «запись оркестратора» (ORCH) или «не Claude Code» (значение source — только в свёрнутом раскрытии «Технические поля», REQ-048); «Сессия» — 8 знаков и полное значение раскрытием; «Агент» — название роли и 8 знаков agent_id, у событий основной сессии — «основная сессия: у этого события агента нет», у записи оркестратора — «оркестратор»; «Задача» — роль, 8 знаков ключа и слово её состояния сейчас с подписью «сейчас» (у UserPromptSubmit и Stop — строка основной сессии этого запроса), у SessionStart и SessionEnd — «к задаче не относится», у SubagentStop без записанного начала — «задача не найдена: её начало не записано»; у помеченной строки — пометка «не подтверждена: » с причиной; «Технические поля» — раскрытием, закрытым по умолчанию: каждое поле строки, кроме prompt_text, в порядке LINE_KEYS, как «ключ: значение» текстом. Строка запроса владельца с окном сохраняет отдельный элемент «открыть историю запроса», который открывает окно по нажатию и по Enter (критерии REQ-008 об открытии окна и клавиатуре не меняются). Новая строка журнала и плановое обновление не закрывают раскрытие и не уводят фокус. Проверка: тест JR-03 в tools/test/pixel-office-page.test.js — по одной строке каждого из 12 случаев: поля раскрытия по этому критерию; keydown Enter и Space раскрывают, Escape закрывает, document.activeElement — строка; prompt_text не появляется в тексте раскрытия; запрос владельца: элемент «открыть историю запроса» открывает окно; после новой строки и пересчёта раскрытие открыто"
      - "Записи оркестратора — строки журнала своим источником. Каждая запись оркестратора (isNoteLine, schema.js) — строка журнала в порядке файла: «кто» — «Оркестратор», слова — случай 11, сессия — её session_id, если он есть, иначе «сессия не указана»; ни текста записи, ни номера требования в строке нет (запрет критерия «Журнал как на образце» REQ-007 относится к строке). Раскрытие записи (критерий 3) показывает её текст полностью (метки «[скрыто]» — отдельными элементами, как в окне истории), номер требования (req_id), если он есть, время запроса и пометку «оркестратор не указал запрос — запись отнесена к последнему запросу владельца» (request_time_auto). Записи оркестратора входят во «Всё» и не входят в «Работа» и «Офис»; счётчик «N из M» во «Всё» считает их; они не меняют задач, строк основной сессии, состояний, офиса и числа N строки «Сейчас» (критерий 7 REQ-042 — тест FS-01 проходит без правки). Проверка: тест JR-04 в tools/test/pixel-office-panels.test.js — журнал с двумя записями оркестратора (одна с session_id, req_id и request_time, одна без них): две строки «Оркестратор записал, как понял запрос» на своих местах, в тексте строк нет note_text и req_id, в раскрытии они есть; «Работа» и «Офис» дают прежние строки; модель задач и офис те же, что без этих строк"
      - "Слова не обещают больше, чем знает источник (R2). В таблице и во всех текстах журнала и раскрытия нет слов успеха: `grep -rniE 'заверш|готов|выполнен|успешн' tools/src/pixel-office/public/ | grep -v HISTORY_META_FINISHED` ничего не печатает (критерий 8 REQ-042; сейчас пусто, код 1); тексты «чего не доказывает» начинаются словами «Не доказывает»; тест сравнивает значения целиком, а не ищет фразу (урок AP-083): у Stop текст называет агентов, запущенных параллельно, и продолжение сессии, у SubagentStop — что задание не обязательно сделано и итог не записан, у PostToolUse — что время записи не время начала работы (литералы таблицы, JR-01). Проверка: команда выше и тест JR-01"
      - "Текст — только как текст (Q7, решение 0013). Роль, описание, идентификаторы, текст записи оркестратора и значения технических полей вида <img src=x onerror=alert(1)> и <script>window.__x=1</script> в строке и в раскрытии показаны буквально, элементов img и script не создают, window.__x не задан; `grep -rnE 'innerHTML|outerHTML|insertAdjacentHTML|document[.]write' tools/src/pixel-office/public/` — пусто (код 1; сейчас пусто); страница отправляет только GET (критерий 10 REQ-042, та же команда). Проверка: тест JR-05 в tools/test/pixel-office-page.test.js и команды выше"
      - "Плохие и пустые условия не ломают журнал (Q10 — кривой ввод). Случаи: пустой журнал (прежний текст EMPTY_JOURNAL и подсказка); строка основной сессии без agent_type — «Основная сессия»; agent_type или subagent_type пуст — «(роль не указана)»; время строки не читается — «время не записано» в строке и в раскрытии; агент события без записанной задачи; запись оркестратора без session_id и request_time; идентификаторы по 128 знаков; связь с сервером потеряна при открытом раскрытии — журнал и раскрытие прежние (PN-02). Ни в одном случае нет исключения, а в тексте журнала и раскрытия нет «undefined», «null», «NaN» и «[object». Проверка: тест JR-06 в tools/test/pixel-office-page.test.js — по сценарию на каждый случай; textContent журнала не совпадает с выражением undefined|null|NaN|[[]object"
      - "Приёмка в браузере с нажатиями — только на стенде с вымышленными данными (decisions/0054, дополнение 2, п. 2). Стенд — как в критерии 10 REQ-044 (отдельный экземпляр сервера, журнал-образец по правилам критерия 9 REQ-042) с записью оркестратора и строкой с временем в конфликте. Журнал владельца, его копии и снимки с них не используются. Шаги и ожидаемое, буквально: 1) прочитать строки журнала стенда — у начала агента «Агент «<роль>» получил задание и начал работу», у повторного начала «… продолжил работу», у окончания «… закончил работу и вернул ответ», у конца ответа «Основная сессия вернула ответ», у передачи «Задание передано агенту «<роль>»», у записи оркестратора «Оркестратор записал, как понял запрос» без текста записи в строке; 2) нажать на строку окончания агента — раскрылось: первыми «Что произошло» и «Чего это не доказывает» с текстом случая 9, затем «Когда», «Источник: Claude Code», «Сессия», «Агент», «Задача» со словом состояния и подписью «сейчас»; раскрыть «Технические поля» — hook_event_name: SubagentStop и agent_id полностью; 3) Escape — раскрытие закрыто, фокус на строке; Tab до другой строки, Enter — раскрылась она; раскрыть запись оркестратора — её текст и номер требования; 4) окна 1470×784 и 375×812 — нет горизонтальной прокрутки (document.documentElement.scrollWidth не больше window.innerWidth); слова строки и раскрытия не рвутся по буквам — способ замера как в критерии 14 (а) REQ-042: у каждой части, отделённой пробелом или дефисом, Range.getClientRects() даёт один прямоугольник; у каждой строки журнала в фокусе видно кольцо фокуса (getComputedStyle: outline-style не none или box-shadow не none). Сценарии пишет BA-ANALYST (docs/uat/REQ-045.md, WF-02, шаг 8), итог и снимки стенда — docs/uat/REQ-045-RUN.md; RELEASE-VALIDATOR на шаге 9 повторяет шаги 2, 3 и 4 сам"
      - "Документация и проверка не обходится (Q4, Q6, AP-005). tools/README.md, раздел «## Pixel Office»: таблица событий журнала (слова, что значит, чего не доказывает), раскрытие события, записи оркестратора в журнале, какие поля строки могут измениться задним числом (критерий 2). Проверка: `awk '/^## Pixel Office/{f=1;next} /^## /{f=0} f' tools/README.md | grep -c 'Чего это не доказывает'` не меньше 1 (сейчас 0); тот же awk с `grep -c 'Оркестратор записал, как понял запрос'` не меньше 1 (сейчас 0); `cd tools && node --test test/pixel-office-docs.test.js` — код 0. Принятые тесты, чьи ожидания меняет это требование (EVENT_LABELS в pixel-office-panels.test.js и pixel-office-page.test.js, число строк «Всё» при записях оркестратора, строка запроса как единственная открываемая строка журнала), не удаляются и не слабеют, а заменяются: каждая замена — в таблице «прежняя проверка → новая» проекта docs/design/REQ-045-*.md с идентификатором прежнего теста; число строк `^test(` и вхождений `assert[.]` в каждом файле tools/test/pixel-office-*.test.js не меньше, чем на метке base/<RUN-ID> (как критерий 11 REQ-044; метки нет — «база не задана», PASS на этом пункте нет). `cd tools && npm run check` — код 0, в итоге node --test «skipped 0» и «todo 0»; в тексте нет путей этого компьютера и названий других проектов"
  - id: REQ-046
    title: Pixel Office — навигация по журналу — фильтры по сессии, агенту, задаче и типу события вместе с прежними «Всё», «Работа», «Офис», поиск, «Показать более ранние» и переходы от события к задаче в панели и к истории запроса
    owner: FRONTEND-DEV   # вся работа — страница (tools/src/pixel-office/public/); вид фильтров и поиска — описание интерфейса GUI-DESIGN-ANALYST (decisions/0054, п. 3); второй прогон WF-02: REQ-046 + REQ-047 (decisions/0054, дополнение 2, п. 1)
