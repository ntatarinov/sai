      запрошен снова; (5) цель не достигнута — «система добавила задачи, раунд k»; (6)
      проект ждёт решения пользователя (ссылка на окно REQ-017); (7) новое: работа
      прервана аварией — проект «на паузе» после восстановления (REQ-009) или в работе,
      а право записи никто не держит, — «работа остановилась, нужно продолжить», с
      кнопкой «Продолжить» (resume REQ-013); (8) новое: израсходовано не меньше 80 %
      потолка (число из состояния, слово «процент» в тексте не используется:
      «израсходовано $X из $Y»). У каждой проблемы — что не получилось (словами), что
      система делает дальше (из состояния движка: повторит, передаст, ждёт вас, ничего
      — нужно продолжить), открыта или решена; решённой её делает последующее событие
      журнала.

