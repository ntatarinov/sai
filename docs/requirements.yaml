      - "tools/README.md: раздел «## Pixel Office» — команда `npm run pixel-office` и вид строки со ссылкой с номером порта по умолчанию, как остановить сервер, каталог ~/.sai-pixel-office/ и что в нём, что из входа хука хранится и что нет, что видны только сессии, «в настройках которых есть обработчики Pixel Office», — запущенные в sai/, а сессии другой папки — только «при копии обработчиков» в её настройках проекта (со ссылкой https://code.claude.com/docs/en/settings), и что интерактивной сессии нужно принять диалог доверия к папке (https://code.claude.com/docs/en/hooks); в нём подраздел «### Ограничения» — задача может остаться «в работе», если событие окончания потеряно, а сервер не перезапускался (до следующего запуска сервера); страницу без входа может прочитать любая учётная запись этого компьютера через 127.0.0.1; правило чтения — обнаружение, а не защита: одной вписанной строки «из будущего» хватает, чтобы пометить «не из хуков» настоящие строки, пришедшие после неё со временем раньше её времени больше чем на 2 минуты; пометка снимается, когда таких строк станет на одну больше, чем вписанных, а если они больше не придут — остаётся навсегда (критерий 4); раздел «## Проверка» — команда `npm run check` (Q4: команда описана в README). Проверка: `grep -F` в tools/README.md каждой из строк «## Pixel Office», «npm run pixel-office», «~/.sai-pixel-office/», «https://code.claude.com/docs/en/settings», «в настройках которых есть обработчики Pixel Office», «при копии обработчиков», «https://code.claude.com/docs/en/hooks», «### Ограничения», «остаться «в работе»», «учётная запись», «одной вписанной строки», «навсегда», «## Проверка», «npm run check» — не меньше 1 строки на каждую; раздел о хранении текста по decisions/0011 (поправка 0011): подраздел «### Хранение текста» — что хранится (текст сообщений владельца и записи оркестратора «как понял»; ответы модели, входы и выходы инструментов и сообщения агентов — нет), предел 4 000 и 2 000 знаков, метка «[скрыто]», как от