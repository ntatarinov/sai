        хотя бы одного прогона по требованию Sai Team
      - >-
        (г) Пробелы оформлены. В docs/requirements.yaml есть блоки REQ-026…REQ-034 со
        всеми полями шапки и не меньше чем тремя критериями у каждого, каждый прошёл
