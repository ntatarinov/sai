      - "Сессия «Идёт» только при свежих данных; полоски прогресса и «n/m» нет. Сессия идёт, если её последняя строка — не SessionEnd, её последнее событие (определение — критерий 7) позже последнего запуска сервера (прежнее правило) и возраст этого события не больше STALE_AFTER_MS. Слово состояния карточки: «Идёт» у идущей сессии; «нет свежих данных» у сессии, которая не закончена SessionEnd, но возраст её последнего события больше STALE_AFTER_MS; во всех остальных случаях (закончена SessionEnd; не закончена, возраст не больше порога, но последнее событие раньше последнего запуска сервера) слова нет. Карточка сессии (над «Текущими» у идущей, в «Истории» у остальных — критерий 15 REQ-007) показывает первые 8 знаков session_id, это слово, время первого события сессии, время и возраст последнего события; элемента progress, подписи «задач n/m · ролей k» и самих чисел нет нигде. Проверка: tools/test/pixel-office-panels.test.js — две сессии без SessionEnd, у одной последнее событие в пределах порога, у другой старше: «Идёт» у первой, «нет свежих данных» у второй, число идущих сессий 1; сессия с SessionEnd (в том числе старше порога) — без слов «Идёт» и «нет свежих данных»; сессия не закончена, моложе порога, но последнее событие раньше записи запуска сервера — без слова; в DOM карточки нет элемента progress и подстрок «задач» и «ролей»; `grep -rnE 'SESSION_STATS|sessionStats|session-progress|session-stats|\"progress\"' tools/src/pixel-office/` — пусто (код 1)"
      - "Возраст последнего события виден на экране. У каждого элемента «в работе» и «нет свежих данных» в панели задач и в карточке агента и у каждой карточки сессии рядом со временем последнего события стоит возраст по часам страницы, слово «назад» и ничего другого: меньше минуты — «меньше минуты назад»; от минуты до 59 минут — «N мин назад»; от 60 минут до 23 часов 59 минут — «N ч M мин назад» (при M = 0 — «N ч назад»); от 24 часов — «N сут K ч назад» (при K = 0 — «N сут назад»); минуты округляются вниз. Возраст растёт без новых строк журнала — при плановом пересчёте (критерий 1). Слова возраста — константы в tools/src/pixel-office/public/texts.js. Проверка: tools/test/pixel-office-panels.test.js — таблица «возраст в мс → текст»: 0, 59 999, 60 000, 59 мин 59 с, 60 мин, 61 мин, 23 ч 59 мин, 24 ч, 50 ч 30 мин → «меньше минуты назад», «меньше минуты назад», «1 мин назад», «59 мин назад», «1 ч назад», «1 ч 1 мин назад», «23 ч 59 мин назад», «1 сут назад», «2 сут 2 ч назад»; на элементе «в работе» возраст есть, на закончившем работу нет; через 60 секунд поддельных часов без новых строк текст возраста изменился"
      - "Слова состояний. В tools/src/pixel-office/public/texts.js слова состояний: «в работе»; «нет свежих данных»; «закончила работу, итог не записан» (пришло событие окончания: SubagentStop у задачи, Stop у строки основной сессии); «окончание не записано» (задачи и строки, закрытые следующим запросом или событием окончания сессии); «сервер перезапускался, события не записывались» (критерий 6). Те же слова — в панели задач, карточке агента и окне «Просмотр истории» (REQ-008, оно берёт слова из той же таблицы). Слов «завершена» и «Недавно завершены» в странице нет, раздел карточки агента, который назывался «Недавно завершены», называет закончивших работу иначе (формулировку выбирает проект); запрет слов успеха шире и проверяется критерием 8. Проверка: tools/test/pixel-office-panels.test.js и tools/test/pixel-office-page.test.js — по одному элементу в каждом из пяти состояний: слово состояния в панели, в карточке агента и в окне истории равно значению таблицы, а значения таблицы равны словам этого критерия (литералы записаны в тесте)"
      - "Перезапуск сервера назван прямо. Задача без события окончания, после начала которой был запуск сервера (запись server-starts, критерий 6(в) REQ-001) и не было события окончания её сессии, показывается как «сервер перезапускался, события не записывались» — не «окончание не записано» и не «в работе»; если у её сессии было событие окончания после начала задачи (с запуском сервера или без) — «окончание не записано». То же у строки основной сессии, закрытой только запуском сервера (критерий 6(г) REQ-001); пришедший позже конец ответа (Stop) делает строку, а SubagentStop — задачу закончившей работу (как сегодня); если после начала строки пришёл следующий запрос или SessionEnd, строка — «окончание не записано», а не слово о перезапуске (REQ-001 критерий 6 (г)). Слово — пометка о том, что события в это время не записывались; оно не утверждает, что агент остановлен. Это состояние, как и «нет свежих данных», относится к одному семейству «подтверждения нет»: оно не считается «в работе», но входит в число N строки «Сейчас» (критерий 13, решение 0051), а «окончание не записано» не входит. Время запуска сервера по-прежнему в разделе «Запуски сервера» панели задач (критерий 6(в) REQ-001). Проверка: tools/test/pixel-office-page.test.js — (1) старт субагента, затем запись запуска сервера: слово «сервер перезапускался, события не записывались»; (2) то же и SessionEnd той же сессии после старта: «окончание не записано»; (3) UserPromptSubmit основной сессии, затем запись запуска сервера: слово «сервер перезапускался…», затем Stop: слово закончившей работу; (4) старт субагента после записи запуска сервера: «в работе»; (4а) запрос основной сессии, запись запуска сервера, следующий запрос — прежняя строка «окончание не записано»; (4б) старт субагента, запись запуска сервера, SubagentStop — слово закончившей работу; (5) воспроизведение D5 на образце журнала (критерий 9): при запущенном после старта агента сервере «Сейчас: в работе ничего нет · без свежих данных: 1», пояснение назы