      проигрывается (решение D8, decisions/0005), а состояния, облачка, журнал и список от
      них не зависят (9). Ссылка «← Учётная система» — не переносится: у Sai нет
      системы, к которой она вела бы.

      Офис. Обстановка делится на две части. Неподвижная — тёмный клетчатый пол и стены
      вне зоны столов, растения, книжные полки, переговорная (большой стол, места вокруг
      него, доска на стене), кухня (стойка с кофемашиной, места отдыха), отдельные места
      отдыха в зале, серверная (стойки за стенами) и подписи «ПЕРЕГОВОРНАЯ», «КУХНЯ»,
      «СЕРВЕРНАЯ» — переносится как есть и не зависит ни от событий, ни от времени (12);
      от событий в ней зависит только доска-канбан со столбцами ролей — в честной форме:
      столбец на каждую роль с задачей в идущих сессиях (на образце — участники текущего
      требования) и «+N» для не поместившихся (13). Растущая — зона столов: столы с
      ноутбуком и стулом, перегородки между их колонками и место под них — в честной
      форме: столов столько, сколько ролей с задачами, и ещё стол основной сессии, а не
      12, как на образце; новые столы добавляются вместе с журналом, занятые не
      сдвигаются (раздел «Столы», критерий 1); экран ноутбука светится, пока роль работает
      (2). Места для всех в переговорной и места отдыха — обстановка: собраний и отдыха
      хуки не дают, поэтому туда никто не ходит (3). Раскладка под FullHD — доработка с
      образца (в его панели читается «…FullHD») — переносится: в окне 1920 × 1080 вся
      страница видна без прокрутки страницы, прокручиваются только списки журнала и
      панели задач (16).

      Персонажи. Фигурка цвета роли на стуле у своего стола, короткая подпись роли (у
      Sai — правило roleLabel, решение D13) и выделение выбранного персонажа —
      переносятся (1, 5). Персонаж «ORCH» образца — у Sai персонаж «Основная сессия»: роль
      основной сессии в событиях хуков не названа (1). Облачка реплик — в честной форме: короткие фразы из закрытого
      списка, каждая привязана к событию и видна только первые 10 секунд после него (10).
      Облачко «Да, конечно» — ответ на вопрос — не переносится. Персонажи, которые в
      простое стоят у чужого стола, сидят в переговорной или стоят у кухни, — не
      переносятся: на образце это следствие событий «вопрос», «совещание» и отдыха,
      которых хуки не дают; у Sai свободный персонаж сидит за своим столом (3). Легенда
      «<роль> · свободен / работает» с меткой цвета у работающих — переносится (11).

      Журнал. Заголовок «Журнал», фильтры «Всё», «Работа», «Офис», подпись пояса и
      счётчик «N из M» — в честной форме: «Работа» — события работы основной сессии и
      субагентов, «Офис» — строки, вызвавшие перемещение в офисе, пояс — часов
      компьютера владельца (критерий 6(е) REQ-001), а не постоянный «Алматы» (14). У
      строки — время, роль, вид события и описание задачи, а цветная полоса у строки
      переносится как метка вида события (14); номер требования и текст итога
      в строке — не переносятся: номера требования в событиях хуков нет, а тексты итогов
      REQ-001 не хранит (критерий 3 REQ-001, Q7).

      Панель «Требования» (текущее с полосой хода «задач N/M · агентов K» и история) — в
      честной форме: панель «Задачи» — список задач REQ-001 в разделах «Текущие» и
      «История», а над ними для каждой идущей сессии полоса хода и «задач N/M · ролей K»
      (15); полоса хода и «задач N/M · агентов K» у карточек истории образца считаются из
      событий так же, поэтому переносятся: такая же сводка — у каждой не идущей сессии с
      задачами, чей элемент показан в разделе «История» (15). Список задач показывает не
      больше 300 элементов («Текущие» и «История» вместе; при большем числе — пометка
      «показано 300 из N», решение D19, decisions/0008): сводка стоит над самым верхним
      показанным элементом своей сессии, а у сессии, чьих элементов из-за предела не видно,
      сводки нет, как нет и самих элементов. Задача, возобновлённая в другой сессии, считается
      в сессии своего последнего старта (критерий 6(и) REQ-001); метки «в работе» и «выполнено» у карточек образца — метки состояния задачи
      REQ-001: «в работе», «завершена», «окончание не записано» (15). Номера, названия и
      статусы требований — не переносятся: в событиях хуков их
      нет, а новый источник (файлы требований и handoff-ов) расширил бы границу REQ-001
      (критерий 5 REQ-001: сервер отдаёт для чтения только события и время своих
      запусков) — это решение владельца, вопрос записан в handoff-е шага 00a прогона
      PO-20261002-01. Элементы REQ-001, которых на образце нет (время запусков сервера,
      пометки пустого журнала и нет связи, карточка агента), остаются; где они стоят,
      решает описание интерфейса.

      Столы — растущая часть обстановки. У основной сессии и у каждой роли, у которой в
      списке задач REQ-001 есть задача, — свой стол с ноутбуком и стулом при любом числе
      таких ролей: число столов не зашито, офис добавляет столы (а с ними перегородки
      между их колонками и место под них) вместе с журналом, уже занятые столы не
      сдвигаются, неподвижная обстановка от этого не меняется. Столы раздаются по первому
      появлению роли в журнале; место зависит только от журнала. Почему не постоянное
      число: на 2026-10-02 в .claude/agents/ уже 37 файлов ролей (было 23), шаг 2c
      итерации 2 (PLAN.md) добавляет роли, а столы получают и встроенные типы
      (general-purpose, Explore, Plan), и роли сессий, начатых в других папках
      (decisions/0007); любое постоянное число со временем оставило бы роль без стола.
      Правило записано в дополнении D11 (decisions/0005, 2026-10-02).

      Перемещения. Персонаж запустившего — основной сессии или субагента (вызов Agent
      изнутри субагента несёт agent_id этого субагента, критерий 3 REQ-001) — идёт к столу
      роли запущенного субагента и возвращается: задачу передали. По окончании задачи
      персонаж субагента идёт к столу запустившего и возвращается: результат вернули.
      Если запустившего определить нельзя, перемещения нет. Других перемещений нет:
      вопросов, совещаний и отдыха хуки не дают, свободный персонаж сидит за своим
      столом. Путь — по той же сетке, что рисуется (как в эталоне:
      reference/pixel-office-osnova/wwwroot/agent-office.js, findPath), поэтому пройти
      сквозь стену, стол или мебель нельзя по построению. «Пауза» останавливает ходьбу, а
      «1×», «2×», «4×» меняют её скорость; какие маршруты есть и когда меняются
      состояния, от них не зависит.

      Облачка. Фраза над персонажем появляется, только когда её даёт событие: «Только что
      получил задачу» — первое начало задачи, над персонажем роли субагента; «Готово» —
      окончание задачи, над ним же; «Получил запрос» — отправка запроса, над персонажем
      основной сессии; «Ответ готов» — конец ответа, закрывший строку основной сессии, над
      ним же. Облачко видно, только пока по часам компьютера прошло от 0 до 10 секунд
      после времени события: так «только что» остаётся правдой, а события, догруженные
      после обрыва связи, облачков не дают. Других фраз нет — ни текстов из событий, ни
      ответов на вопросы.

      Что меняется в проекте: файлы страницы и офиса в tools/src/pixel-office/public/;
      новые тесты tools/test/pixel-office-office.test.js,
      tools/test/pixel-office-layout.test.js и tools/test/pixel-office-panels.test.js и
      общий с REQ-001 файл помощников тестов tools/test/pixel-office-helpers.js (один
      новый файл, без .test.js, чтобы `npm test` не запускал его как тест; прежние тесты,
      в том числе tools/test/helpers.js, не меняются); описание интерфейса по образцу — в
      docs/design/ (WF-04, шаг 1), логика офиса и страницы — в проекте
      docs/design/REQ-001-pixel-office.md; снимки DESIGN-QA-VALIDATOR — вне проекта или в
      docs/design/samples/ с пометкой actual в имени (WF-04, шаг 4); handoff-ы — в
      handoffs/PO-20260930-01/ и handoffs/PO-20261002-01/; статус — в блоке REQ-007
      docs/requirements.yaml. Сервер, хук, .claude/settings.json и tools/package.json
      REQ-007 не меняет.

      Числа — перевод аналитика, не слова владельца: 10 секунд — сколько видно облачко
      после события (страница получает событие не позже чем через 5 секунд, критерий 7
      REQ-001, остальное — запас); 1920 × 1080 — окно снимка: FullHD, раскладка под который —
      доработка с образца; 1×, 2×, 4× — кнопки образца; 37 — число файлов в
      .claude/agents/ на 2026-10-02 (ls .claude/agents/*.md | wc -l), правило столов от
      него не зависит.

      Вне области. Совещания, вопросы и ответы, сбор в переговорной и уход персонажей на
      отдых — хуки таких событий не дают, показать их значило бы выдумать (R2);
      переговорная, её места и места отдыха остаются обстановкой. Проигрывание истории с
      начала (решение D8, decisions/0005): «Пауза» и скорости касаются только ходьбы по
      маршрутам, появившимся после открытия страницы. Номера, названия и статусы
      требований, карточка требования и выбор требования — в событиях хуков их нет
      (вопрос о новом источнике — в handoff-е шага 00a прогона PO-20261002-01). Тексты
      итогов, найденных дефектов и выводов — REQ-001 их не хранит (критерий 3 REQ-001,
      Q7). Постоянный пояс «Алматы» — время показывается по поясу часов компьютера
      (критерий 6(е) REQ-001). Постоянный состав ролей эталона — роли берутся из
      agent_type. Ссылка «← Учётная система» и переключатель режима эталона — у Sai нет ни
      учётной системы, ни режима симуляции (критерий 4 REQ-001).

      Планка. Q8, R3, Q9 и Q11 не применимы, как в REQ-001: данных магазинов, фото
      покупателей, SQL и адресов, которые задаёт магазин или покупатель, нет. R2 —
      критерии 2, 3, 5, 7 и 10–16; Q7 и правила страницы REQ-001 — критерий 6; Q10 —
      критерий 9 (при обрыве связи страница работает дальше, «LIVE» гаснет; критерий 7
      REQ-001); Q4 и Q6 — критерий 8; Q12 — новый источник для номеров требований
      требование само не решает: это вопрос владельцу в handoff-е шага 00a прогона
      PO-20261002-01; правило столов записано в дополнении D11 (decisions/0005); R1 — мерж подтверждает владелец.
    acceptance_criteria:
      - "Состав офиса и столы — растущая часть обстановки: персонаж «Основная сессия» — с числом идущих сессий, если их больше одной (идущая сессия — как в описании), — и персонажи только тех ролей, у которых в списке задач REQ-001 есть хотя бы одна задача; у основной сессии и у каждой такой роли — свой стол с ноутбуком и стулом при любом числе ролей: роли без стола не бывает, число столов не зашито, вместе со столами растут перегородки между их колонками и место под них, а неподвижная обстановка (критерий 12) не меняется; столы раздаются по первому появлению роли в журнале, место зависит только от журнала (две загрузки одного журнала дают одинаковые места), а строки новой роли, дописанные в конец журнала без пометок «не из хуков», не сдвигают уже занятые столы (дополнение D11, decisions/0005). Проверка: tools/test/pixel-office-layout.test.js — для N = 1, N = K + 3 и N = 3·(K + 3), где K — число файлов .claude/agents/*.md, прочитанное тестом при запуске, а 3 — встроенные типы general-purpose, Explore и Plan: у N ролей и основной сессии N + 1 разных столов, у каждого — ноутбук и стул, место и клетка подхода каждого стола проходимы и связны между собой, места и клетки подхода первых N + 1 столов при N и при N + 1 ролях совпадают; tools/test/pixel-office-office.test.js — состав по последовательности событий, одинаковые места при двух загрузках, новая роль в конце журнала не двигает прежние, подсчёт идущих сессий, в том числе событие окончания сессии, затем SessionStart с source resume и тем же session_id, затем старт субагента: сессия идёт, её задача «в работе»"
      - "Состояния: персонаж роли «работает», пока у роли есть задача «в работе» по критерию 6 REQ-001 (при нескольких — с их числом), сразу по событию — не после анимации, и на паузе, и при любой скорости; задача «окончание не записано» персонажа работающим не делает; экран ноутбука на столе роли светится, только пока роль «работает»; строка «не из хуков» (критерий 4 REQ-001) не меняет ни одного состояния. Проверка: tools/test/pixel-office-office.test.js — состояние сразу после события, в том числе на паузе и при 4×; два параллельных запуска одного agent_type; «окончание не записано»; строка «не из хуков»; по вызовам рисования экран ноутбука светится у стола работающей роли и не светится у остальных"
      - "Перемещения — только по двум событиям: начало задачи — персонаж запустившего (основной сессии или субагента — по данным хуков; если запустившего определить нельзя, перемещения нет) идёт к столу роли субагента и возвращается; окончание задачи — персонаж субагента идёт к столу запустившего и возвращается; других перемещений нет: свободный персонаж сидит за своим столом, ни один маршрут не ведёт в переговорную, на кухню или в серверную, строки «не из хуков» перемещений не вызывают. Проверка: tools/test/pixel-office-office.test.js — маршруты появляются только после событий начала и окончания задачи, у каждого маршрута верные начальная и конечная клетки, вызов Agent изнутри субагента ведёт от стола этого субагента, ни одна конечная клетка маршрута не лежит в комнате, после всех маршрутов каждый персонаж — на своём месте за столом"
      - "Сетка (как reference/pixel-office-osnova/tests/layout.js): каждое место за столом и клетка подхода к нему проходимы, не лежат на стене, столе или мебели, и все такие клетки связны между собой; обстановка рисуется по той же сетке, по которой строятся маршруты, и её клетки, кроме стульев у столов (это места персонажей), непроходимы; маршрут строится только по проходимым клеткам; недостижимая цель оставляет персонажа на месте. Проверка: tools/test/pixel-office-layout.test.js (планировка, связность обходом в ширину, непроходимость клеток обстановки); tools/test/pixel-office-office.test.js — прогон перемещений по последовательности событий: ни в один момент персонаж не стоит на клетке стены, стола или мебели (как «Проходимость» в reference/pixel-office-osnova/tests/behaviour.js)"
      - "Карточка агента и один поток событий: щелчок по персонажу выделяет его на холсте и открывает карточку — роль, её задачи «в работе» и последние завершённые, последние события роли; офис, легенда, доска, облачка, строка «Сейчас», журнал с фильтрами, панель задач и карточка строятся из того же массива событий, что журнал и список задач REQ-001, и после добавления одного события все они меняются согласованно. Проверка: tools/test/pixel-office-office.test.js и tools/test/pixel-office-panels.test.js — одна последовательность событий, затем ещё одно событие: каждое представление пересчитано из того же массива и согласовано с остальными; щелчок выделяет персонажа и открывает его карточку"
      - "Правила страницы REQ-001 действуют для всех файлов страницы и офиса (Q7, граница decisions/0003): код отправляет только GET-запросы, выводит текст из событий как текст, а не как HTML (в шапке, легенде, журнале, панели задач, карточке, подписях и на доске), ничего не загружает с других адресов и не нарушает Content-Security-Policy REQ-001 (нет встроенных скриптов и обработчиков в атрибутах). Проверка: тест секрета критерия 8 REQ-001 в tools/test/pixel-office-server.test.js охватывает все файлы tools/src/pixel-office/public/; tools/test/pixel-office-office.test.js и tools/test/pixel-office-panels.test.js — поддельный fetch: только GET; описание и роль <img src=x onerror=alert(1)> в строке «Сейчас», журнале, панели задач, легенде, подписи, на доске и в карточке не создают элемента; `grep -rEn 'https?://' tools/src/pixel-office/public; echo $?` — ни одной найденной строки и код 1; `grep -rniE ' on[a-z]+=|javascript:' tools/src/pixel-office/public; echo $?` — ни одной найденной строки и код 1 (без учёта регистра: onClick= в HTML — тоже обработчик; код 2 — каталога нет, не проходит); тест критерия 8 REQ-001 в tools/test/pixel-office-server.test.js — у каждого <script> в HTML, который отдаёт сервер, в том числе с файлами офиса, есть src"
      - "Офис на реальных событиях (R2): в шаге UAT «реальная сессия» REQ-001 UAT-RUNNER прогоняет логику офиса (команда — из дизайна) на строках журнала, добавленных за сессию, и прикладывает вывод: роль субагента есть в офисе; за сессию ровно два маршрута «туда и обратно» — персонаж основной сессии к столу субагента и персонаж субагента к столу основной сессии; после события окончания персонаж субагента не «работает». Проверка: вывод команды в handoff-е шага UAT"
      - "Проверка не обходится (Q4, Q6): команда критерия 14 REQ-001 проходит вместе с тестами REQ-007; `ls tools/test/pixel-office-office.test.js tools/test/pixel-office-layout.test.js tools/test/pixel-office-panels.test.js` — код 0; в итоге node --test — «skipped 0» и «todo 0»; проверки Q6 критерия 14 REQ-001 охватывают и эти файлы. Проверка: вывод команд критерия 14 REQ-001 и команды ls (TEST-RUNNER; RELEASE-VALIDATOR повторяет сам)"
      - "Шапка, в честной форме: название «Pixel Office»; значок «LIVE» — только пока последний опрос сервера удался: до первого удачного опроса и при «Нет связи с сервером Pixel Office» (критерий 7 REQ-001) его нет, а пометка «REAL — события хуков Claude Code» (критерий 4 REQ-001) видна всегда; строка «Сейчас: …» — первый элемент раздела «Текущие» панели задач (критерий 15): у задачи — подпись роли (как у персонажа) и описание, если оно есть (критерий 6(з) REQ-001), у строки основной сессии — «Основная сессия — обрабатывает запрос», и число остальных элементов «в работе», если они есть; при пустом разделе — «Сейчас: в работе ничего нет»; кнопки «Пауза» (на паузе — «Продолжить»), «1×», «2×», «4×»: на паузе персонажи стоят, новые маршруты ждут и проходятся после «Продолжить»; при 2× и 4× персонаж проходит тот же путь вдвое и вчетверо быстрее, чем при 1×; при открытии страницы — 1× без паузы; ссылки «← Учётная система» и выбора требования нет. Проверка: tools/test/pixel-office-panels.test.js — поддельные fetch и часы: «LIVE» после удачного опроса, нет «LIVE» до первого опроса и после неудачного, пометка REAL во всех трёх случаях; строка «Сейчас» на каждый случай — задача с описанием, задача без описания, только строка основной сессии, несколько элементов «в работе», пусто — и её смена после нового события; tools/test/pixel-office-office.test.js — поддельные кадры: на паузе за 10 секунд кадров ни один персонаж не сдвинулся, а событие за это время сразу изменило состояние; после «Продолжить» маршрут пройден; один и тот же путь при 2× и 4× занимает половину и четверть кадров пути при 1× (с точностью до одного кадра)"
      - "Облачка — только фразы, привязанные к событиям (R2): над персонажем роли субагента — «Только что получил задачу» по первому началу задачи и «Готово» по окончанию задачи; над персонажем основной сессии — «Получил запрос» по отправке запроса и «Ответ готов» по концу ответа, закрывшему строку основной сессии; облачко видно, только пока по часам компьютера прошло от 0 до 10 секунд после времени события; других фраз нет — ни текстов из событий, ни фраз без события; строки «не из хуков», повторный старт задачи, конец ответа без открытой строки, окончание без записанного начала и события SessionStart, SessionEnd и PostToolUse облачков не дают. Проверка: tools/test/pixel-office-office.test.js — поддельные часы: на каждый из четырёх случаев — облачко с этой фразой над нужным персонажем в момент события и через 10 секунд, его нет через 11 секунд и раньше времени события; строка, полученная через 30 секунд после её времени (как после обрыва связи), облачка не даёт; в каждом перечисленном случае без облачка облачков нет; все фразы облачков во всех сценариях теста — из этих четырёх"
      - "Легенда как на образце: по элементу на основную сессию и на каждую роль с задачей, в порядке столов, — полное имя роли (у основной сессии — «Основная сессия») и состояние: у роли «работает», пока у неё есть задача «в работе», иначе «свободен»; у основной сессии «работает», пока открыта её строка «обрабатывает запрос», иначе «свободна»; метка цвета роли — только у работающих; состояние меняется сразу по событию. Проверка: tools/test/pixel-office-office.test.js — по последовательности событий: имена, порядок, состояния, метка цвета только у работающих, смена состояния сразу после событий начала и окончания"
      - "Неподвижная обстановка как на образце (R2): тёмный клетчатый пол и стены вне зоны столов; растения и книжные полки; переговорная с подписью «ПЕРЕГОВОРНАЯ» — большой стол, места вокруг него и доска на стене; кухня с подписью «КУХНЯ» — стойка с кофемашиной и места отдыха; отдельные места отдыха в зале; серверная с подписью «СЕРВЕРНАЯ» — стойки за стенами. Этот неподвижный слой не зависит ни от событий, ни от времени: при любом журнале и в любой момент он один и тот же; от событий зависит только содержимое доски (критерий 13); зона столов — столы с ноутбуками и стульями, перегородки между их колонками и место под них — растущая часть со своей проверкой (критерий 1); случайных величин в коде страницы и офиса нет. Проверка: tools/test/pixel-office-layout.test.js — в сетке есть три комнаты с этими подписями и названной обстановкой; клетки неподвижного слоя одинаковы при пустом журнале и при N = 1, N = K + 3 и N = 3·(K + 3) ролях (N и K — как в критерии 1); tools/test/pixel-office-office.test.js — вызовы рисования неподвижного слоя одинаковы для двух разных журналов (пустого и с K + 3 ролями) и для одного журнала в моменты, разделённые минутой (без маршрутов и облачков; содержимое доски не сравнивается); `grep -rn 'Math.random' tools/src/pixel-office/public; echo $?` — ни одной найденной строки и код 1 (код 2 — каталога нет, не проходит); как это выглядит — снимок по критерию 16"
      - "Доска в переговорной — канбан по ролям, в честной форме: столбец на каждую роль, у которой есть задача в идущих сессиях, в порядке первого появления роли в журнале, — цвет и подпись роли (как у персонажа) и число её задач в этих сессиях «в работе», «завершена» и «окончание не записано»; роли, чьи столбцы не поместились, — одной меткой «+N», где N — их число; нет идущих сессий — на доске нет столбцов; доска меняется сразу по событию. Проверка: tools/test/pixel-office-office.test.js — по последовательности событий двух сессий, одна из которых закончилась: столбцы только ролей идущей сессии и верные числа по состояниям; ролей больше, чем помещается столбцов, — «+N» с верным N; после окончания последней идущей сессии столбцов нет"
      - "Журнал как на образце, в честной форме: заголовок «Журнал»; фильтры «Всё», «Работа», «Офис», при открытии страницы — «Всё»: «Всё» — все строки журнала REQ-001, в том числе помеченные «не из хуков»; «Работа» — строки видов UserPromptSubmit, Stop, PostToolUse, SubagentStart и SubagentStop; «Офис» — строки, по которым в офисе появился маршрут (критерий 3); выбранный фильтр не сбрасывается новыми событиями; подпись «время — <пояс>» с поясом часов компьютера (критерий 6(е) REQ-001); счётчик «N из M»: M строк подходят под фильтр, N из них показано (предел показа задаёт дизайн REQ-001); у строки — время, роль, вид события, описание задачи, если оно связано с запуском (критерий 6(з) REQ-001), и пометка «не из хуков» у помеченных; номера требования и текста итога нет. Проверка: tools/test/pixel-office-panels.test.js — последовательность со всеми видами событий, помеченной строкой и двумя маршрутами: каждый фильтр показывает ровно свои строки, счётчик равен числу показанных и числу подходящих строк, фильтр сохраняется после нового события, под TZ=Asia/Almaty в подписи пояса — Asia/Almaty"
      - "Панель задач на месте панели «Требования» образца, в честной форме: список задач REQ-001 в двух разделах — «Текущие» (задачи и строки основной сессии «в работе») и «История» (остальные), в каждом новые сверху, как в критерии 6(д) REQ-001; у элемента — подпись и полное имя роли (у строки основной сессии — «Основная сессия — обрабатывает запрос»), описание, если оно есть, состояние и время по критерию 6 REQ-001; над «Текущими» для каждой идущей сессии — первые 8 знаков её session_id, полоса хода и «задач N/M · ролей K», где M — число задач этой сессии (задача, возобновлённая в другой сессии, — в сессии своего последнего старта, критерий 6(и) REQ-001), N — сколько из них «завершена», K — число разных ролей среди них; M, N и K считаются по всем задачам сессии, включая те, чьих элементов нет в списке из-за предела 300; список показывает не больше 300 элементов («Текущие» и «История» вместе); если элементов больше 300, показаны первые 300 в порядке критерия 6(д) REQ-001 и есть пометка «показано 300 из N», где N — число всех элементов; в «Истории» — такая же сводка для каждой не идущей сессии, у которой есть задачи и чей элемент показан в «Истории» (как полоса хода у карточек истории образца), над самым верхним показанным элементом этой сессии, новые сверху; у не идущей сессии, чьих элементов в «Истории» нет из-за предела 300, сводки нет; номеров, названий и статусов требований нет. Проверка: tools/test/pixel-office-panels.test.js — последовательность событий двух сессий, одна из которых закончилась: элементы в своих разделах и в порядке «новые сверху», числа N, M, K и доля полосы N/M у сводки идущей сессии над «Текущими» и у сводки закончившейся — в «Истории», после нового события разделы и числа меняются; случай «больше 300» — 400 закончившихся сессий по одной задаче: в «Истории» показано 300 элементов, есть пометка «показано 300 из 400», сводок столько, сколько сессий среди показанных элементов (300), у сессии без показанного элемента сводки нет; случай возобновления — старт субагента с agent_id X в сессии A, затем старт с тем же X в сессии B, затем событие окончания этого субагента в сессии B: у сессии A задача не входит ни в M, ни в N, ни в K (при отсутствии других задач у A все три равны 0), у сессии B M = 1, N = 1 (задача «завершена»), K = 1; случай предела для чисел — одна закончившаяся сессия с 301 задачей: в «Истории» показано 300 элементов, а в сводке этой сессии M = 301"
      - "Страница похожа на образец (WF-04, шаги 3, 4 и 6): DESIGN-QA-VALIDATOR запускает отдельный экземпляр — `cd tools && npm run pixel-office -- --port <свободный порт> --dir <отдельная папка состояния вне проекта>`; в эту папку кладётся копия настоящего журнала владельца (сам журнал только читается); состояния, которых в копии нет, — роли с задачами в числе файлов .claude/agents/ на момент проверки, две «работающие» роли, облачко над персонажем — даются сочинёнными событиями, которые пишутся только в ту же отдельную папку, не в рабочий журнал владельца (R2); снимает страницу в окне 1920 × 1080 и сравнивает по устройству и смыслу с docs/design/samples/office-2026-10-02.jpg и с описанием интерфейса REQ-007: те же области в том же порядке — шапка сверху, офис с легендой слева, журнал и панель задач справа; есть элементы критериев 9–15; вся страница — шапка, офис со всеми столами и легендой, журнал и панель задач — видна в окне без прокрутки страницы, прокручиваются только списки внутри журнала и панели задач (раскладка под FullHD — доработка с образца); различия с образцом — только места «не переносится» и «в честной форме» из описания этого требования, в том числе число и расстановка столов (критерий 1), и каждое названо в описании интерфейса с причиной; вердикт PASS — нет находок Critical и High; в handoff-е DESIGN-QA-VALIDATOR перечислены части снимка, снятые на сочинённых событиях. Затем ORCH показывает владельцу снимок рядом с образцом, в отчёте прямо называет части снимка, снятые на сочинённых событиях, и записывает в тот же handoff дословный ответ владельца; ответ — подтверждение сходства. Проверка: `shasum -a 256 docs/design/samples/office-2026-10-02.jpg` — 148eda286845409ff8761ad90bcbd43b727593577dc50fdb4a05ed62b0f810d5; jq по result.verdict handoff-а DESIGN-QA-VALIDATOR в handoffs/PO-20261002-01/, по перечню частей снимка на сочинённых событиях в нём и по записанному в нём ответу владельца"
