  - id: REQ-013
    title: Sai Team, часть 3 — движок — планировщик, расписание и параллельность, контекст, проверка результата, согласования, потолок проекта, завершение, пауза и восстановление (без интерфейса)
    owner: BACKEND-DEV
    status: done   # 2026-10-13T09:07:45Z, прогон REAL-20261013-01 (WF-02, шаг 10): RELEASE-VALIDATOR PASS (handoffs/REAL-20261013-01/step-09-release-validator.json) — 15 критериев из 15 выполнены; на чистой копии npm ci и npm run check, 1478 тестов из 1478. Зависимость REQ-010 — done (запись выше по порядку, 2026-10-13). Критерий 13 (настоящий запуск): основание — слово владельца 2026-10-13 (decisions/0048), потолок 3 USD назвал ORCH по поручению владельца, израсходовано 0,92 USD (0,922915); проект p-20261013-e20bfa дошёл до «выполнен», 6 задач из 6, 135 событий, ни одна задача не стала «готово» без проверки (отчёт docs/uat/REAL-RUN-20261013.md). Граница доказательства: исправление ISS-0031 (критерий 15) на настоящей модели НЕ проверено — второго круга плана в запуске не было; критерий 15 закрыт тестами на поддельном claude (SF-01…SF-11, мутант убит), а повторный настоящий запуск для него не обязателен. Не проверено на настоящей модели: пауза, продолжение, остановка, ответы владельца и чат, сбои сети и исполнителя, исчерпание потолка, параллельные задачи (план шёл цепочкой), критические задачи, повторные попытки. Прежде: in_progress; 2026-10-09 код и тесты прошли все ворота (940 из 940), не хватало критерия 13
    depends_on: [REQ-010]   # исполнители, run-task, повторы, потолок на запуск; REQ-010 — done с 2026-10-13, через него REQ-009 (ядро, писатель, каталог, язык) — done с 2026-10-13 и REQ-002 — done с 2026-10-11
    original_request: >
      «Твоя задача — ДОВЕСТИ ПРОДУКТ ДО РАБОЧЕГО СОСТОЯНИЯ.»; «Я не должен управлять
      агентами вручную.»; «Главный ориентир: максимально автономная виртуальная команда
      + предельно простой UX для бизнеса + Pixel Office как живое зеркало реальной
      работы + качество продукта не хуже [образца], а в ключевых сценариях лучше.»;
      «Не подменяй реальную интеграцию mock-данными. Не подменяй работающую
      автономность визуальной имитацией.»; «Запрещено создавать красивый интерфейс, за
      которым нет реальной системы. Не создавай: случайные статусы; фиктивные проценты;
      fake agent activity; имитацию работы; декоративные task updates; захардкоженные
      сценарии для демо.» (владелец, 2026-10-06, сообщение в сессии Claude Code;
      дословные куски переданы ORCH в задании прогона PROD-20261006-01, шаг 02a-r1;
      название чужого проекта заменено ORCH на «[образец]»; полного текста сообщения в
      файлах Sai нет).
    description: >
      Что получает владелец. Пользователь ставит цель — система сама строит план,
      раздаёт задачи ролям виртуальной команды, выполняет независимое параллельно,
      проверяет каждый результат отдельным исполнением, при неудаче подключает другую
      роль, спрашивает пользователя только о критичном и завершает проект только при
      достижении цели. Задачи выполняются исполнителями REQ-010 (run, повторы, потолок
      на запуск); всё пишется в журнал ядра REQ-009 настоящими событиями. Интерфейса
      здесь нет: REQ-011 и REQ-012 (только называются). Основа —
      docs/product/parity-matrix.md (раздел 6, пункты 3, 4, 7, 8).

      Планировщик (решение ORCH D-C; записывается в 0015): роль «Руководитель
      проекта» получает цель и контекст и возвращает план по схеме (задачи с ролью,
      описанием, критерием готовности, depends_on, отметкой «критическое»). Движок
      проверяет: схема, нет циклов, не больше 40 задач, роли из каталога, depends_on
      ссылаются на задачи плана. Плохой план — одна повторная попытка с описанием
      ошибки; снова плохой — проект «ждёт решения пользователя» с причиной «план не
      получен» и вопросом пользователю (событие CHAT).

      Исполнение: задачи, у которых все depends_on «готово», выполняются параллельно.
      Предел одновременных задач — по умолчанию ровно 2; настройка — 1, 2 или 3
      (опция `--parallel <N>` команд start и resume); 0, 4 и больше, не число —
      отказ с понятным текстом, состояние не меняется. Каждая задача получает контекст
      проекта — цель, память и результаты своих задач-зависимостей, а не «с нуля».
      Задача, которая после повторов REQ-010 «не удалось», переводит проект в «ждёт
      решения пользователя» с вопросом (событие CHAT).

      Проверка (D-D): задача становится «готово» только после проверки её критерия
      готовности отдельным исполнением роли «Проверяющий (QA)» (отдельный запуск
      исполнителя, не тот, что делал задачу). Не прошла — до 2 повторов с замечаниями
      проверяющего; затем задачу получает другая роль из каталога (выбирает
      Руководитель проекта; движок проверяет, что роль другая и есть в каталоге) с тем
      же правилом «до 2 повторов»; затем «ждёт решения пользователя».

      Согласования (D-E): задача с отметкой «критическое» (отправка, публикация,
      удаление, финансовая операция, изменение важных данных, передача наружу) не
      выполняет действие — готовит черновик файлом в проекте и переходит в «ждёт
      решения пользователя». Ответ пользователя — одобрить, изменить (с текстом),
      отклонить — событие USER; работа продолжается. Одобрение в этом срезе не
      совершает действия вовне: черновик принимается как результат, событие прямо
      говорит, что действие вовне не выполнено.

      Потолок проекта: когда сумма расхода (REQ-010) достигает потолка, новые задачи не
      запускаются, проект переходит в «ждёт решения пользователя» с причиной «потолок
      стоимости» и вопросом (событие CHAT). Пользователь может поднять потолок командой
      `npm run team -- budget <id> <usd>` (событие USER) и продолжить командой resume;
      потолок не больше уже израсходованного — отказ.

      Завершение: проект «выполнен» только когда каждая задача «готово» или закрыта
      пользователем (отклонена, или зависела от отклонённой), хотя бы одна задача
      «готово» и итоговая проверка цели (Проверяющий сверяет результаты с целью)
      прошла; иначе
      Руководитель проекта создаёт следующие задачи — не больше 2 раундов дозадач,
      затем вопрос пользователю. Пауза, возобновление и остановка — по команде
      пользователя; «остановлен» — конечный статус. Восстановление: после аварийной
      остановки задачи «прервана» (REQ-009) перезапускаются при возобновлении; число
      таких перезапусков считается в попытках.

      Команды для проверки без интерфейса (точный вывод — проект CODE-DESIGNER;
      new — из REQ-010): `npm run team -- start <id> [--parallel N]`,
      `npm run team -- pause|stop <id>`, `npm run team -- resume <id> [--parallel N]`,
      `npm run team -- answer <id> <задача> approve|change|reject [--text "<текст>"]`,
      `npm run team -- budget <id> <usd>`. Все — команды записи по правилу писателя
      REQ-009; start и resume держат право записи, пока движок работает. Пока право
      держит движок, команды из другого процесса передаются ему файлом-очередью inbox/
      папки проекта, и события пишет сам движок (критерий 9).

      Безопасность. Q7: как REQ-010 — значения окружения никуда не пишутся, журнал
      маскируется, текст пользователя и агентов (в том числе план и ответы) — данные и
      не меняют полей проекта, роли, исполнителя, флагов, потолка. Принцип Q8 —
      проекты не смешиваются: агент проекта A не получает файлов и памяти проекта B
      (критерий 4). Q10: сбой исполнителя одной задачи не роняет движок и другие
      задачи. Q11: своих сетевых запросов у движка нет; сеть Исследователя — разбор в
      REQ-010. Q9, R3 неприменимы: базы с SQL и фото покупателей нет. R2: события
      ENGINE создаются кодом движка в момент настоящего изменения состояния, ничего
      задним числом и ничего заготовленного.

      Файлы (от корня Sai): tools/src/team/ (планировщик, расписание, проверка,
      согласования, команды start, pause, resume, stop, answer, budget),
      tools/test/team-*.test.js, сценарии scripted в tools/test/fixtures/team/,
      tools/package.json, tools/README.md (раздел «## Sai Team — движок»). Не
      затрагиваются: tools/src/pixel-office/, .claude/agents/.

      Вне области: интерфейс (REQ-011, REQ-012), многопользовательность и рабочие
      пространства, внешние интеграции, любые настоящие действия вовне (письма,
      публикации, платежи), выбор модели пользователем.
