      - "Строка «Сейчас» при состояниях без подтверждения (решения 0050, п. 2, и 0051, п. 2). Когда нет ни одного элемента «в работе» (раздел «Текущие» панели задач пуст), а есть элементы в состоянии «нет свежих данных» или «сервер перезапускался, события не записывались», блок «Сейчас» пишет «Сейчас: в работе ничего нет · без свежих данных: N», где N — число таких элементов обоих состояний (задач и строк основной сессии) по всей модели, а не по показанному списку (предел 300 на N не влияет); «окончание не записано» в N не входит. У этой части есть пояснение — атрибут title блока «Сейчас» и строка в панели «Задачи» над «Историей»: что это задачи и строки основной сессии без подтверждения, что причина названа отдельно для каждого состояния — для «нет свежих данных» возраст самого старого последнего события (определение — критерий 7) среди них в формате критерия 4, для «сервер перезапускался…» время последнего запуска сервера; причина названа, только если элементы этого состояния есть. Нет таких элементов — второй части нет и блок пишет «Сейчас: в работе ничего нет», как раньше; есть элементы «в работе» — блок строится только из них (критерии 1–2 REQ-036), второй части нет. N и пояснение берутся из модели, записей запуска сервера и часов страницы, ничего другого в них нет (R2). Проверка: tools/test/pixel-office-panels.test.js, поддельные часы: пусто — «Сейчас: в работе ничего нет» без второй части; два элемента «нет свежих данных» в разных сессиях — «… · без свежих данных: 2», title называет возраст более старого из двух по таблице критерия 4; один элемент «сервер перезапускался…» — N = 1, title называет время запуска сервера; по одному элементу каждого состояния — N = 2, title называет обе причины; один элемент «окончание не записано» — второй части нет; 301 элемент обоих состояний — N = 301; новая доверенная строка сессии элемента «нет свежих данных» — N уменьшилось, элемент вернулся в «в работе» и вторая часть пропала; элемент «в работе» вместе с элементом «нет свежих данных» — вторая часть не показана; текст второй части и title — константы texts.js"
      # 2026-10-13, прогон ISS-0062-20261013-01, WF-03 шаг 2 (REQ-ANALYST), доработка r1 по FAIL ворот (handoffs/ISS-0062-20261013-01/step-02b-req-validator.json, F1–F7): критерий 14 добавлен по дефекту docs/issues/ISS-0062-pixel-office-restart-word-squeezes-role-name.md, а не из новых слов владельца: ожидаемой раскладки названия роли и слова состояния не было ни в критериях REQ-042, ни в тестах. Опора — слова владельца пункта 9 «Визуальный уровень и удобство» («контрастность и читаемость») и пункта 17 («не жертвуй читаемостью ради декоративности») в docs/owner-requests/2026-10-13-pixel-office.md; original_request не менялся, номера критериев 1–13 и статус не менялись.
      - "Слово состояния не сжимает название роли и не рвёт слова по буквам (ISS-0062; Q3, Q4). Слово состояния любой длины — любое значение таблицы STATE_LABELS в tools/src/pixel-office/public/texts.js, в том числе самое длинное «сервер перезапускался, события не записывались» — не сжимает название роли и не рвёт по буквам ни его, ни себя. Места вывода (AP-017): перечень — результат команды `grep -rnE 'STATE_LABELS[[]|: SESSION_STALE' tools/src/pixel-office/public/*.js` (на момент записи три строки). (1) Плашка .item-state в функции itemInto: она стоит в одной строке-контейнере с названием роли; itemInto общая для панели «Задачи» (слово «в работе» — в разделе «Текущие», остальные слова — в разделе «История», критерий 2) и для карточки агента. (2) Подпись .history-state в окне «Просмотр истории». (3) Значок .session-badge карточки сессии: он расположен абсолютно (position: absolute) и не стоит в строке с названием роли, поэтому из замеров (а)–(в) исключён; страницу в целом он проверяет через (г). Новое место, найденное этой командой, входит в перечень; перечень и проект исправления сверяются с диагнозом ISSUE-FIXER (handoffs/ISS-0062-20261013-01/step-01-issue-fixer.json, result), различие — замечание проверяющего. Свойства в окнах 1470×784 и 375×812: (а) для места (1) название роли (.item-role) выведено целиком: у каждой его части, отделённой пробелом или дефисом, Range.getClientRects() даёт один прямоугольник (перенос по пробелу и по дефису допустим, например у general-purpose; часть, которая сама шире контейнера, не проверяется), и правый край каждого прямоугольника названия не правее правого края элемента .item, в котором оно стоит (не зависит от display названия); (б) для мест (1) и (2) слово состояния не рвётся по буквам: у каждой его части, отделённой пробелом, Range.getClientRects() даёт один прямоугольник, и высота плашки не больше N·h, где N — число слов в слове состояния, а h — высота плашки того же элемента со словом «в работе» в том же окне (одна строка); плашка, сложенная столбиком из букв, не проходит, перенос по словам проходит; (в) для места (1) строка элемента .item со словом «сервер перезапускался, события не записывались» выше строки того же элемента со словом «в работе» не больше чем на высоту плашки с длинным словом плюс отступ между плашкой и названием (верхний край плашки минус нижний край названия, если плашка под названием, иначе 0); (г) горизонтальной прокрутки нет: document.documentElement.scrollWidth не больше window.innerWidth. Числовых порогов ширины и высоты в критерии нет: допустимое никто не измерял, измерено только плохое. До исправления: окно 1470×784 — название роли 20 px при плашке 300 px, строка основной сессии 387 px (RELEASE-VALIDATOR) или 332 px (UAT-RUNNER); окно 375×812 — строка 716 px (RELEASE-VALIDATOR) или 644 px (UAT-RUNNER), название по одной букве (handoffs/REQ042-20261013-01/step-09-release-validator.json, F1; docs/uat/REQ-042-RUN.md, О1). Проверка двумя способами, нужны оба. 1) Автоматический тест в tools/test/pixel-office-*.test.js, без новых зависимостей и без браузера: читает tools/src/pixel-office/public/style.css и один раз проверяет правила CSS мест (1) и (2) — .item-state и .history-state вместе со всеми правилами вариантов [data-state=…] этих селекторов — на свойство, которое выберет проект исправления (docs/design/ISS-0062-*.md): например, плашка в строке с названием может сжиматься и переноситься по словам (нет flex: none и white-space: nowrap), а название не разбивается по буквам, или плашка вынесена на отдельную строку; правила вариантов [data-state=…] не меняют раскладочные свойства (display, position, flex, flex-shrink, flex-basis, white-space, width, min-width, max-width, overflow-wrap, word-break). Значения STATE_LABELS тесту не нужны: раскладка от текста слова не зависит, тексты слов нужны замеру в браузере. Тест падает на style.css метки base/<RUN-ID> прогона исправления (`git show base/<RUN-ID>:tools/src/pixel-office/public/style.css`; метка — decisions/0031, имя — в context.base_tag handoff-ов прогона; метки нет — «база не задана», PASS на этом пункте нет) и проходит после исправления; в названии или комментарии теста сказано, что он проверяет правило CSS, а не вид (вид доказывает п. 2). 2) Замер в приёмке на одном стенде СТ-3 из docs/uat/REQ-042.md (запуск, затем блок Ж: задача Plan и строка «Основная сессия — обрабатывает запрос»), в таком порядке: (i) до перезапуска оба элемента «в работе», в «Текущих» панели «Задачи»; в окне 1470×784, затем в окне 375×812 (размер окна меняется без перезапуска сервера) UAT-RUNNER через getBoundingClientRect и Range.getClientRects измеряет для обоих элементов название роли, плашку и строку, а для задачи Plan — ещё плашку в карточке агента Plan; (ii) сервер перезапускается (сценарий 16); (iii) после перезапуска те же два элемента показывают слово «сервер перезапускался, события не записывались» в разделе «История» панели «Задачи» (в «Текущих» их нет, критерий 2); те же замеры в обоих окнах для названия, плашки и строки, для плашки в карточке агента Plan (где её показывает код, критерий 2 (в)) и для подписи в окне «Просмотр истории» задачи Plan (место 2). Пару для (в) дают замеры одного и того же элемента до и после перезапуска. Числа и снимки записываются в docs/uat/REQ-042-RUN.md или в документ приёмки прогона; сценарии 16 и 37 в docs/uat/REQ-042.md дополняет этим замером BA-ANALYST на шаге 8 прогона; RELEASE-VALIDATOR на шаге 9 повторяет замер сам. Раскладка названия роли и плашки состояния — единственное исключение из слов «вид, цвета и анимация» в абзаце описания «Что в этой работе нет»; цвета, шрифты и анимация по-прежнему вне требования. Критерии REQ-036 этот критерий не заменяют и им не заменяются: критерий 1 REQ-036 требует название роли целиком в «Текущих» и «Истории» (и в браузере на 1470×784 и 390×844), критерий 7 — размеры экрана и строки, читаемые целиком; критерий 14 добавляет слово состояния рядом с названием. Q8, Q10, Q11 и R3 неприменимы (как в описании)"
