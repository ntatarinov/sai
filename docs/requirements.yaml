        строки или знак вне [A-Za-z0-9_-]. Тестовые случаи для имени
        one_pager.md: «называет» — «правь one_pager.md», «правь one_pager.md.» (точка
        в конце предложения), «(см. one_pager.md)», имя в done_when; «не называет» —
