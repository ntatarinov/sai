      decisions/0015, раздел «Основание».
    description: >
      Что получает пользователь. У проекта одна память, общая для всей команды: цель,
      решения, факты, ошибки (что не получилось и почему) и заметки. Агенты не
      начинают с нуля и не повторяют ошибок, а человек видит, что команда «знает», и
      может это поправить.

      Уже есть: событие памяти ядра (виды «факт», «решение», «заметка»; REQ-009,
      проект docs/design/REQ-009-team-core.md), запись памяти агентом (REQ-010), подача
      цели и памяти во вход задачи (REQ-013, критерий 4).

      REQ-016 расширяет критерий 4 REQ-013, не меняя его текста. Что меняется: (1)
      «память проекта» во входе задачи — не вся действующая память, а часть по правилу
      подбора (3) ниже; до REQ-016 — вся действующая память; (2) в память добавляется
      вид «ошибка», и он во вход попадает всегда; (3) правки и удаления пользователя:
      во вход попадает последняя редакция, удалённое — нет. Что не меняется: цель
      проекта и результаты всех задач-зависимостей во входе, отсутствие результатов
      независимых задач и данных другого проекта. Если тест критерия 4 REQ-013 кладёт
      в фикстуру факт независимой задачи и ждёт его во входе, работа REQ-016 приводит
      этот тест к правилу подбора, а текст критерия 4 REQ-013 ORCH поправляет
      отдельной правкой WF-01 (критерий 7).

      Новое: (1) вид «ошибка» — движок записывает его сам, когда задача окончательно
      «не удалась» (что за задача, причина словами); (2) правка и удаление записи
      пользователем — новыми событиями, журнал только дописывается: исходная запись
