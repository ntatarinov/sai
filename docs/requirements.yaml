    acceptance_criteria:
      # 2026-10-15, прогон PIXEL-20261015-01, WF-01 шаг 1, доработка r1 (REQ-ANALYST): было → стало по таблице REQ-048, decisions/0057, дополнение, п. 2; номер и статус не менялись; «LIVE» → «на связи» (пять мест).
