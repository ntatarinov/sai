      Новые типы событий — только новой редакцией проекта REQ-009 (decisions/0017, P3).

      На странице проекта REQ-011 — раздел «Память проекта» по видам; у записи — кто
      записал (человеческое название роли, «вы» или «система») и когда; кнопки
