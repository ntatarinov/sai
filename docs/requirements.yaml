      - "Карточка основной сессии. Нажатие на персонажа или любую клетку стола основной сессии (старшинство персонажа — как в критерии 1 REQ-044) и Enter или Space на кнопке легенды «Основная сессия» открывают карточку строки основной сессии; по умолчанию — первая строка основной сессии в порядке списка модели (правило d REQ-001). Видно сразу: «Основная сессия», 8 знаков session_id (полное — раскрытием, кнопка «Скопировать» как в критерии 3 REQ-044); строка «Задача» — слово состояния строки (REQ-042) и основание: у «в работе» и «нет свежих данных» — время последнего доверенного события сессии и возраст (критерии 1 и 4 REQ-042) и время запроса («Владелец отправил запрос» или «В сессию пришло служебное сообщение» — слова REQ-045); у закончившей работу — «Основная сессия вернула ответ» и время Stop; у «окончание не записано» — закрывшее событие (следующий запрос или «Закрыт разговор с Claude Code») и время; у «сервер перезапускался…» — время запуска сервера; окна «Просмотр истории» карточка не открывает (decisions/0014, решение 5): если у строки есть окно запроса владельца (windowOfMainRow), карточка пишет «историю запроса открывает её строка в панели «Задачи» или в журнале» (переходы критерия 2), иначе — «у этой строки нет окна запроса владельца»; «Рабочее место» — как в критерии 4 (в) REQ-044, слова легенды «работает» или «свободна». Раскрытием: «кого запустила в этом запросе» — задачи с запустившим «основная сессия» по правилу z, той же session_id, чьё первое начало лежит в окне этого запроса (docs/design/REQ-008-history.md, п. 7.3, правило 3), со словом состояния и кнопкой к карточке экземпляра; другие строки этой сессии (последние 5, «показано 5 из N») и другие сессии (идущие первыми) для переключения; «Вся основная сессия» — прежние разделы её карточки (критерий «Карточка агента» REQ-007 остаётся выполненным, «разговоров идёт: N» — внутри этого раскрытия). Сессия, в которой есть только SessionStart или SessionEnd, без запросов, — «запросов в этой сессии не записано». Проверка: тест MC-01 в tools/test/pixel-office-panels.test.js — две сессии, в первой два запроса владельца и служебное сообщение, во второй только SessionStart: основание и время у каждой строки в каждом состоянии, возраст у «в работе» и «нет свежих данных», список запущенных в окне первого запроса без задач второго запроса и второй сессии, переключение строк и сессий, текст для сессии без запросов; тест MC-02 в tools/test/pixel-office-page.test.js — нажатие на стол основной сессии открывает эту карточку; идентификаторы MC-01…MC-08 свободны (`grep -rn '\"MC-' tools/test/` сейчас ничего не находит)"
      - "Переходы из карточки экземпляра (REQ-044) и карточки основной сессии. (а) «к задаче в панели» — карточка закрывается (выбор персонажа остаётся), элемент этой задачи (строки основной сессии) в панели «Задачи» прокручен в видимую область и получает фокус (пометка data-target); если элемента нет среди показанных (LIST_LIMIT = 300), кнопки нет, а карточка пишет «задача не показана в панели: там последние 300 элементов»; (б) «события в журнале» — карточка закрывается, в журнале выбран фильтр «Задача» этого экземпляра или строки (REQ-046, критерий 1; строки PostToolUse входят в задачу запущенного агента и в задачу передавшего, как там определено), последняя его строка раскрыта (REQ-045, критерий 3) и в фокусе; (в) окна «Просмотр истории» карточка напрямую не открывает (decisions/0014, решение 5): кнопки «открыть историю запроса» и другого элемента, открывающего окно, в карточке экземпляра и карточке основной сессии нет; история запроса открывается из элемента панели «Задачи», к которому ведёт (а) (кнопка «открыть историю запроса» элемента, REQ-008), и из журнала, к которому ведёт (б) (раскрытие события — REQ-046, критерий 3; строка запроса владельца — REQ-045, критерий 3); (г) в карточке экземпляра у «кто запустил: Основная сессия» — кнопка к карточке основной сессии на строке запроса, в окне которого (docs/design/REQ-008-history.md, п. 7.3, правило 3) лежит первое начало экземпляра, или на первой строке этой сессии, если окна нет. Проверка: тест MC-03 в tools/test/pixel-office-page.test.js — переходы (а), (б), (г): целевой элемент получил фокус или открыт, после (а) и (б) карточка закрыта (overlay hidden); (а) при 301 элементе для самого старого — текст вместо кнопки; (б) после перехода счётчик журнала равен числу строк задачи; (в) в DOM карточки экземпляра и карточки основной сессии нет элемента с data-request и класса history-open, ни одно нажатие внутри карточки не открывает окно истории; (г) открывается карточка основной сессии на нужной строке"
