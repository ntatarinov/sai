        для scripted и для claude-cli на поддельном исполняемом файле (критерий 6): оба
        отдают поток событий и итог с полями статус, файлы-результаты, краткий итог,
        расход; итог проверяется по схеме ответа роли, ответ вне схемы — сбой задачи
