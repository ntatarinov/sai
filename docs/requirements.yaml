    owner: FRONTEND-DEV   # кнопки, подтверждение, тексты, состояние на странице; запись команд в обработчиках сервера (tools/src/web/) — BACKEND-DEV в том же прогоне; вид — описание интерфейса GUI-DESIGN-ANALYST (WF-04)
    status: done   # 2026-10-11: RELEASE-VALIDATOR PASS, прогон PROD-20261011-01, step-43 (круг 3; критерии 1–13 — step-41; npm run check 1164 из 1164), по исключению decisions/0029 (зависимости REQ-013, REQ-002 in_progress). Не выполнено: R-1 и R-2 с настоящим Claude Code — нет согласия владельца; сценарии 04 и 20 (часть «не удалось») — состояние недостижимо; 24Б (откат записи не удался) — нечем воспроизвести, покрыто только тестом. Прежде: in_progress, прогон PROD-20261011-01 (WF-02); ворота требований: handoffs/REQ-20261011-01/step-08 — REQ-035 прошёл пункты (а)–(е)
