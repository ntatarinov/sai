      - "apply-verdict после третьего REJECT записывает в STATE.md блок «### Рекомендация агентов (WF-06)» с текстом эскалации и apply-report.json, не пишет proposed-actions.json; раздел владельца не меняется (тест)"
      - "snapshot-diff завершается с кодом 1, если изменены, добавлены или удалены файлы вне разрешённых префиксов, и с кодом 0 иначе (тесты)"
      - "Сбой записи (ISS-0002): других ошибок из критериев 3, 4, 6, 7 нет («папка вне runs/» из критерия 4 определяется по пути, без перехода по ссылкам); у prepare-run по пути папки прогона нет никакой записи — любая запись там, даже битая ссылка, — это E_USAGE, код 2 (дизайн §4.1, P12); но apply-verdict или prepare-run не может записать свои цели — у apply-verdict STATE.md, apply-report.json и при ACCEPT proposed-actions.json, у prepare-run папку прогона (и runs/, если её нет): цель apply-verdict — папка, ссылка или не обычный файл; на пути к цели вместо папки ссылка или файл; существующую цель нельзя прочитать для сравнения; цель, которую нужно изменить, или папка, где цель нужно изменить или создать, только для чтения; остаток прерванного или параллельного запуска; любая ошибка ОС на любом шаге записи (в том числе ENOSPC, EFBIG, EIO). Тогда код выхода 1, stdout пуст, в stderr только строки E_WRITE без трассировки стека; команда ничего не пишет вне проекта и не меняет ничего из того, что видит строгий список проекта: папки, файлы и ссылки, их права, байты и время изменения файлов, текст ссылок (время изменения папок не сравнивается). Исключения из «не меняет»: двойной сбой (после сбоя не удалось удалить свою временную запись или вернуть уже заменённую цель) — каждая такая запись и цель названа в строках E_WRITE, остальное как до запуска; сбой уборки после применения — все цели как после запуска без сбоя, каждая оставшаяся временная запись названа в строках E_WRITE, остальное как до запуска. Ни при сбое, ни когда процесс убит сигналом SIGKILL, цель не бывает записана частично: каждая цель — как до запуска или целиком новая, а если в STATE.md уже новое содержимое, то и в остальных целях тоже. После устранения причины и удаления названных остатков повторный запуск с теми же аргументами (у prepare-run — с тем же --created-at) даёт те же байты целей, что запуск без сбоя. Проверка: `cd tools && node --test test/apply.write.test.js test/prepare.write.test.js test/listing.test.js` — код 0 (эти файлы входят в `npm run check`); есть тесты на каждый вид сбоя из списка, а у вида с вариантами — на каждый вариант, возможный у команды (у apply-verdict: цель — папка, ссылка, не обычный файл; на пути — ссылка; у prepare-run: на пути — ссылка и файл), на каждую цель обеих команд, на оба исключения, на SIGKILL у обеих команд и на битую ссылку по пути папки прогона prepare-run (E_USAGE, код 2); каждый тест на отказ сравнивает строгий список до и после запуска; listing.test.js проверяет, что строгий список видит папки, ссылки, права и время изменения файлов"

