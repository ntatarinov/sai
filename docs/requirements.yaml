    title: Pixel Office — понятные ошибки сервера и страницы — «журнал не читается» отличим на странице от «нет связи с сервером», у ответов 403 и 405 тело того же вида, что у остальных ошибок сервера
    owner: BACKEND-DEV   # server.js (критерий 2) и общая проверка; изменение страницы (критерий 1: tools/src/pixel-office/public/app.js и texts.js) делает FRONTEND-DEV по проекту CODE-DESIGNER в том же прогоне WF-02
