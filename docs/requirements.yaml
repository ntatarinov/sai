      - "Шапка, в честной форме: название «Pixel Office»; значок «на связи» — только пока последний опрос сервера удался: до первого удачного опроса и при «Нет связи с сервером Pixel Office» (критерий 7 REQ-001) его нет, а пометка «Источник событий — Claude Code» (критерий 4 REQ-001) видна всегда; блок «Сейчас» — по одной строке на каждый элемент раздела «Текущие» панели задач (критерий 15), то есть на каждого работающего агента, в том же порядке (критерии 1–2 REQ-036; текста «и ещё N» нет): у задачи — название роли простыми словами (таблица REQ-036) и описание, если оно есть (критерий 6(з) REQ-001), у строки основной сессии — «Основная сессия — обрабатывает запрос»; элементы «нет свежих данных», «сервер перезапускался, события не записывались» и «окончание не записано» в блок не входят (критерий 2 REQ-042); при пустом разделе — «Сейчас: в работе ничего нет», а если есть элементы «нет свежих данных» или «сервер перезапускался, события не записывались», к этой фразе добавляется « · без свежих данных: N», где N — число элементов обоих состояний (критерий 13 REQ-042, решения 0050 и 0051); кнопки «Пауза» (на паузе — «Продолжить»), «1×», «2×», «4×»: на паузе персонажи стоят, новые маршруты ждут и проходятся после «Продолжить»; при 2× и 4× персонаж проходит тот же путь вдвое и вчетверо быстрее, чем при 1×; при открытии страницы — 1× без паузы; ссылки «← Учётная система» и выбора требования нет. Проверка: tools/test/pixel-office-panels.test.js — поддельные fetch и часы: «на связи» после удачного опроса, нет «на связи» до первого опроса и после неудачного, пометка шапки во всех трёх случаях; блок «Сейчас» на каждый случай — задача с описанием, задача без описания, только строка основной сессии, несколько элементов «в работе» (строк столько же, сколько элементов, текста «и ещё» нет; точные тексты — критерий 2 REQ-036, он заменяет прежние проверки PN-02), пусто, только элементы «нет свежих данных» и «сервер перезапускался, события не записывались» («Сейчас: в работе ничего нет · без свежих данных: N», N — число элементов обоих состояний, тексты — критерий 13 REQ-042) — и его смена после нового события; tools/test/pixel-office-office.test.js — поддельные кадры: на паузе за 10 секунд кадров ни один персонаж не сдвинулся, а событие за это время сразу изменило состояние; после «Продолжить» маршрут пройден; один и тот же путь при 2× и 4× занимает половину и четверть кадров пути при 1× (с точностью до одного кадра)"
      # 2026-10-13, прогон PIXEL-20261013-01, WF-01 шаг 1 доработка r3 по FAIL ворот: критерий изменён по REQ-042, decisions/0051 (облачки: слова успеха заменены словами факта, решение 0051 п. 3)
      - "Облачка — только фразы, привязанные к событиям (R2): над персонажем роли субагента — «Только что получил задачу» по первому началу задачи и «Закончил работу» по окончанию задачи; над персонажем основной сессии — «Получил запрос» по отправке запроса и «Вернул ответ» по концу ответа, закрывшему строку основной сессии; облачко видно, только пока по часам компьютера прошло от 0 до 10 секунд после времени события; других фраз нет — ни текстов из событий, ни фраз без события; строки «не из хуков», повторный старт задачи, конец ответа без открытой строки, окончание без записанного начала и события SessionStart, SessionEnd и PostToolUse облачков не дают. Проверка: tools/test/pixel-office-office.test.js — поддельные часы: на каждый из четырёх случаев — облачко с этой фразой над нужным персонажем в момент события и через 10 секунд, его нет через 11 секунд и раньше времени события; строка, полученная через 30 секунд после её времени (как после обрыва связи), облачка не даёт; в каждом перечисленном случае без облачка облачков нет; все фразы облачков во всех сценариях теста — из этих четырёх; слова окончания и конца ответа сверяются с BUBBLE_TEXTS.done и BUBBLE_TEXTS.answer_ready (критерий 8 REQ-042)"
      # 2026-10-15, прогон PIXEL-20261015-01, WF-01 шаг 1, доработка r1 (REQ-ANALYST): было → стало по таблице REQ-048, decisions/0057, дополнение, п. 2; номер и статус не менялись; в легенде «полное имя роли» (код) → название простыми словами (roleName), код — в подсказке.
      - "Легенда как на образце: по элементу на основную сессию и на каждую роль с задачей, в порядке столов, — название роли простыми словами (roleName по таблице REQ-036; код роли — только в подсказке «код роли: …», REQ-048, критерий 1; у основной сессии — «Основная сессия») и состояние: у роли «работает», пока у неё есть задача «в работе», иначе «свободен»; у основной сессии «работает», пока открыта её строка «обрабатывает запрос», иначе «свободна»; метка цвета роли — только у работающих; состояние меняется сразу по событию. Проверка: tools/test/pixel-office-office.test.js — по последовательности событий: имена, порядок, состояния, метка цвета только у работающих, смена состояния сразу после событий начала и окончания"
      - "Неподвижная обстановка как на образце (R2): тёмный клетчатый пол и стены вне зоны столов; растения и книжные полки; переговорная с подписью «ПЕРЕГОВОРНАЯ» — большой стол, места вокруг него и доска на стене; кухня с подписью «КУХНЯ» — стойка с кофемашиной и места отдыха; отдельные места отдыха в зале; серверная с подписью «СЕРВЕРНАЯ» — стойки за стенами. Уплотнение пустого пола по критерию 18(д) расхождением с образцом не считается, если состав комнат и их взаимное расположение по смыслу те же. Этот неподвижный слой не зависит ни от событий, ни от времени: при любом журнале и в любой момент он один и тот же; от событий зависит только содержимое доски (критерий 13); зона столов — столы с ноутбуками и стульями, перегородки между их колонками и место под них — растущая часть со своей проверкой (критерий 1); случайных величин в коде страницы и офиса нет. Проверка: tools/test/pixel-office-layout.test.js — в сетке есть три комнаты с этими подписями и названной обстановкой; клетки неподвижного слоя одинаковы при пустом журнале и при N = 1, N = K + 3 и N = 3·(K + 3) ролях (N и K — как в критерии 1); tools/test/pixel-office-office.test.js — вызовы рисования неподвижного слоя одинаковы для двух разных журналов (пустого и с K + 3 ролями) и для одного журнала в моменты, разделённые минутой (без маршрутов и облачков; содержимое доски не сравнивается); `grep -rn 'Math.random' tools/src/pixel-office/public; echo $?` — ни одной найденной строки и код 1 (код 2 — каталога нет, не проходит); как это выглядит — снимок по критерию 16"
      # 2026-10-13, прогон PIXEL-20261013-01, WF-01 шаг 1 доработка r1: критерий изменён по REQ-042 и decisions/0049, 0050 (слова состояний; доска считает только сессии со свежими данными)
      - "Доска в переговорной — канбан по ролям, в честной форме: столбец на каждую роль, у которой есть задача в идущих сессиях (идущая сессия — со свежими данными, критерий 3 REQ-042), в порядке первого появления роли в журнале, — цвет и подпись роли (как у персонажа) и число её задач в этих сессиях по состояниям — «в работе», «закончила работу, итог не записан», «окончание не записано» и «сервер перезапускался, события не записывались» (слова — критерий 5 REQ-042); роли, чьи столбцы не поместились, — одной меткой «+N», где N — их число; нет идущих сессий — на доске нет столбцов; доска меняется сразу по событию. Проверка: tools/test/pixel-office-office.test.js — по последовательности событий двух сессий, одна из которых закончилась: столбцы только ролей идущей сессии и верные числа по состояниям; ролей больше, чем помещается столбцов, — «+N» с верным N; после окончания последней идущей сессии столбцов нет; когда в единственной сессии нет событий дольше STALE_AFTER_MS (поддельные часы), столбцов нет, а после нового события сессии столбцы возвращаются (критерий 2 REQ-042)"
      # 2026-10-15, прогон PIXEL-20261015-01, WF-01 шаг 1, доработка r1 (REQ-ANALYST): было → стало по таблице REQ-048, decisions/0057, дополнение, п. 2; номер и статус не менялись; пометка строки журнала «не из хуков» → «не подтверждена» без значения source; «помеченные «не из хуков»» → «помеченные правилом чтения».
      - "Журнал как на образце, в честной форме: заголовок «Журнал»; фильтры «Всё», «Работа», «Офис», при открытии страницы — «Всё»: «Всё» — все строки журнала REQ-001, в том числе помеченные правилом чтения; «Работа» — строки видов UserPromptSubmit, Stop, PostToolUse, SubagentStart и SubagentStop; «Офис» — строки, по которым в офисе появился маршрут (критерий 3); выбранный фильтр не сбрасывается новыми событиями; подпись «время — <пояс>» с поясом часов компьютера (критерий 6(е) REQ-001); счётчик «N из M»: M строк подходят под фильтр, N из них показано (предел показа задаёт дизайн REQ-001); у строки — время, роль, вид события, описание задачи, если оно связано с запуском (критерий 6(з) REQ-001), и пометка «не подтверждена» у помеченных (без значения source, REQ-048); номера требования и текста итога нет. Проверка: tools/test/pixel-office-panels.test.js — последовательность со всеми видами событий, помеченной строкой и двумя маршрутами: каждый фильтр показывает ровно свои строки, счётчик равен числу показанных и числу подходящих строк, фильтр сохраняется после нового события, под TZ=Asia/Almaty в подписи пояса — Asia/Almaty"
