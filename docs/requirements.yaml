        исполнителя; на копии каталога Sai без node_modules во временной папке
        `cd tools && npm ci && npm run check` проходит с кодом 0, тесты
        tools/test/team-*.test.js входят в прогон (их число в выводе больше 0), вывод
        приложен"

  - id: REQ-010
    title: Sai Team, часть 2 — исполнители агентов — интерфейс run, claude-cli, scripted (только для тестов), инструменты ролей, потолок стоимости на запуск (без интерфейса)
    owner: BACKEND-DEV
    status: in_progress   # прогон PROD-20261006-01 (2026-10-06): исполнители построены и приняты по всем критериям, проверяемым без настоящего Claude (789 тестов, повторные ворота безопасности, ревью и тестов, мутанты, пробы гонки, чистая копия); остатки — критерий 14 (UAT настоящего запуска claude-cli) ждёт письменного согласия владельца и потолка расходов; depends_on REQ-002 ещё in_progress, done невозможен (шапка файла)
    depends_on: [REQ-009]   # проект, задачи, журнал, писатель, каталог ролей, язык событий; через REQ-009 — и REQ-002 (сейчас in_progress)
    original_request: >
      «Твоя задача — ДОВЕСТИ ПРОДУКТ ДО РАБОЧЕГО СОСТОЯНИЯ.»; «Главный ориентир:
      максимально автономная виртуальная команда + предельно простой UX для бизнеса +
      Pixel Office как живое зеркало реальной работы + качество продукта не хуже
      [образца], а в ключевых сценариях лучше.»; «Не подменяй реальную интеграцию
      mock-данными. Не подменяй работающую автономность визуальной имитацией.»;
      «Запрещено создавать красивый интерфейс, за которым нет реальной системы. Не
      создавай: случайные статусы; фиктивные проценты; fake agent activity; имитацию
      работы; декоративные task updates; захардкоженные сценарии для демо.»
      (владелец, 2026-10-06, сообщение в сессии Claude Code; дословные куски переданы
      ORCH в задании прогона PROD-20261006-01, шаги 02a и 02a-r1; название чужого
      проекта заменено ORCH на «[образец]»; полного текста сообщения в файлах Sai нет).
    description: >
      Что получает владелец. Роль виртуальной команды выполняет одну задачу проекта
      настоящим исполнителем — Claude Code как дочерний процесс — с инструментами только
      своей роли, в пределах потолка стоимости, с повтором при временном сбое; всё
      пишется в журнал ядра REQ-009 настоящими событиями. Планировщика, расписания,
      проверки, согласований и завершения проекта здесь нет — это REQ-013; интерфейса
      нет — REQ-011 и REQ-012 (только называются). Основа —
      docs/product/current-state.md (раздел 4: основной исполнитель — Claude Code как
      процесс) и docs/product/parity-matrix.md (раздел 6, пункты 3, 4).

      Исполнитель (решение ORCH D-B; записывается в 0015): один интерфейс run(роль,
      задача, контекст проекта, ограничения) → поток событий и итог (статус,
      файлы-результаты, краткий итог, расход). Два исполнителя. «claude-cli» —
      единственный настоящий: Claude Code как дочерний процесс (`claude -p`, вывод
      stream-json, потолок --max-budget-usd, ограничение набора инструментов по роли,
      схема ответа через --json-schema; флаги — из `claude --help`, как они записаны в
      docs/product/current-state.md, раздел 4); путь к исполняемому файлу —
      переменная SAI_TEAM_CLAUDE_BIN (по умолчанию `claude` из PATH). «scripted» —
      детерминированный и только для тестов: сценарий он берёт только из файла, путь к
      которому передаёт тест (файлы сценариев лежат в tools/test/fixtures/team/); при
      создании проекта командой `new` файл сценария копируется в папку проекта (имя копии
      — поле проекта scenario_file), и run берёт сценарий из копии (критерий 16); в
      tools/src/team/ сценариев нет; без файла сценария scripted отказывает. У проекта
      поле executor = scripted, и система везде честно его показывает (событие при
      запуске, поле проекта, фраза модуля «язык» со словами «тестовый исполнитель»);
      он не выбирается по умолчанию, не называется настоящим, а проект на claude-cli
      никогда не переходит на scripted молча. Настоящие запуски включены, только если
      задана переменная SAI_TEAM_REAL_RUNS=1 и у проекта задан потолок стоимости больше
      0; иначе задача проекта с executor claude-cli не запускается — отказ с понятным
      текстом. Условия проверяет сам исполнитель claude-cli внутри run() до запуска
      процесса, а не только команда run-task: так их не обходит ни одна команда, в
      том числе start и resume движка REQ-013, которые вызывают исполнитель сами.
      Потолок проекта — число не меньше 0, 0 значит «потолка нет»: ядро REQ-009 хранит
      такой проект (его создаёт API ядра), команда `new` требует потолок больше 0, а
      реальный запуск без потолка (нет потолка или 0) запрещает исполнитель — критерий 3.
      Переменная SAI_TEAM_WEB=0 отключает у Исследователя WebSearch и WebFetch
      (выключатель сети; решение ORCH I3, записывается в 0015); без SAI_TEAM_REAL_RUNS=1
      настоящий запуск невозможен вообще, и значит сети у Исследователя нет.

      Внутреннее соответствие ролей (дополняет каталог REQ-009): у каждой роли — промт и
      точный список инструментов Claude Code; пользователю не показывается. Списки в
      этом срезе (решение ORCH, записывается в 0015): Исследователь — Read, Write,
      Edit, Glob, Grep внутри work/ проекта и WebSearch, WebFetch (поиск и чтение
      страниц в сети, только чтение, без записи вовне; не передаются, если задана
      SAI_TEAM_WEB=0); Разработчик и остальные восемь
      ролей — Read, Write, Edit, Glob, Grep внутри work/ проекта. Ни у одной роли нет
      Bash (командной оболочки), запуска субагентов (Task, Agent) и других инструментов.
      Рабочая папка процесса — work/ в папке проекта; файлы, которые агент там
      создал, становятся файлами результата только через ядро REQ-009 — с маскированием,
      правами 0600 и событием результата (критерий 16); дополнительные папки (--add-dir)
      не передаются; флаги, отключающие проверку разрешений, не передаются.

      Команды для проверки без интерфейса (точный вывод — проект CODE-DESIGNER):
      `npm run team -- new --goal "<цель>" --budget <usd> [--executor scripted
      --scenario <файл>]` (создать проект), `npm run team -- add-task <id> --role
      <роль> --text "<описание>" --done-when "<критерий готовности>"` (добавить задачу
      вручную — для проверки; задачи из плана создаёт REQ-013), `npm run team --
      run-task <id> <задача>` (выполнить одну задачу один раз с повторами по правилам,
      без планировщика и без проверки). Все три — команды записи по правилу писателя
      REQ-009. Сбой диска у `new` (EACCES) и у записи файла результата в `run-task` (EIO)
      проверяется на уровне команды здесь (критерий 15); на уровне API ядра — критерий 13
      REQ-009.

      Повторы: временный сбой исполнителя (таймаут задачи, выход с ошибкой, оборванный
      вывод, сбой сети в задаче Исследователя) — повтор с паузой, не больше 2; после
      них задача «не удалось» с понятной причиной. Таймаут задачи — по умолчанию 20
      минут (настраивается); отмена запуска убивает дерево процессов; не больше одного
      процесса claude на задачу.

      Потолок стоимости на запуск: расход каждого запуска (из итога исполнителя)
      суммируется в проекте; каждый запуск claude получает --max-budget-usd не больше
      остатка потолка; при остатке 0 или меньше (в том числе при потолке 0 — «потолка нет») run-task
      не запускает процесс и отказывает с понятным текстом. Что делает проект при достижении потолка
      (вопрос пользователю, повышение потолка) — REQ-013.

      Безопасность. Q7: ключи и вход — только из окружения; значения переменных
      окружения не пишутся в журнал, файлы проекта и сообщения; журнал маскируется
      maskSecrets (REQ-009). Текст пользователя и агентов — данные: не меняет полей
      проекта, роли, исполнителя, флагов, потолка. Дочерний процесс — spawn с массивом
      аргументов без оболочки. Принцип Q8 — проекты не смешиваются: рабочая папка
      процесса — work/ в папке своего проекта, других папок процесс не получает. Q10 —
      исполнитель как внешний сервис: каждый его сбой, в том числе сбой сети в задаче
      Исследователя, даёт понятное событие и не роняет процесс; у запуска есть таймаут.
      Q11 — честный разбор: сам код Sai Team по сети не ходит (критерий 11), но у
      Исследователя есть исходящие запросы — WebSearch и WebFetch Claude Code; адреса
      выбирает модель, в том числе из текста пользователя, а запрос делает инструмент
      Claude Code, которым Sai не управляет; проверить каждый адрес перед запросом по
      Q11 (запрет loopback, частных сетей, link-local) Sai поэтому не может. Защита в
      этом срезе: только чтение (WebFetch и WebSearch, никаких инструментов записи
      вовне), запрещающие правила Claude Code для WebFetch на localhost, 127.0.0.1,
      [::1], 0.0.0.0 и 169.254.169.254, потолок стоимости, таймаут задачи, выключатель SAI_TEAM_WEB=0; остаток
      (частные сети, имена, которые указывают на внутренние адреса; исходящие
      GET-запросы по адресам, выбираемым моделью, с возможной утечкой контекста через
      адрес) назван в README и записывается в 0015 как остаточный риск Q11 (критерий 1
      REQ-009). R3 неприменим: фото покупателей нет. R2: события
      ENGINE — настоящие события в момент изменения, события scripted помечены.

      Файлы (от корня Sai): tools/src/team/ (интерфейс run, исполнители, внутреннее
      соответствие ролей, команды new, add-task, run-task), tools/test/exec-*.test.js (и помощник exec-helpers.js),
      поддельный исполняемый файл, записи stream-json и сценарии scripted для тестов в
      tools/test/fixtures/team/, tools/package.json, tools/README.md (раздел «## Sai
      Team — исполнители»). Не затрагиваются: tools/src/pixel-office/, .claude/agents/
      (роли конвейера разработки — не роли продукта).

      Вне области: планировщик, параллельность, проверка результата, согласования,
      завершение проекта, пауза и остановка проекта (REQ-013); интерфейс (REQ-011,
      REQ-012); многопользовательность; внешние интеграции; любые настоящие действия
      вовне (письма, публикации, платежи); исполнитель через Anthropic API по ключу
      (запасной вариант — отдельным требованием); выбор модели пользователем.
