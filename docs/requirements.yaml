    original_request: >
      Слова владельца, сообщение в сессии Claude Code, 2026-10-13; дословно — в
      docs/owner-requests/2026-10-13-pixel-office.md (названия разделов — по файлу). Раздел
      «Модель данных и достоверность»: «Не добавляй фиктивные сообщения, задачи, агентов,
      результаты, счётчики и временные отметки.» Раздел «Состояния и жизненный цикл»: «При
      невозможности достоверно определить состояние предпочитай «неизвестно» или «нет
      свежих данных», а не выдуманный статус.» Раздел «Задачи и правая панель»: «Если
      прогресс в процентах нельзя вычислить из реальных данных, не показывай фиктивные
      проценты.» Итоговый принцип: «Сначала достоверность, затем функциональность, затем визуальная
      полировка.» Объём работы и порядок — decisions/0049, пункт 1 («REQ-042 —
      достоверность состояний»); основание — изучение handoffs/PIXEL-20261013-01/
      step-00-architecture-auditor.json (result.report_markdown, дефекты D1–D5; ошибки сервера и страницы, D7 и D8, — REQ-043, решение 0051).
    description: >
      Что получает владелец. Страница Pixel Office перестаёт показывать то, чего журнал не
      знает. Задача, которая «в работе» по событиям, но в её сессии давно нет ни одного
      события, показывается как «нет свежих данных» с возрастом последнего события, а не
      как работающая; с карточки сессии уходят полоска прогресса и «задач n/m · ролей k»;
      слово «завершена» заменено словами, которые обещают столько, сколько знает источник;
      после перезапуска сервера задача помечена тем, что произошло, а не молчаливым
      «окончание не записано»; облачки и слова страницы не называют успехом то, что
      событие окончания не доказывает.

      Как сейчас (проверено по коду 2026-10-13, файлы — от корня Sai).
      1. tools/src/pixel-office/public/model.js (buildModel): задача и строка основной
      сессии остаются «в работе» до запуска сервера, следующего запроса или события
      SessionEnd; сессия «идёт» (running), пока её последняя строка — не SessionEnd и не
      раньше последнего запуска сервера. SessionEnd приходит редко, поэтому «в работе» и
      «Идёт» держатся днями (изучение: D1, D2). 2. app.js (sessionCard), panels.js
      (sessionStats), texts.js (SESSION_STATS): на карточке сессии — элемент progress и
      «задач n/m · ролей k»; m растёт по ходу работы, полоска почти всегда полная (D3).
      3. texts.js (STATE_LABELS): состояние completed называется «завершена», хотя оно
      значит только, что пришло событие SubagentStop или Stop (D4). 4. model.js: запуск
      сервера закрывает все открытые задачи как «окончание не записано», в том числе
      настоящие, и «Сейчас» пишет «в работе ничего нет» при работающем агенте (D5): после
      правки задачи этого состояния и состояния «нет свежих данных» не считаются «в
      работе», но в «Сейчас» не пропадают без следа — они входят в число «без свежих
      данных: N» с пояснением причины (критерий 13, решения 0050 и 0051). 5. texts.js
      (BUBBLE_TEXTS): облачки «Готово» и «Ответ готов» по событиям SubagentStop и Stop
      называют успех, которого эти события не доказывают.

      Что будет (содержание; расположение и вид слов на экране — описание интерфейса
      GUI-DESIGN-ANALYST, если оно понадобится, и проект CODE-DESIGNER). Порог: 60 минут без
      событий — ответ на первый вопрос изучения, decisions/0049 (возобновления задач бывают
      через часы; число из изучения в требование не вынесено, потому что способ его расчёта
      не записан); он записан одной именованной константой STALE_AFTER_MS. Возраст последнего события виден на экране у каждой задачи «в работе» и «нет
      свежих данных» и у каждой карточки сессии; «нет
      свежих данных» — не «завершена» и не «ошибка», а честное «не знаю». Источник вывода —
      только время последней доверенной строки хука той же сессии (правило критерия 7) и часы
      страницы; вывод назван выводом.

      Что в этой работе нет. Строки «Сейчас» по агентам и названия ролей простыми словами —
      REQ-036 (идёт после этого требования; критерии 9 и 15 REQ-007 согласованы с обоими
      требованиями шагом WF-01 прогона PIXEL-20261013-01; критерии REQ-042 проверяют только
      то, какие элементы входят в блок «Сейчас», и не зависят от его формы); ошибки сервера и
      страницы — отличие «журнал не читается» от «нет связи» и тела ответов 403 и 405 — REQ-043
      (после этого требования, 0051); обзор «агент → задача → событие» и итог сессии —
      REQ-044; новые события хуков (Notification, StopFailure) — REQ-045; хранение итога
      агента (0011, пункт (а), не меняется); вне этого требования: подпись «свободен» —
      вывод, а не событие; решает обзор (REQ-044); слово «завершён» у времени окончания в
      окне «Просмотр истории» (HISTORY_META_FINISHED) — подпись времени, не слово состояния
      и не облачко (критерий 8 называет это исключение); схема
      журнала, хук, подписи, правило чтения; вид, цвета и анимация (кроме раскладки названия роли и плашки состояния, критерий 14). Правила закрытия задач
      по SessionEnd, следующему запросу и Stop (критерий 6 REQ-001) не отменяются — к ним
      добавляется возраст.

      Планка. Q7 и решение 0013: слова состояний и возраст строятся из констант и часов
      страницы, описание и роль из журнала по-прежнему выводятся как текст (критерий 10).
      R2: новых данных не вводится, каждое слово состояния выводится из строк журнала,
      записей запуска сервера и часов (критерий 10). Q8 неприменим: данных клиентов нет,
      Pixel Office — служебный инструмент (решение 0003). Q10 в части внешних сервисов
      неприменим: страница ходит только на свой сервер 127.0.0.1, внешних вызовов нет;
      реалистичный сбой «журнал не читается» разобран в REQ-043, критерий 1. Q11 неприменим: адресов,
      которые задаёт клиент или пользователь и по которым ходит сервер, нет (страница
      запрашивает только собственные пути). R3 сейчас не применим (решение 0033).

      Файлы (от корня Sai): tools/src/pixel-office/public/ (model.js, panels.js, texts.js,
      app.js, office-model.js, schema.js или другой файл константы, style.css),
      tools/test/pixel-office-*.test.js, tools/test/pixel-office-helpers.js,
      tools/test/fixtures/pixel-office/ (образец журнала), раздел «## Pixel Office»
      tools/README.md, проект docs/design/REQ-042-*.md. Принятые тесты, которые меняют
      ожидания (прежние слова состояний, «Идёт», полоса и «n/m», тексты облачков),
      заменяются по таблице проекта, а не удаляются (критерий 12).

      Открытых выборов нет: объём и порог решены записью 0049, порядок работ и строка
      «Сейчас» при задачах без свежих данных — записью 0050, разделение на REQ-042 и REQ-043,
      состояния без подтверждения и слова облачков — записью 0051. Названия констант и
      текстов, не названных в критериях, выбирает проект.
    acceptance_criteria:
      - "Порог и правило «нет свежих данных». В tools/src/pixel-office/public/ одна экспортируемая константа STALE_AFTER_MS, равная 3 600 000 мс (60 минут, решение 0049); число порога записано один раз: `grep -rn 'STALE_AFTER_MS' tools/src/pixel-office/public/ | grep -c 'export const'` равно 1, а `grep -rnE '3600000|3_600_000|60 \\* 60 \\* 1000' tools/src/pixel-office/public/` даёт ровно одну строку — определение константы; форматирование возраста (критерий 4) берёт единицы времени из своих именованных констант и этих литералов не содержит. Возраст последнего события элемента = часы страницы минус время последней доверенной строки хука (определение — критерий 7) той же сессии: для задачи — сессии её последнего старта (критерий 6(и) REQ-001), для строки основной сессии — её сессии; отрицательный возраст считается нулём. Элемент, который по критерию 6 REQ-001 остался бы «в работе», при возрасте строго больше STALE_AFTER_MS получает состояние «нет свежих данных», при возрасте не больше — остаётся «в работе». «Нет свежих данных» не закрывает элемент: у него нет времени окончания, и он не называется ни «завершена», ни «закончила работу», ни ошибкой. Из «нет свежих данных» элемент возвращает в «в работе» следующая доверенная строка той же сессии, кроме двух случаев, где результат другой: SessionEnd делает задачу или открытую строку основной сессии «окончание не записано», а новый запрос (UserPromptSubmit) закрывает открытую строку основной сессии как «окончание не записано» и открывает новую строку «в работе»; SubagentStop делает задачу закончившей работу, Stop закрывает открытую строку основной сессии как закончившую работу (по состояниям — критерий 2(е), как в REQ-001 критерий 6 (в), (г)). Состояние пересчитывается по часам страницы при плановом пересчёте (REFRESH_MS в tools/src/pixel-office/public/app.js), без новых строк журнала. Если время последнего события не читается (не число), элемент — «нет свежих данных», возраст не показан, слова NaN на странице нет, страница не падает. Проверка: tools/test/pixel-office-page.test.js и tools/test/pixel-office-panels.test.js, поддельные часы, границы берутся из STALE_AFTER_MS: старт субагента в T0, больше строк нет — на T0 + STALE_AFTER_MS «в работе», на T0 + STALE_AFTER_MS + 1 мс «нет свежих данных»; плановый тик часов без новых строк меняет показанное слово; затем строка PostToolUse той же сессии — снова «в работе», затем SubagentStop — слово закончившей работу; задача идёт два часа, но в её сессии 5 минут назад было событие — «в работе»; то же для строки основной сессии (UserPromptSubmit без Stop, затем Stop); строка с нечитаемым временем; отдельный тест: значение STALE_AFTER_MS равно 3600000"
      # 2026-10-13, прогон PIXEL-20261013-01, WF-01 шаг 1 доработка r5 по второму FAIL ворот: факт о коде — tools/src/pixel-office/public/model.js, buildModel. Ветка UserPromptSubmit/SessionEnd (строки 306–315) закрывает открытую строку основной сессии (карта openRow) как state "unrecorded", closed_by next_prompt или session_end, и запоминает SessionEnd сессии (lastEnd); ветка Stop (332–341) закрывает только открытую строку (open !== undefined) как "completed", без открытой строки ничего не меняет; после цикла (386–392) строки, оставшиеся "in_progress" при latestStart > start_index, получают "unrecorded", closed_by server_start; задача (406–416): last_is_stop → "completed", иначе latestStart > last_start_index или lastEnd сессии > last_start_index → "unrecorded", иначе "in_progress". Возраст и «нет свежих данных» в коде появятся с этим требованием.
      - "«Нет свежих данных», «сервер перезапускался…» и «окончание не записано» не показывают работу. Для элемента в любом из этих трёх состояний (критерии 5 и 6): (а) персонаж роли не «работает», экран ноутбука на столе роли не светится, легенда пишет «свободен» или «свободна» (критерии 2 и 11 REQ-007; сама подпись «свободен» — вывод, её судьбу решает REQ-044); (б) в блоке «Сейчас» (критерий 9 REQ-007) и в разделе «Текущие» панели задач его нет — он стоит в «Истории» со своим словом состояния; элементы «нет свежих данных» и «сервер перезапускался…» при этом входят в число N строки «Сейчас» (критерий 13), «окончание не записано» — нет; (в) в карточке агента задача не в списке «Сейчас в работе», а показана со своим словом состояния и, если оно «нет свежих данных», с возрастом (критерий 4); (г) переход в «нет свежих данных» не событие журнала: он не даёт маршрута, облачка и строки в журнале (критерий 10 REQ-007 — облачка только по событиям); (д) число идущих сессий (число в карточке основной сессии, критерий 1 REQ-007) и доска в переговорной (критерий 13 REQ-007) считают только идущие сессии по критерию 3; (е) что делают со строкой следующие события (правила — REQ-001 критерий 6 (в), (г); факт о коде — в комментарии над критерием). Для задачи: из «нет свежих данных» её возвращает в «в работе» любая следующая доверенная строка её сессии, кроме SessionEnd; SessionEnd после старта задачи делает её «окончание не записано» из любого из трёх состояний; из «сервер перезапускался…» и «окончание не записано» её возвращает в «в работе» только повторный SubagentStart с тем же agent_id (правило (а) REQ-001); SubagentStop делает её закончившей работу из любого из трёх состояний. Для строки основной сессии: открытая строка — в том числе «нет свежих данных» и строка, которую запись запуска сервера пометила «сервер перезапускался…» до закрытия, — закрывается следующим запросом той же сессии или SessionEnd как «окончание не записано» (она не остаётся в прежнем состоянии), а новый запрос открывает новую строку «в работе»; Stop закрывает только открытую строку (из «нет свежих данных» и «сервер перезапускался…», если запрос или SessionEnd ещё не приходили) как закончившую работу; строку «окончание не записано» Stop не меняет (конец ответа без открытой строки ничего не меняет), как и любые другие строки; из «нет свежих данных» строку основной сессии возвращает в «в работе» любая другая доверенная строка её сессии, кроме запроса и SessionEnd. Проверка: tools/test/pixel-office-office.test.js и tools/test/pixel-office-panels.test.js — одна последовательность событий и поддельные часы на двух моментах, до порога и после: до порога персонаж «работает», экран светится по вызовам рисования, элемент в «Текущих» и в блоке «Сейчас», сессия идёт, на доске есть столбец роли; после порога — «свободен», экран по вызовам рисования не светится, элемент в «Истории», блок «Сейчас» пишет «Сейчас: в работе ничего нет · без свежих данных: N» (критерий 13), сессия не идёт, столбцов на доске нет, число маршрутов и облачков не выросло; для (е) два теста в tools/test/pixel-office-page.test.js. Тест FS-02 (задача): «нет свежих данных» и строка PostToolUse той же сессии — «в работе»; «нет свежих данных» и SessionEnd после старта — «окончание не записано»; «сервер перезапускался…» и PostToolUse — состояние прежнее, повторный SubagentStart того же agent_id — «в работе», SubagentStop — слово закончившей работу; «сервер перезапускался…» и SessionEnd после старта — «окончание не записано»; «окончание не записано» (SessionEnd) и PostToolUse — состояние прежнее, SubagentStop — слово закончившей работу. Тест FS-03 (строка основной сессии): «нет свежих данных» и следующий запрос — прежняя строка «окончание не записано», новая «в работе»; «нет свежих данных» и SessionEnd — «окончание не записано»; «нет свежих данных» и Stop — слово закончившей работу; «нет свежих данных» и PostToolUse той же сессии — «в работе»; запрос, запись запуска сервера и Stop — слово закончившей работу; запрос,