      - "«## Что не доказано» (при итоге «проверка на 14 дней») перечисляет каждое отличие из таблицы ценности, которое опирается на «не найдено» или «частично», цену и каждую долю как допущения и приём предоплаты, если исследования его не закрыли. «## Связь с большим планом» (при обоих итогах) говорит: docs/business-plan/README.md этим документом не меняется; шаг 2 Pixel Office в нём (строка 586) и его критерий остановки (строки 593–595), где 1% посетителей страницы сравнивается с 2% активных пользователей продукта (Д7; файл отзывов, разделы 1–2), в этом документе не используются; проводить ли проверку и какую — решает владелец. Проверка: grep -F «docs/business-plan/README.md» в разделе; остальное — шаг 3"
      - "Снимок «до» и защищённое (npm — из tools/, остальные команды — из корня sai): (а) после PASS шага 00b ORCH переводит REQ-006 из pending в in_progress — это единственное изменение блока REQ-006 до шага 5 или перевода в blocked; затем создаёт handoffs/<BP-ID>/parallel-runs.jsonl (критерий 15) и до отправки шага 1 выполняет `npm run snapshot -- ../handoffs/<BP-ID>/snapshot-before.txt`; в context обоих handoff-ов шага 1 пишет snapshot_before_sha256 (shasum -a 256 файла снимка), а для блоков REQ-006 и REQ-005 файла docs/requirements.yaml — req006_block_lines, req006_block_sha256, req005_block_lines, req005_block_sha256: Б6 = awk '/^  - id: REQ-006$/{f=1;print;next} f&&/^  [-#]/{exit} f&&/^[[:space:]]*$/{n++;next} f{for(;n>0;n--)print z;print}' docs/requirements.yaml, Б5 — та же команда с REQ-005 вместо REQ-006; lines — вывод Бn | wc -l, sha256 — Бn | shasum -a 256; Бn выполняется из корня sai (из tools/ — с ../docs/requirements.yaml). Результат Бn засчитывается, только если lines больше 0, Бn | head -n 1 | grep -cx '  - id: REQ-006' (для Б5 — '  - id: REQ-005') — 1, а sha256 не равен e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855: это хеш пустого ввода, то есть отказ команды, а не значение. В снимке grep -cE 'handoffs/<BP-ID>/step-01|session-review-|pixel-office-brief' — 0. (б) Защищённый набор З за прогон не меняется ни в одном байте: docs/business-plan/README.md; docs/business-plan/research/pixel-office.md, agent-pipeline.md, kpp-vision.md; docs/business-plan/reviews/; .claude/agents/; docs/workflows/WF-07-business-plan.md; tools/src/snapshot.js. З-строки снимка = grep -E '^[0-9a-f]{64}  (docs/business-plan/README[.]md|docs/business-plan/research/(pixel-office|agent-pipeline|kpp-vision)[.]md|docs/business-plan/reviews/.+|[.]claude/agents/.+|docs/workflows/WF-07-business-plan[.]md|tools/src/snapshot[.]js)$' <снимок> | LC_ALL=C sort. (в) На шаге 4 RELEASE-VALIDATOR сам: shasum -a 256 снимка «до» равен snapshot_before_sha256; снимает снимок «после» вне проекта; З-строки снимка «до» не пусты и совпадают (diff пуст) с З-строками снимка «после» и с выводом, не зависящим от tools/: find docs/business-plan/README.md docs/business-plan/research/pixel-office.md docs/business-plan/research/agent-pipeline.md docs/business-plan/research/kpp-vision.md docs/business-plan/reviews .claude/agents docs/workflows/WF-07-business-plan.md tools/src/snapshot.js -type f -exec shasum -a 256 {} + | LC_ALL=C sort; Б6 и Б5 проходят те же условия, и их lines и sha256 равны записанным; `npm run snapshot-diff -- ../handoffs/<BP-ID>/snapshot-before.txt <после> --allow docs/business-plan/pixel-office-brief.md --allow docs/business-plan/research/session-review-platforms.md --allow docs/business-plan/research/session-review-tools.md --allow handoffs/<BP-ID>/ --allow STATE.md $(cat <А>)` — код выхода 0, где <А> — разрешения объявленных прогонов (критерий 15). Контроли той же командой: (1) без трёх --allow выходных файлов REQ-006 — код 1 и ровно три строки added с этими путями; (2) с <копия-до> = { grep -v -F '  docs/owner-goals.md' <до>; printf '%064d  docs/owner-goals.md' 0; echo; } вместо снимка «до» — код 1 и ровно одна строка changed docs/owner-goals.md; (3) с <копия-после> = grep -v -F '  docs/owner-goals.md' <после> вместо снимка «после» — код 1 и ровно одна строка removed docs/owner-goals.md (вместо docs/owner-goals.md — любой файл, который есть в обоих снимках и не входит в разрешённые и объявленные пути). docs/requirements.yaml меняется только как объявленный путь параллельного прогона; блоки REQ-006 и REQ-005 защищают Б6 и Б5. (г) Если после снимка «до» пришлось править что-то вне выходов REQ-006, handoffs/<BP-ID>/, STATE.md и объявленных путей, — прогон заново с новым BP-ID или письменное исключение владельца (AP-007). Проверка: вывод всех команд (в) — в handoff-е шага 4"
      - "Параллельные прогоны: ORCH ведёт handoffs/<BP-ID>/parallel-runs.jsonl только дописыванием — JSON-строка на прогон (дополнение путей — новой строкой с тем же run_id): run_id — имя папки handoff-ов прогона; declared_at (date -u +%Y-%m-%dT%H:%M:%SZ); serves — непустой список того, чему служит прогон (REQ-NNN, ISS-NNNN или decisions/NNNN), без REQ-006; paths — пути, которые прогон может менять (папка — с / на конце, как --allow у snapshot-diff), среди них всегда handoffs/<run_id>/. Прогон, идущий в момент снимка «до», объявляется до отправки шага 1; новый — до отправки его первого handoff-а. При отправке шага 1 ORCH пишет в context обоих handoff-ов шага 1 parallel_runs_lines (wc -l файла) и parallel_runs_sha256 (shasum -a 256 файла). Ни один объявленный путь не совпадает с путём из З (критерий 14) или выходов REQ-006 (docs/business-plan/pixel-office-brief.md, docs/business-plan/research/session-review-platforms.md, docs/business-plan/research/session-review-tools.md, handoffs/<BP-ID>/), не содержит его и не лежит внутри него. Разрешения дают только прогоны, у которых к шагу 4 в handoffs/<run_id>/ есть хотя бы один handoff: <А> = for r in $(jq -r .run_id <файл> | LC_ALL=C sort -u); do ls handoffs/$r/*.json >/dev/null 2>&1 && jq -r --arg r $r 'select(.run_id == $r) | .paths[]' <файл>; done | sed 's/^/--allow /' (вывод — в файл вне проекта). Проверка: на шаге 4 RELEASE-VALIDATOR из корня sai, <файл> = handoffs/<BP-ID>/parallel-runs.jsonl — (1) jq -se --arg t '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$' --arg h handoffs/ --arg s / --arg x REQ-006 'all(.[]; . as $e | ($e.run_id|length) > 0 and ($e.declared_at|test($t)) and ($e.serves|length) > 0 and ($e.serves|index([$x])|not) and ($e.paths|length) > 0 and ($e.paths|all(length > 0)) and ($e.paths|index([$h + $e.run_id + $s])))' <файл> — true; (2) jq -s '[.[].declared_at] == ([.[].declared_at]|sort)' <файл> — true; (3) head -n <parallel_runs_lines> <файл> | shasum -a 256 — равен parallel_runs_sha256; (4) jq -n '[inputs | .paths[]] as $d | [$ARGS.positional[] as $z | $d[] as $x | select($x == $z or (($x|explode|last) == 47 and ($z|startswith($x))) or (($z|explode|last) == 47 and ($x|startswith($z)))) | $x] | length' --args <пути З и выходов REQ-006> < <файл> — 0 (47 — код символа /); (5) для каждого run_id, у которого есть handoff-ы: в jq -r '.context.requirement_ids // [] | .[]' handoffs/<run_id>/*.json | LC_ALL=C sort -u нет строки REQ-006 (grep -cx REQ-006 — 0), и comm -23 этого списка с jq -r --arg r <run_id> 'select(.run_id == $r) | .serves[]' <файл> | LC_ALL=C sort -u пуст — каждый id из handoff-ов прогона объявлен в serves; (6) у run_id, впервые появившегося после первых parallel_runs_lines строк, declared_at его первой строки не позже jq -r .created_at handoffs/<run_id>/*.json | LC_ALL=C sort | head -n 1"
      - "Задания при замороженных мандатах: task.description каждого handoff-а шагов 1b, 2a, 2b, 2c, 3, 4 и 5 (и их -rN, -runN) содержит строку «REQ-006 действует вместо REQ-005» и строку, которая начинается с «Дополнительные источники этого прогона:», — с путями сверх списка мандата или словом «нет»; задание шага 2b содержит «Шаг 2b задан критериями 4–6 REQ-006»; задание шага 3 содержит «Проверки мандата, привязанные к REQ-005 (обязательные разделы, план на 30 дней, числовые критерии остановки), заменяются критериями REQ-006»; задание шага 2c содержит step-02a-plan-writer-value и step-02b-plan-validator-value — имена handoff-ов 2a и 2b из критерия 6, и оба пути есть в его context.artifacts_in. Каждая фраза — в одной строке, без переноса. ORCH выполняет эти проверки на каждом handoff-е до его отправки и пишет вывод в context.task_check. Проверка: jq -r .task.description <handoff> | grep -cF '<фраза>' — не меньше 1 для каждой фразы; jq -r .task.description <handoff> | grep -c '^Дополнительные источники этого прогона:' — не меньше 1; jq по context.artifacts_in и context.task_check"
      - "Ворота прогона: REQ-VALIDATOR — PASS до отправки шага 1 (AP-010). Шаг 3 — PLAN-VALIDATOR, не запуск автора, result.verdict «PASS» по критериям 4 (часть для шагов 3 и 4) и 7–13 (step-03-plan-validator.json); FAIL — тот же PLAN-WRITER дорабатывает (step-02c-plan-writer-rN.json с result.changes), затем step-03-plan-validator-rN.json; не больше двух доработок. Шаг 4 — RELEASE-VALIDATOR, result.verdict «PASS» по всем критериям, кроме последнего (step-04-release-validator.json); не больше двух доработок. Расхождение RELEASE-VALIDATOR с вердиктом 2b — не повод для доработки: REQ-006 сразу blocked «вердикт ворот оспорен» (критерий 5). FAIL после второй доработки на шаге 1b, 3 или 4 — REQ-006 blocked, замечания передаются владельцу; эскалация не считается выполнением. Проверка: jq по result.verdict"
      - "Handoff-ы: у каждого handoff-а в handoffs/<BP-ID>/ шага, который выполнял агент (включая step-00a, step-00b и их -rN), заполнен context.agent_run_id (продолженный после перерыва агент сохраняет свой id, повторный запуск -runN получает новый); у автора и проверяющего одного шага id разный; created_at и started_at — одно чтение часов; каждая доработка после FAIL — отдельный handoff …-rN.json с result.changes (AP-013); повторный запуск после обрыва — …-runN.json, а прерванный handoff закрыт как FAILED с пометкой not_agent_attested (WF-07, «Handoff-ы»; AP-006); у каждого handoff-а проверяющего (00b, 1b, 2b, 3, 4) есть result.verdict. Проверка: jq"
      - "Учёт, шаг 5 — после PASS шага 4; этот критерий проверяет ORCH до записи DONE (мандат doc-updater.md, Q2) и пишет вывод своих команд и вердикт в context.orch_check handoff-а шага 5: (а) в docs/anti-patterns.md новая запись «### AP-NNN — …» с полями «Что случилось», «Почему это плохо», «Как правильно», «Где найдено» — об ошибке знаменателя; в ней есть «README.md», «594», «Д7» и docs/business-plan/reviews/2026-09-30-external-review.md; (б) в STATE.md в разделе доработок большого плана (заголовок «### », содержащий «доработки бизнес-плана»; пояснение в скобках DOC-UPDATER исправляет, если для новых пунктов оно неверно) есть пункт с «594» и номером этой записи AP и пункт с «каскад сигналов» и ссылкой на раздел 3 файла отзывов; (в) STATE.md называет итог REQ-006 («проверка на 14 дней» или «рано») и путь docs/business-plan/pixel-office-brief.md; (г) в docs/workflows/WF-07-business-plan.md есть раздел «## Вариант: короткий документ с воротами ценности» со строками «Шаг 2a», «Шаг 2b», «Шаг 2c», правилом, что FAIL на шаге 2b сразу даёт итог «рано», правилами снимка и parallel-runs.jsonl и лимитами доработок шагов 1b, 3, 4 и 5 (WF-07 защищён до шага 4 включительно, на шаге 5 его дописывают); (д) статус REQ-006 — done, последним действием шага; (е) у каждого handoff-а шага 5 заполнен context.agent_run_id. Если проверка ORCH не прошла — DOC-UPDATER в доработке step-05-doc-updater-rN.json первым действием возвращает статус REQ-006 в in_progress, исправляет, последним действием снова ставит done и перечисляет правки в result.changes; ORCH проверяет снова; не больше двух доработок (правило этого требования: в WF-07 лимита для шага 5 нет), FAIL после второй — REQ-006 blocked. done итоговый, только если context.orch_check.verdict последнего handoff-а шага 5 — «PASS». Проверка: grep по пунктам (а)–(г), awk для раздела STATE.md, jq по (д), (е) и context.orch_check"

