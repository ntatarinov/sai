    original_request: >
      Слова владельца, сообщение в сессии Claude Code 2026-10-14, после показа
      переделанного Pixel Office; дословно — в
      docs/owner-requests/2026-10-14-pixel-office-interactive.md:
      «Честно говоря, я думал, то, что Pixel Office будет более интерактивный, но я этого не увидел. Мне сейчас это самое главное. Когда я нажимаю на рабочий стол агента, либо на агента, когда я вижу журнал, тому прочее, это должно быть более интерактивно. Потому что там написано все непонятно для пользователя.»
      Просьба того же владельца 2026-10-13, сообщение в сессии Claude Code; дословно — в
      docs/owner-requests/2026-10-13-pixel-office.md. Основной сценарий: «Пользователь открывает агента и изучает его текущую деятельность.» и «Пользователь может проследить сообщения и передачи работы между агентами, если эти взаимодействия действительно зарегистрированы.»
      «Интерактивный офис», «Рабочие места и компьютеры»: «Сделай значимые рабочие места интерактивными.» Из списка «При выборе рабочего места показывай:» — «кто с ним связан;», «какие реальные события подтверждают текущую активность;», «текущую задачу, если она достоверно определена;», «последнее зарегистрированное действие;», «историю и результат работы, если они доступны.»
      «Не связывай агента с компьютером исключительно ради визуальной композиции. Если в источниках данных нет модели физических рабочих мест, используй их как визуальные представления агентов, не выдавая это за фактическое состояние операционной системы.»
      «Различай состояние агента, состояние задачи и состояние рабочего места. Они не обязательно совпадают.»
      «Агенты»: «При нажатии на агента открывай удобную карточку или боковую панель.» «Не создавай длинные карточки с бесполезными цифрами. Важные сведения должны быть видны сразу, подробности — доступны по раскрытию.»
      «Визуальный уровень и удобство»: «доступность основных действий с клавиатуры;»
      Объём и порядок — decisions/0054, п. 1 и дополнение 2, п. 1 (REQ-044 — карточка экземпляра агента по нажатию на персонажа или стол).
    description: >
      Что получает владелец. Нажатие на персонажа роли или на его стол (мышью) и нажатие
      Enter на строке роли в легенде (с клавиатуры) открывает карточку одного экземпляра
      агента — одного запуска субагента (одного agent_id), — а не только роли: кто это
      простыми словами, что известно о нём сейчас и на каком событии это основано, его
      задача, полученные задания, возврат результата, кто его запустил и кого запустил он.
      Чего журнал не знает, карточка называет прямо.

      Как сейчас (проверено по коду 2026-10-14, файлы — от корня Sai).
      1. tools/src/pixel-office/public/app.js, onCanvasClick: точка нажатия переводится в клетки
      (canvasPoint), hitTest (office-view.js) ищет только персонажа — в пределах 0,9 клетки по
      горизонтали и 1,1 по вертикали от его клетки, среди всех позиций sim.positions(), в
      том числе персонажей в пути; нажатие на стол, когда персонаж ушёл по маршруту, и
      нажатие на ноутбук карточку не открывают. 2. Персонаж и стол — одни на роль
      (buildOffice, office-model.js: character.key = role:<agent_type>); карточка — карточка
      роли (buildCard): название роли кодом (character.full), «в работе: N» (CARD_WORKING),
      списки задач роли по состояниям и 10 последних событий роли; экземпляра, его agent_id
      и session_id, кто запустил и кого запустил, описания задачи отдельно от списка нет. У
      основной сессии та же функция даёт карточку «Основная сессия» со строкой «идущих
      сессий: N» (CARD_SESSIONS) и разделами строк основной сессии. 3. Карточка
      пересобирается при каждом обновлении (renderCard, replaceChildren). 4. С клавиатуры
      карточка открывается кнопкой легенды (button, Enter и Space); Escape закрывает её
      (onKey); фокус возвращается на кнопку легенды, только если карточку открыла легенда
      (openerKey), после нажатия на холст фокус никуда не возвращается. 5. Данные, которые
      есть (schema.js, LINE_KEYS; hook.js и protocol.js, buildWriteBody): SessionStart,
      SessionEnd, UserPromptSubmit, Stop, SubagentStart, SubagentStop и PostToolUse — только
      для инструмента Agent и только с tool_response.agentId (launched_agent_id), с
      subagent_type и description (до 100 знаков), если они есть во входе; agent_id есть у
      событий внутри субагента. Строку PostToolUse пишет тот, кто передал задание; у агентов
      переднего плана она приходит после SubagentStop запущенного агента (проба P2 в
      docs/design/REQ-001-pixel-office.md, событие 23; в журнале владельца по счёту 114 из 526
      таких строк), у фоновых — сразу при запуске (факт (10) описания REQ-001). Вызовов
      других инструментов, сообщений между агентами, ошибок и ожидания человека журнал не
      знает (события хуков — отдельное требование, номер при записи, decisions/0057, п. 3). В журнале
      владельца на 2026-10-14 — 3719 строк, 534 разных agent_id, 4 разных session_id (счёт
      командами без вывода текстов); у одной роли бывает много экземпляров.

      Что будет (содержание; расположение и вид — описание интерфейса GUI-DESIGN-ANALYST,
      устройство — проект CODE-DESIGNER).
      1. Нажатие на персонажа роли или на любую клетку стола его роли (стол, ноутбук на нём,
      место за столом — по раскладке layout.js) открывает карточку; если точка попадает и в
      персонажа, и в клетку стола, открывается карточка персонажа: он нарисован поверх
      стола, и человек нажимает на ту фигуру, которую видит (персонаж другой роли, пришедший
      по маршруту к чужому столу, открывает свою карточку). По умолчанию — экземпляр, первый
      в порядке списка модели (правило d REQ-001: «в работе» первыми, новые сверху) среди
      задач этой роли. Другие экземпляры той же роли — список в карточке, выбор переключает
      карточку.
      2. Основная сессия в этом требовании не меняется: нажатие на её персонажа или стол и
      кнопка легенды «Основная сессия» открывают прежнюю карточку (buildCard для ключа
      main: «разговоров идёт: N» (слово — REQ-048) и разделы строк основной сессии, критерий «Карточка агента»
      REQ-007); новую карточку основной сессии даёт REQ-047.
      3. Состояние экземпляра показано тремя отдельными строками, у каждой — основание:
      задача (слово состояния REQ-042 и то, что его определило: для «в работе» и «нет
      свежих данных» — время последнего доверенного события сессии и его возраст по
      критериям 1 и 4 REQ-042), агент (последнее событие самого экземпляра — SubagentStart
      или SubagentStop), рабочее место (стол роли на холсте — изображение роли, общее для
      всех её экземпляров, а не компьютер; слово легенды «работает» или «свободен» — вывод
      по журналу). Судьба подписи «свободен» (decisions/0051, п. 2): подпись в легенде
      остаётся, карточка объясняет, что она значит; критерий 2(а) REQ-042 не меняется.
      4. Связи — только по равенству идентификаторов: кто запустил — по правилу z REQ-001
      (критерий 6(з)); кого запустил — строки PostToolUse с agent_id, равным agent_id
      экземпляра. Запись PostToolUse о передаче задания этому экземпляру показана отдельно,
      как «задание передано», а не как действие самого агента.
      5. Важное видно сразу, подробности — раскрытием; раскрытия и фокус не сбрасываются
      плановым обновлением страницы.
      Как выполняются критерии 4 и 2(в) REQ-042 в новой карточке: у экземпляра «в работе» и
      «нет свежих данных» строка «Задача» и пункт списка экземпляров показывают время
      последнего события сессии и возраст; прежние разделы карточки роли со словами
      состояний и возрастом остаются в раскрытии «Вся роль».

      Что в этой работе нет. Карточка основной сессии и переходы из карточки к панели
      «Задачи», журналу и окну «Просмотр истории», а также переходы в карточку из журнала и
      панели — REQ-047; фильтры и поиск журнала — REQ-046; слова событий — REQ-045; новые
      события хуков — отдельное требование (decisions/0057, п. 3); итог сессии — после него (decisions/0054, дополнение, п. 2);
      хранение текста ответа агента (decisions/0011, п. (а), не меняется); строки «Сейчас» и
      названия ролей — REQ-036; подписи персонажей на холсте (D13), цвета, анимация и
      маршруты; сервер, хук, схема журнала и правило чтения.

      Планка. R2: каждая строка карточки выводится из строк журнала, записей запуска сервера,
      часов страницы и констант texts.js; связи — только по равенству идентификаторов; о
      компьютере, операционной системе, сообщениях между агентами, ошибках и ожидании
      карточка говорит «не записано» или «Claude Code этого не сообщает», а не придумывает. Q7 и
      решение 0013: роль, описание и идентификаторы выводятся как текст (textContent); в
      буфер обмена кнопка «Скопировать» кладёт только значение идентификатора. Q10: внешних
      сервисов нет (страница ходит только на свой сервер 127.0.0.1), но реалистичные плохие
      условия — неполные строки, связь потеряна, буфер обмена недоступен — страницу не
      роняют (критерий 8). Q8 неприменим: данных клиентов и пространств бизнеса нет, Pixel
      Office — служебный инструмент (decisions/0003). Q11 неприменим: адресов, которые
      задаёт клиент или пользователь и по которым ходит сервер, нет. R3 сейчас не применим
      (decisions/0033). Журнал владельца в работе и приёмке читается только командами счёта
      без вывода текстов (decisions/0054, дополнение 2, п. 2).

      Файлы (от корня Sai): tools/src/pixel-office/public/ (app.js, office-model.js,
      office-view.js, panels.js, texts.js, index.html, style.css или новый модуль карточки),
      tools/test/pixel-office-*.test.js, tools/test/pixel-office-helpers.js,
      tools/test/fixtures/pixel-office/, раздел «## Pixel Office» tools/README.md, проект
      docs/design/REQ-044-*.md и описание интерфейса (имя — по WF-04), документы приёмки
      docs/uat/REQ-044*.md. Принятые тесты, ожидания которых меняются (карточка роли, «в
      работе: N» в шапке карточки, возврат фокуса после нажатия на холст), заменяются по
      таблице проекта, а не удаляются (критерий 11).

      Открытые выборы (ответ — описание интерфейса или проект): где стоит карточка (окно
      или боковая панель) и как выглядят раскрытия.
    acceptance_criteria:
      # 2026-10-15, прогон PIXEL-20261015-01, WF-01 шаг 1 (REQ-ANALYST): по REQ-048 («понятный язык и вид») заменены только слова на экране и место кода роли, смысл и номера критериев не меняются; было → стало: критерий 1 — «идущих сессий: N» → «разговоров идёт: N»; 3 — код роли «рядом» с названием → в раскрытии «Полные номера и код роли», «экземпляр» → «запуск», «Экземпляры этой роли» → «Все запуски этой роли»; 4 — «порог свежести» → «после 60 минут без событий…», «Сессия Claude Code закрыта» → «Закрыт разговор с Claude Code», фраза «…хук не записывает» → «…Claude Code не сообщает»; 5 — пояснение «У агентов переднего плана… у фоновых…» → «Если он ждёт ответа агента… если агент работает параллельно…», две фразы «…хук…» → «…Claude Code не сообщает»; 7 — «экземпляров роли: N» → «запусков этой роли: N»; 10 — «экземпляр», «Экземпляры этой роли», «идущих сессий: N» — так же. В описании устаревшее «события хуков — REQ-048» заменено ссылкой на decisions/0057, п. 3. Статус done не менялся; перепроверку правленых критериев проводит RELEASE-VALIDATOR прогона REQ-048.
      # 2026-10-14, прогон PIXEL-20261014-01, WF-01 шаг 1, доработка r1 по FAIL ворот (handoffs/PIXEL-20261014-01/step-02-req-validator.json): F2 — карточка основной сессии и переходы вынесены в REQ-047, прежние критерии 7 и 8 удалены, прежние 9–13 стали 7–11; F3 — приёмка только на стенде; F5 — основание «в работе» и «нет свежих данных» со свежестью и возрастом, последнее действие — только события экземпляра; F6 — depends_on ссылается на 0054, дополнение, п. 1; L1 — персонаж старше клетки стола; L2 — способ замера в критерии 7.
      # 2026-10-15, прогон PIXEL-20261015-01, WF-01 шаг 1, доработка r2 (REQ-ANALYST): было → стало, decisions/0057: запуск по умолчанию «первый элемент роли по правилу d» → при запуске «в работе» — прежнее правило, без него — критерий 8 REQ-047 (наблюдение Н2); номер и статус не менялись; перепроверяет RELEASE-VALIDATOR прогона REQ-046/REQ-047/REQ-048.
      - "Нажатие мышью на персонажа роли или на его стол открывает карточку экземпляра. Попадание: персонаж — как сейчас (hitTest по всем позициям, в том числе персонажей в пути); стол — любая клетка стола роли (стол, ноутбук на нём, место за столом; набор клеток берётся из той же раскладки layout.js, по которой рисуется стол), в том числе когда персонаж этой роли ушёл по маршруту или стоит на паузе. Старшинство (L1): если точка попадает и в персонажа, и в клетку стола, открывается карточка персонажа. Нажатие на пустой пол, стену или обстановку вне столов — как сейчас (карточка закрывается, выделение снимается, критерий «Карточка агента» REQ-007). Открывается экземпляр по умолчанию: если у роли есть запуск «в работе» — первый элемент этой роли в порядке списка модели (правило d REQ-001); если запуска «в работе» нет — по правилу критерия 8 REQ-047 (сначала запуски «нет свежих данных» и «сервер перезапускался…», затем самое позднее собственное событие; до выполнения REQ-047 — первый элемент по правилу d); заголовок — название роли простыми словами по таблице REQ-036. Персонаж, стол и кнопка легенды основной сессии открывают прежнюю карточку основной сессии без изменений, кроме слов, которые меняет REQ-048 (описание, п. 2; новая — REQ-047). Проверка: тест AC-01 в tools/test/pixel-office-office.test.js — для каждой клетки каждого стола раскладки на журнале из трёх ролей и основной сессии функция попадания возвращает ключ роли этого стола, для клетки пола между столами — null; персонаж роли в пути (позиция не у стола) — клетка его стола всё равно даёт ключ его роли; персонаж роли B стоит на клетке подхода к столу роли A, точка — в пределах его попадания и в клетке стола A: возвращается ключ B, а точка в клетке стола A вне попадания персонажа — ключ A; тест AC-02 в tools/test/pixel-office-page.test.js — нажатие на середину стола роли с двумя экземплярами (один «в работе», начат раньше; другой «закончила работу, итог не записан», начат позже) открывает карточку экземпляра «в работе» (его 8 знаков agent_id в карточке), нажатие на персонажа — та же карточка; нажатие на стол основной сессии — прежняя карточка с текстом «разговоров идёт: N» (слово — REQ-048); идентификаторы AC-01…AC-11 свободны (`grep -rn '\"AC-' tools/test/` сейчас ничего не находит)"
      - "Клавиатура. Кнопка роли в легенде (её достигает Tab) по Enter и по Space открывает ту же карточку, что нажатие на персонажа этой роли; внутри карточки Tab проходит все её управляющие элементы (кнопки «Скопировать», раскрытия, список экземпляров, кнопки связей, «×») в порядке их показа; Escape при фокусе на любом элементе карточки закрывает её; после закрытия (Escape, «×» или нажатие вне карточки) фокус стоит на кнопке легенды той роли, чья карточка была открыта, — и когда карточку открыла легенда, и когда её открыло нажатие на холст. У элемента карточки в фокусе видно кольцо фокуса (урок ISS-0064). Проверка: тест AC-03 в tools/test/pixel-office-page.test.js — keydown Enter и Space на кнопке легенды открывают карточку той роли; Escape закрывает, document.activeElement — кнопка легенды этой роли; то же после открытия нажатием на холст; приёмка в браузере (критерий 10, шаг 6): Tab по карточке, у каждого элемента в фокусе getComputedStyle даёт outline-style не none или box-shadow не none"
      - "Шапка карточки: кто это и какой экземпляр. Видно сразу (не в закрытом раскрытии): название роли простыми словами (таблица REQ-036; роль, которой нет в таблице, — как пришла, целиком; без роли — «(роль не указана)»), код роли из журнала (agent_type), если он отличается от названия, — не в шапке, а в раскрытии «Полные номера и код роли» с подписью «код роли: …» (REQ-048, критерий 1); слово «запуск» и первые 8 знаков agent_id; «сессия» и первые 8 знаков session_id. Полное значение каждого идентификатора — в раскрытии, выделяемым текстом, и кнопкой «Скопировать»: она вызывает navigator.clipboard.writeText с полным значением; после удачи рядом слово «скопировано»; если navigator.clipboard нет или обещание отклонено — текст «не удалось скопировать — выделите значение вручную», полное значение показано, страница не падает. Если у роли больше одного экземпляра — список «Все запуски этой роли»: у каждого 8 знаков agent_id, слово состояния REQ-042, у состояний «в работе» и «нет свежих данных» — время последнего события сессии и возраст (критерий 4 REQ-042), описание задачи или «описание не записано», время последнего начала; выбор пункта переключает карточку на этот экземпляр, текущий помечен aria-current; если экземпляров больше 5 — показаны 5 по порядку правила d и подпись «показано 5 из N», остальные — раскрытием. Проверка: тест AC-04 в tools/test/pixel-office-page.test.js — роль из таблицы REQ-036, роль вне таблицы, задача без роли: тексты шапки; agent_id из 128 знаков: в шапке 8 знаков, в раскрытии все 128; поддельный clipboard: удача — writeText вызван ровно один раз с полным agent_id, слово «скопировано»; clipboard отсутствует и отклоняет — текст отказа, исключения нет; роль с 7 экземплярами — 5 в списке, «показано 5 из 7», у пункта «в работе» и у пункта «нет свежих данных» есть возраст, у закончившего работу — нет; выбор второго — шапка и строки карточки второго"
      - "Состояние задачи, агента и рабочего места — три отдельные строки, у каждой основание, которое это состояние действительно определяет. (а) «Задача»: слово состояния элемента по таблице STATE_LABELS (REQ-042, критерий 5) и основание: «в работе» — последнее доверенное событие сессии (определение — критерий 7 REQ-042), его время и возраст, и что после 60 минут без событий пишется «нет свежих данных» (критерий 1 REQ-042), а рядом — последнее начало экземпляра («получил задание и начал работу» или, у повторного начала, «продолжил работу» — слова REQ-045) и его время; «нет свежих данных» — то же время последнего события сессии и возраст, больше порога; «сервер перезапускался, события не записывались» — время запуска сервера после последнего начала, без возраста (как в панели «Задачи»); «закончила работу, итог не записан» — последнее событие SubagentStop после последнего начала («закончил работу и вернул ответ») и его время; «окончание не записано» — событие «Закрыт разговор с Claude Code» после последнего начала и его время. (б) «Агент»: последнее событие самого экземпляра — самая поздняя по порядку файла доверенная строка SubagentStart или SubagentStop с его agent_id — словами таблицы REQ-045, её время и возраст, и фраза «о других действиях агента — чтении файлов, командах, правках — Claude Code не сообщает». (в) «Рабочее место»: что стол на холсте — изображение роли, общее для всех её экземпляров, а не компьютер, и что о компьютере и операционной системе Pixel Office ничего не знает; слово легенды этой роли («работает» или «свободен») и его смысл: «работает» — у роли есть задача «в работе» (с их числом), «свободен» — по журналу у роли нет задачи «в работе», это вывод по событиям, а не событие. Проверка: тест AC-05 в tools/test/pixel-office-panels.test.js — поддельные часы; по одному экземпляру в каждом из пяти состояний: строка «Задача» содержит слово, равное STATE_LABELS, и основание этого критерия; экземпляр «в работе», начатый три часа назад, при доверенной строке своей сессии 5 минут назад — основание называет время этой строки и «5 мин назад», а не время начала как основание свежести; повторно начатый экземпляр — «продолжил работу» с временем второго начала; экземпляр «нет свежих данных» при другом экземпляре той же роли «в работе» — «Задача» — «нет свежих данных», «Рабочее место» — «работает» (строки различаются); у роли без задач «в работе» — «свободен» с пояснением; все тексты-шаблоны — константы texts.js"
      - "Задача, полученные задания и возврат — то, что журнал знает об экземпляре. Текущая задача: описание из связанной строки PostToolUse по правилу z (REQ-001, критерий 6(з)) с подписью, что его написал передавший задание; связанной строки нет — «описание не записано: записи о передаче задания нет»; строка есть без описания — «описание не записано»; связанных строк несколько (разные tool_use_id) — «не установлено: записей о передаче задания несколько». «Задание передано»: каждая строка PostToolUse с launched_agent_id, равным agent_id экземпляра, — время, кто передал, описание и пояснение «Эту запись пишет тот, кто передал задание. Если он ждёт ответа агента, запись приходит после окончания работы агента; если агент работает параллельно — сразу при запуске. Это не действие самого агента» (основание — проба P2 в docs/design/REQ-001-pixel-office.md и факт (10) описания REQ-001); эти строки не входят в последнее событие агента (критерий 4 (б)). Начала: каждая строка SubagentStart с этим agent_id (первая — «получил задание и начал работу», следующие — «продолжил работу»). Возврат: каждая строка SubagentStop с этим agent_id — «закончил работу и вернул ответ, итог не записан» и время; текста ответа нет (decisions/0011, п. (а)); строк нет — только слово состояния задачи. Фразы о том, чего журнал не знает: «О сообщениях между агентами Claude Code не сообщает: известны только передачи задания и окончания работы» и «Об ошибках и о том, что агент ждёт человека, Claude Code сейчас не сообщает». Строка SubagentStop без записанного начала карточки не создаёт (как сейчас, REQ-001). Проверка: тест AC-06 в tools/test/pixel-office-panels.test.js — экземпляр в порядке строк переднего плана: SubagentStart, SubagentStop, затем PostToolUse с launched_agent_id этого экземпляра: последнее событие агента — SubagentStop, «Задание передано» — один пункт с пояснением, состояние «закончила работу, итог не записан»; экземпляр с двумя SubagentStart и двумя SubagentStop: два начала («получил…» и «продолжил работу»), два возврата, последнее событие — второй SubagentStop; экземпляр без PostToolUse; с PostToolUse без description; с двумя PostToolUse разных tool_use_id; строка, помеченная правилом чтения, с тем же agent_id не меняет ни последнего события, ни списков; обе фразы о том, чего журнал не знает, и пояснение к «Задание передано» — константы texts.js"
      - "Связи — только по равенству идентификаторов (R2). «Кто запустил»: по правилу z — основная сессия (текст «Основная сессия» без кнопки; кнопку к карточке основной сессии добавляет REQ-047), субагент — название его роли и 8 знаков его agent_id (кнопка открывает карточку его экземпляра, если задача с таким ключом есть; иначе текст «начало этого агента не записано» без кнопки); правило z не дало строки — «не установлено» с причиной (записи о передаче нет или их несколько). «Кого запустил»: каждая строка PostToolUse с agent_id, равным agent_id экземпляра, — роль запущенного (роль задачи с ключом launched_agent_id; задачи нет — subagent_type строки; нет и его — «(роль не указана)»), 8 знаков launched_agent_id, слово состояния задачи и кнопка к его карточке, если задача есть. Ни время, ни порядок строк, ни совпадение сессии связи не создают. Проверка: тест AC-07 в tools/test/pixel-office-panels.test.js — цепочка «основная сессия → агент A → агент B»: у B «кто запустил» — A, у A «кого запустил» — B, у A «кто запустил» — «Основная сессия» без кнопки; строка PostToolUse той же сессии в ту же секунду, но с другим launched_agent_id, не связывает; launched_agent_id без задачи — пункт без кнопки; нажатие на кнопку B в карточке A открывает карточку B; мутант, связывающий по ближайшему времени, делает тест красным (проверяет TEST-DESIGN-VALIDATOR, WF-02, шаг 5b)"
      - "Сразу видно, остальное раскрытием, без бесполезных чисел. Не в закрытом раскрытии: шапка (критерий 3), три строки состояния (критерий 4), текущая задача и «кто запустил» (критерии 5 и 6). В раскрытиях, закрытых при открытии карточки: полные идентификаторы, «Задание передано», начала, возвраты, «кого запустил», запуски роли сверх 5 и «Вся роль» — прежние разделы карточки роли (её задачи «в работе», без подтверждения, закончившие работу, «окончание не записано», последние события роли, со словами состояний и возрастом по критериям 2 (в) и 4 REQ-042; критерий «Карточка агента и один поток событий» REQ-007 остаётся выполненным). Раскрытие — элемент details и summary или кнопка с aria-expanded, открывается Enter и Space. Плановое обновление страницы (REFRESH_MS) и новая строка журнала не закрывают открытые раскрытия, не переключают экземпляр и не уводят фокус с элемента карточки. Числа в карточке экземпляра — только времена, возрасты, 8 знаков идентификаторов, тексты из журнала и подписи «показано n из N», «запусков этой роли: N» и число задач «в работе» в строке «Рабочее место»; прежней строки «в работе: N» (CARD_WORKING) в шапке нет. Проверка: тест AC-08 в tools/test/pixel-office-page.test.js — элементы «сразу» не лежат внутри закрытого details или скрытого раскрытия; после открытия раскрытия, фокуса на кнопке в нём и одного планового пересчёта с новой строкой журнала раскрытие открыто, экземпляр тот же, document.activeElement — та же кнопка (по data-ключу); в раскрытии «Вся роль» у задачи «нет свежих данных» есть возраст; `grep -n 'CARD_WORKING' tools/src/pixel-office/public/app.js` — пусто (код 1; сейчас находит строки 51 и 922); приёмка в браузере (критерий 10, шаг 7): в окне 1470×784 нижний край последнего элемента «сразу» не ниже нижнего края видимой области карточки при её прокрутке 0; в окнах 1470×784 и 375×812 нет горизонтальной прокрутки (document.documentElement.scrollWidth не больше window.innerWidth); название роли и 8 знаков идентификатора не рвутся по буквам — способ замера как в критерии 14 (а) REQ-042: у каждой части, отделённой пробелом или дефисом, Range.getClientRects() даёт один прямоугольник"
      - "Плохие и пустые условия не ломают карточку (Q10 — кривой ввод). Случаи: экземпляр без описания, без связанной строки о передаче, запущенный агентом, чьё начало не записано; задача без роли; agent_id и session_id по 128 знаков; журнал пуст (персонажей нет — карточку открыть не на чем, легенда пуста, как сейчас); связь с сервером потеряна, когда карточка открыта (карточка сохраняет содержимое, как страница в PN-02); экземпляр исчез из модели (журнал заменён) — карточка закрывается, как сейчас (renderCard); время строки не читается — вместо времени и возраста «время не записано». Ни в одном случае нет исключения, а в тексте карточки нет «undefined», «null», «NaN» и «[object». Проверка: тест AC-09 в tools/test/pixel-office-page.test.js — по сценарию на каждый случай: исключений нет (reportOnce не вызван), textContent карточки не совпадает с выражением undefined|null|NaN|[[]object, ожидаемый текст каждого случая — константа texts.js"
      - "Правда и безопасность (R2, Q7). Каждая строка карточки построена из строк журнала, записей запуска сервера, часов страницы и констант texts.js; ничего о компьютере, операционной системе, нагрузке или «простое» не утверждается; слов успеха нет — `grep -rniE 'заверш|готов|выполнен|успешн' tools/src/pixel-office/public/ | grep -v HISTORY_META_FINISHED` ничего не печатает (критерий 8 REQ-042; сейчас пусто, код 1); вывод — только textContent: `grep -rnE 'innerHTML|outerHTML|insertAdjacentHTML|document[.]write' tools/src/pixel-office/public/` — пусто (код 1; сейчас пусто); страница по-прежнему отправляет только GET (критерий 10 REQ-042, та же команда). Тест AC-10 в tools/test/pixel-office-page.test.js: роль, описание и agent_id вида <img src=x onerror=alert(1)> показаны в карточке буквально и не создают элемента img; writeText получает только значение идентификатора. Q8 и Q11 неприменимы, R3 сейчас не применим, внешних сервисов нет (описание, «Планка»)"
      - "Приёмка в браузере с нажатиями — только на стенде с вымышленными данными (decisions/0054, дополнение 2, п. 2). Стенд — отдельный экземпляр сервера: `cd tools && npm run pixel-office -- --port <свободный порт> --dir <отдельная папка состояния вне проекта>`; журнал стенда — образец по правилам критерия 9 REQ-042 (идентификаторы начинаются с «sample-», описания — со слова «Образец», без prompt_text), записанный через настоящий путь записи (hook.sh и сервер) или положенный в папку стенда до запуска; в нём: роль A с двумя экземплярами (A1 «в работе»; A2 — запуск, SubagentStop, повторный запуск, SubagentStop, затем строка PostToolUse о передаче задания A2), роль C с семью экземплярами, роль B, которую запустил A1 (PostToolUse с agent_id A1), строка SubagentStop без начала и описание с разметкой. Журнал владельца, его копии и снимки с них в приёмке не используются. Шаги и ожидаемое, буквально: 1) нажать мышью на персонажа A — открылась карточка: заголовок — название роли A простыми словами, «запуск» и 8 знаков A1, строки «Задача: в работе» с временем последнего события сессии и возрастом, «Агент» с последним событием A1, «Рабочее место: работает»; 2) нажать «×», поставить «Пауза», нажать на ноутбук на столе A — та же карточка A1; 3) в «Все запуски этой роли» нажать A2 — «Задача: закончила работу, итог не записан» с временем второго окончания, «Агент» — «закончил работу и вернул ответ», а не «Задание передано»; в раскрытии начал — «получил…» и «продолжил работу»; 4) открыть раскрытие идентификатора, нажать «Скопировать», в консоли разработчика выполнить `await navigator.clipboard.readText()` — значение равно полному agent_id A2 из файла журнала стенда; 5) в карточке A1 в «Кого запустил» нажать B — карточка B, «Кто запустил» — A и 8 знаков A1; 6) только клавиатурой: Tab до кнопки легенды A, Enter — карточка A1; Tab по всем элементам карточки — у каждого видно кольцо фокуса (замер критерия 2); Escape — фокус на кнопке легенды A; 7) открыть карточку роли C — «показано 5 из 7»; окна 1470×784 и 375×812 — замеры критерия 7; 8) нажать на персонажа основной сессии — прежняя карточка «Основная сессия» с «разговоров идёт: N». Сценарии пишет BA-ANALYST (docs/uat/REQ-044.md, WF-02, шаг 8), итог и снимки стенда — docs/uat/REQ-044-RUN.md; RELEASE-VALIDATOR на шаге 9 повторяет шаги 1, 3, 5, 6 и замеры 7 сам"
      - "Документация и проверка не обходится (Q4, Q6, AP-005). tools/README.md, раздел «## Pixel Office»: карточка экземпляра, открытие нажатием на персонажа, на стол и Enter на легенде, старшинство персонажа над столом, три строки состояния и что стол — изображение роли, а не компьютер, что запись о передаче задания — не действие агента, чего карточка не знает (действия кроме передачи задания, сообщения между агентами, ошибки, ожидание человека). Проверка: `awk '/^## Pixel Office/{f=1;next} /^## /{f=0} f' tools/README.md | grep -c 'экземпляр'` не меньше 1 (сейчас 0); `cd tools && node --test test/pixel-office-docs.test.js` — код 0. Принятые тесты Pixel Office, чьи ожидания меняет это требование (карточка роли вместо карточки экземпляра, строка «в работе: N» в шапке карточки, возврат фокуса после нажатия на холст), не удаляются и не слабеют, а заменяются: каждая замена — в таблице «прежняя проверка → новая» проекта docs/design/REQ-044-*.md с идентификатором прежнего теста; число строк `^test(` и число вхождений `assert[.]` в каждом файле tools/test/pixel-office-*.test.js не меньше, чем на метке base/<RUN-ID> (`git show base/<RUN-ID>:tools/test/<файл> | grep -c '^test('` против рабочего файла; метка — decisions/0031, имя — context.base_tag handoff-ов; метки нет — «база не задана», PASS на этом пункте нет). `cd tools && npm run check` — код 0 (format:check, lint, traces, handoffs-check, test), в итоге node --test «skipped 0» и «todo 0»; в тексте нет путей этого компьютера и названий других проектов"
