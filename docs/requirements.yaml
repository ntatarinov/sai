    description: >
      Что получает владелец. По каждому своему запросу в Pixel Office открывается окно
      «Просмотр истории» (образец — скриншот владельца: окно из старого офиса другого
      проекта владельца; там данные были сидированные, здесь показывается только
      настоящее, планка R2). В окне, сверху вниз: заголовок; мета — когда начат, когда
      завершён, статус; «Исходный запрос» — текст сообщения владельца; «Как оркестратор
      понял» — то, что оркестратор записал о своём понимании; таблица «Кто работал и что
      сделал» — задача, агент, описание, итог; «Хронология» — время, кто, что.
      Только данные и действия; как окно выглядит — описание интерфейса (WF-04/WF-02,
      GUI-DESIGN-ANALYST), как устроен код — проект CODE-DESIGNER.

      Решение уже принято: decisions/0011-pixel-office-stores-owner-requests.md (2026-10-05)
      — Pixel Office хранит текст сообщений владельца и записи оркестратора «как понял»
      на условиях (а)–(е) этой записи. Оно меняет прежнюю границу decisions/0003 и 0007
      «тексты запросов и ответов не хранятся»; остальные границы 0003, 0005, 0007
      сохраняются и проверяются здесь же: один путь записи с подписью, текст из событий —
      всегда как текст, нет внешних адресов, только 127.0.0.1. Это требование
      расширяет критерии REQ-001 1(д) и UAT, 3, 4, 6(г), 13 и 14 (список полей строки журнала,
      «текст запроса не хранится», правило чтения source, строка основной сессии, README,
      закрепление tools/package.json): поправки уже внесены в их текст (доработка r1) как
      расширения, каждое со своей проверкой, ничего не ослаблено. Путей записи у сервера
      теперь два: прежний /api/events (хук, критерий 8 REQ-001 — для него без изменений) и
      новый /api/note (запись оркестратора, критерии 4–6 ниже); критерий 8 REQ-001
      («один путь записи, требует секрет») читается так: запись событий хука — один
      путь, запись оркестратора — другой путь с тем же секретом.

      Затрагиваются файлы (от корня Sai): tools/src/pixel-office/hook.js (+ hook.sh не
      меняется по смыслу), protocol.js, server.js, journal.js, config.js, страница —
      tools/src/pixel-office/public/ (panels.js, app.js, model.js, index.html, style.css,
      texts.js), tools/src/cli.js или отдельный файл команды в tools/src/, tools/package.json
      (npm-скрипт pixel-office-note), tools/README.md (раздел «## Pixel Office»), тесты
      tools/test/pixel-office-*.test.js, роль .claude/agents/orchestrator.md. Не
      затрагиваются: docs/design/REQ-001-pixel-office.md (его правит CODE-DESIGNER
      прогона PO-20261005-01; проект для этого требования — отдельный документ или
      раздел, который писать после того прогона), ключ записи и порт (прежние).

      Что хранится. Из события UserPromptSubmit в строку журнала добавляются поля
      prompt_kind («owner» — сообщение владельца; «service» — служебное), для «owner» —
      prompt_text (текст после маскирования и обрезки) и, если текст обрезан,
      prompt_truncated: true. Служебным считается сообщение, которое начинается с
      `<system-reminder>`, `[SYSTEM NOTIFICATION`, `<task-notification`, `Another Claude
      session` или `This session is being continued`; у него prompt_text нет. Маскирование
      до записи: вероятные секреты заменяются меткой «[скрыто]»; предел — 4 000 знаков.
      Запись оркестратора — отдельная строка журнала: source «ORCH», время с часов в
      момент записи, note_text (до 2 000 знаков, после того же маскирования), по желанию
      req_id (вида REQ-NNN), session_id и request_time (время запроса владельца, к которому
      относится запись, как оно записано в журнале); если request_time не задан, сервер сам
      привязывает запись к последнему сообщению владельца (критерий 11) и ставит
      request_time_auto: true. Запись идёт отдельным путём сервера /api/note: он принимает
      только note_text, req_id, request_time, session_id и сам ставит source ORCH и время;
      путь хука /api/events по-прежнему отвечает 400 на любой source и на любое поле вне
      списка хука (критерии 4 и 6). Оба пути подписаны тем же HMAC-секретом и дают те же 401,
      403, 405 и 413. Окно запроса — от сообщения
      владельца до следующего сообщения владельца той же сессии (служебные сообщения
      границ не ставят). Запись «как понял» относится к запросу, чьё время указано в
      request_time; без него сервер находит последнее на момент записи сообщение владельца
      (не служебное) — по session_id записи, если он дан, иначе по всему журналу — и ставит
      его время сам; если такого нет — запись остаётся в журнале и ни к какому окну не
      относится. В окне показывается последняя запись ORCH этого запроса.

      Имена полей, пути и переменной (prompt_kind, prompt_text, prompt_truncated, note_text,
      req_id, request_time, request_time_auto, /api/note, SAI_PIXEL_OFFICE_STORE_TEXT, pixel-office-note) — перевод
      аналитика, не слова владельца; CODE-DESIGNER может заменить их, одновременно
      заменив их в тестах критериев. Предел 4 000 и 2 000 знаков и метка «[скрыто]» —
      из decisions/0011 (предел записки 2 000 — из задания ORCH).

      Остаточный риск, названный прямо: маскирование (критерий 7: набор правил, один на двух
      линиях — сервер на обоих путях записи и хук до отправки) распознаёт вероятные секреты,
      а не все; не распознаётся секрет в произвольной форме с пробелами и секрет словами; секрет в необычной форме может попасть в локальный журнал (только на
      компьютере владельца, права 0600). Это принято решением 0011 и повторяется в
      отчёте владельцу.

      Вне области: хранение ответов модели, входов и выходов инструментов и сообщений
      агентов (хранить нельзя — граница 0011); отправка текста наружу; полнотекстовый
      поиск; редактирование и удаление записей; номера требований, выведенные из событий
      хуков без записи ORCH; другие сессии, кроме сообщений владельца. Критерии Q4–Q6,
      Q8–Q11 к этому требованию не применяются как отдельные пункты, кроме тех, что
      названы в критериях (Q4 — одна команда проверки; Q8 нет магазинов, Q9–Q11 нет
      внешних сервисов, фото и адресов от пользователя).

      Размер (AP-016) и порядок поставки: один блок, две части. (а) Данные и обязанность
      ORCH — критерии 1–8, 14–19 (хук, сервер, журнал, команда, маскирование, Q10, роль ORCH,
      README и проверка); (б) страница — критерии 9–13 (окно просмотра, после адаптации под
      2K). Сначала поставляется (а) и проходит ворота, потом (б), которая читает данные из
      (а); статус требования done — только когда готовы обе части.
    acceptance_criteria:
      - "Хук добавляет текст сообщения владельца. Тест tools/test/pixel-office-hook.test.js запускает hook.js с входом UserPromptSubmit, где prompt — обычный текст «сделай X»: строка журнала содержит prompt_kind = «owner» и prompt_text = «сделай X»; со входом, где prompt длиннее 4 000 знаков: prompt_text не длиннее 4 000 знаков (плюс метка «обрезано» не входит в предел, она в prompt_truncated: true), prompt_truncated = true; для входа ровно 4 000 знаков prompt_truncated нет. Прочие события (кроме UserPromptSubmit) не получают ни одного из новых полей; разрешённый список остальных полей строки (критерий 3 REQ-001) не расширяется: тест сравнивает ключи строк всех видов событий с перечнем и падает на любом лишнем ключе, кроме названных новых полей"
      - "Служебные сообщения без текста. Тест подаёт в hook.js по одному входу UserPromptSubmit с prompt, начинающимся с каждой из пяти меток из description («<system-reminder>», «[SYSTEM NOTIFICATION», «<task-notification», «Another Claude session», «This session is being continued»): в строке prompt_kind = «service», поля prompt_text нет, и ни одна подстрока такого prompt (кроме метки вида — если она не записывается, то никакая) в events.jsonl не встречается: `grep -c` по файлу журнала для уникальной подстроки из тела сообщения — 0. Сообщение владельца, у которого метка стоит не в начале («сделай <system-reminder>»), остаётся «owner»"
      - "hook.js по-прежнему тихий и быстрый (Q10): тест запускает hook.js с входами критериев 1–2 и 4: stdout пуст, stderr пуст, код выхода 0, время работы при запущенном сервере и при остановленном — в пределах, установленных критерием 10 REQ-001 (тот же тест, расширенный новыми входами); при остановленном сервере строка не пишется нигде, кроме прежнего места, и текст сообщения не попадает ни в stdout, ни в stderr, ни в файл вне каталога состояния (тест ищет подстроку теста во всех файлах временного каталога и каталога состояния, кроме events.jsonl)"
      - "Путь записи хука — прежний /api/events — проверяет новые поля и отклоняет лишнее. Тест tools/test/pixel-office-server.test.js отправляет на него подписанные запросы и ждёт: prompt_text не строка, длиннее 4 000 знаков, у события не UserPromptSubmit, у prompt_kind = «service» — 400, у prompt_kind вне «owner»/«service» — 400; любое поле вне списка хука (критерий 3 REQ-001 с тремя полями) — 400, в том числе note_text, req_id, request_time, session_id как поле записи оркестратора и поле source с любым значением (в том числе «ORCH» и «REAL») — 400; после каждого отказа sha256 events.jsonl и число его строк не изменились (проверка неизменного состояния). Корректный запрос — 204: это прежнее поведение /api/events (REQ-001 не меняется; число 204 — в tools/src/pixel-office/server.js, `sendEmpty(res, 204)`, и в tools/test/pixel-office-server.test.js, а не в тексте блока REQ-001); 200 — только у /api/note, критерий 5, строка добавлена с временем и source = REAL, поставленными сервером; запрос, в теле которого есть source или время, — 400 как прежде (критерий 4 REQ-001). Отдельный тест: запрос на /api/events с телом, годным для /api/note, — 400 и журнал без изменений, то есть путь хука не может записать строку source ORCH"
      - "Запись оркестратора «как понял» — команда, путь /api/note. Из каталога tools: `npm run pixel-office-note -- --help` печатает использование и завершается кодом 0; `npm run pixel-office-note -- --text \"текст понимания\" --req REQ-008` (форма вызова одна, везде: `pixel-office-note --text \"<текст>\" [--req REQ-NNN]`; текст задаётся только опцией --text, до 2 000 знаков, позиционного текста нет — тест вызывает команду с текстом без --text: код выхода не 0, запрос не отправлен, журнал не изменён; --req, --session и --request-time необязательны; ORCH --session не передаёт, критерий 16) при запущенном сервере: код выхода 0, в журнал добавлена одна строка с source = ORCH, note_text, req_id = REQ-008, время с часов в момент записи (критерий 2 REQ-001), request_time (привязка — критерий 11) и без каких-либо других ключей, кроме session_id (только если --session передан) и request_time_auto (при привязке сервером); успех записи оркестратора — ответ 200 (не 204: 204 — успех /api/events); команда подписывает тело HMAC-секретом из каталога состояния и пишет на путь /api/note, который не равен пути хука (тест перехватывает запросы к серверу: ровно один запрос на запись, путь /api/note, ни одного запроса на /api/events). Тест tools/test/pixel-office-server.test.js. Секрет: он не принимается ни в аргументах, ни в переменных окружения команды (в --help и в разборе аргументов такого параметра нет; тест передаёт --secret и получает отказ с кодом выхода не 0 и без записи) и не печатается — содержимое файла write-secret не встречается ни в stdout, ни в stderr (тест ищет значение секрета в выводе)"
      - "Отказы на пути записи оркестратора /api/note и его отличие от пути хука. Тест на сервере: запрос без заголовка подписи или с неверной подписью — 401; с чужим Host — 403 (до чтения тела); метод не POST — 405 с Allow; тело больше предела BODY_MAX — 413; поле вне note_text, req_id, request_time, session_id — 400, в том числе source (с любым значением) и поля хука (prompt_kind, prompt_text, prompt_truncated, hook_event_name, agent_id и прочие); note_text длиннее 2 000 знаков или не строка — 400; пустой note_text — 400; req_id не по виду REQ-NNN (например «REQ-8», «../x») — 400; request_time не времени или времени из будущего больше чем на 60 секунд от часов — 400; session_id не строка или длиннее 200 знаков — 400; после каждого отказа sha256 events.jsonl не изменился. Принятая запись: 200 (у /api/events успех — 204, критерий 4), source = ORCH и время поставил сервер (в теле их нет), строка не помечается как событие хука. Те же коды 401/403/405/413 даёт и /api/events (тест на обоих путях одной таблицей); любой путь, кроме /api/events и /api/note, на запись — 404 или 405 и ничего не пишет, список путей и методов в тесте сравнивается с этим перечнем. Команда при остановленном сервере: код выхода не 0, сообщение «сервер не запущен» в stderr, журнал не создан и не изменён"
      - "Маскирование секретов — до записи в журнал, для сообщений и для записей ORCH, на двух линиях: сервер маскирует на обоих путях записи (/api/events и /api/note) — это обязательная линия, потому что она единая; хук маскирует до отправки — вторая линия, и текст из хука не должен выходить из процесса в открытом виде. Набор правил: ключи sk-, sk-ant-, sk-proj- (с дефисами и подчёркиваниями в хвосте); ghp_, gho_, ghs_, github_pat_; AKIA и ASIA с 16 знаками; JWT (три части base64url через точку); PEM-блоки (от -----BEGIN до -----END, и обрезанный блок без END — до конца текста); URL вида схема://пользователь:пароль@хост; заголовки Authorization и Bearer; пары `имя=значение` и `имя: значение` для token, secret, password, passwd, api_key, apikey, authorization (имя в любом регистре, значение — до пробела или кавычки); длинные случайные строки — токен, то есть непрерывный отрезок знаков из [A-Za-z0-9_+=-] длиной 32 и более, ограниченный с обеих сторон пробелом, кавычкой, скобкой, знаком препинания, началом или концом текста, но не знаком «/» или «.» (отрезок, у которого с любой стороны вплотную «/» или «.» — часть пути, адреса или имени файла, — этим правилом не маскируется; точка или запятая в самом конце, как знак препинания, границей служит), в котором есть строчная буква и хотя бы одна цифра или прописная буква (то есть два из трёх классов — строчные, прописные, цифры — и строчные среди них; слово из одних строчных, одни цифры и шестнадцатеричная строка из прописных букв и цифр этим правилом не маскируются). Примеры теста: путь docs/design/samples/history-view-sample-2026-10-05 и начало пути tools/src/pixel-office/public/panels.js НЕ маскируются; строка Zm9vYmFyMTIzNDU2Nzg5MGFiY2RlZmdoaWprbG1ub3A= маскируется; 40 строчных букв подряд (слово без цифр и без прописных) НЕ маскируются; строка из 40 знаков с цифрами и строчными без «/» и «.» маскируется; она же внутри пути (с «/» вплотную) не маскируется. Тест (tools/test/pixel-office-hook.test.js и -server.test.js): на каждое правило — пример, который хук присылает уже замаскированным (перехват тела запроса), и тот же пример в открытом виде, отправленный на оба пути сервера напрямую, — в events.jsonl нет значения секрета (`grep -F` значения — код 1), на его месте «[скрыто]», остальной текст сохранён. Обычный текст, числа, пути, номера требований вида «REQ-008» и хеши короче 32 знаков не портятся. Секрет на границе 4 000 знаков не оставляет в журнале ни одной части длиной 8 знаков и более (маскирование до обрезки). Остаточный риск — не распознаётся секрет в произвольной форме с пробелами, секрет словами («пароль — имя кота и год»), секрет base64 со знаком «/» или «.» (длинное правило их не берёт — только специальные правила выше) и секрет из одних прописных букв и цифр — тест это фиксирует как известный непокрытый случай и README называет его (критерий 15)"
      - "Отключение хранения текста. Тест запускает hook.js и сервер с SAI_PIXEL_OFFICE_STORE_TEXT=0: в строке UserPromptSubmit нет prompt_text, остаётся prompt_kind и время (задачи и журнал работают как раньше); команда `pixel-office-note --text \"<текст>\"` при том же значении переменной — код выхода 0 (отключение хранения — не сбой: и хук, и команда завершаются с кодом 0; код 1 команда даёт только при недоступном сервере и неверном ответе, критерии 6 и 17), запись source ORCH с note_text не создаётся, команда печатает в stderr «хранение текста отключено»; сервер при этой переменной отвергает запись с prompt_text или note_text (400). Страница при такой строке показывает в окне запроса «текст не сохраняется» вместо раздела «Исходный запрос» (тест страницы на фикстуре без prompt_text)"
      - "Страница показывает только настоящее (R2). Тест tools/test/pixel-office-page.test.js (или -panels.test.js) на копии страницы без сети: у запроса, события которого есть в журнале, окно «Просмотр истории» собирается только из строк журнала; журнал пуст — окно открыть не на чем (запросов нет), ничего не показывается из примера владельца: поиск по public/ — ни заголовка, ни номера, ни текстов запроса, понимания, задачи и хронологии со скриншота образца (тест берёт строки из docs/design/samples/history-view-sample-2026-10-05.jpg, переписанные в тест как список запрещённых фраз; в список не входит название другого проекта, видное на скриншоте [образец] — оно не переписывается ни в тест, ни в требование, ни в код. Проверка списка фраз — тест-grep по public/. Проверка названия — по существу, а не готовой командой (команда содержала бы само название): REQ-VALIDATOR и TEST-DESIGN-VALIDATOR открывают скриншот, читают название и одноразовой командой у себя, не записывая название в файлы, убеждаются, что его нет в блоке REQ-008 (блок выбирается `awk '/^  - id: REQ-008$/{f=1} f&&/^  - id: /&&!/REQ-008$/{exit} f' docs/requirements.yaml`), во всём tools/ и в public/ — результат 0 вхождений; остальные блоки docs/requirements.yaml (REQ-001, REQ-007 ссылаются на эталон) в проверку не входят) и никакого заранее записанного текста запроса или понимания (тест грепает public/ и берёт данные только из фикстуры журнала). Запись ORCH в окне подписана «Оркестратор записал» и отличается от событий хуков; ни одна запись ORCH не выдаётся за событие хука и не меняет задачи, их состояния и офис (тест: при добавлении записи ORCH список задач и состояния персонажей по критерию 6 REQ-001 те же, что до неё)"
      # 2026-10-13, прогон PIXEL-20261013-01, WF-01 шаг 1 доработка r1: критерий изменён по REQ-042 и decisions/0049, 0050 (слова состояния в мете окна; слово «завершён» у времени окончания не менялось — это подпись времени Stop, а не состояние)
      - "Открытие окна и его разделы. Тест страницы на фикстуре журнала (одно сообщение владельца, в окне — две задачи субагентов, одна ещё не окончена, одна запись ORCH, одно служебное сообщение): запрос владельца виден в списке задач и в журнале и открывается окном «Просмотр истории»; служебное сообщение окном не открывается и подписано «служебное сообщение»; в окне, в порядке сверху вниз, разделы: «Просмотр истории» (метка), заголовок, мета, «Исходный запрос», «Как оркестратор понял», «Кто работал и что сделал», «Хронология». Заголовок — первая строка сообщения (до 120 знаков), а если запись ORCH задаёт req_id — «REQ-NNN — » и первая строка записи. Мета — когда начат (время сообщения), когда завершён (время последнего Stop основной сессии в окне; нет — состояние по правилам критерия 6 REQ-001 словами REQ-042: «в работе», «нет свежих данных», «окончание не записано» или «сервер перезапускался, события не записывались») и статус. «Исходный запрос» — текст сообщения, абзацы (пустые строки) сохранены. Таблица — столбцы «Задача», «Агент», «Что делал», «Итог»: строки — задачи, начатые в окне запроса, состояние каждой — по критерию 6 REQ-001 словами REQ-042 («в работе», «нет свежих данных», «закончила работу, итог не записан», «окончание не записано», «сервер перезапускался, события не записывались»), «Итог» — только то, что есть в событиях (состояние задачи; текста ответа агента нет — он не хранится), пустое поле не заполняется выдуманным. «Хронология» — события окна: время (с часов события), кто (роль или «Оркестратор»), что (вид события); записи ORCH — с подписью «Оркестратор записал» и текстом записи"
      # 2026-10-15, прогон PIXEL-20261015-01, WF-01 шаг 1, доработка r1 (REQ-ANALYST): было → стало по таблице REQ-048, decisions/0057, дополнение, п. 2; номер и статус не менялись; «привязано автоматически» → «оркестратор не указал запрос — запись отнесена к последнему запросу владельца».
      - "«Как оркестратор понял» — честно. Тест страницы: у запроса с несколькими записями ORCH (разное время, один request_time) показывается последняя по времени записи, а более ранние остаются в «Хронологии»; у запроса без записи ORCH раздел показывает «оркестратор не записал, как понял» и пустого блока или придуманного текста нет; запись, у которой request_time совпадает с запросом из другой сессии, относится к тому запросу, чьё время указано; запись без request_time привязывается автоматически (тест на сервере): сервер сам находит последнее не служебное сообщение владельца в журнале — по session_id записи, если он дан, иначе по всему журналу, и пишет его время в request_time с request_time_auto = true; при отсутствии такого сообщения request_time нет, запись ни к какому окну не относится; страница подписывает такую запись «оркестратор не указал запрос — запись отнесена к последнему запросу владельца», а запись с явным request_time этой подписи не получает (тест страницы). Границы окна: сообщение владельца той же сессии открывает следующее окно, сообщения других сессий и служебные — нет; события, начатые до первого сообщения сессии в журнале, в окно не входят"
      - "Текст — всегда как текст, а не разметка (граница 0003). Тест страницы подаёт сообщение с `<script>window.__x=1</script>`, `<img src=x onerror=...>` и `&lt;b&gt;`: в окне это видно как буквальный текст, `window.__x` не задан, в DOM окна нет созданных элементов script/img из текста; страница по-прежнему не использует innerHTML, outerHTML, insertAdjacentHTML, document.write и eval для этого текста (`grep -nE` по tools/src/pixel-office/public/*.js — прежний результат, критерий 13 REQ-007 о том же), атрибут style у страницы не используется, адресов внешних ресурсов (кроме 127.0.0.1) в public/ нет"
      - "Окно управляется клавиатурой и кнопкой. Тест страницы (браузерный тест, прежний способ проверки страницы REQ-007) открывает окно: оно закрывается кнопкой «Закрыть» и клавишей Esc; после закрытия фокус возвращается на элемент, из которого окно открыли; пока окно открыто, фокус не уходит на страницу под ним (Tab по кругу внутри окна); окно доступно с клавиатуры (открывается Enter с фокуса на запросе); на размерах окна браузера 1920 × 1080 и 2560 × 1440 (адаптация под 2K — прогон PO-20261005-01) окно целиком видно, у содержимого есть своя прокрутка внутри окна, а не страницы, горизонтальной прокрутки нет. Проверка в два места: (i) измерение в браузере на этих двух размерах (снимки и размеры элементов) — WF-02, шаг 7, DESIGN-QA-VALIDATOR; (ii) тест контракта CSS в `cd tools && npm run check` (в проекте docs/design/REQ-008-history.md он назван PN-22; имя теста — как в проекте) — правила окна, дающие внутреннюю прокрутку и отсутствие горизонтальной; критерий закрыт, когда пройдены оба"
      - "Права и расположение файлов, прежние границы сохранены (Q7, R3). Тест: после записей критериев 1 и 5 events.jsonl и write-secret имеют права 0600, каталог ~/.sai-pixel-office/ — 0700 (`stat`), файлов в каталоге состояния — только STATE_FILES из config.js (новых файлов для текстов нет); сервер слушает только 127.0.0.1 и отвечает 403 на чужой Host (критерий 9 REQ-001, тесты проходят; их перечень, изменённый по decisions/0011 — ниже, остальные без изменений); у сервера два пути записи, /api/events и /api/note (список путей и методов в тесте сравнивается с этим перечнем, критерий 6) и нет ни одного исходящего запроса (`grep -nE \"https?\\.request|fetch\\(|net\\.connect\" tools/src/pixel-office/server.js` — пусто, код 1, как до работы); ни текст сообщений, ни записей ORCH не попадает в stdout сервера, в консоль страницы и в имена файлов (тест ищет уникальную подстроку в выводе сервера, собранном за прогон теста). Изменяются по decisions/0011 только эти тесты REQ-001, каждое изменение — расширение: tools/test/pixel-office-hook.test.js (ключи строк UserPromptSubmit — три новых поля, критерий 3 REQ-001; тест «prompt не хранится» теперь «prompt не хранится как ключ, текст — в prompt_text»), tools/test/pixel-office-server.test.js (список путей записи — два пути; ключи строки source ORCH; отказ source на /api/events остаётся), tools/test/pixel-office-page.test.js (правило чтения: строки source ORCH не помечаются «не из хуков»; строка основной сессии без текста запроса остаётся), tools/test/pixel-office-settings.test.js — при необходимости только если он сравнивает список полей или путей; прочие тесты проходят без изменений, число прежних тестов не уменьшилось и ни одна проверка не удалена и не ослаблена (сравнение имён и числа проверок до и после — вывод `node --test` с числом тестов и diff по git, приложены TEST-RUNNER)"
      - "tools/README.md, раздел «## Pixel Office», описывает: что теперь хранится (текст сообщений владельца, записи ORCH — по decisions/0011) и что нет; как отключить хранение (SAI_PIXEL_OFFICE_STORE_TEXT=0); команду `npm run pixel-office-note` с примером в единой форме `pixel-office-note --text \"<текст>\" [--req REQ-NNN]` (текст — опцией --text); остаточный риск необнаруженного секрета с названными примерами (что не распознаётся: секрет в произвольной форме с пробелами, секрет словами; что распознаётся — набор правил критерия 7 одним перечнем); подраздел «### Хранение текста»; два пути записи и что оба подписаны и только на 127.0.0.1; как стереть историю (удалить ~/.sai-pixel-office/events.jsonl при остановленном сервере). Проверка: `grep -nF` в tools/README.md каждой из строк «pixel-office-note», «--text», «SAI_PIXEL_OFFICE_STORE_TEXT», «0011», «### Хранение текста», «остаточный риск», «[скрыто]», «/api/note», «--session», «и у сервера, и у Claude Code (в обоих местах)» — не меньше 1 строки на каждую; в README сказано, что без --session привязка идёт по последнему сообщению владельца во всём журнале и при двух параллельных сессиях может попасть на чужое сообщение, а ORCH --session не передаёт (не видит свой session_id), так что этот риск принят (`grep -nF \"без --session\" tools/README.md` — не меньше 1 строки), и строка «переменную SAI_PIXEL_OFFICE_STORE_TEXT задавать и у сервера, и у Claude Code (в обоих местах)» с пояснением: если хранение выключено только у сервера, а хук Claude Code всё ещё шлёт prompt_text, сервер отвечает 400 и событие теряется целиком (известный риск критерия 8), и что секрет base64 со знаком «/» или «.» длинным правилом маскирования не распознаётся; разделы README не потеряны (`grep -c '^## ' tools/README.md` не меньше прежнего). И одна команда проверки (Q4): `cd tools && npm run check` проходит — prettier --check, eslint и все тесты, новые файлы под prettier и eslint (не в списке исключений), число прежних тестов не уменьшилось"
      - "Обязанность ORCH — запись «как понял» (проверяется содержимым роли, а не кодом страницы; код не обязывает оркестратора, поэтому честная проверка — текст роли и разбор его работы). В .claude/agents/orchestrator.md есть пункт: на каждое сообщение владельца, с которого начинается работа, до раздачи агентам ORCH записывает «как понял» командой `cd tools && npm run pixel-office-note -- ...` (`pixel-office-note --text \"<текст>\" [--req REQ-NNN]`, текст — опцией --text; --req — когда номер требования известен; --session и --request-time необязательны, ORCH --session не передаёт, потому что не видит свой session_id: без них сервер сам привязывает запись к последнему сообщению владельца, критерий 11, request_time_auto), и что если сервер не запущен, команда не удалась или хранение отключено — ORCH не придумывает запись и называет это в отчёте владельцу; ORCH не вписывает в запись секреты и персональные данные из сообщения. Проверка (команда в роли стоит в обратных кавычках или в блоке кода, пояснения — вне кавычек команды или в других строках): `grep -nE \"pixel-office-note\" .claude/agents/orchestrator.md` — не пусто; `grep -nE \"до раздачи|до запуска агентов\" .claude/agents/orchestrator.md` — не пусто; `grep -nE 'pixel-office-note[^`]*--text' .claude/agents/orchestrator.md` — не пусто (строка команды содержит --text); запрет --session — по тексту самой команды, а не по строке с её именем: `grep -oE 'pixel-office-note[^`]*' .claude/agents/orchestrator.md | grep -c -e '--session'` — 0 (код выхода grep -c 1), то есть в команде, от слова pixel-office-note до закрывающей кавычки или конца строки, --session нет, а пояснение «--session не передаётся» рядом, после закрывающей обратной кавычки, проверку не ломает (проверено на примере: строка с командой без --session и пояснением после кавычки даёт 0; строка с --session внутри кавычек даёт 1) (REQ-VALIDATOR и REVIEWER читают пункт и подтверждают, что он говорит именно это); роль не просит ничего вне decisions/0011. Что оркестратор записывает на каждое сообщение фактически, код не проверяет — это проверка роли, а не страницы; раздел «Как оркестратор понял» честно показывает отсутствие записи (критерий 11)"
      - "Q10 — команда pixel-office-note не виснет и не раскрывает секрет. Тест tools/test/pixel-office-server.test.js: (а) соединение и ответ — по 3 секунды: поддельный сервер, принимающий соединение и молчащий, — команда завершается с кодом 1 не позже чем за 3,5 секунды, в stderr сообщение «сервер не ответил за 3 с» и нет значения секрета и текста записи; сервер, не принимающий соединение (порт закрыт) — код 1 за те же 3,5 секунды; (б) поддельный сервер отвечает 401, 403, 413 и 500 (по одному прогону на код): команда завершается с кодом 1, в stderr — короткая причина по коду («подпись не принята», «адрес отклонён», «запись слишком велика», «ошибка сервера»), нет ни значения секрета, ни значения подписи, ни тела запроса, ни note_text (тест ищет их в stdout и stderr — 0 вхождений), журнал не меняется; (в) при включённом хранении код выхода 0 — только при ответе 200 от /api/note; ответ 204 команда за успех не считает (204 — успех /api/events, команда на него не ходит); при отключённом хранении (критерий 8) код выхода 0 без всякого запроса — это не сбой и не противоречие: ответа /api/note в этом случае нет, и тест проверяет, что запрос не отправлен"
      - "Q10 — хук не виснет на огромном вводе. Тест tools/test/pixel-office-hook.test.js: из входа prompt берётся и обрабатывается не более 64 КБ (остаток отбрасывается до маскирования, и prompt_truncated = true), маскирование и обрезка укладываются в жёсткий выход хука 1,5 секунды (HOOK_HARD_EXIT_MS); входы: prompt 5 МБ из обычного текста, 5 МБ одного знака без пробелов, патологическая строка (повторы `sk-` и `a=` на 1 МБ, длинные цепочки знаков из правила «длинные случайные строки», незакрытый PEM-заголовок на 1 МБ) — на каждом хук завершается за 2 секунды с кодом выхода 0, stdout и stderr пусты, в журнал попадает усечённый замаскированный текст или ничего (в строке нет prompt_text, остальные поля на месте), хук не зависает; правила маскирования выполняются за время, линейное по длине (тест на 64 КБ патологического текста не медленнее 200 мс в самом маскировании)"
      - "Команда pixel-office-note соединяется только с локальным сервером. Тест tools/test/pixel-office-server.test.js: адрес берётся только как 127.0.0.1 и порт из файла port в каталоге состояния (так же читает порт хук, критерий 10 REQ-001), в команде нет параметра адреса или порта (--host, --port, --url в разборе аргументов нет; тест передаёт каждый из них — отказ, код выхода не 0, запрос не отправлен); при файле port с нечисловым содержимым или портом вне 1–65535 — код 1 без запроса; подмена переменной окружения адреса (HTTP_PROXY, NODE_OPTIONS не используются) не меняет адрес: перехват сокетов в тесте видит только 127.0.0.1; `grep -nE \"https?://[^1l]|0[.]0[.]0[.]0|localhost\" tools/src/pixel-office/<файл команды>` — только 1 (код 1: ни внешнего адреса, ни имени)"

  - id: REQ-009
    title: Sai Team, часть 1 — ядро проекта — состояние, журнал событий как единственный источник правды, хранение, восстановление, чтение, каталог ролей и человеческий язык событий (без интерфейса)
    owner: BACKEND-DEV
    status: done   # 2026-10-13T09:07:21Z, прогон REAL-20261013-01 (WF-02, шаг 10): RELEASE-VALIDATOR PASS (handoffs/REAL-20261013-01/step-09-release-validator.json) — 14 критериев из 14 выполнены; на чистой копии npm ci и npm run check, 1478 тестов из 1478. Зависимость REQ-002 — done (2026-10-11). Основание настоящего запуска, который шёл в этом прогоне: слово владельца 2026-10-13 (decisions/0048); потолок 3 USD назвал ORCH по поручению владельца, не сам владелец; израсходовано 0,92 USD (один запуск из трёх разрешённых). Прежде: in_progress; прогон PROD-20261006-01 (2026-10-06) построил ядро и принял по критериям без настоящего Claude (789 тестов), done мешала только зависимость REQ-002
    depends_on: [REQ-002]   # tools/ и одна команда проверки cd tools && npm run check (decisions/0002); REQ-002 — done с 2026-10-11 (прогон ISS-0002-20261011-01; с 2026-10-01 до этого был in_progress из-за критерия 11, ISS-0002)
    original_request: >
      «Твоя задача — ДОВЕСТИ ПРОДУКТ ДО РАБОЧЕГО СОСТОЯНИЯ.»; «Главный ориентир:
      максимально автономная виртуальная команда + предельно простой UX для бизнеса +
      Pixel Office как живое зеркало реальной работы + качество продукта не хуже
      [образца], а в ключевых сценариях лучше.»; «Главная задача этой сессии — получить
      максимально большой РЕАЛЬНЫЙ прирост готовности продукта, а не максимально
      подробный отчёт о том, что когда-нибудь нужно сделать.»; «Не подменяй реальную
      интеграцию mock-данными. Не подменяй работающую автономность визуальной
      имитацией.»; «Запрещено создавать красивый интерфейс, за которым нет реальной
      системы. Не создавай: случайные статусы; фиктивные проценты; fake agent activity;
      имитацию работы; декоративные task updates; захардкоженные сценарии для демо.»
      (владелец, 2026-10-06, сообщение в сессии Claude Code; дословные куски переданы
      ORCH в задании прогона PROD-20261006-01, шаги 02a и 02a-r1; название чужого
      проекта заменено ORCH на «[образец]»; полного текста сообщения в файлах Sai нет).
    description: >
      Что получает владелец. Первый кусок «реальной системы» из видения владельца:
      проект с целью, задачами и памятью, который живёт в файлах на его компьютере,
      переживает аварийную остановку и читается одной правдой — журналом событий, и
      каталог ролей виртуальной команды с человеческими названиями. Это ядро, на котором
      стоят исполнители (REQ-010) и движок (REQ-013); интерфейса здесь нет. Следующие
      требования, которые здесь только называются и критериев которых здесь нет
      (номера REQ-011 и REQ-012 зарезервированы за ними, блоков у них пока нет, и
      другим требованиям эти номера не отдаются; REQ-013 — движок): REQ-011 «бизнес-интерфейс: чат, проект, задачи, результаты» и REQ-012 «Pixel
      Office как зеркало состояния проекта на человеческом языке». Анализ, на котором
      стоит требование: docs/product/current-state.md (готовность около 10 %: нет
      движка, проектов, задач, чата) и docs/product/parity-matrix.md (раздел 6 —
      вертикальный срез, пункты 1–2: хранение проекта и журнал событий).

      Основание для кода (критерий 1). Слова владельца «Твоя задача — ДОВЕСТИ ПРОДУКТ
      ДО РАБОЧЕГО СОСТОЯНИЯ.» (2026-10-06) ORCH принимает как решение о старте
      разработки продукта Sai Team. До кода должны быть: запись этого решения в
      STATE.md (раздел «Решение владельца о старте») и запись decisions/0015 (её
      поручает ORCH роли DOC-UPDATER), которая для кода tools/src/team/ принимает стек и
      команду проверки по Q4 вместо зарезервированной 0001: Node 22, без зависимостей
      во время выполнения, как decisions/0002 и 0003, команда проверки
      `cd tools && npm run check` (в неё входит `npm test`), и записывает решения ORCH
      D-A…D-F, на которых стоят REQ-009, REQ-010 и REQ-013.

      Проект: цель (текст пользователя), статус (создан; планирование; в работе; на
      паузе; ждёт решения пользователя; остановлен; выполнен; не удалось), потолок
      стоимости в долларах США (budget_usd — число не меньше 0; 0 значит «потолка нет»:
      ядро хранит такое значение и создаёт проект с потолком 0 по API, а реальный запуск
      без потолка запрещает исполнитель REQ-010), исполнитель (executor — его значения
      задаёт REQ-010), память проекта — факты, решения, файлы, результаты. Задача: роль (из
      каталога ролей этого требования, критерий 10), описание, критерий готовности,
      depends_on (задачи того же проекта), статус (ждёт; в работе; на проверке; готово;
      не удалось; ждёт решения пользователя; прервана), число попыток, результаты-файлы.
      Внутренние коды статусов и полей задаёт проект CODE-DESIGNER
      (docs/design/REQ-009-*.md); критерии ниже проверяют смысл, а не написание кода.

      Событие — строка журнала проекта: время (с часов, ISO 8601 UTC), проект, задача
      (или пусто), источник — ENGINE, AGENT или USER, тип, данные. Журнал только
      дописывается и — единственный источник правды: состояние проекта и задач
      выводится воспроизведением событий по порядку; любой другой файл с состоянием
      (если проект его заведёт для скорости) — только производный, его удаление не
      меняет состояния. Сообщения пользователя и ответы системы — события вида CHAT
      (память разговора проекта, источник USER или ENGINE). Время: событие источника
      ENGINE не раньше предыдущего события журнала (допуск 0); событие источника USER
      или AGENT может быть раньше предыдущего не больше чем на 2 секунды (часы разных
      процессов); больше — отказ.

      Хранение (решение ORCH D-A; записывается в 0015, критерий 1): каталог
      ~/.sai-team (права 0700; для тестов и запуска — переменная SAI_TEAM_HOME),
      в нём своя папка на проект с events.jsonl (0600) и папкой files/ для
      результатов-файлов (папки 0700, файлы 0600). Добавление события — одна строка
      целиком или ничего, с fsync до ответа «записано».

      Писатель. Право записи в проект держит ровно один процесс — писатель: процесс,
      который взял право записи через API ядра и ещё не отдал его. Право берётся
      файлом-замком в папке проекта, созданным атомарно (создание с отказом, если файл
      есть), с pid писателя внутри. Любая команда записи (в этом требовании —
      `npm run team -- say`; дальше — команды REQ-010 и REQ-013), пока право держит
      другой живой процесс, получает отказ с понятным текстом и кодом выхода не 0, файлы
      проекта не меняются. Замок, pid которого не принадлежит живому процессу,
      устаревший: следующий писатель снимает его и пишет об этом событие ENGINE. Команды
      чтения права записи не берут и файлы проекта не меняют никогда.

      Восстановление после аварийной остановки выполняет только писатель — сразу после
      того, как взял право записи: оборванная последняя строка отбрасывается (файл
      усекается до последней целой строки) и называется (событие ENGINE и сообщение
      команды); испорченная строка не последней — проект не открывается на запись, с
      понятным сообщением, ничего не пропускается молча; задачи «в работе» получают
      событие и статус «прервана» (их перезапуск по правилам — REQ-013). Команда чтения
      при оборванной последней строке показывает состояние по целым строкам и говорит,
      что последняя строка не дописана, а файлы не меняет.

      Чтение: список проектов; один проект с задачами и прогрессом; журнал событий
      постранично. Прогресс = число задач «готово» и число всех задач («3 из 5») —
      только из воспроизведённого состояния; без задач прогресса нет; процентов нет
      нигде. Для проверки без интерфейса — команды `npm run team -- projects`,
      `npm run team -- project <id>`, `npm run team -- events <id> [--after N]
      [--limit M]`, `npm run team -- say <id> --text "<текст>"` (сообщение
      пользователя — событие CHAT, USER); вывод — JSON. Точная форма вывода — в
      проекте CODE-DESIGNER. Проекты и задачи в тестах этого требования создаются
      через API ядра; команды создания проекта и задач дают REQ-010 и REQ-013.

      Каталог ролей (файл в tools/src/team/): ровно десять ролей — Руководитель
      проекта, Бизнес-аналитик, Исследователь, Финансовый аналитик, Юрист, Маркетолог,
      Дизайнер, Разработчик, Проверяющий (QA), Специалист поддержки; у каждой
      внутренний код, человеческое название и описание для пользователя. У каждой роли
      есть место для внутреннего соответствия (промт и инструменты исполнителя); его
      содержимое задаёт REQ-010, а ядро уже здесь никогда не показывает внутренние поля
      каталога в выводе команд и во фразах.

      Модуль «язык»: событие (вместе с состоянием, воспроизведённым до него) → фраза для
      бизнеса таблицей правил «тип события → фраза», где у каждой строки названы входное
      событие и роль из каталога, если фраза о роли; без технического (контекст,
      токены, промт, JSON, коды выхода не показываются). Образцы фраз из слов владельца
      и их входные события — в критерии 11.

      Безопасность. Q7: в журнале и файлах проекта нет секретов: все строки данных
      события перед записью проходят maskSecrets из tools/src/pixel-office/mask.js
      (правила M1–M10, decisions/0013); ключи — только в переменных окружения, их
      значения никуда не пишутся. Q8 в Sai — про магазины; магазинов здесь нет, но
      тот же принцип действует для проектов: путь к данным одного проекта не даёт
      данных другого и не выходит из своей папки (критерий 7). Q9, Q11, R3
      неприменимы: базы с SQL нет, ядро по сети не ходит, фото покупателей нет. Q10:
      сбой диска не роняет процесс (критерий 13). R2: события ENGINE пишутся в момент
      настоящего изменения состояния, ничего задним числом.

      Код: Node 22 без зависимостей во время выполнения (decisions/0002, 0003; для
      tools/src/team/ — 0015); node:sqlite не используется (в Node 22
      экспериментальный, docs/product/current-state.md, раздел 3). Файлы (от корня
      Sai): tools/src/team/ (новые модули ядра, каталог ролей, модуль «язык» и команды
      team), tools/test/team-*.test.js, tools/package.json (скрипт team), tools/README.md
      (раздел «## Sai Team — ядро»). Не затрагиваются: tools/src/pixel-office/ (из него
      только импортируется mask.js; файлы не меняются), журнал и каталог Pixel Office
      ~/.sai-pixel-office.

      Вне области: интерфейс (REQ-011, REQ-012), исполнители (REQ-010), движок —
      планировщик, расписание, проверка, согласования, завершение (REQ-013),
      многопользовательность и рабочие пространства, внешние интеграции, любые
      настоящие действия вовне, удаление проектов командой (удаление — вручную папкой,
      описано в README).
