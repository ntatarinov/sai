  - id: REQ-014
    title: Sai самостоятельный — нет путей этого компьютера и названий других проектов (команда проверки), клон на чистой машине работает (npm ci, npm run check, Pixel Office, команды team), одна инструкция в README, без внешних сервисов во время работы, кроме Claude Code
    owner: BACKEND-DEV   # команда проверки следов и тесты; README — DOC-UPDATER в том же прогоне
    status: in_progress   # 2026-10-09: прогон PROD-20261009-01 начат (WF-02, шаг 0). 2026-10-13: зависимости REQ-009 (done 2026-10-13) и REQ-002 (done 2026-10-11) выполнены; статус не менялся — повтор шага 9 по PLAN.md (итерация 7, запись 2026-10-10) не делался
    depends_on: [REQ-009]   # команда `npm run team` на чистой машине — из REQ-009 (done с 2026-10-13); через него — REQ-002 (tools/, npm run check; done с 2026-10-11)
    original_request: >
      «я хочу чтобы этот проект был самостоятельным потому что его нужно будет взять
      открыть на другом компьютере чтобы не было ссылок на существующие проекты как
      платформ [образец] legacy [проект владельца], [проект владельца]» (владелец,
      2026-10-06, дословно — decisions/0019, раздел «Основание»). И (тот же день):
      «Тебе нужно сформировать требования по проекту, которые были не реализованы или
      реализованы. Accept критерии приемок должны быть. То есть суть в том, что сай
      проект должен самостоятельно работать без участия других проектов, но он должен
      взять лучшее с проектов просто требования составь и все а потом это мы сделаем на
      сонете» (сообщение в сессии Claude Code; дословно — в задании
      handoffs/REQ-20261006-01/step-01-req-analyst.json).
    description: >
      Что получает владелец. Sai открывается на другом компьютере из своего
      репозитория без чего-либо с этого компьютера: git clone, `cd tools && npm ci`,
      `npm run check`, запуск Pixel Office и команд team. В файлах Sai нет путей этого
      компьютера и названий других проектов, и это проверяет команда, а не ручной
      поиск. Ручная очистка уже сделана (decisions/0019, PLAN.md, шаг 2g); здесь — чтобы
      это не вернулось.

      Команда проверки следов `cd tools && npm run traces` (имя скрипта может уточнить
      проект) проверяет все файлы, которые отслеживает git, и неигнорируемые новые
      файлы: (а) абсолютные пути домашних каталогов пользователей macOS и Linux —
      корень домашних каталогов macOS или Linux, за которым идёт имя пользователя;
      следом не считается путь, где на месте имени стоит пометка в угловых скобках
      (например, «<имя>»), и строка из списка исключений (ниже); к таким путям
      относится и их закодированная запись, какой она бывает в имени папки проекта
      Claude Code: «-Users-<имя>-…» и «-home-<имя>-…» с дефисами вместо косых черт
      (с пометкой в угловых скобках на месте имени — не след); (б) названия из списка
      запрещённых названий; (в) ссылки в Markdown, которые после разрешения
      относительно файла выходят за корень репозитория Sai.

      Список запрещённых названий открытым текстом в Sai не хранится — иначе он сам
      стал бы следом: в Sai лежит только файл хешей sha256 слов и пар соседних слов,
      приведённых к нижнему регистру; команда сравнивает с ними слова и пары слов
      проверяемых файлов. Правило деления текста на слова — одно для пополнения и для
      проверки: сначала текст нормализуется — приводится к форме NFKC и к нижнему
      регистру, и из него удаляются невидимые знаки (нулевой ширины, мягкий перенос,
      метка порядка байтов и другие из перечня проекта; удаляются без замены
      разделителем); то же применяется к вводу пополнения и к открытому списку;
      затем разделитель — любой знак, который
      не буква и не цифра (пробел, дефис, точка, косая черта, подчёркивание и прочие);
      слово — непрерывная последовательность букв и цифр длиной не меньше 3 знаков;
      пара — два соседних слова после такого деления. Так название внутри пути, имени
      файла или идентификатора («a/Zqxwvorg/b», «zqxwvorg-api») тоже находится. Ограничение: склейка слов и camelCase, цифра
      вплотную к слову и похожие буквы другого алфавита не ловятся — это защита от
      случайности, не от умысла.
      Делению подвергается не только текст файла, но и путь самого файла от корня
      репозитория: проверяется каждый его сегмент, то есть и имена папок, и имя файла.
      Пополняет файл владелец командой, которая читает название со
      стандартного ввода; ни одно название в файл не пишется. Для независимой сверки
      (критерий 2) открытый список лежит у владельца вне репозитория; команда читает
      его по пути из переменной окружения SAI_TRACE_LIST, если она задана. Ни шаблон
      поиска, ни названия, ни путь к списку не пишутся в handoff-ы и другие файлы Sai:
      handoff, который говорит о следах, называет проверку только командой
      `npm run traces`, хешем sha256 файла списка и числом совпадений.

      Список исключений — файл в Sai: на каждую строку — файл, хеш sha256 строки и
      причина. Он нужен для исторических учётных файлов, которые только дописываются
      (handoff-ы, quality-bar §6, п. 8), когда совпадение — не след этого компьютера
      (например, условный путь в примере входа теста). Исключение действует только на
      эту строку этого файла: та же строка в другом файле или изменённая строка —
      снова след. Команда проверки входит в `npm run check`.

      Совпадения, которые найдёт первый запуск: настоящие следы (путь этого
      компьютера, название другого проекта — в том числе шаблон поиска названий,
      записанный в handoff прогона REQ-20261006-01, шаг 01) заменяются пометкой, как в
      decisions/0019, — смысл записи не меняется; совпадения, которые следом не
      являются (условный путь в примере входа теста), вносятся в список исключений, а
      запись не правится.

      Чистая машина — копия, полученная клоном репозитория в пустую временную папку,
      где рядом нет других проектов, с домашним каталогом во временной папке (нет
      ~/.sai-team, ~/.sai-pixel-office, настроек Claude Code). Внешние сервисы во время
      работы: только Claude Code — при настоящих запусках исполнителя (REQ-010) и для
      хуков; реестр npm нужен только `npm ci` для инструментов разработки. В коде
      tools/src нет зависимостей времени выполнения (decisions/0002), сетевые
      обращения — только к 127.0.0.1, страницы не грузят ничего с внешних адресов.

      README.md — одна инструкция «Как открыть на другом компьютере»: что нужно (git,
      Node 22 с npm; Claude Code — только для хуков Pixel Office и настоящих запусков),
      шаги git clone, `cd tools && npm ci`, `npm run check`, `npm run pixel-office`,
      `npm run team -- projects`; без устаревших слов о том, что своего репозитория у
      Sai нет и что кода продукта нет. Адрес репозитория в README — пометка
      «<адрес репозитория Sai>», а не адрес этого компьютера.

      Вывод команды не печатает найденное название из списка (только файл, строку и
      «название из списка»), иначе вывод сам был бы следом. Если название найдено в
      пути файла, сам путь не печатается совсем (решение 0021, D4; проект, п. 2.1):
      вместо него строка «<файл №k, sha256 пути <12 hex>>: название из списка в имени
      файла», где k — номер файла (с 1) в списке путей, отсортированном по байтам UTF-8
      (как `LC_ALL=C sort`), а 12 hex — начало sha256 байтов UTF-8 пути. Найти файл по
      метке: `git ls-files -z --cached --others --exclude-standard | LC_ALL=C sort -z |
      tr '\0' '\n' | sed -n '<k>p'` (команда записана и в tools/README.md); начало
      sha256 найденного пути должно совпасть с меткой. Безопасность. Q7
      неприменим: команда не читает и не пишет секретов. Q8, Q9, Q11, R3 неприменимы: данных магазинов,
      SQL, внешних адресов и фото нет. Q10: файл, который нельзя прочитать как текст,
      пропускается с пометкой в выводе, а не роняет команду; так же с пометкой пропускается файл крупнее предела (16 МиБ) и файл, ссылающийся за корень репозитория через символическую ссылку, а строка Markdown длиннее 100 000 знаков не разбирается на ссылки (пометка в выводе; названия и пути в ней проверяются как обычно).

      Файлы (от корня Sai): tools/src/ (команда проверки следов), tools/test/traces-*.test.js,
      tools/package.json (скрипт; входит в check), файл хешей запрещённых названий и
      файл исключений (место — проект), tools/src/traces/git-files.js (корень
      репозитория и список файлов через git; это единственное место команды проверки
      следов, где разрешён child_process, и только для двух вызовов git без оболочки с
      фиксированными аргументами: `git -c core.fsmonitor=false -C <папка> rev-parse --show-toplevel` и
      `git -c core.fsmonitor=false -c core.quotePath=false ls-files -z --cached --others --exclude-standard`), README.md (раздел «Как открыть на другом
      компьютере»), исправления найденных настоящих следов в любых файлах Sai — только
      замена пометкой.

      Вне области: переписывание истории git (решение 0019, «Граница»: нужно отдельное
      решение владельца), установка Node и Claude Code на машине, исполнитель через
      Anthropic API по ключу.
    acceptance_criteria:
