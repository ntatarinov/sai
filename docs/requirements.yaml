  - id: REQ-011
    title: Sai Team, часть 4 — бизнес-интерфейс — проекты, цель одной фразой, чат, задачи и связи «чат ↔ задача ↔ исполнитель ↔ проект» на локальной странице, без технических слов
    owner: FRONTEND-DEV   # страница; локальный сервер и его API — BACKEND-DEV в том же прогоне
    status: done   # 2026-10-10: RELEASE-VALIDATOR PASS, прогон PROD-20261010-01, круг 4 (handoffs/PROD-20261010-01/step-51-release-validator.json; критерии 1–15 — круг 3, step-50; npm run check 1109 из 1109). Зависимость REQ-013 на тот момент была in_progress (критерий 13) — по исключению decisions/0027; с 2026-10-13 REQ-013 — done (прогон REAL-20261013-01), исключение больше не нужно. Сценарии R-1 и R-2 с настоящим Claude через страницу НЕ выполнены: настоящий запуск 2026-10-13 шёл командами, не через страницу; согласие на настоящие запуски владелец дал (decisions/0048, до двух запусков осталось). Прежде: in_progress с 2026-10-10 (прогон начат, WF-02, шаг 0)
    depends_on: [REQ-013]   # проект создаётся, планируется и выполняется движком REQ-013; через него — REQ-010, REQ-009 (журнал, состояние, язык, каталог ролей) и REQ-002; чат при работающем движке — через файл-очередь inbox/ и модуль tools/src/team/engine/channel.js по критерию 9 REQ-013 (уточнён правкой WF-01 2026-10-06; описание, «Чат»)
    original_request: >
      «Тебе нужно сформировать требования по проекту, которые были не реализованы или
      реализованы. Accept критерии приемок должны быть. То есть суть в том, что сай
      проект должен самостоятельно работать без участия других проектов, но он должен
      взять лучшее с проектов просто требования составь и все а потом это мы сделаем на
      сонете» (владелец, 2026-10-06, сообщение в сессии Claude Code; дословно — в задании
      handoffs/REQ-20261006-01/step-01-req-analyst.json). Видение, на которое опирается
      требование, — слова владельца того же дня, дословно в decisions/0015 (раздел
      «Основание»): «Главный ориентир: максимально автономная виртуальная команда +
      предельно простой UX для бизнеса + Pixel Office как живое зеркало реальной работы +
      качество продукта не хуже [образца], а в ключевых сценариях лучше.»
    description: >
      Что получает пользователь. Человек, который не программирует, работает с
      проектами виртуальной команды на странице, а не командами терминала. Команда
      `cd tools && npm run team-web` (имя скрипта может уточнить проект CODE-DESIGNER;
      тогда критерии читаются с ним) запускает локальный сервер и печатает ссылку
      http://127.0.0.1:<порт>/. На странице: список проектов; новый проект — цель одной
      фразой и потолок расходов; страница проекта; чат проекта. Всё, что показано,
      выводится из журнала проекта воспроизведением (REQ-009): своего файла состояния у
      интерфейса нет, а записи идут только через API ядра и команды движка REQ-013.

      Страница проекта отвечает на шесть вопросов владельца — словами, без технических
      терминов: (1) что происходит — последние фразы модуля «язык» REQ-009; (2) кто
      занимается — человеческие названия ролей, у которых задача в работе или на
      проверке; (3) когда будет готово — правило ниже; (4) есть ли проблема — задачи
      «не удалось», проект «ждёт решения пользователя» с причиной; (5) нужно ли что-то от
      меня — число вопросов, ждущих ответа, и переход к ним (сам ответ в окне — REQ-017);
      (6) результат — список файлов результата с задачей и ролью (открыть и скачать —
      REQ-015). Прогресс — «N из M задач» из состояния; в текстах, которые формирует
      Sai (статус, прогресс, срок, подписи, фразы модуля «язык»), процентов нет (как
      REQ-009). Проект на тестовом исполнителе (scripted, REQ-010) помечен «тестовый
      исполнитель» в списке проектов и на странице проекта (decisions/0015, D-B).

      Вопрос, ждущий ответа (5), — одно открытое ожидание решения: движок REQ-013
      открыл его событием CHAT с вопросом, и его ещё не закрыли ответ пользователя или
      новый статус задачи или проекта. Одно ожидание — один вопрос, даже если в нём
      «ждёт решения пользователя» и задача, и проект. Видов шесть, как в окне REQ-017:
      критическая задача, сбой задачи, проверка не прошла после передачи другой роли,
      потолок стоимости, план не получен, цель не достигнута. То же число показывает
      окно REQ-017.

      «Когда будет готово» — только правда из журнала: пока в проекте меньше двух задач
      «готово», показывается «срок пока не оценить»; иначе — «примерно через X мин»,
      где X = медиана длительности готовых задач этого проекта × округление вверх
      (число незавершённых задач / предел параллельности проекта), округлено вверх до
      минуты. Длительность задачи — от события первого запуска задачи (первой попытки)
      до события «готово». Незавершённые — задачи плана в статусах «ждёт», «в работе»,
      «на проверке», «прервана» и «ждёт решения пользователя»; «готово» и «не удалось»
      не считаются. У проекта в конечном статусе — его статус словами, без оценки.
      Правило — часть требования; если проект CODE-DESIGNER предложит иной вариант,
      выбор — запись decisions/ на шаге проекта (Q12). Иного источника срока нет.

      Связи — одна реальность по ссылкам (parity-matrix, превосходство «Ж»): сообщение
      чата, которое говорит о задаче, ведёт на задачу; задача — на карточку исполнителя
      (роль: человеческое название, описание из каталога, задачи этой роли в проекте) и
      на проект; карточка исполнителя — на его задачи и на проект. Внутренние поля
      каталога ролей (промт, инструменты) не показываются никогда (REQ-009, критерий 10).

      Чат: сообщение пользователя — событие CHAT источника USER; вопросы и ответы
      системы — события CHAT источника ENGINE. Граница случая «проект занят»
      (критерии 5 и 10): (а) право записи держит движок REQ-013 — запущенный этим
      сервером или командой start или resume из терминала — сообщение принимается и
      сохраняется: сервер передаёт его движку через канал движка, событие CHAT пишет
      движок как держатель права записи, ответа «проект занят» нет; (б) права записи
      никто не держит (движок не запущен) — событие CHAT пишет сам сервер через API
      ядра; (в) право записи держит процесс, который не движок (короткая команда
      записи из терминала, например `say` или `budget`), — понятный текст «сообщение
      не отправлено, повторите через несколько секунд», текст остаётся в поле ввода,
      журнал не изменён (это случай критерия 10). Механизм канала — файл-очередь
      inbox/ папки проекта по критерию 9 REQ-013 (не сокет и не сеть); сервер пишет в
      неё только через модуль tools/src/team/engine/channel.js и ждёт подтверждения
      (ack) движка (критерий 15); поправка к решению 0017, I3 (другой процесс получает
      E_PROJECT_BUSY), — запись decisions/ проекта CODE-DESIGNER REQ-013. Зависимость:
      случай (а) и критерий 5 опираются на критерий 9 REQ-013 (уточнён правкой WF-01
      2026-10-06): сообщение чата передаётся движку файлом-очередью inbox/ папки
      проекта через модуль канала REQ-013, событие пишет движок; пока критерий 9
      REQ-013 не выполнен, случай (а) и критерий 5 невыполнимы. Технические подробности (тип события, номера, исполнитель, расход
      по запускам) в обычном виде не показываются — их раскрытие и отдельный режим для
      специалистов — REQ-022.

      Безопасность. Сервер слушает только 127.0.0.1 и отвечает только на Host
      127.0.0.1:<порт> или localhost:<порт> (как Pixel Office, REQ-001); запросы записи
      принимаются только со своей страницы — проверка Origin и токен, выданный
      страницей (точный механизм — проект), чтобы чужой сайт в браузере пользователя не
      создал проект и не написал в чат. Сеть: node:http — только в файлах сервера
      интерфейса tools/src/web/ и только на 127.0.0.1; код движка tools/src/team/
      сетевых модулей не получает (критерий 6 REQ-013 остаётся верным). Текст
      пользователя и агентов — данные: показывается как есть, как текст, не как
      разметка (запрет «%» и технических слов его не касается); маскируется
      maskSecrets до записи (REQ-009). Q8 в Sai — про магазины; принцип для проектов: путь одного проекта не
      даёт данных другого, идентификатор, которого нет, — «не найден». Q10: сбой ядра
      или движка (диск, проект занят, исполнитель недоступен) — понятный текст, сервер
      работает дальше. Q11 неприменим: сервер не ходит по адресам, которые задаёт
      пользователь. Q9, R3 неприменимы: SQL и фото покупателей нет. R2: на странице нет
      ни одного состояния, процента, фразы или движения, которых нет в журнале.

      Файлы (от корня Sai): tools/src/web/ (сервер и страница интерфейса — отдельно от
      движка), tools/test/team-web-*.test.js, tools/package.json (скрипт),
      tools/README.md (раздел «## Sai Team — интерфейс»), описание интерфейса
      docs/design/REQ-011-*.md (GUI-DESIGN-ANALYST, WF-04), список файлов теста
      tools/test/traces-runtime.test.js (критерий 4 REQ-014), если он уже есть. Граница
      decisions/0015 разрешает код продукта только в tools/src/team/; место
      tools/src/web/ выбрано ORCH (прогон REQ-20261006-01), до кода его записывает
      decisions/NNNN-*.md (Q12, критерий 13). Сервер берёт данные и пишет только через
      API ядра REQ-009 и команды движка REQ-013 (импорт из tools/src/team/). Не
      затрагиваются: tools/src/pixel-office/, ~/.sai-pixel-office.

      Вне области: окно «От вас требуется решение» (REQ-017), просмотр и скачивание
      результатов (REQ-015), память проекта (REQ-016), лента с раскрытием деталей и
      режим для специалистов (REQ-022), очередь проблем (REQ-021), шаблоны целей
      (REQ-020), пользователи и вход (REQ-018), роли и права (REQ-023), рабочие
      пространства (REQ-024), Pixel Office (REQ-012), мобильное приложение, действия
      вовне.
