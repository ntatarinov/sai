      - "База исключений — тест (временный репозиторий, запись ORCH в decisions/ фикстуры со строкой «База handoffs-check: <коммит>»): (а) запись «путь, H4, status, sha256 значения, причина» → нарушение H4 этого поля снято и посчитано в «исключений использовано»; нарушение H5 того же файла видно; (б) в файл с записью H7 для result.issues[0].at добавлено и закоммичено второе время позже коммита в result.issues[1].at → новая строка H7 о result.issues[1].at, код 1, первое нарушение по-прежнему снято; (в) значение поля с записью изменено → нарушение видно, запись — «исключение не использовано»; (г) запись с хешем нового значения (не того, что в файле в коммите базы) → stderr «handoffs-check: <код>: …» с номером строки базы, код 2; запись для файла, которого нет в коммите базы, → код 2; (д) шапка «база:» с другим коммитом, чем строка «База handoffs-check:» в записи decisions/ с наибольшим номером, → код 2; запись decisions/ с большим номером и новым коммитом при старой шапке → код 2; коммит базы не предок HEAD → код 2; (е) запись без причины, с хешем не из 64 hex, без пути поля или с кодом H10 → код 2 и номер строки tools/handoffs/exceptions.tsv; (ж) лишняя запись → строка «исключение не использовано: tools/handoffs/exceptions.tsv:<N>», код выхода тот же"
      - "Настоящий репозиторий и счёт записей. После работы `cd tools && npm run handoffs-check` — код 0, итоговая строка «нарушений 0, исключений использовано K из L» с K = L. В decisions/ есть запись ORCH со строкой «База handoffs-check: <40 hex>», и этот хеш тот же, что в строке «база:» tools/handoffs/exceptions.tsv (`grep -h 'База handoffs-check:' decisions/*.md` и `grep 'база:' tools/handoffs/exceptions.tsv`, вывод приложен). На копии вне проекта с пустой базой (только шапка) — код 1, число строк нарушений M (по итоговой строке) равно числу записей базы `grep -vc '^#' tools/handoffs/exceptions.tsv` и равно L (вывод обоих запусков приложен); в выводе есть строки: H4 для handoffs/PO-20261005-01/step-07-design-qa-validator.json (DONE), H4 для handoffs/WF06-20260926-01/step-10-orch.json (PENDING в коммите), H4 для handoffs/PROD-20261011-01/step-17-reviewer.json (status и result.status), H7 для result.issues[0].at в handoffs/PROD-20261010-01/step-24-test-designer.json; строк о handoffs/WF06-20260925-01/step-10-orch.json и step-13-req-analyst.json (CANCELLED) нет; строк H7 о completed_at файлов handoffs/PROD-20261006-01/step-04-code-designer-r2.json и handoffs/PROD-20261010-01/step-44-code-designer-iss0010.json нет (значение не позже своего коммита)"
      - "Вывод, коды и сбои. Тест: порядок строк — по пути, затем по строке, затем по пути поля; последняя строка — «handoffs-check: файлов проверено …»; запуск вне git-репозитория → код 2 и тот же текст, что у traces («это не git-репозиторий…»); git не найден (PATH без git) → код 2; файл без права чтения → код 2; ни в одном случае нет стека в stderr. Команда ничего не пишет: хеши всех файлов handoffs/ и tools/handoffs/ до и после запуска совпадают. На репозитории `time (cd tools && npm run handoffs-check)` — не больше 20 секунд (вывод приложен)"
      - "Документы. docs/workflows/handoffs.md: в разделе «## Проверка учёта» есть `cd tools && npm run handoffs-check` (`awk '/^## Проверка учёта/{f=1;next} /^## /{f=0} f' docs/workflows/handoffs.md | grep -c 'handoffs-check'` не меньше 1, сейчас 0), правило поправки ORCH с by (`… | grep -c 'orch_correction'` не меньше 1) и правило путей через заглушку (`… | grep -c '<scratch>/'` не меньше 1); в разделе «## Время» — правило at_note и полей was и previous (`awk '/^## Время/{f=1;next} /^## /{f=0} f' docs/workflows/handoffs.md | grep -c 'at_note'` и `… | grep -c 'previous'` — каждое не меньше 1, сейчас 0). tools/README.md описывает команду, правила H1–H11, базу исключений с записью на нарушение и сверкой с коммитом базы и коды выхода: `grep -c 'handoffs-check' tools/README.md` не меньше 2, `grep -c 'База handoffs-check' tools/README.md` не меньше 1"
      - "Место записи и границы. База — метка `base/<RUN-ID>` (decisions/0031). `git diff --name-only base/<RUN-ID>` плюс `git status --porcelain` перечисляют только файлы закрытого перечня описания; `git diff --name-only base/<RUN-ID> -- handoffs/ | grep -v '^handoffs/<RUN-ID>/'` пусто (старые handoff-ы не тронуты). Проверка целиком (Q4, Q6): `cd tools && npm run check` — код 0; на копии Sai без node_modules во временной папке `cd tools && npm ci && npm run check` — код 0, вывод приложен; `cd tools && npm run traces` — код 0; в изменении нет skip, todo и отключённых правил линтера; в тексте нет путей компьютера и названий других проектов"
  - id: REQ-039
    title: Заготовка handoff-а командой — `npm run handoff -- new` создаёт файл по docs/workflows/handoffs.md со временем с часов и меткой base/<RUN-ID>, `npm run handoff -- close` ставит статус и completed_at с часов; ничего не перезаписывает и пишет только в handoffs/
    owner: BACKEND-DEV   # команда и тесты в tools/; строки в docs/workflows/handoffs.md, .claude/agents/orchestrator.md и tools/README.md — в том же прогоне
    status: done   # 2026-10-11: прогон REQ039-20261011-01, PASS RELEASE-VALIDATOR (handoffs/REQ039-20261011-01/step-09-release-validator.json: 8 критериев выполнены, npm ci && npm run check на чистой копии — код 0, 1389 из 1389); зависимость REQ-038 — done, исключения нет
    depends_on: [REQ-038]   # close проверяет закрытый файл правилами H1–H11 из REQ-038 и использует их код; без REQ-038 команде нечем проверять. В план — только после PASS REQ-038 на шаге 2 WF-01 (правила H1–H11 ссылаются на его текст)
    original_request: >
      «Сформируй требования которые ты считаешь полезными для sonnet, после этого я запущу
      это все твое на sonnet» — слова владельца, 2026-10-11, сообщение в сессии Claude Code
      (дословно — в поле context.owner_words handoffs/REQ-20261011-02/
      step-01-req-analyst.json). Основание — аудит ORCH 2026-10-11: времена в handoff-ах
      записаны не с часов (AP-056, AP-061), handoff-ы созданы заранее без своего started_at
      (AP-058), часть handoff-ов написали сами агенты, потому что файла не было (в
      handoffs/PROD-20261011-01/step-22-test-designer.json и step-43-release-validator.json
      поле context.note_by_agent: «Файла handoff-а не было; поля верхнего уровня записаны …
      по сообщению ORCH»); на 2026-10-11 в 22 handoff-ах нет поля created_at. Набор JSON и
      времени руками — лишняя работа и источник ошибок для агентов на модели Sonnet.
    description: >
      Что получает владелец. ORCH и агенты не набирают поля handoff-а и время руками:
      команда пишет файл по протоколу, время берёт с часов и проверяет закрытый файл
      правилами REQ-038. Время из будущего в полях, которые пишет команда, получить нельзя.

      Создание. `cd tools && npm run handoff -- new --run <RUN-ID> --step <ШАГ> --role <КОД
      РОЛИ> --workflow <WF-NN> --task "<что сделать>" [--criterion "<пункт>"]…
      [--requirement <REQ-NNN>]… [--artifact-in <путь от корня>]… [--write-set "<текст>"]…
      [--route "<текст>"] [--qualifier <уточнение>] [--suffix <rN|runN|vN>] [--priority
      HIGH|NORMAL|LOW] [--rework-of <путь handoff-а>]`. Повторяемые ключи дают списки в
      порядке ввода. Имена ключей закреплены этим требованием. Проверки входа:
      - RUN-ID — `<МЕТКА>-<ГГГГММДД>-<NN>` (handoffs.md): метка из заглавных латинских
        букв и цифр, у дефекта и аудита — с номером (`ISS-0002`, `AUD-001`); примеры —
        PROD-20261011-01, ISS-0002-20260930-01, AUD-001-20261012-01 принимаются;
        prod-20261011-01, PROD-2026-10-11-01, PROD-20261011-1 отклоняются;
      - ШАГ — две цифры и, может быть, одна строчная буква: 00, 01, 05b; «5b», «100»
        отклоняются;
      - КОД РОЛИ — один из кодов в скобках в строках `name:` файлов .claude/agents/*.md (на
        2026-10-11 их 37: `grep -h '^name:' .claude/agents/*.md | wc -l`); неизвестный код
        отклоняется с подсказкой, где список;
      - уточнение — строчные латинские буквы и цифры через дефис (`market`, `req001`);
        суффикс — r, run или v с номером от 1 (`r1`, `run2`, `v3`); workflow — WF-01…WF-07;
        task — непустой текст; requirement — REQ-NNN.
      Что пишется. Файл handoffs/<RUN-ID>/step-<ШАГ>-<роль строчными через
      дефис>[-<уточнение>][-<суффикс>].json; handoff_id —
      step<ШАГ>[-<уточнение>][-<суффикс>]-<RUN-ID> (пример handoffs.md:
      step06-r2-ISS-0002-20260930-01). Поля и порядок — как в примере handoffs.md:
      handoff_id, run_id, workflow_id, step, from_agent «ORCH», to_agent, file, status
      «PENDING», priority (по умолчанию NORMAL), context (requirement_ids, agent_run_id null,
      artifacts_in, затем route, write_set, base_tag, rework_of — если заданы), task
      (description, acceptance_criteria), created_at, started_at, completed_at null, result
      null; при суффиксе rN — поле round со значением N. created_at и started_at — одно
      чтение часов, вид ГГГГ-ММ-ДДTчч:мм:ссZ (то же, что `date -u +%Y-%m-%dT%H:%M:%SZ`).
      JSON с отступом 2 пробела, UTF-8 без экранирования кириллицы, перевод строки в конце.
      Команда печатает путь созданного файла и handoff_id.
      Метка базы (decisions/0031). Если в репозитории есть метка git `base/<RUN-ID>` —
      context.base_tag «base/<RUN-ID>». Если её нет: для WF-02 — отказ «метки base/<RUN-ID>
      нет: поставьте её до первого изменения прогона (decisions/0031)», файл не создаётся;
      для остальных процессов поле не пишется (выбор этого требования: 0031 говорит только о
      WF-02; открытый вопрос 1).
      Ничего не перезаписывается. Файл уже есть — отказ «файл уже есть: <путь>; handoff-ы не
      перезаписываются», файл байт в байт прежний; такой handoff_id уже есть в другом файле
      handoffs/ — отказ. Создание исключительное: два одновременных `new` с одним именем —
      ровно один файл и один отказ. Папка handoffs/<RUN-ID>/ создаётся, если её нет; при
      отказе она не создаётся.

      Закрытие. `cd tools && npm run handoff -- close <путь handoff-а от корня> --status
      COMPLETED|FAILED`. Условия: путь внутри handoffs/ (без «..», не абсолютный, не ссылка
      за корень — как readText у traces); файл — JSON; status сейчас PENDING или
      IN_PROGRESS; completed_at сейчас null (уже записанное не перезаписывается); result —
      объект, и result.status равен значению --status (result пишет получатель до закрытия,
      handoffs.md). Команда ставит status и completed_at с часов; completed_at не раньше
      started_at (started_at позже часов — отказ «started_at позже часов»). Перед записью
      новый текст файла проверяется правилами REQ-038 (H1–H11 для одного файла): нарушение
      — отказ, строки нарушений в формате REQ-038, файл не изменён. Меняются только
      значения status и completed_at: остальные поля, их порядок и значения прежние.
      Остановка по правилу роли (IN_PROGRESS и «BLOCKED») командой close не делается —
      это не закрытие.

      Запись. Только в handoffs/<RUN-ID>/, через временный файл в той же папке; при сбое
      временный файл не остаётся. `new` фиксирует файл исключительно — так, чтобы занятое
      имя давало отказ, а не замену: жёсткая ссылка временного файла на имя handoff-а с
      отказом при занятом имени (EEXIST) и удаление временного файла, или замок с
      исключительным созданием на время записи; что из двух — выбор CODE-DESIGNER.
      Переименование (rename) для `new` не годится: оно заменяет существующий файл.
      `close` меняет уже существующий файл — временный файл и переименование (как в
      служебном коде по decisions/0004).
      Коды выхода: 0 — сделано; 1 — отказ по правилам (файл есть, нарушение REQ-038, не тот
      статус); 2 — ошибка вызова или окружения (неизвестный ключ, нет значения ключа, git не
      найден, папка не git-репозиторий, диск). Ошибка — одна строка stderr «handoff:
      <код>: <текст>» по-русски, без стека. `--help` печатает обе подкоманды и все ключи.

      Точные места записи (перечень закрытый). Код — tools/src/handoffs/ (общая папка с
      REQ-038); tools/package.json — скрипт handoff; тесты — tools/test/handoffs-*.test.js,
      фикстуры tools/test/fixtures/handoffs/; документы — docs/workflows/handoffs.md (разделы
      «Время» и «Кто что пишет»: создавать и закрывать командой), .claude/agents/
      orchestrator.md (один пункт: handoff создаётся командой `new` в момент запуска агента,
      не заранее), tools/README.md (раздел о команде). Файлы учёта прогона — как в REQ-038.

      Безопасность и сбои. Q7: команда не печатает и не пишет ничего, кроме полей handoff-а
      из аргументов; секрет в аргументе остаётся на совести вызывающего — `npm run
      handoffs-check` и traces проверяют результат. Q10: занятое имя, битый файл, отказ диска
      — понятная строка, файл не испорчен. Q8, Q9, Q11, R3 неприменимы. R2: Pixel Office не
      затрагивается.

      Вне области: правка полей context и task после создания; запись result за агента;
      пометки not_agent_attested и поправки ORCH (пишутся по handoffs.md руками);
      подкоманда «start» (перевод в IN_PROGRESS) — открытый вопрос 2; перенос старых
      handoff-ов.

      Открытые вопросы:
      1. Отказывать ли без метки base/<RUN-ID> и для WF-03 (дефект): 0031 говорит только о
         WF-02.
      2. Нужна ли подкоманда «start» (PENDING → IN_PROGRESS получателем, handoffs.md,
         «Как работает получатель», п. 4) — сейчас статус меняют руками.
