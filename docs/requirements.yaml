  - id: REQ-019
    title: Sai Team, часть 9 — аудит — неизменяемый журнал действий людей с проверкой целостности; кто что разрешил и сделал; раскрытие деталей
    owner: BACKEND-DEV
    status: pending
    depends_on: [REQ-023, REQ-024]   # «кто» и журнал входа — REQ-018 (через REQ-023); кто видит страницу — таблица прав REQ-023 (строка «журнал действий»); журнал пространства и разделение по пространствам — REQ-024
    original_request: >
      «Тебе нужно сформировать требования по проекту, которые были не реализованы или
      реализованы. Accept критерии приемок должны быть. То есть суть в том, что сай
      проект должен самостоятельно работать без участия других проектов, но он должен
      взять лучшее с проектов просто требования составь и все а потом это мы сделаем на
      сонете» (владелец, 2026-10-06, сообщение в сессии Claude Code; дословно — в задании
      handoffs/REQ-20261006-01/step-01-req-analyst.json). Видение того же дня —
      decisions/0015, раздел «Основание».
    description: >
      Что получает владелец. Можно проверить, кто что разрешил и сделал, и убедиться,
      что запись об этом никто не подправил. Из лучшего у [образца] берётся смысл:
      неизменяемый журнал аудита с цепочкой хешей.

      У каждого события источника USER в журнале проекта — кто (пользователь REQ-018;
      команда терминала — «терминал этого компьютера»). Журналов, кроме журналов
      проектов, два, и оба вводит не это требование: журнал входа уровня установки
      (REQ-018) — вход, неверный вход, выход, сброс пароля, создание и удаление
      пользователя; при неверном входе пространство неизвестно, поэтому событие
      пишется туда; журнал пространства (REQ-024) — действия людей внутри
      пространства: участник добавлен или убран, роль изменена, решения, изменения
      настроек. Здесь к журналам проектов, журналу входа и журналам пространств
      добавляется цепочка хешей — в каждом журнале своя, независимая от других (точный
      формат — новая редакция проекта REQ-009); команда `npm run team -- audit <id>`
      (для журнала входа и журнала пространства — по проекту CODE-DESIGNER)
      проверяет цепочку одного журнала и называет номер первой строки, где цепочка не
      сходится.

      Правило проверки (от него зависят номера в критерии 2). Строка i (i ≥ 2) несёт
      хеш sha256 байтов строки i − 1 целиком; первая строка цепочки — заданное
      начальное значение. Проверка идёт сверху вниз и называет наименьший номер i,
      для которого строка i не разбирается или её поле хеша не равно sha256 строки
      i − 1 (для первой строки — начальному значению). Следствия на журнале из 30
      строк: изменён байт в поле данных строки 12 (строка разбирается) — строка 12
      проходит, не сходится строка 13 → 13; удалена строка 12 — новая строка 12
      (прежняя 13) несёт хеш прежней 12 → 12; вставлена строка после 12 с хешем,
      не равным sha256 строки 12, → 13; вставлена строка после 12 с верным хешем
      строки 12 → вставка проходит, не сходится следующая за ней (прежняя 13) → 14;
      строки 12 и 13 переставлены — новая строка 12 (прежняя 13) несёт хеш прежней
      12 → 12. Журналы, начатые до этого требования, без цепочки: проверка называет,
      до какой строки цепочки нет, и проверяет остальное.

      Страница «Журнал действий» (видят владелец и участник пространства; права —
      строка «журнал действий» таблицы REQ-023): действия людей текущего пространства
      по времени из журналов его проектов и журнала пространства — кто, что, в каком
      проекте; фильтр по человеку, проекту и виду (решения, потолок, память,
      участники, роли). Журнал входа уровня установки на странице не показывается: он
      не принадлежит ни одному пространству; его проверяет команда audit. Строка
      раскрывается: подробности события словами и полями (маскированными), ссылка на
      проект и задачу. Отличие от ленты REQ-022: там — работа команды агентов, здесь
      — действия людей и проверка целостности.

      Безопасность. Q7: в журналах нет паролей и cookie (REQ-018, REQ-024). Принцип Q8:
      журнал пространства A не виден пользователю B. Цепочка хешей обнаруживает
      правку, а не запрещает её. Остаточный риск (цепочка без ключа): не
      обнаруживаются удаление хвоста журнала, правка последней строки и правка, после
      которой хеши всех следующих строк пересчитаны заново; его называют README и
      запись решения (вместе с тем, где хранить последний хеш или ключ, если владелец
      решит закрыть его).
      Q10: испорченная строка — проверка называет её, страница работает. Q9, Q11, R3
      неприменимы.

      Файлы (от корня Sai): tools/src/team/, tools/src/web/,
      tools/test/team-audit*.test.js, проект docs/design/REQ-009-team-core.md (новая
      редакция формата строки), tools/README.md. Вне области: внешнее хранилище
      аудита, выгрузка в службы мониторинга, подпись ключом.
    acceptance_criteria:
      - "Кто сделал. Тест tools/test/team-audit.test.js: у каждого события USER,
        записанного через сервер, есть пользователь сессии; у записанного командой
        терминала — «терминал этого компьютера»; событие USER без автора ядро
        отклоняет, журнал не изменён (хеш)"
      - "Цепочка обнаруживает правку. Тест: на журнале из 30 событий с цепочкой `npm run
        team -- audit <id>` — код 0; каждое изменение копии журнала даёт код не 0 и
        номер первой строки, где цепочка не сходится, по правилу описания: изменение
        одного байта в поле данных строки 12 (строка разбирается) — 13; удаление
        строки 12 — 12; вставка строки после 12 с неверным хешем — 13; вставка строки
        после 12 с верным хешем строки 12 — 14; перестановка строк 12 и 13 — 12;
        изменение байта, после которого строка 12 не разбирается, — 12; журнал, начатый
        без цепочки, — код 0 и сообщение, до какой строки цепочки нет"
      - "Журналы входа и пространства. Тест: вход, неверный вход (с неверным паролем и с
        несуществующим именем), выход и сброс пароля дают по одной строке в журнале
        входа REQ-018 и ни одной в журнале пространства; добавление участника и смена
        роли дают по одной строке в журнале пространства REQ-024 и ни одной в журнале
        входа; строки обоих журналов несут цепочку; проверка цепочки каждого журнала —
        код 0; изменение одного байта в поле данных строки 2 копии журнала входа — код
        не 0 и номер 3, а проверка журнала пространства по-прежнему — код 0 (цепочки
        независимы); то же для правки журнала пространства; пароля и cookie в обоих
        журналах нет (тест ищет их значения)"
      - "Страница «Журнал действий». Тест сервера: после 10 действий двух пользователей
        в двух проектах страница отдаёт ровно 10 строк по времени; фильтр по человеку,
        по проекту и по виду даёт ровно соответствующие строки; раскрытие строки даёт
        поля события (маскированные) и ссылки на проект и задачу; строк журнала входа на
        странице нет; наблюдатель получает отказ по строке «журнал действий» таблицы
        прав REQ-023, владелец и участник — проходят (перебор теста
        tools/test/team-roles.test.js дополняется этой строкой); пользователь пространства B не получает строк
        пространства A (тот же ответ, что на несуществующее)"
      - "Документация и проверка (Q4). tools/README.md описывает команду audit, что она
        обнаруживает и все три остаточных риска цепочки без ключа: удаление хвоста
        журнала, правка последней строки, правка с пересчётом хешей всех следующих
        строк; новая редакция проекта
        REQ-009 проверена CODE-DESIGN-VALIDATOR; на копии каталога Sai без node_modules
        `cd tools && npm ci && npm run check` — код 0; вывод приложен"

