<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Office — Osnova</title>
<link rel="stylesheet" href="agent-office.css">
</head>
<body>

<div id="authGate" class="gate">
  <div class="gate-card">
    <div class="gate-title">Agent Office</div>
    <p>Визуализация работы агентной системы над требованиями Osnova.</p>
    <div id="gateErr" class="gate-err"></div>
    <input id="login" placeholder="Логин" value="admin">
    <input id="password" type="password" placeholder="Пароль" value="admin123">
    <button onclick="gateLogin()">Войти</button>
    <a href="/" class="gate-back">← К учётной системе</a>
  </div>
</div>

<div id="app" class="shell" style="display:none">
  <header class="bar">
    <span class="logo">Agent Office</span>
    <span class="src" id="srcBadge">LIVE</span>
    <div class="ctl">
      <button id="btnMode" onclick="toggleMode()">Режим: LIVE</button>
      <button id="btnPlay" onclick="togglePlay()">Пауза</button>
      <button onclick="setSpeed(1)" class="sp" data-sp="1">1×</button>
      <button onclick="setSpeed(2)" class="sp" data-sp="2">2×</button>
      <button onclick="setSpeed(4)" class="sp" data-sp="4">4×</button>
      <select id="reqFilter" onchange="applyFilter()"><option value="">Все требования</option></select>
    </div>
    <a href="/" class="back">← Учётная система</a>
  </header>

  <main class="grid">
    <section class="stage">
      <canvas id="office" width="960" height="600"></canvas>
      <div class="legend" id="legend"></div>
    </section>

    <aside class="side">
      <div class="panel">
        <div class="panel-head">
          <b>Журнал событий</b>
          <span class="muted"><span id="tzLabel"></span> · <span id="feedCount"></span></span>
        </div>
        <div class="feed" id="feed"></div>
      </div>
      <div class="panel" id="inspector">
        <div class="panel-head"><b>Требования</b></div>
        <div class="inspector-body" id="inspectorBody"></div>
      </div>
    </aside>
  </main>
</div>

<div id="modal" class="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-card"><button class="modal-x" onclick="closeModal()">×</button>
    <div id="modalBody"></div></div>
</div>

<script src="format.js"></script>
<script src="agent-office.js"></script>
</body>
</html>
