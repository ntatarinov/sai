<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pixel Office</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="top">
      <h1 class="top-title">Pixel Office</h1>
      <div id="link" class="link" data-state="none">
        <span class="link-dot"></span>
        <span class="link-lines">
          <span id="link-status" class="link-status"></span>
          <span id="source-badge" class="link-source"
            >Источник событий — Claude Code</span
          >
        </span>
      </div>
      <div id="now" class="now" data-busy="false" hidden>
        <span class="now-dot"></span>
        <span id="now-text" class="now-text"></span>
      </div>
      <div class="controls" role="group">
        <button id="pause" class="ctl" type="button" aria-pressed="false">
          Пауза
        </button>
        <button
          id="speed-1"
          class="ctl"
          type="button"
          data-speed="1"
          aria-pressed="true"
        >
          1×
        </button>
        <button
          id="speed-2"
          class="ctl"
          type="button"
          data-speed="2"
          aria-pressed="false"
        >
          2×
        </button>
        <button
          id="speed-4"
          class="ctl"
          type="button"
          data-speed="4"
          aria-pressed="false"
        >
          4×
        </button>
      </div>
    </header>
    <div id="now-all-catcher" class="now-all-catcher" hidden></div>
    <div
      id="now-all"
      class="now-all"
      role="list"
      tabindex="0"
      aria-label="Сейчас — все работающие агенты"
      hidden
    ></div>

    <noscript>
      <div class="noscript">Для страницы нужен JavaScript.</div>
    </noscript>

    <main class="layout">
      <section id="office-panel" class="panel panel-office" aria-label="Офис">
        <div id="office-inner" class="office-inner">
          <div
            id="office-scroll"
            class="office-scroll"
            tabindex="0"
            aria-label="Офис — прокрутка"
          >
            <canvas id="office" width="945" height="594"></canvas>
          </div>
          <p id="office-note" class="office-note" hidden></p>
          <ul id="legend" class="legend"></ul>
        </div>
      </section>

      <section class="panel panel-journal">
        <div class="panel-head">
          <div class="panel-head-row">
            <h2 id="journal-title">Журнал</h2>
            <div class="filters">
              <button
                id="filter-all"
                class="filter"
                type="button"
                data-filter="all"
                aria-pressed="true"
              >
                Всё
              </button>
              <button
                id="filter-work"
                class="filter"
                type="button"
                data-filter="work"
                aria-pressed="false"
              >
                Работа
              </button>
              <button
                id="filter-office"
                class="filter"
                type="button"
                data-filter="office"
                aria-pressed="false"
              >
                Офис
              </button>
            </div>
          </div>
          <div class="journal-tools">
            <input
              id="journal-search"
              class="journal-search"
              type="search"
              autocomplete="off"
              aria-label="Поиск в журнале"
              placeholder="Поиск в журнале"
            />
            <button
              id="journal-filters"
              class="filter journal-filters"
              type="button"
              aria-expanded="false"
              aria-controls="journal-filter-line"
            >
              Фильтры
            </button>
          </div>
          <div id="journal-filter-line" class="journal-filter-line" hidden>
            <select
              id="filter-session"
              class="journal-select"
              aria-label="Сессия"
            ></select>
            <select
              id="filter-agent"
              class="journal-select"
              aria-label="Агент"
            ></select>
            <select
              id="filter-type"
              class="journal-select"
              aria-label="Тип события"
            ></select>
            <button id="journal-reset" class="filter" type="button" hidden>
              Сбросить фильтры
            </button>
          </div>
          <div id="journal-task-mark" class="task-mark" hidden></div>
          <p id="journal-meta" class="journal-meta"></p>
        </div>
        <ul id="journal" class="journal" tabindex="0"></ul>
      </section>

      <section class="panel panel-tasks">
        <div class="panel-head">
          <h2 id="tasks-title">Задачи</h2>
        </div>
        <div id="tasks" class="tasks" tabindex="0"></div>
      </section>
    </main>

    <div id="card-overlay" class="overlay" hidden>
      <div
        id="card"
        class="card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="card-title"
      ></div>
    </div>

    <div id="history-overlay" class="history-overlay" hidden>
      <div
        id="history"
        class="history"
        role="dialog"
        aria-modal="true"
        aria-labelledby="history-title"
      >
        <button id="history-close" class="history-close" type="button"></button>
        <div id="history-body" class="history-body" tabindex="0"></div>
      </div>
    </div>

    <script type="module" src="boot.js"></script>
  </body>
</html>
